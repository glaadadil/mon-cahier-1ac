  svt: [
    {semester:"S1",
      title:"Le milieu naturel et ses composantes",
      essentiel:"Un milieu naturel (forêt, oued, plage, jardin...) est formé de deux grandes familles de composantes : les êtres vivants (faune et flore) et les éléments non vivants ou minéraux (eau, air, roches, sol, lumière, température).",
      cours:"Pour découvrir un milieu naturel, on part en sortie avec des outils : jumelles pour observer les oiseaux, filet à insectes, bocaux pour garder des échantillons, appareil de Berlèse pour les petits animaux du sol, et des appareils de mesure (thermomètre, pH-mètre, oxymètre). On note d'abord les composantes vivantes : la faune (animaux) et la flore (végétaux). On note ensuite les composantes minérales, non vivantes : l'eau, l'air, les roches, le sol. Un être est vivant s'il naît, se nourrit, respire, grandit, se reproduit et meurt. Ces composantes ne sont pas isolées : elles sont liées par des relations, surtout des relations alimentaires. Exemple concret : dans un jardin de Rabat, le rosier (flore) est piqué par les pucerons (faune), qui sont mangés par les coccinelles ; le tout vit grâce à l'eau d'arrosage, au sol et à la lumière du Soleil (composantes minérales).",
      piege:"Beaucoup d'élèves classent le sol ou l'eau parmi les êtres vivants parce qu'ils « font pousser » les plantes, et oublient que le champignon ou la mousse sont bien des êtres vivants. Retiens : bouger n'est pas un critère du vivant (un arbre ne bouge pas mais il est vivant), et l'eau ne se reproduit pas.",
      astuce:"Pense au mot « FLEUR » pour les critères du vivant : se Forme (naît), se Lance dans la croissance, se nourrit (Eat), Utilise l'air (respire), se Reproduit. Et pour les composantes : « FA-FLO + ERAS » = FAune + FLOre (vivant) / Eau, Roches, Air, Sol (non vivant).",
      exercice:"Lors d'une sortie près d'un oued, Yasmine note : eau de l'oued, grenouille, roseaux, galets, air, escargot, sable, mousse verte, température de 22 °C. 1) Classe ces éléments en deux colonnes : composantes vivantes / composantes non vivantes. 2) Cite deux outils qu'elle a pu utiliser et à quoi ils servent. 3) Donne une relation alimentaire possible entre deux êtres vivants de sa liste.",
      reponse:"1) Composantes vivantes : grenouille, roseaux, escargot, mousse verte. Composantes non vivantes (minérales) : eau de l'oued, galets, air, sable, température 22 °C. 2) Exemples : les jumelles pour observer les animaux qui ne se laissent pas approcher (oiseaux, grenouille) ; un bocal pour conserver un échantillon d'escargot ; un thermomètre pour mesurer la température de l'eau. 3) Relation alimentaire : roseaux -> escargot (l'escargot mange les roseaux), la flèche signifie « est mangé par ». La grenouille peut ensuite manger des insectes du milieu."},
    {semester:"S1",
      title:"La diversité des êtres vivants et la cellule",
      essentiel:"Malgré leur très grande diversité, tous les êtres vivants ont un point commun : ils sont formés de cellules. La cellule est l'unité de structure (la plus petite « brique ») de tous les êtres vivants.",
      cours:"Dans un même milieu, on trouve des animaux, des végétaux, des champignons et des micro-organismes très différents par la taille, la forme et le mode de vie : c'est la biodiversité. Pour trouver leur point commun, on observe au microscope optique une fine lame de feuille d'élodée ou une cellule de la muqueuse de la joue. On voit alors des petites unités séparées : les cellules. Chaque cellule possède une membrane (l'enveloppe), un cytoplasme (le contenu gélatineux) et un noyau (qui commande la cellule). La cellule végétale possède en plus une paroi rigide et des chloroplastes verts contenant la chlorophylle. Certains êtres vivants sont unicellulaires (une seule cellule, comme la paramécie ou la bactérie), d'autres sont pluricellulaires (des milliards de cellules, comme l'être humain ou l'olivier).",
      piege:"Confondre « cellule » et « organe », ou croire que seuls les animaux ont des cellules. Autre erreur fréquente : dire que la cellule se voit à l'œil nu ou à la loupe. Il faut le microscope, car une cellule mesure quelques centièmes de millimètre.",
      astuce:"Pour les 3 éléments de base d'une cellule, retiens « M.C.N. » = Membrane, Cytoplasme, Noyau (comme « Ma Cellule est Née »). Et pour la cellule végétale, ajoute « P.C. » : Paroi + Chloroplastes.",
      exercice:"Amina observe au microscope deux préparations : A montre des cases régulières vertes avec une paroi épaisse ; B montre des formes arrondies sans paroi rigide ni couleur verte. 1) Laquelle est une cellule végétale ? Justifie par deux arguments. 2) Nomme les trois éléments présents dans les deux cellules. 3) Un ami dit : « la paramécie n'est pas un être vivant car elle n'a qu'une cellule ». Réponds-lui.",
      reponse:"1) La préparation A est la cellule végétale : elle possède une paroi rigide qui lui donne une forme géométrique régulière, et des chloroplastes verts (chlorophylle) responsables de la couleur verte. 2) Les trois éléments communs sont la membrane cytoplasmique, le cytoplasme et le noyau. 3) Faux : la paramécie est un être vivant unicellulaire ; elle naît, se nourrit, respire, grandit, se reproduit et meurt. Le nombre de cellules ne change rien, la cellule reste l'unité de structure de tous les êtres vivants."},
    {semester:"S1",
      title:"La respiration en milieu aérien",
      essentiel:"Respirer, c'est absorber du dioxygène (O2) du milieu et rejeter du dioxyde de carbone (CO2). Dans l'air, les mammifères respirent par des poumons, les insectes par des trachées et les plantes par des stomates.",
      cours:"On met la respiration en évidence avec l'eau de chaux : elle devient trouble en présence de CO2. Avec un dioxymètre, on mesure la baisse du dioxygène : par exemple, sous une cloche opaque contenant une plante verte, l'O2 passe de 20,9 % à 17,2 % et l'eau de chaux se trouble. La cloche est opaque pour empêcher la photosynthèse et n'observer que la respiration. Chez l'Homme, l'air passe par les cavités nasales, la trachée, les bronches, les bronchioles puis les alvéoles pulmonaires, où les gaz passent dans le sang grâce à une paroi très fine et à de nombreux vaisseaux sanguins : c'est la respiration pulmonaire. Chez le criquet, l'air entre par des stigmates (petits orifices de l'abdomen), circule dans les trachées puis les trachéoles qui touchent directement les organes : c'est la respiration trachéenne, sans intermédiaire du sang. Chez les plantes aériennes, les échanges se font par les stomates des feuilles, dont l'ouverture s'appelle l'ostiole.",
      piege:"Croire que « les plantes ne respirent pas, elles font seulement la photosynthèse ». Faux : les plantes respirent jour et nuit (absorption d'O2, rejet de CO2) ; la photosynthèse, elle, n'a lieu qu'à la lumière. Autre piège : dire que l'air expiré ne contient plus du tout de dioxygène ; il en contient encore, mais moins.",
      astuce:"« On prend l'Oxygène, on rend le CO2 » : O2 entre, CO2 sort. Pour les organes de l'air : Poumons pour les Mammifères, Trachées pour les Insectes (T comme Ticket d'entrée : sTigmates), Stomates pour les végétaux.",
      exercice:"On place un criquet vivant dans un bocal fermé contenant un petit tube d'eau de chaux limpide et relié à un dioxymètre. Au début : O2 = 20,9 %, eau de chaux limpide. Après 30 minutes : O2 = 18,1 %, eau de chaux trouble. 1) Interprète les deux résultats. 2) Quelles sont les voies respiratoires du criquet ? 3) Pourquoi faut-il refaire la même expérience avec un bocal vide (sans criquet) ?",
      reponse:"1) La baisse de l'O2 de 20,9 % à 18,1 % montre que le criquet a absorbé du dioxygène ; l'eau de chaux qui se trouble montre qu'il a rejeté du dioxyde de carbone. Le criquet réalise donc des échanges gazeux respiratoires avec le milieu aérien. 2) Les stigmates, puis les trachées, puis les trachéoles qui apportent l'O2 directement aux organes (respiration trachéenne). 3) Le bocal sans criquet est l'expérience témoin : il prouve que les changements observés sont bien dus à l'animal et non au dispositif lui-même."},
    {semester:"S1",
      title:"La respiration dans l'eau et chez les plantes",
      essentiel:"Dans l'eau, les poissons prélèvent le dioxygène dissous grâce à leurs branchies. Mais certains animaux aquatiques (dauphin, larve de moustique) viennent respirer l'air de la surface, et les plantes respirent aussi, par les stomates et les lenticelles.",
      cours:"Dans un aquarium avec un poisson relié à un dioxymètre, la quantité d'O2 dissous diminue et l'eau de chaux se trouble : le poisson absorbe du dioxygène dissous et rejette du CO2. L'eau entre par la bouche, passe sur les branchies, puis sort par les opercules (ouïes) : l'eau qui entre est riche en O2, celle qui sort est riche en CO2. Les branchies sont très fines, très nombreuses et très riches en vaisseaux sanguins : cela facilite les échanges avec le sang. On compare avec l'expérience témoin (aquarium sans poisson) pour être sûr du résultat. Attention : vivre dans l'eau ne veut pas dire respirer dans l'eau. Le dauphin et la baleine remontent respirer l'air par leurs poumons, et la larve de moustique utilise un siphon à la surface. Chez les plantes, les racines respirent grâce à l'O2 du sol, les feuilles par les stomates et les tiges âgées par les lenticelles.",
      piege:"Penser que le poisson « respire l'eau », ou que le dauphin respire par des branchies. Le poisson utilise seulement le dioxygène dissous dans l'eau ; le dauphin est un mammifère à poumons qui respire l'air même s'il vit dans la mer.",
      astuce:"« B.O.B. » pour le trajet de l'eau chez le poisson : Bouche -> Ouïes/branchies -> Bouche fermée, sortie par l'Opercule. Et retiens la phrase : « milieu de vie n'est pas milieu de respiration ».",
      exercice:"Deux aquariums identiques sont reliés à un dioxymètre : A contient un poisson, B ne contient rien. Après 20 min : dans A, O2 dissous passe de 8 mg/L à 5,5 mg/L et l'eau de chaux se trouble ; dans B rien ne change. 1) Quel est le rôle de l'aquarium B ? 2) Conclus sur la respiration du poisson. 3) Un élève dit : « le dauphin respire comme le poisson car il vit dans la mer ». Corrige et justifie.",
      reponse:"1) L'aquarium B est l'expérience témoin : il montre que les variations mesurées dans A sont dues au poisson. 2) Le poisson absorbe le dioxygène dissous dans l'eau (8 -> 5,5 mg/L) et rejette du dioxyde de carbone (eau de chaux trouble) : il réalise une respiration branchiale, les échanges se faisant au niveau des branchies très fines et riches en vaisseaux sanguins. 3) Faux : le dauphin est un mammifère marin qui possède des poumons ; il remonte à la surface pour respirer le dioxygène de l'air. Il vit dans l'eau mais respire en milieu aérien."},
    {semester:"S1",
      title:"L'alimentation chez l'être humain et les animaux",
      essentiel:"Tous les animaux se nourrissent pour vivre, grandir et se défendre contre les maladies. Selon les aliments consommés, on distingue trois régimes alimentaires : herbivore, carnivore et omnivore.",
      cours:"Le régime alimentaire est le type d'aliments consommés par un animal. L'herbivore (ou phytophage) mange des végétaux, le carnivore (ou zoophage) mange de la chair, l'omnivore mange un peu de tout : l'Homme est omnivore. L'appareil buccal et le tube digestif sont adaptés au régime : le mouton, herbivore, a des incisives coupantes, pas de canines pointues et des molaires larges pour broyer l'herbe, avec un tube digestif très long et un gros caecum ; le chat, carnivore, a des canines longues et des carnassières tranchantes, avec un tube digestif court. Certains animaux ont un appareil buccal spécialisé : trompe piqueuse du moustique, langue longue de l'abeille pour les aliments liquides, bec crochu de l'aigle. Chez l'Homme, l'alimentation doit être équilibrée : aliments bâtisseurs (viande, poisson, lait, œufs), énergétiques (pain, riz, huile, sucre) et fonctionnels (fruits et légumes, riches en vitamines et sels minéraux), avec de l'eau.",
      piege:"Croire que « herbivore » veut dire « qui mange seulement de l'herbe » (la girafe mange des feuilles, l'écureuil des graines : ils restent phytophages), et confondre régime alimentaire avec place dans la chaîne alimentaire. Autre erreur : penser que les dents ne servent qu'à mordre, alors que leur forme renseigne sur le régime.",
      astuce:"« H.C.O. » comme les trois régimes : Herbivore = plantes, Carnivore = chair, Omnivore = tOut. Pour les dents : « Canine pointue = Carnivore, Molaire plate = maNger l'herbe ».",
      exercice:"On observe deux mâchoires. Mâchoire 1 : incisives coupantes, pas de canines, molaires larges et plates ; tube digestif long de 30 m. Mâchoire 2 : canines longues et pointues, dents tranchantes ; tube digestif long de 2 m. 1) Attribue chaque mâchoire à un régime alimentaire et donne un exemple d'animal. 2) Explique le lien entre la longueur du tube digestif et le régime. 3) À quel régime appartient l'Homme et pourquoi ?",
      reponse:"1) Mâchoire 1 = régime herbivore (phytophage), exemple : le mouton ou la vache. Mâchoire 2 = régime carnivore (zoophage), exemple : le chat ou le lion. 2) Les végétaux sont difficiles à digérer : l'herbivore a besoin d'un tube digestif très long (30 m) pour digérer lentement la cellulose. La viande est digérée plus vite, donc le carnivore a un tube digestif court (2 m). 3) L'Homme est omnivore : il mange à la fois des aliments d'origine végétale et animale ; sa dentition comprend incisives, canines et molaires, et son tube digestif est de longueur intermédiaire."},
    {semester:"S1",
      title:"La nutrition des plantes vertes",
      essentiel:"Les plantes vertes n'ont besoin que de matière minérale : eau et sels minéraux absorbés par les racines, dioxyde de carbone absorbé par les feuilles, plus la lumière. Grâce à la photosynthèse, elles fabriquent elles-mêmes leur matière organique : elles sont autotrophes.",
      cours:"Une plante privée d'eau se flétrit en quelques heures ; une plantule d'orge arrosée avec de l'eau sans sels minéraux arrête sa croissance : l'eau et les sels minéraux sont donc indispensables. Ils sont absorbés par la zone pilifère de la racine, couverte de poils absorbants, et forment la sève brute qui monte vers les feuilles. À la lumière, les feuilles absorbent le CO2 par les stomates et fabriquent de la matière organique (l'amidon, mis en évidence par l'eau iodée qui devient bleu-noir) tout en libérant du dioxygène : c'est la photosynthèse, qui a lieu dans les chloroplastes contenant la chlorophylle. La matière organique fabriquée est transportée par la sève élaborée des feuilles vers tous les organes. Exemple concret : les cultures « hors sol » sous serre à Agadir poussent sans terre, dans une solution d'eau + sels minéraux, ce qui prouve que la plante n'a pas besoin de matière organique du sol.",
      piege:"L'erreur la plus fréquente est de croire que la plante « mange » la terre ou se nourrit d'engrais comme d'un aliment organique. Le sol ne fournit que de l'eau et des sels minéraux. Autre confusion : mélanger respiration (jour et nuit, absorbe O2) et photosynthèse (seulement à la lumière, absorbe CO2).",
      astuce:"Recette de cuisine de la plante : « EAU + SELS + CO2 + LUMIÈRE = SUCRE + O2 ». Retiens « ESCL » (Eau, Sels minéraux, CO2, Lumière) pour les 4 besoins.",
      exercice:"Trois plantules d'orge identiques sont cultivées 3 semaines : A dans une solution d'eau + sels minéraux à la lumière ; B dans une solution d'eau + sels minéraux à l'obscurité ; C dans de l'eau distillée pure à la lumière. Résultats : A pousse bien et ses feuilles contiennent de l'amidon ; B jaunit et ne grandit presque pas ; C reste petite et ses feuilles pâlissent. 1) Que montre la comparaison A/B ? 2) Que montre la comparaison A/C ? 3) Écris les besoins nutritifs d'une plante verte et nomme la transformation qui fabrique l'amidon.",
      reponse:"1) A et B ne diffèrent que par la lumière : la lumière est donc indispensable à la croissance et à la fabrication de la matière organique (amidon). 2) A et C ne diffèrent que par les sels minéraux : les sels minéraux sont indispensables au développement normal de la plante. 3) Besoins nutritifs : eau et sels minéraux (absorbés par les poils absorbants de la zone pilifère des racines), dioxyde de carbone (absorbé par les stomates des feuilles) et lumière. La transformation qui fabrique l'amidon est la photosynthèse, réalisée dans les chloroplastes grâce à la chlorophylle, avec rejet de dioxygène."},
    {semester:"S1",
      title:"Chaînes alimentaires et équilibres naturels",
      essentiel:"Une chaîne alimentaire est une suite d'êtres vivants où chacun est mangé par le suivant ; la flèche se lit « est mangé par ». Plusieurs chaînes reliées entre elles forment un réseau trophique, et l'équilibre naturel dépend de ces relations.",
      cours:"Chaque être vivant occupe une place précise appelée maillon, et chaque maillon correspond à un niveau trophique. Une chaîne commence toujours par un végétal vert : c'est le producteur, car il produit la matière organique grâce à la lumière (autotrophe). Viennent ensuite le consommateur primaire (qui mange le végétal), puis le consommateur secondaire (qui mange un animal) : ce sont des hétérotrophes. Les décomposeurs (bactéries, champignons, vers de terre) transforment la matière organique morte en matière minérale réutilisable par les plantes. Exemples : Rosier -> Puceron -> Coccinelle, ou Graine -> Souris -> Couleuvre -> Buse. L'équilibre naturel est le maintien du nombre d'individus de chaque espèce : quand les lapins (proies) diminuent, les lynx (prédateurs) diminuent aussi. L'Homme peut détruire cet équilibre (déforestation, surpâturage, chasse abusive, pollution) ou le protéger (reboisement, parcs nationaux comme celui de Souss-Massa, épuration des eaux). La mise en place d'un équilibre naturel est lente et progressive : dans un milieu forestier, les plantes herbacées annuelles apparaissent en environ 1 an, les plantes herbacées vivaces en 2 à 4 ans, les arbustes et les arbres en 5 à 15 ans, et il faut de 25 à 50 ans pour que toutes les strates de végétation (herbacées, arbustes, arbres) et les populations animales associées s'installent durablement : c'est seulement à ce stade final que le milieu devient réellement équilibré. Les activités humaines peuvent rompre cet équilibre : rejets de déchets liquides et gazeux, pollution du sol par les pesticides, incendies, surexploitation des forêts, marées noires, pêche intensive. Ces substances polluantes s'accumulent et se concentrent le long des chaînes alimentaires, ce qui peut nuire même aux prédateurs situés tout en haut. Pour préserver les équilibres, on peut traiter les déchets avant rejet, limiter les pesticides, prévenir les incendies, mieux transporter le pétrole et respecter le repos biologique (périodes où la pêche est interdite pour laisser les espèces se reproduire).",
      piege:"Dessiner les flèches dans le mauvais sens : la flèche va toujours du mangé vers le mangeur (« est mangé par »), donc du végétal vers l'animal. Autre erreur : commencer une chaîne par un animal, ou oublier les décomposeurs.",
      astuce:"Retiens la phrase : « la flèche montre où passe la nourriture », et l'ordre « P.C.C.D. » = Producteur, Consommateur primaire, Consommateur secondaire, Décomposeur.",
      exercice:"Dans un champ marocain on observe : blé, sauterelle, lézard, faucon, bactéries du sol. 1) Construis une chaîne alimentaire de 4 maillons avec ces êtres vivants et donne le nom de chaque niveau trophique. 2) Que signifie la flèche ? 3) Les agriculteurs éliminent tous les faucons. Explique en deux phrases la conséquence sur les sauterelles et sur le blé.",
      reponse:"1) Blé -> Sauterelle -> Lézard -> Faucon. Le blé est le producteur (végétal vert), la sauterelle le consommateur primaire (phytophage), le lézard le consommateur secondaire (zoophage) et le faucon le consommateur tertiaire (prédateur au sommet) ; les bactéries du sol sont les décomposeurs qui recyclent la matière organique morte. 2) La flèche signifie « est mangé par » : elle va de l'être mangé vers celui qui le mange. 3) Sans faucons, le nombre de lézards augmente d'abord, puis les sauterelles peuvent proliférer si l'équilibre est rompu ; les sauterelles trop nombreuses dévorent le blé, ce qui détruit la récolte. C'est un exemple de déséquilibre naturel provoqué par l'Homme."},
    {semester:"S1",
      title:"Classer les êtres vivants",
      essentiel:"Classer, c'est regrouper les êtres vivants selon des critères communs (caractères observables) pour pouvoir les identifier. On utilise pour cela une clé de détermination.",
      cours:"Un critère de classification est un caractère que possède un être vivant et qui sert à le classer : présence ou absence de colonne vertébrale, nombre de pattes, type de revêtement du corps (poils, plumes, écailles), mode de respiration, mode de reproduction. Chez les animaux, on distingue d'abord les vertébrés (qui possèdent une colonne vertébrale) et les invertébrés (qui n'en possèdent pas). Les vertébrés forment 5 groupes : poissons, amphibiens, reptiles, oiseaux et mammifères. Les invertébrés comportent plusieurs groupes (insectes, arachnides, crustacés, myriapodes, mollusques, vers, etc.). Les végétaux se classent aussi, par exemple selon la présence de fleurs, de graines ou de spores. Pour identifier un être vivant inconnu, on suit une clé de détermination : à chaque étape, on choisit entre deux propositions. Exemple concret : un animal a une colonne vertébrale -> il est couvert de plumes -> il a un bec : c'est un oiseau (la cigogne blanche des toits de Meknès). Les végétaux se classent eux aussi selon des critères précis, en huit grands groupes : les algues unicellulaires (organismes verts formés d'une seule cellule), les algues pluricellulaires (végétaux verts aquatiques, sans tige feuillée ni graines, comme le fucus), les lichens (association d'un champignon et d'une algue, sans fleurs ni graines), les champignons pluricellulaires (non verts, sans chlorophylle), les mousses (plantes vertes à tige feuillée mais sans racines ni vaisseaux conducteurs), les fougères (plantes vertes avec racines et vaisseaux conducteurs, mais sans fleurs ni graines), les gymnospermes (plantes à graines non protégées, comme le pin sylvestre) et les angiospermes (plantes à fleurs et à graines protégées dans un fruit, comme l'aubépine). Exemples de classement : l'aubépine est une angiosperme, le pin sylvestre une gymnosperme, la fougère une fougère, la mousse une mousse et le fucus une algue. Chez les invertébrés, on distingue aussi plusieurs groupes selon des critères précis : les vers (corps mou et allongé, sans coquille), les mollusques lamellibranches (coquille à deux valves et branchies en lamelles, comme la moule), les mollusques gastéropodes (coquille unique généralement spiralée, comme l'escargot), les mollusques céphalopodes (pied transformé en tentacules autour de la tête, comme la pieuvre, sans colonne vertébrale), les crustacés (carapace, cinq paires de pattes ou plus, deux paires d'antennes, comme le crabe), les insectes (trois paires de pattes, une paire d'antennes, souvent des ailes), les myriapodes (plus de trois paires de pattes, une paire d'antennes, comme le mille-pattes) et les arachnides (quatre paires de pattes, ni antennes ni ailes, comme l'araignée).",
      piege:"Classer selon le milieu de vie ou selon la ressemblance générale : la baleine vit dans l'eau mais ce n'est pas un poisson (elle allaite, elle a des poumons), et la chauve-souris vole mais n'est pas un oiseau. Le critère scientifique passe avant l'apparence.",
      astuce:"Pour les 5 groupes de vertébrés : « P.A.R.O.M. » = Poissons, Amphibiens, Reptiles, Oiseaux, Mammifères. Et « plumes = oiseau, poils + lait = mammifère, écailles + branchies = poisson ». Pour les végétaux, retiens l'ordre de complexité croissante « Algues, Lichens, Champignons, Mousses, Fougères, Gymnospermes, Angiospermes » : à chaque groupe s'ajoute une nouveauté (tige feuillée, racines, vaisseaux conducteurs, puis fleurs et graines protégées).",
      exercice:"Classe ces animaux en vertébrés / invertébrés puis donne leur groupe : sardine, criquet, dauphin, escargot, tortue, araignée, cigogne. Ensuite, construis une clé de détermination à 3 questions permettant de distinguer la sardine, la cigogne et le dauphin.",
      reponse:"Vertébrés : sardine (poisson), dauphin (mammifère), tortue (reptile), cigogne (oiseau). Invertébrés : criquet (insecte, 6 pattes), escargot (mollusque), araignée (arachnide, 8 pattes). Clé de détermination possible : Question 1 : le corps est-il couvert de plumes ? Oui -> cigogne (oiseau). Non -> question 2. Question 2 : l'animal respire-t-il par des branchies avec un corps couvert d'écailles ? Oui -> sardine (poisson). Non -> question 3. Question 3 : l'animal a-t-il des poumons et allaite-t-il ses petits ? Oui -> dauphin (mammifère)."},
    {semester:"S2",
      title:"Lire une carte topographique",
      essentiel:"La carte topographique est la représentation, à échelle réduite, du relief d'une région sur un plan. On la lit grâce à son titre, son échelle, son orientation, sa légende et ses courbes de niveau.",
      cours:"Avant une sortie géologique, le géologue prépare son matériel : carte topographique, boussole pour orienter la carte, marteau pour casser la roche, loupe pour observer les détails, acide chlorhydrique dilué pour reconnaître le calcaire, sacs et étiquettes pour les échantillons, appareil photo et carnet. L'échelle est le rapport entre la distance mesurée sur la carte (d) et la distance réelle sur le terrain (D) : E = d/D, écrite sous la forme 1/X. Par exemple, avec une échelle de 1/10 000, 1 cm sur la carte représente 10 000 cm, soit 100 m sur le terrain. Une courbe de niveau relie tous les points de même altitude ; on distingue les courbes maîtresses (trait épais, tous les 50 ou 100 m), les courbes normales (trait fin) et les courbes intercalaires (tirets). L'équidistance est la différence d'altitude entre deux courbes voisines. Des courbes serrées indiquent une pente forte, des courbes espacées une pente douce. Un point coté donne l'altitude exacte d'un point précis.",
      piege:"Confondre distance sur la carte et distance réelle, et se tromper dans la conversion (1/10 000 : 1 cm -> 10 000 cm = 100 m, et non 10 000 m). Autre erreur : croire que des courbes très rapprochées signifient une pente douce.",
      astuce:"Pour l'échelle, retiens « d sur D » : la petite distance (carte) sur la grande (terrain). Et pour le relief : « courbes serrées = pente raide (comme des marches d'escalier serrées), courbes espacées = pente douce ».",
      exercice:"Sur une carte topographique à l'échelle 1/25 000, la distance mesurée entre le village A et le village B est de 4 cm. Les courbes de niveau sont équidistantes de 20 m ; A est sur la courbe 300 m et B sur la courbe 460 m. 1) Calcule la distance réelle entre A et B en mètres puis en km. 2) Combien de courbes de niveau sépare-t-on entre A et B ? 3) La zone entre A et B a des courbes très rapprochées : que peux-tu dire de la pente ?",
      reponse:"1) D = d x X = 4 cm x 25 000 = 100 000 cm = 1 000 m = 1 km. 2) La dénivelée est 460 - 300 = 160 m ; avec une équidistance de 20 m, on compte 160 / 20 = 8 intervalles, donc 8 courbes de niveau franchies. 3) Des courbes très rapprochées indiquent une pente forte (raide) : on monte 160 m sur seulement 1 km de distance horizontale."},
    {semester:"S2",
      title:"Érosion et transport des matériaux",
      essentiel:"L'érosion est l'usure et la destruction des roches à la surface de la Terre ; les débris produits, appelés sédiments, sont ensuite transportés par l'eau, le vent, la glace ou la gravité.",
      cours:"Les agents d'érosion sont l'eau (pluie, oueds, mer), le vent, le gel et le dégel, la glace des glaciers, mais aussi les êtres vivants (racines des arbres) et l'Homme (carrières, routes). On distingue l'érosion mécanique (les roches sont cassées et usées, par exemple par le gel qui fait éclater la roche) et l'érosion chimique (l'eau dissout la roche, comme le calcaire qui donne des grottes). Les débris arrachés portent le nom de sédiments : blocs, galets, graviers, sable, argile. Le transport se fait par roulement et rebond pour les gros éléments, en suspension pour les particules fines (l'eau devient trouble) et en solution pour les substances dissoutes. Plus le transport est long, plus les grains deviennent petits, arrondis et lisses : c'est l'usure. Exemple concret : après une forte pluie sur le Haut Atlas, l'oued devient marron car il transporte des argiles en suspension ; les gros blocs restent au pied de la montagne, tandis que le sable fin arrive jusqu'à la plage.",
      piege:"Croire que l'érosion transporte les matériaux : ce sont deux étapes différentes (l'érosion arrache, le transport déplace). Autre erreur classique : penser que les gros galets sont emportés le plus loin, alors que ce sont les particules les plus fines qui voyagent le plus loin.",
      astuce:"Retiens l'ordre « E.T.S.D. » : Érosion -> Transport -> Sédimentation -> Diagenèse. Et pour l'usure : « plus le galet voyage, plus il maigrit et s'arrondit ».",
      exercice:"On observe des grains de quartz prélevés en trois endroits d'un même oued : zone 1 (près de la montagne) : grains gros, anguleux, à arêtes vives ; zone 2 (milieu de la vallée) : grains moyens, légèrement arrondis ; zone 3 (embouchure, près de la mer) : grains fins, ronds et lisses. 1) Explique ces différences. 2) Cite deux agents d'érosion et deux modes de transport. 3) Dans quelle zone trouve-t-on l'argile déposée ? Pourquoi ?",
      reponse:"1) Plus les grains sont transportés loin de la roche mère, plus ils sont usés : ils deviennent plus petits, arrondis et lisses par frottement et chocs pendant le transport. La zone 1 est proche de la source des débris (peu de transport), la zone 3 en est la plus éloignée (transport long). 2) Agents d'érosion : l'eau (pluie, oued) et le vent (aussi le gel, la glace, les racines, l'Homme). Modes de transport : par roulement/rebond sur le fond pour les gros éléments et en suspension pour les particules fines (ou en solution pour les sels dissous). 3) L'argile se dépose surtout dans la zone 3, à l'embouchure, là où le courant est le plus faible : les particules les plus fines et les plus légères sont transportées le plus loin avant de se déposer."},
    {semester:"S2",
      title:"Sédimentation, diagenèse et roches sédimentaires",
      essentiel:"Quand le courant faiblit, les sédiments se déposent en couches (strates) : c'est la sédimentation. Ces sédiments se transforment ensuite en roche dure par la diagenèse.",
      cours:"La sédimentation est le dépôt des sédiments quand la vitesse de l'eau diminue, par exemple dans un lac, un barrage ou au fond de la mer. Le dépôt est classé : les éléments les plus gros et les plus lourds (galets, graviers) tombent d'abord, puis le sable, puis l'argile la plus fine, ce qui donne un classement des grains et des couches superposées appelées strates. La diagenèse est l'ensemble des transformations qui changent un sédiment meuble en roche solide : la compaction (le poids des couches supérieures chasse l'eau et tasse les grains) et la cimentation (un ciment naturel, souvent calcaire, colle les grains entre eux). Ainsi le sable devient du grès, l'argile devient de l'argilite, la boue calcaire devient du calcaire. Les roches sédimentaires se classent en roches détritiques (issues de débris : grès, argile, poudingue), roches d'origine chimique (sel gemme, gypse) et roches d'origine biologique (calcaire à coquilles). Exemple concret : les falaises calcaires du littoral marocain montrent des strates superposées, et l'acide chlorhydrique dilué versé sur le calcaire produit une effervescence. On distingue plusieurs grandes familles de roches sédimentaires selon leur origine : les roches calcaires, d'origine chimique et/ou biochimique (le calcaire y est l'élément le plus abondant) ; les roches argileuses, généralement détritiques, formées de fines particules issues de l'érosion ; les roches siliceuses, d'origine détritique (sable, grès) ou biochimique (radiolarite, diatomite) ; les roches salines ou évaporites, formées par précipitation de sels dissous après évaporation de l'eau (gypse, sel gemme) ; et les roches carbonées, issues de l'accumulation de matière organique animale et végétale (tourbe, charbon, pétrole), utilisées comme combustibles. La vitesse du courant détermine la taille des grains déposés : avec un courant d'environ 10 cm/s, seules les particules de moins de 1 mm environ (le sable) peuvent encore se déposer ; à 1 cm/s, même le sable fin se dépose, car le courant est devenu trop faible pour le maintenir en mouvement.",
      piege:"Croire que la diagenèse est immédiate ou qu'elle fait fondre les grains : elle dure des milliers à des millions d'années et se fait par compaction + cimentation. Autre confusion fréquente : mélanger l'ordre des étapes et placer la sédimentation avant le transport.",
      astuce:"« Le sable devient GRÈS quand il est PRESSÉ et COLLÉ » : diagenèse = compaction (presser) + cimentation (coller). Ordre complet : Érosion, Transport, Sédimentation, Diagenèse (E.T.S.D.).",
      exercice:"Un forage traverse, de haut en bas : une couche de sable meuble (0-2 m), une couche de grès dur (2-8 m), une couche d'argilite (8-15 m), un calcaire à coquilles (15-25 m). 1) Range dans l'ordre les 4 étapes de formation d'une roche sédimentaire. 2) De quel sédiment vient le grès ? Et l'argilite ? 3) Quel test simple permet de reconnaître le calcaire ? Quel résultat attends-tu ?",
      reponse:"1) Érosion -> transport -> sédimentation -> diagenèse. 2) Le grès provient du sable consolidé par compaction et cimentation ; l'argilite provient de l'argile (particules très fines) consolidée de la même façon. 3) On verse quelques gouttes d'acide chlorhydrique dilué sur l'échantillon : le calcaire fait effervescence (dégagement de bulles de dioxyde de carbone), alors que le grès ou l'argilite ne réagissent pas."},
    {semester:"S2",
      title:"Fossiles et temps géologiques",
      essentiel:"Un fossile est un reste ou une trace d'être vivant conservé dans les roches sédimentaires. Les fossiles permettent de dater les couches et de reconstituer les milieux anciens, ce qui sert à construire l'échelle des temps géologiques.",
      cours:"La Terre s'est formée il y a environ 4,5 milliards d'années et la vie est apparue il y a environ 3,5 milliards d'années. La paléontologie est la science qui étudie les êtres ayant vécu autrefois. Un fossile peut être une coquille, un os, une dent, une empreinte de feuille, une trace de pas ou un insecte piégé dans l'ambre. La fossilisation est la transformation d'un être vivant en fossile : l'animal meurt et tombe au fond de l'eau, les parties molles disparaissent, les sédiments le recouvrent, puis les sédiments se transforment en roche. Pour qu'elle réussisse, il faut un enfouissement rapide dans un milieu pauvre en oxygène, sinon les agents de destruction (air, dissolution, bactéries) détruisent le corps. Les modes de fossilisation sont la conservation totale (mammouth dans la glace), partielle (squelette, dents de requin), le moulage et les empreintes (archéoptéryx dans le calcaire). Dans un ensemble de couches non déformées, la couche du bas est la plus ancienne : c'est le principe de superposition. Un fossile stratigraphique, qui a vécu peu de temps mais s'est répandu largement (comme l'ammonite ou le trilobite), sert de « montre » pour dater les couches et permet de découper l'histoire de la Terre en ères : Précambrien, Primaire, Secondaire, Tertiaire, Quaternaire.",
      piege:"Croire que tous les êtres morts deviennent des fossiles, ou que les fossiles sont les os « d'origine » restés intacts : la fossilisation est rare et lente, et la matière est le plus souvent remplacée ou moulée par la roche. Autre erreur : dire que la couche du haut est la plus ancienne.",
      astuce:"Pour les ères, retiens la phrase : « Pré-Pri-Se-Ter-Qua » (Précambrien, Primaire, Secondaire, Tertiaire, Quaternaire). Pour la superposition : « plus c'est en bas, plus c'est vieux ».",
      exercice:"Une falaise montre trois couches non déformées : en bas la couche C avec des trilobites, au milieu la couche B avec des ammonites, en haut la couche A avec des coquilles d'huîtres semblables aux actuelles. 1) Range les couches de la plus ancienne à la plus récente et cite le principe utilisé. 2) Que peux-tu dire du milieu de formation de ces couches ? 3) Cite deux conditions nécessaires à la fossilisation.",
      reponse:"1) De la plus ancienne à la plus récente : C (trilobites), puis B (ammonites), puis A (huîtres). On utilise le principe de superposition : dans des couches non déformées, la couche située en dessous est la plus ancienne. 2) Les trilobites, ammonites et huîtres sont des animaux marins : ces couches se sont donc formées dans un milieu marin, ce qui montre que la région était autrefois recouverte par la mer. 3) Il faut un enfouissement rapide du corps sous les sédiments et un milieu pauvre en dioxygène (pour éviter la destruction par les bactéries et les agents atmosphériques) ; en général, la présence de parties dures (coquille, os) favorise aussi la conservation."},
    {semester:"S2",
      title:"Les ressources en eau et leur protection",
      essentiel:"L'eau douce utilisable est très rare et le Maroc est un pays semi-aride : il faut connaître ses réserves (barrages, nappes phréatiques, bassins hydrographiques) et les protéger de la pollution et du gaspillage.",
      cours:"L'eau circule sans arrêt dans la nature : évaporation, condensation en nuages, précipitations, ruissellement vers les oueds et infiltration qui alimente les nappes d'eau souterraines. Un bassin hydrographique est toute la région dont les eaux de pluie s'écoulent vers un même oued et ses affluents ; au Maroc, on étudie par exemple le bassin de l'oued Sebou. Une nappe phréatique est une réserve d'eau souterraine contenue dans une roche perméable, exploitée par des puits et des forages. Les eaux du pays sont stockées dans les barrages (ex. barrage Al Massira) et utilisées pour l'eau potable, l'irrigation et l'industrie. Ces ressources sont menacées par la sécheresse, la surexploitation des nappes, la pollution (eaux usées, déchets industriels, engrais et pesticides, décharges) et le gaspillage. Pour les protéger : épurer les eaux usées dans des stations d'épuration, traiter l'eau potable, économiser l'eau (irrigation au goutte-à-goutte, réparation des fuites, robinet fermé pendant le brossage des dents), et ne jamais jeter de produits chimiques dans l'évier. On distingue deux types de nappe phréatique : la nappe libre, dont le niveau supérieur (la surface piézométrique) peut varier librement car elle n'est recouverte par aucune couche imperméable ; et la nappe captive, emprisonnée entre deux couches imperméables et dont l'eau est sous pression, ce qui peut la faire jaillir naturellement lorsqu'on creuse un puits. La perméabilité d'une roche est son aptitude à se laisser traverser par l'eau : une roche aquifère (poreuse et/ou fissurée) peut stocker de grandes quantités d'eau. Quand l'eau dissout lentement le calcaire, elle forme un paysage karstique, avec des grottes, des cavités et parfois des rivières souterraines.",
      piege:"Penser que l'eau de la Terre est illimitée parce que « la planète est couverte d'eau » : la quasi-totalité est salée ou gelée, et l'eau douce liquide accessible est infime. Autre erreur : croire que l'eau claire est forcément potable, alors qu'elle peut contenir des microbes et des produits dissous.",
      astuce:"Les 3 gestes anti-gaspillage : « ferme, répare, arrose goutte à goutte ». Et retiens : « nappe = éponge souterraine, bassin = entonnoir de pluie vers l'oued ».",
      exercice:"Une commune consomme 150 L d'eau par habitant et par jour pour 20 000 habitants ; 20 % de cette eau est perdue dans des fuites du réseau. 1) Calcule le volume total consommé par jour, en litres puis en m3. 2) Calcule le volume perdu chaque jour par les fuites. 3) Cite deux causes de pollution de l'eau et deux solutions concrètes pour protéger les ressources.",
      reponse:"1) Volume total = 150 x 20 000 = 3 000 000 L par jour, soit 3 000 m3 par jour (1 m3 = 1 000 L). 2) Pertes = 20 % de 3 000 000 = 600 000 L par jour, soit 600 m3 par jour perdus. 3) Causes de pollution : les eaux usées domestiques non traitées et les déchets industriels (ou les engrais et pesticides agricoles, les décharges). Solutions : épurer les eaux usées dans une station d'épuration avant de les rejeter, et économiser l'eau (réparer les fuites du réseau, irrigation au goutte-à-goutte, gestes d'économie à la maison)."}
