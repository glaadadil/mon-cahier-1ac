  anglais: [
    {semester:"S1",
      title:"Greetings and introducing yourself",
      essentiel:"You use greetings (salutations) to say hello and goodbye, and the verb 'to be' to say your name, your age and where you are from.",
      cours:"Greetings change with the time of day: 'Good morning' (before 12), 'Good afternoon' (after 12), 'Good evening' (at night), and 'Hi' or 'Hello' with friends. When you meet someone new you say: 'Hello, my name is Lina. Nice to meet you.' The other person answers: 'Nice to meet you too.' To introduce yourself you need the verb 'to be': I am (I'm), you are (you're), he/she is (he's/she's), we are, they are. Useful questions and answers: 'What's your name?' - 'My name is Lina.' / 'How old are you?' - 'I'm eleven (years old).' / 'Where are you from?' - 'I'm from Morocco. I'm Moroccan.' / 'How are you?' - 'I'm fine, thank you.' To say goodbye: 'Goodbye', 'Bye', 'See you tomorrow', 'Good night'. Remember: names, countries and nationalities always start with a capital letter (majuscule): Lina, Morocco, Moroccan, Monday.",
      piege:"Students often say 'I have eleven years' because in French we say 'j'ai onze ans'. In English we use the verb 'be': 'I am eleven years old.' Another common mistake is 'How old are you?' answered with 'I have 11' - always use 'I'm 11'. Also do not forget the capital letter in 'I' and in 'English', 'Morocco'.",
      astuce:"Remember the three magic questions with the same beginning: NAME - AGE - PLACE ('What's your name? How old are you? Where are you from?'). For age, think 'I AM my age' (je SUIS mon age), never 'I have'.",
      exercice:"Complete the dialogue with the correct words: 'A: Good ______ (it is 9 a.m.)! My name ______ Karim. What's ______ name? B: Hello Karim. I ______ Salma. Nice to ______ you. A: How ______ are you? B: I ______ eleven years old. And you? A: I'm twelve. Where ______ you from? B: I'm ______ Casablanca.' Then write three sentences to introduce yourself.",
      reponse:"'A: Good morning! My name is Karim. What's your name? B: Hello Karim. I am (I'm) Salma. Nice to meet you. A: How old are you? B: I am (I'm) eleven years old. And you? A: I'm twelve. Where are you from? B: I'm from Casablanca.' Example of self-introduction: 'Hello! My name is Lina Amrani. I am eleven years old and I am in the first year of middle school. I am from Rabat, in Morocco.'"},
    {semester:"S1",
      title:"School and classroom objects",
      essentiel:"You learn the names of school things (objets scolaires) and how to say where they are with 'There is / There are' and 'this, that, these, those'.",
      cours:"Classroom words: a pen, a pencil, a pencil case (trousse), a rubber/eraser (gomme), a ruler (regle), a sharpener (taille-crayon), a book, a copybook/notebook (cahier), a schoolbag (cartable), a desk (bureau/table), a chair, a board (tableau), a cupboard (placard), a poster, a picture, a computer, a map. Use 'a' or 'an' for one thing ('a pen', 'an eraser' before a vowel sound) and add -s for many ('two pens'). To say what is in the room: 'There is a board on the wall' (one thing) and 'There are twenty chairs in the classroom' (many things). Use 'this' for one thing near you, 'that' for one thing far, 'these' for many near, 'those' for many far: 'This is my pencil case. Those are your books.' Classroom language you hear every day: 'Open your books, please.', 'Listen and repeat.', 'Can I go out, please?', 'What does it mean?'. To ask about possession: 'Have you got a ruler?' - 'Yes, I have. / No, I haven't.'",
      piege:"Forgetting the plural -s and the difference between 'there is' and 'there are': students write 'There is two boards' instead of 'There are two boards'. Another mistake is 'this books' instead of 'these books' (this = singular, these = plural). Also, 'an' is used before a vowel SOUND: 'an apple', 'an eraser', but 'a ruler'.",
      astuce:"Remember 'THIS/THESE = close, with an S like Sister next to me; THAT/THOSE = far, with an O like Over there.' And for 'there is / there are': IS goes with 1, ARE goes with 2+.",
      exercice:"Look at this classroom description and fill in the gaps with 'There is' or 'There are', then rewrite the underlined words in the plural: 'In my classroom, ______ a big green board. ______ thirty chairs and fifteen desks. ______ a computer on the teacher's desk, and ______ two colourful posters on the wall.' Plural exercise: 'this pencil' -> ______ ; 'that book' -> ______ .",
      reponse:"'In my classroom, there is a big green board. There are thirty chairs and fifteen desks. There is a computer on the teacher's desk, and there are two colourful posters on the wall.' Plurals: 'this pencil' -> 'these pencils' ; 'that book' -> 'those books'. (We use 'there is' with one thing and 'there are' with more than one; 'this/that' become 'these/those' in the plural and the noun takes -s.)"},
    {semester:"S1",
      title:"My family",
      essentiel:"You learn family words (les membres de la famille) and how to talk about them with 'have got' and possessive adjectives like my, his, her.",
      cours:"Family words: mother/mum, father/dad, parents, sister, brother, grandmother/grandma, grandfather/grandpa, aunt (tante), uncle (oncle), cousin, son (fils), daughter (fille), baby. To speak about your family you use 'have got' or 'have': 'I have got two sisters and one brother.' - 'She has got a big family.' The question is 'Have you got any brothers or sisters?' - 'Yes, I have. / No, I haven't.' Possessive adjectives show who it is: my, your, his (for a boy), her (for a girl), its, our, their. Example: 'This is my uncle. His name is Omar. His wife is my aunt; her name is Nadia.' You can also use 's for possession: 'my father's car', 'Sara's brother'. To describe people, use the verb 'be' plus adjectives: 'My grandmother is old and very kind. My brother is tall and funny.'",
      piege:"Mixing up 'his' and 'her': the possessive follows the OWNER, not the object. We say 'my sister and her book' (not 'his book') and 'my brother and his bag'. Another frequent mistake: 'He have got two sisters' instead of 'He has got two sisters', and forgetting 's ('the car of my father' -> 'my father's car').",
      astuce:"HIS has an 'H' like He, HER has an 'H' like sHe... simple rule: 'boy = his, girl = her'. For have/has, remember 'He, She, It -> add S' (HeSheIt = S).",
      exercice:"Complete with 'have got / has got' and the right possessive (my, his, her, our, their): '1. I ______ a big family. 2. My sister is twelve. ______ name is Hind. 3. My father ______ two brothers; ______ names are Ali and Said. 4. My parents ______ a small house in the country; ______ house is white.' Then write 3 sentences about your own family.",
      reponse:"'1. I have got a big family. 2. My sister is twelve. Her name is Hind. 3. My father has got two brothers; their names are Ali and Said. 4. My parents have got a small house in the country; their house is white.' Example: 'I have got one brother and two sisters. My brother's name is Anas; he is fifteen and he is very funny. My mother is a nurse and her name is Khadija.' (Rule: I/you/we/they + have got, he/she/it + has got; 'her' for a girl, 'their' for several people.)"},
    {semester:"S1",
      title:"My house",
      essentiel:"You learn the rooms of a house and the furniture, and you say where things are with prepositions of place (in, on, under, next to, behind).",
      cours:"Rooms: a living room (salon), a bedroom (chambre), a kitchen (cuisine), a bathroom (salle de bain), a dining room, a hall, a garden, a garage, a roof terrace. Furniture: a bed, a table, a chair, a sofa, a wardrobe (armoire), a fridge, a cooker, a lamp, a carpet (tapis), a mirror, a window, a door. Prepositions of place tell you WHERE: in (dans), on (sur), under (sous), next to (a cote de), behind (derriere), in front of (devant), between (entre), above (au-dessus de). Example: 'My bedroom is upstairs. There is a small bed next to the window and a blue carpet on the floor. My books are in the wardrobe and my schoolbag is under the desk.' You can also describe home activities with the present continuous (am/is/are + verb-ing) for what is happening now: 'My mother is cooking in the kitchen and my brother is watching TV in the living room.' And adverbs of frequency for chores: 'I always make my bed. I sometimes wash the dishes. I never forget my homework.'",
      piege:"Confusing 'in' and 'on': we say 'in the kitchen' but 'on the table'. Students also write 'in front of' when they mean 'in front of the house' but use 'in front' alone - always add 'of'. Another mistake: forgetting -ing in the present continuous ('She is cook' instead of 'She is cooking').",
      astuce:"Picture a cat to learn prepositions: the cat is IN the box, ON the box, UNDER the box, NEXT TO the box, BEHIND the box. Say it out loud with a real object in your room. IN = inside, ON = touching the top.",
      exercice:"Look at this bedroom and complete with in, on, under, next to or between: '1. The lamp is ______ the table. 2. The shoes are ______ the bed. 3. My clothes are ______ the wardrobe. 4. The chair is ______ the desk. 5. The picture is ______ the two windows.' Then write four sentences describing your favourite room.",
      reponse:"'1. The lamp is on the table. 2. The shoes are under the bed. 3. My clothes are in the wardrobe. 4. The chair is next to the desk. 5. The picture is between the two windows.' Example description: 'My favourite room is the living room. There is a big brown sofa in front of the television and a colourful carpet on the floor. My mother's plants are next to the window. In the evening, we sit there and we drink mint tea together.'"},
    {semester:"S2",
      title:"Clothes and colours",
      essentiel:"You learn the names of clothes (les vetements) and colours, and how to describe what people are wearing with 'wear' and the present continuous.",
      cours:"Clothes: a T-shirt, a shirt, a dress (robe), a skirt (jupe), trousers (pantalon), jeans, a jumper/sweater (pull), a jacket, a coat (manteau), shoes, trainers (baskets), socks (chaussettes), a hat, a scarf (echarpe), a djellaba, a kaftan. Colours: red, blue, green, yellow, black, white, brown, orange, pink, purple, grey. In English the colour comes BEFORE the noun: 'a red dress' (une robe rouge), 'black shoes'. When there are two adjectives, the order is opinion + size + colour: 'a nice long blue skirt'. Use 'wear' for a habit and 'be wearing' for now: 'I wear a uniform every day.' / 'Today she is wearing a green jacket.' Ask: 'What are you wearing?' or 'What colour is your bag?' - 'It's dark blue.' Some clothes are always plural: trousers, jeans, shorts, glasses - so we say 'My trousers are new' and 'a pair of trousers'.",
      piege:"Putting the colour after the noun like in French: 'a dress red' instead of 'a red dress'. Also using a plural adjective: 'blacks shoes' - adjectives NEVER take -s in English ('black shoes'). And saying 'my trouser is' instead of 'my trousers are'.",
      astuce:"Remember the rhyme 'colour first, thing after': RED CAR, BLUE BAG. And adjectives in English are 'lazy': they never change, no -e, no -s.",
      exercice:"Put the words in the right order and correct the mistakes: '1. skirt / a / long / blue - She is wearing ______. 2. shoes / whites / new - I have got ______. 3. Correct: 'Today my brother wear a jacket green.' 4. Answer: What are you wearing today? (2 sentences)'",
      reponse:"'1. She is wearing a long blue skirt. 2. I have got new white shoes. 3. Correct sentence: 'Today my brother is wearing a green jacket.' (present continuous for now: is wearing; the colour comes before the noun: a green jacket). 4. Example: 'Today I am wearing a white T-shirt, blue jeans and black trainers. I am also wearing my grey school jacket because it is cold.''"},
    {semester:"S1",
      title:"Food and drinks",
      essentiel:"You learn food and drink words and how to talk about what you like and what you eat, with 'some / any' and 'How much / How many'.",
      cours:"Food: bread, cheese, eggs, meat, chicken, fish, rice, pasta, soup, salad, vegetables (legumes), fruit, apples, oranges, bananas, dates, olives, honey, msemen, harira. Drinks: water, milk, juice, tea (mint tea), coffee, a milkshake, a smoothie. Some nouns can be counted (countable): 'one apple, two apples'; others cannot (uncountable): bread, rice, water, milk, cheese - they have no plural, so we say 'some bread', 'a lot of milk', 'a glass of water', 'a piece of cheese'. Use 'some' in positive sentences ('I want some juice'), and 'any' in questions and negatives ('Have you got any bananas?', 'There isn't any bread'). Ask quantity with 'How many' + countable ('How many eggs?') and 'How much' + uncountable ('How much sugar?'). Talk about tastes with like/don't like/love/hate: 'I like fish but I don't like olives.' - 'Do you like harira?' - 'Yes, I do. / No, I don't.' At a cafe: 'Can I have a glass of orange juice, please?' - 'Here you are.' - 'Thank you.'",
      piege:"Adding -s to uncountable nouns: 'breads', 'waters', 'rices' are wrong; say 'some bread', 'two bottles of water'. Another very common mistake is answering 'Do you like tea?' with 'Yes, I like it very much' but writing 'Yes, I like' - the short answer is 'Yes, I do.' Also do not forget the -s in 'he likes'.",
      astuce:"'If you can count it, MANY; if you must pour it, MUCH.' (many apples / much water). And remember: 'SOME in a smile (positive), ANY in a question or a NO'.",
      exercice:"Complete with some, any, how much or how many: '1. I would like ______ milk in my tea. 2. Have you got ______ apples? 3. ______ eggs do we need for the cake? 4. ______ sugar do you put in your tea? 5. There isn't ______ bread on the table.' Then write two sentences about the food you like and dislike.",
      reponse:"'1. I would like some milk in my tea. 2. Have you got any apples? 3. How many eggs do we need for the cake? 4. How much sugar do you put in your tea? 5. There isn't any bread on the table.' Example: 'I love chicken with rice and I really like fresh orange juice. I don't like fish and I hate hot soup.' (Rule: some = positive, any = questions and negatives; how many + countable nouns like eggs, how much + uncountable nouns like sugar.)"},
    {semester:"S2",
      title:"Transport and getting around",
      essentiel:"You learn the means of transport (les moyens de transport) and how to say how you travel with 'by' and 'go to', and how to ask for directions.",
      cours:"Transport words: a bus, a train, a tram, a taxi, a car, a bike (bicycle), a motorbike, a plane, a boat, on foot (a pied). We say 'by bus, by train, by car, by plane, by bike' BUT 'on foot' and 'on my bike'. Example: 'I go to school on foot, and my father goes to work by car.' Verbs to know: go, come, take ('I take the bus at 7 o'clock'), get on / get off (monter / descendre), walk, ride (a bike), drive (a car), wait for. Ask questions with the present simple: 'How do you go to school?' - 'I go by bus.' / 'How long does it take?' - 'It takes twenty minutes.' Directions: 'Excuse me, where is the post office, please?' - 'Go straight on, turn left at the traffic lights, and it is on your right, next to the pharmacy.' Useful words: street, corner (coin), roundabout (rond-point), bus stop, station, ticket, opposite (en face de), near, far.",
      piege:"Saying 'by foot' instead of 'on foot', and 'I take the bus to go to the school' with an extra 'the' - we say 'go to school' without an article when we speak about school in general. Students also forget the -s in the third person: 'My sister go by taxi' -> 'My sister goes by taxi.'",
      astuce:"'BY for machines, ON for feet': by car, by bus, by plane... but ON FOOT, because your feet touch the ground. For directions, learn three magic verbs: GO straight, TURN left, TAKE the second street.",
      exercice:"Complete with by, on, goes or takes: '1. Every morning I go to school ______ foot because it is near. 2. My brother ______ to the university ______ train. 3. The journey ______ about thirty minutes.' Then give directions from your school to the nearest pharmacy in 3 sentences.",
      reponse:"'1. Every morning I go to school on foot because it is near. 2. My brother goes to the university by train. 3. The journey takes about thirty minutes.' Example of directions: 'Go out of the school and turn right. Go straight on for about a hundred metres, then turn left at the traffic lights. The pharmacy is on your right, opposite the bakery.' (Rule: 'on foot' but 'by train'; he/she/it + goes/takes with -s.)"},
    {semester:"S2",
      title:"Sports and abilities",
      essentiel:"You learn sports words and how to say what you can and cannot do with 'can' and 'can't' (la capacite).",
      cours:"Sports: football, basketball, volleyball, handball, tennis, swimming, running, cycling, karate, gymnastics, chess (echecs). We use 'play' with ball games and games ('play football', 'play chess'), 'do' with individual activities ('do karate', 'do gymnastics') and 'go' with -ing activities ('go swimming', 'go running', 'go cycling'). 'Can' expresses ability: 'I can swim very well. I can't ride a horse.' After can/can't, the verb has NO 's' and NO 'to': 'She can play tennis' (not 'she can plays' or 'can to play'). Questions: 'Can you ride a bike?' - 'Yes, I can. / No, I can't.' You can add adverbs: very well, well, quite well, a little, not at all. To speak about similarity, use short rejoinders: 'I can swim.' - 'Me too!' / 'I can't swim.' - 'Me neither.' / 'Not me.' Ask about favourites: 'What's your favourite sport?' - 'My favourite sport is volleyball because it is a team sport.'",
      piege:"Adding 'to' or '-s' after can: 'He can to swim' or 'He cans swim' are both wrong; say 'He can swim.' Another mistake is mixing play/do/go: 'I play swimming' -> 'I go swimming'. Also, 'can't' is the short form of 'cannot' - do not forget the apostrophe.",
      astuce:"Learn the three verb families: 'PLAY with a ball, DO the martial arts, GO with the -ING sports.' And remember 'CAN is a little robot: it never takes S and never takes TO.'",
      exercice:"1) Complete with play, do or go: 'a. I ______ basketball at school. b. My sister ______ karate on Saturdays. c. We ______ swimming in summer.' 2) Make sentences with can / can't: 'd. she / ride a bike (+) e. I / play the guitar (-) f. you / speak English? (?)'",
      reponse:"'1) a. I play basketball at school. b. My sister does karate on Saturdays. c. We go swimming in summer. 2) d. She can ride a bike. e. I can't play the guitar. f. Can you speak English?' (Rules: play + ball games, do + martial arts/gymnastics, go + -ing sports; after can/can't the verb stays in the base form, and in questions 'can' comes before the subject.)"},
    {semester:"S2",
      title:"Free time and routines",
      essentiel:"You talk about your daily routine (la routine quotidienne) and your hobbies with the present simple and adverbs of frequency.",
      cours:"Routine verbs: get up, wash, brush my teeth, have breakfast, go to school, have lunch, do my homework, help my mother, watch TV, read, play, go to bed. Free-time activities: listen to music, play video games, ride a bike, draw, read comics, chat with friends, watch films, do sport. The present simple describes what you do every day. Add -s (or -es) for he/she/it: 'I get up at seven o'clock.' / 'She gets up at six.' / 'He watches TV in the evening.' Negative and questions use do/does: 'I don't play video games on school days.' / 'Does she read every evening?' - 'Yes, she does.' Adverbs of frequency go BEFORE the main verb: always, usually, often, sometimes, rarely, never. 'I always have breakfast. She never goes to bed late.' Time expressions: in the morning, in the afternoon, in the evening, at night, at 7 o'clock, on Mondays, every day, twice a week, at the weekend.",
      piege:"Forgetting the -s in the third person ('She go to school') and using it with do/does ('Does she goes?' -> 'Does she go?'). Also placing the adverb wrongly: 'I go always to school by bus' -> 'I always go to school by bus'. And remember 'in the morning' but 'at night'.",
      astuce:"'He, She, It -> the S must fit!' And for adverbs of frequency, remember the sandwich: SUBJECT + ADVERB + VERB ('I never forget'). With the verb 'be', it is the opposite: 'I am never late.'",
      exercice:"Put the verbs in the present simple and place the adverb correctly: '1. My mother (get up) ______ at six o'clock. (always) 2. I (not / watch) ______ TV before my homework. 3. ______ your brother (play) ______ football at the weekend? 4. We (visit) ______ our grandparents on Fridays. (usually)' Then write 4 sentences about your Sunday.",
      reponse:"'1. My mother always gets up at six o'clock. 2. I don't watch TV before my homework. 3. Does your brother play football at the weekend? 4. We usually visit our grandparents on Fridays.' Example: 'On Sundays, I usually get up at nine o'clock. I have a big breakfast with my family and then I help my mother in the kitchen. In the afternoon, I sometimes ride my bike with my cousin or read a comic book. I never go to bed late because I have school on Monday.'"},
    {semester:"S2",
      title:"Health and feeling well",
      essentiel:"You learn the parts of the body and how to say how you feel, with 'have got a...' for illnesses and 'should' for advice.",
      cours:"Parts of the body: head, hair, eyes, ears, nose, mouth, teeth (tooth), throat (gorge), neck, back (dos), arm, hand, finger, leg, foot (feet), stomach (ventre). Feelings and health: 'How are you?' - 'I'm fine, thanks.' / 'I'm not very well.' / 'I'm tired / hungry / thirsty / cold / hot / happy / sad / scared.' For illness we use 'have got': 'I've got a headache' (mal a la tete), 'a toothache', 'a stomach ache', 'a sore throat', 'a cold' (un rhume), 'a temperature / a fever', 'the flu'. Say 'It hurts' or 'My leg hurts.' At the doctor's: 'What's the matter?' / 'What's wrong?' - 'I've got a bad cough.' - 'You should stay in bed and drink a lot of water. You shouldn't eat cold food.' Advice uses 'should / shouldn't' + base verb (no 'to'). Healthy habits: eat fruit and vegetables, drink water, sleep eight hours, do sport, wash your hands, don't eat too much sugar.",
      piege:"Translating French word for word: 'I have mal to my head' or 'I am cold' confused with 'I have cold' - the correct forms are 'I've got a headache' and 'I'm cold' (for temperature) / 'I've got a cold' (illness). Another mistake: 'You should to rest' -> 'You should rest'. Note also the irregular plurals: tooth/teeth, foot/feet.",
      astuce:"Learn the '-ACHE family' together: headACHE, toothACHE, stomach ACHE, backACHE, earACHE. And for advice: 'SHOULD is a good friend - it gives advice, never TO.'",
      exercice:"Match and complete: '1. I ate too many sweets. I've got a ______. 2. I can't speak, I've got a sore ______. 3. Give advice with should / shouldn't: a. My friend has got a temperature. b. I am very tired at school every morning.' Then write a short dialogue (4 lines) between a doctor and a pupil.",
      reponse:"'1. I ate too many sweets. I've got a stomach ache (or a toothache). 2. I can't speak, I've got a sore throat. 3. a. She should stay at home and see a doctor. She shouldn't go to school. b. You should go to bed earlier. You shouldn't watch TV late at night.' Example dialogue: 'Doctor: Good morning. What's the matter? - Pupil: I've got a bad headache and a temperature. - Doctor: Let me see... You've got the flu. You should rest for two days and drink a lot of water. - Pupil: Thank you, doctor.'"}

  info: [
    {semester:"S1",
      title:"Information et informatique",
      essentiel:"Une information est une donnée qui a du sens pour nous ; l'informatique est la science du traitement automatique de l'information à l'aide d'un ordinateur.",
      cours:"Le mot « informatique » est fabriqué à partir de deux mots : INFORMATion + automATIQUE. Une information, c'est une donnée (un texte, un nombre, une image, un son, un signal) qui apporte un sens utile à celui qui la reçoit. L'ordinateur, lui, est une machine électronique programmable : il reçoit des données, les conserve, les traite et affiche le résultat très vite et sans erreur de calcul. Le chemin suivi par les données est toujours le même : ENTRÉE → TRAITEMENT → SORTIE. Exemple concret : tu tapes 12 et 8 au clavier avec le signe « + » (entrée), l'ordinateur additionne (traitement), et 20 apparaît sur l'écran (sortie). Attention : 12 et 8 tout seuls sont des données ; « la note de Sara est 20/20 » est une information, car elle a un sens.",
      piege:"Erreur fréquente : croire que « informatique » veut dire « ordinateur ». Non : l'ordinateur est la machine, l'informatique est la science (la matière) qui étudie le traitement automatique de l'information. On dit « un ordinateur », pas « un informatique ».",
      astuce:"Retiens le mot-valise en le coupant : INFORMAT-ION + AUTOM-ATIQUE = INFORMATIQUE. Et retiens les 3 mots dans l'ordre : Entrée, Traitement, Sortie (E-T-S), comme les 3 étapes d'une recette : ingrédients, cuisson, plat servi.",
      exercice:"1) Complète : le mot « informatique » vient de ......... et de ......... . 2) Range ces éléments dans les 3 étapes E/T/S : le clavier, le processeur, l'écran. 3) Donne un exemple de donnée et un exemple d'information.",
      reponse:"1) « information » et « automatique ». 2) Entrée : le clavier ; Traitement : le processeur ; Sortie : l'écran. 3) Donnée : « 17 » ou « 25/12 » ; Information : « la note de Sara en maths est 17/20 » ou « le contrôle aura lieu le 25 décembre » — car là, le nombre prend un sens."},
    {semester:"S1",
      title:"Le système informatique",
      essentiel:"Un système informatique = le matériel (hardware) + les logiciels (software). Les deux sont indispensables : sans logiciel, la machine ne sert à rien.",
      cours:"Le matériel, c'est tout ce qu'on peut toucher : l'unité centrale et les périphériques. Dans l'unité centrale on trouve le processeur (CPU), le « cerveau » de l'ordinateur qui exécute les ordres et fait les calculs (sa vitesse se mesure en gigahertz, GHz), la mémoire vive RAM, très rapide mais temporaire (elle perd tout dès qu'on coupe le courant), et le disque dur, mémoire permanente de grande capacité qui garde les fichiers, les programmes et le système d'exploitation même éteint. Les logiciels, c'est tout ce qui n'est pas matériel : les logiciels d'application (Paint, un jeu, un traitement de texte) et le système d'exploitation (Windows) qui fait fonctionner l'ensemble. Exemple concret : ton ordinateur est comme une classe : le matériel c'est la salle, les tables et le tableau ; le logiciel c'est la leçon et les consignes. Une salle sans leçon ne sert à rien, une leçon sans salle ne peut pas se dérouler.",
      piege:"Erreur fréquente : confondre la RAM et le disque dur, ou croire qu'un fichier « ouvert » est déjà enregistré. La RAM est temporaire : si le courant se coupe avant que tu enregistres, ton travail est perdu. Le disque dur, lui, garde les données.",
      astuce:"Deux familles à retenir : « ce que je touche = matériel », « ce que je clique = logiciel ». Pour RAM / disque dur : RAM = « Rapide Après Minute, tout s'efface » (temporaire), disque dur = « dur comme la pierre, ça reste ».",
      exercice:"Classe en deux colonnes (Matériel / Logiciel) : la souris, Windows, le processeur, Paint, le disque dur, un jeu vidéo. Puis explique en une phrase la différence entre la RAM et le disque dur.",
      reponse:"Matériel : la souris, le processeur, le disque dur. Logiciel : Windows, Paint, un jeu vidéo. La RAM est une mémoire temporaire et très rapide qui perd tout son contenu quand on éteint l'ordinateur, alors que le disque dur est une mémoire permanente de grande capacité qui conserve les fichiers et les programmes même après l'extinction."},
    {semester:"S1",
      title:"Périphériques : entrée, sortie et stockage",
      essentiel:"Les périphériques sont les appareils branchés à l'unité centrale : ceux d'entrée envoient les données, ceux de sortie donnent les résultats, ceux de stockage les conservent.",
      cours:"Un périphérique d'entrée sert à faire entrer des données dans l'ordinateur : le clavier (texte et chiffres), la souris (clics et déplacements), le scanner (image d'un document papier), et aussi le microphone et la webcam. Un périphérique de sortie sert à faire sortir le résultat : l'écran (affichage), l'imprimante (papier), les haut-parleurs (son). Un périphérique de stockage sert à garder les données : le disque dur, la clé USB, la carte mémoire, le CD/DVD. Certains appareils sont mixtes : un écran tactile sert à la fois d'entrée (tu touches) et de sortie (il affiche). Exemple concret : pour faire un dessin et le donner à ta maîtresse, tu dessines avec la souris (entrée), tu le vois sur l'écran (sortie), tu l'imprimes (sortie) et tu le copies sur une clé USB (stockage).",
      piege:"Erreur fréquente : classer le scanner et l'imprimante dans la même catégorie parce qu'ils se ressemblent. Le scanner fait ENTRER une image dans l'ordinateur (entrée), l'imprimante fait SORTIR le document sur papier (sortie).",
      astuce:"Pose-toi la question du sens de la flèche : vers l'ordinateur = entrée ; depuis l'ordinateur = sortie ; ça reste dedans = stockage. Astuce mémoire : « Clavier-Souris-Scanner entrent, Écran-Imprimante-Haut-parleurs sortent, USB-Disque gardent ».",
      exercice:"Classe dans un tableau à 3 colonnes (Entrée / Sortie / Stockage) : imprimante, clavier, clé USB, écran, scanner, disque dur, souris, haut-parleurs. Puis cite un appareil qui peut être à la fois entrée et sortie.",
      reponse:"Entrée : clavier, scanner, souris. Sortie : imprimante, écran, haut-parleurs. Stockage : clé USB, disque dur. Un écran tactile (ou un casque avec micro) est à la fois périphérique d'entrée et de sortie."},
    {semester:"S1",
      title:"Système d'exploitation et interface graphique",
      essentiel:"Le système d'exploitation (par exemple Windows) est le logiciel principal qui fait fonctionner l'ordinateur et nous permet de le commander grâce à une interface graphique.",
      cours:"Sans système d'exploitation, l'ordinateur ne démarre pas : l'écran, le processeur et le disque dur resteraient des pièces électroniques muettes. Le système d'exploitation gère le matériel, lance les programmes, organise les fichiers et présente à l'utilisateur une interface graphique facile à utiliser. Cette interface, c'est le Bureau : on y trouve les icônes (petits dessins qui représentent un programme, un fichier ou un dossier), la barre des tâches en bas et le menu Démarrer. Chaque programme s'ouvre dans une fenêtre que l'on peut réduire, agrandir, déplacer, redimensionner ou fermer grâce aux boutons en haut à droite. Exemple concret : tu double-cliques sur l'icône de Paint, une fenêtre s'ouvre ; tu la réduis pour aller voir un dossier, puis tu la retrouves en cliquant sur son bouton dans la barre des tâches.",
      piege:"Erreur fréquente : confondre « réduire » et « fermer ». Réduire (le trait « – ») met la fenêtre de côté dans la barre des tâches, le programme continue de tourner ; fermer (la croix « × ») arrête le programme, et si tu n'as pas enregistré, tu perds ton travail.",
      astuce:"Retiens les 3 boutons de la fenêtre de gauche à droite : « – » je range, « ▢ » j'agrandis, « × » je quitte. Et retiens que Windows est un « chef d'orchestre » : il ne joue pas la musique, il fait jouer tous les autres.",
      exercice:"1) Donne un exemple de système d'exploitation. 2) Cite trois éléments que l'on voit sur le Bureau. 3) Quelle est la différence entre réduire une fenêtre et la fermer ?",
      reponse:"1) Windows (on peut citer aussi Linux ou macOS). 2) Les icônes, la barre des tâches, le menu Démarrer (et l'arrière-plan/fond d'écran). 3) Réduire range la fenêtre dans la barre des tâches, mais le programme reste ouvert et le travail n'est pas perdu ; fermer arrête complètement le programme, et le travail non enregistré est perdu."},
    {semester:"S1",
      title:"Fichiers, dossiers et extensions",
      essentiel:"Un fichier est un ensemble d'informations enregistrées sous un nom ; les dossiers servent à ranger les fichiers ; l'extension indique le type du fichier.",
      cours:"Chaque travail enregistré devient un fichier, qui possède un nom, une taille, une date et un emplacement. Le nom complet est en deux parties séparées par un point : le nom choisi et l'extension, par exemple « exposé_egypte.docx ». L'extension dit à l'ordinateur avec quel logiciel ouvrir le fichier : .docx (document de traitement de texte), .txt (texte simple), .jpg ou .png (image), .mp3 ou .wav (son), .mp4 (vidéo), .pdf (document à lire/imprimer), .xlsx (tableur). Pour ne pas se perdre, on range les fichiers dans des dossiers, et un dossier peut contenir d'autres dossiers (sous-dossiers) : c'est l'arborescence. Exemple concret : crée un dossier « Collège », puis dedans « Sciences sociales » et « Informatique », et place « exposé_egypte.docx » dans le bon dossier. On peut ensuite copier, déplacer, renommer ou supprimer un fichier.",
      piege:"Erreur fréquente : effacer ou changer l'extension quand on renomme un fichier (écrire « photo » au lieu de « photo.jpg »). L'ordinateur ne sait plus alors comment l'ouvrir. Quand tu renommes, ne touche qu'à la partie avant le point.",
      astuce:"Pense à une lettre postale : le fichier est la lettre, le dossier est la boîte, et l'extension est le timbre qui dit à quel bureau l'envoyer. Et retiens 3 paires : texte → .docx, image → .jpg, son → .mp3.",
      exercice:"Associe chaque fichier à son type : « leçon.docx », « chat.jpg », « chanson.mp3 », « film.mp4 ». Puis propose une organisation en dossiers pour ranger tes travaux de 1AC.",
      reponse:"« leçon.docx » = document de traitement de texte ; « chat.jpg » = image ; « chanson.mp3 » = son (audio) ; « film.mp4 » = vidéo. Organisation possible : un dossier « 1AC » contenant les sous-dossiers « Sciences sociales », « Informatique », « Maths », « Français », et dans chacun un sous-dossier « Exposés » et un sous-dossier « Contrôles »."},
    {semester:"S1",
      title:"Images, sons et documents multimédias",
      essentiel:"Avec des logiciels utilitaires simples, on peut créer un fichier dessin et un fichier son, puis les réunir dans un document multimédia.",
      cours:"Le programme de 1AC prévoit la création d'un fichier dessin et d'un fichier son. Pour le dessin, on utilise un logiciel de dessin comme Paint : on choisit un outil (crayon, pinceau, formes, pot de peinture), une couleur, on dessine, puis on enregistre avec « Fichier > Enregistrer sous » en choisissant un nom et un format d'image (.png ou .jpg). Pour le son, on utilise un enregistreur (magnétophone) avec un microphone : on clique sur « Enregistrer », on parle, on arrête, on écoute, puis on enregistre en .wav ou .mp3. Un document est dit multimédia quand il réunit plusieurs médias : texte, image, son, vidéo — par exemple un exposé où l'on insère une image et où l'on ajoute un commentaire audio. Exemple concret : dessine le drapeau du Maroc dans Paint, enregistre-le sous « drapeau.png », enregistre ta voix qui le décrit sous « description.mp3 », puis insère l'image dans ton document de traitement de texte.",
      piege:"Erreur fréquente : cliquer sur « Enregistrer » au lieu de « Enregistrer sous » lors du premier enregistrement, ou ne pas regarder dans quel dossier le fichier part — on ne le retrouve plus ensuite. Regarde toujours le nom ET l'emplacement avant de valider.",
      astuce:"Trois questions à te poser à chaque enregistrement : QUOI (le nom), OÙ (le dossier), COMMENT (le format/l'extension). Et retiens : image = .png/.jpg, son = .mp3/.wav.",
      exercice:"Tu veux réaliser une petite carte de vœux multimédia. 1) Quel logiciel utilises-tu pour le dessin ? 2) Sous quel format enregistres-tu l'image et le son ? 3) Cite les médias que peut contenir un document multimédia.",
      reponse:"1) Un logiciel de dessin comme Paint. 2) L'image en .png (ou .jpg) et le son en .mp3 (ou .wav). 3) Le texte, l'image, le son, la vidéo (et l'animation)."},
    {semester:"S2",
      title:"Traitement de texte : saisir et corriger",
      essentiel:"Un logiciel de traitement de texte (comme MS Word) permet de saisir un texte au clavier, puis de le corriger et de le modifier avant de l'enregistrer.",
      cours:"La saisie consiste à taper le texte au clavier : la touche Espace sépare les mots, la touche Entrée passe à un nouveau paragraphe, la touche Maj (Shift) donne les majuscules et les caractères du haut. Le point d'insertion (le curseur clignotant) indique où le texte va s'écrire. Pour corriger : la touche Retour arrière (Backspace) efface le caractère situé avant le curseur, la touche Suppr (Delete) efface celui situé après, ou la sélection entière. On peut aussi sélectionner un mot, puis le copier (Ctrl+C), le couper, le coller ailleurs (Ctrl+V), et annuler une erreur avec Ctrl+Z. Le correcteur linguistique souligne en rouge les fautes d'orthographe et propose des suggestions par un clic droit. On enregistre régulièrement avec Ctrl+S. Exemple concret : tu tapes « Le Maroc et un beau pays », le correcteur ne souligne rien car « et » existe, mais toi tu relis et tu corriges en « est » : le correcteur aide, il ne remplace pas la relecture.",
      piege:"Erreur fréquente : faire confiance à 100 % au correcteur automatique, ou utiliser plusieurs Espace/Entrée pour placer un texte. Le correcteur ne comprend pas le sens (« et »/« est »), et les espaces multiples déforment la mise en page.",
      astuce:"Quatre raccourcis à retenir par cœur : Ctrl+S (enregistrer), Ctrl+C (copier), Ctrl+V (coller), Ctrl+Z (annuler). Astuce : « S = Sauver, C = Copier, V = Verser, Z = Zéro erreur ».",
      exercice:"1) Quelle touche utilises-tu pour aller à un nouveau paragraphe ? 2) Quelle est la différence entre Backspace et Suppr ? 3) Donne le raccourci pour enregistrer et celui pour annuler.",
      reponse:"1) La touche Entrée. 2) Backspace (retour arrière) efface le caractère qui se trouve juste avant le curseur, tandis que Suppr (Delete) efface le caractère qui se trouve juste après le curseur, ou l'élément sélectionné. 3) Enregistrer : Ctrl+S ; annuler : Ctrl+Z."},
    {semester:"S2",
      title:"Traitement de texte : mise en forme",
      essentiel:"La mise en forme consiste à changer l'apparence du texte : on met en forme les caractères (police, taille, couleur, gras, italique) et les paragraphes (alignement, interligne).",
      cours:"La mise en forme des caractères agit sur les lettres : on choisit la police (Arial, Times New Roman…), la taille (12, 14, 18…), la couleur, et les styles gras (Ctrl+G), italique (Ctrl+I), souligné (Ctrl+U). La mise en forme des paragraphes agit sur des blocs entiers : l'alignement (à gauche, centré, à droite, justifié), l'interligne (espace entre les lignes), le retrait et les puces ou numéros pour faire une liste. Règle d'or : il faut d'abord SÉLECTIONNER, puis appliquer le format. On peut aussi enrichir le document en insérant un tableau, une image ou une forme. Exemple concret : pour un exposé, mets le titre en Arial taille 18, gras, centré et en bleu ; puis le texte en taille 12, justifié, avec un interligne de 1,5 ; et fais la liste des idées avec des puces.",
      piege:"Erreur fréquente : cliquer sur « gras » sans avoir sélectionné le texte — rien ne change sur ce qui est déjà écrit (seul le texte tapé ensuite sera en gras). Autre erreur : confondre mise en forme des caractères et des paragraphes ; l'alignement et l'interligne concernent tout le paragraphe, pas une lettre.",
      astuce:"Retiens la règle en deux temps : « je sélectionne, puis je décide ». Et pour distinguer les deux familles : caractères = les lettres (police, taille, couleur, G/I/S) ; paragraphes = le bloc (alignement, interligne, puces).",
      exercice:"Tu dois mettre en forme un exposé. 1) Cite trois éléments de la mise en forme des caractères. 2) Cite deux éléments de la mise en forme des paragraphes. 3) Que dois-tu toujours faire AVANT d'appliquer une mise en forme ?",
      reponse:"1) La police (type de caractère), la taille, la couleur — on peut aussi citer le gras, l'italique, le souligné. 2) L'alignement (gauche, centré, droite, justifié) et l'interligne — on peut aussi citer les retraits et les puces/numéros. 3) Sélectionner le texte concerné."},
    {semester:"S2",
      title:"Mise en page, impression et export",
      essentiel:"La mise en page règle la feuille (format, orientation, marges) ; l'aperçu permet de vérifier avant d'imprimer, et l'export en PDF sert à partager le document sans le déformer.",
      cours:"La mise en page concerne la page entière : le format du papier (A4 le plus souvent), l'orientation (portrait ou paysage), les marges (haut, bas, gauche, droite), les en-têtes et pieds de page, et la numérotation des pages. Avant d'imprimer, on utilise toujours l'aperçu avant impression pour vérifier le nombre de pages et voir si rien n'est coupé. Ensuite, dans la boîte de dialogue Impression (Ctrl+P), on choisit l'imprimante, le nombre de copies et les pages à imprimer. Enfin, on peut exporter le document en PDF : le PDF garde exactement la même apparence sur tous les ordinateurs et se lit partout, ce qui est idéal pour envoyer un travail. Exemple concret : ton exposé a un tableau large ; en portrait il est coupé, alors tu passes en orientation paysage, tu réduis les marges, tu vérifies dans l'aperçu, tu exportes en PDF et tu l'envoies à ton professeur.",
      piege:"Erreur fréquente : confondre mise en forme et mise en page. La mise en forme change l'apparence du texte, la mise en page change les réglages de la feuille. Autre erreur : imprimer sans passer par l'aperçu, et gaspiller du papier à cause d'une page presque vide.",
      astuce:"Trois mots pour la mise en page : FORMAT, ORIENTATION, MARGES (F-O-M). Et un réflexe : « aperçu d'abord, impression ensuite ». Ctrl+P = Print (imprimer).",
      exercice:"1) Quelle orientation choisis-tu pour un tableau très large ? 2) Cite trois réglages de la mise en page. 3) Pourquoi exporter un document en PDF avant de l'envoyer ?",
      reponse:"1) L'orientation paysage. 2) Le format du papier (A4), l'orientation (portrait/paysage) et les marges — on peut aussi citer l'en-tête/pied de page et la numérotation des pages. 3) Parce que le PDF conserve exactement la même mise en page, les mêmes polices et les mêmes images sur n'importe quel ordinateur, et qu'il peut être lu partout sans le logiciel de traitement de texte d'origine."},
    {semester:"S2",
      title:"Chercher une information et rester en sécurité",
      essentiel:"On peut chercher une information dans un support de stockage, dans une encyclopédie numérique ou sur le Web ; il faut ensuite vérifier la source et protéger ses données personnelles.",
      cours:"Le programme de 1AC prévoit deux recherches : la recherche d'un fichier sur un support de stockage (grâce à l'outil de recherche de Windows, en tapant une partie du nom ou en filtrant par type ou par date) et la recherche dans une encyclopédie numérique (CD/DVD ou version en ligne), organisée par articles, rubriques et mots-clés. Sur le Web, on utilise un navigateur puis un moteur de recherche avec des mots-clés précis. Ensuite vient l'étape la plus importante : évaluer l'information. Il faut regarder qui publie (site officiel, école, ministère, encyclopédie reconnue), quand cela a été publié, et comparer au moins deux sources différentes avant de recopier. Pour la sécurité : ne jamais donner son nom complet, son adresse, son numéro de téléphone ou une photo à un inconnu ; utiliser un mot de passe long et secret ; ne pas ouvrir les pièces jointes ou les liens suspects ; et parler tout de suite à un adulte en cas de message méchant ou gênant. Exemple concret : pour un exposé sur la civilisation de Mésopotamie, cherche « civilisation Mésopotamie » sur un site scolaire reconnu, compare avec ton manuel, et cite ta source à la fin de l'exposé.",
      piege:"Erreur fréquente : croire que le premier résultat d'un moteur de recherche est forcément le plus vrai, et copier-coller sans vérifier ni citer la source. Un site peut contenir des erreurs (dates fausses, informations dépassées) : il faut toujours croiser deux sources.",
      astuce:"Trois questions avant de faire confiance à une page : QUI l'a écrite ? QUAND ? Est-ce que je le retrouve AILLEURS ? Et pour la sécurité, la règle « STOP » : rien de personnel, Ne clique pas sur l'inconnu, Mot de passe secret, Parle à un adulte.",
      exercice:"Tu prépares un exposé sur les droits de l'enfant. 1) Cite deux endroits où tu peux chercher l'information selon le programme de 1AC. 2) Donne deux critères pour savoir si un site est fiable. 3) Cite deux informations que tu ne dois jamais publier sur Internet.",
      reponse:"1) Dans un support de stockage (disque dur, clé USB) grâce à l'outil de recherche de fichiers, et dans une encyclopédie numérique (ou sur un site officiel via un moteur de recherche). 2) L'auteur ou l'organisme qui publie (site officiel, ministère, encyclopédie reconnue, établissement scolaire) et la date de publication ; on peut ajouter la possibilité de vérifier la même information dans une deuxième source. 3) Son adresse personnelle et son numéro de téléphone (ainsi que son mot de passe, son école ou ses photos privées)."}

  arabe: [
    {semester:"S1",
      title:"الميزان الصرفي",
      essentiel:"الميزان الصرفي مقياس نزن به الكلمة العربية في حروفها وحركاتها وسكناتها، وحروفه ثلاثة: الفاء والعين واللام على وزن «فَعَلَ». ولا نزن به إلا الأسماء والأفعال.",
      cours:"لكي نزن كلمة نقابل حرفها الأول بالفاء، والثاني بالعين، والثالث باللام، ونضع على حروف الميزان الحركات نفسها التي على حروف الكلمة. مثال: «كَتَبَ» وزنها «فَعَلَ»، و«عَلِمَ» وزنها «فَعِلَ». وإذا كانت الكلمة أكثر من ثلاثة حروف أصلية زدنا لامًا أو لامين: «زَلْزَلَ» وزنها «فَعْلَلَ»، و«سَفَرْجَل» وزنها «فَعَلَّل». وإذا كان في الكلمة حرف مضعّف رددنا الشدة إلى أصلها قبل الوزن: «قَصَّ» تصير «قَصَصَ» فوزنها «فَعَلَ». وإذا كان فيها حرف علة رددناه إلى أصله بالنظر إلى المضارع: «قَالَ ← يَقُولُ» فأصلها «قَوَلَ» ووزنها «فَعَلَ». وأما الحروف الزائدة فتُكتب في الميزان كما هي بلفظها، مثل: «اِكْتَتَبَ» على وزن «اِفْتَعَلَ».",
      piege:"الخطأ الشائع في هذا السن هو وزن الكلمة على عدد حروفها المكتوبة فقط، فيقول التلميذ إن وزن «قَالَ» هو «فَاعَ»، أو وزن «قَصَّ» هو «فَعْ»، لأنه لم يردّ حرف العلة والحرف المضعّف إلى أصلهما.",
      astuce:"احفظي جملة صغيرة: «أُفكّ الشدّة، وأُرجع حرف العلة، ثم أزن». وتذكّري أن حروف الزيادة مجموعة في كلمة واحدة سهلة الحفظ: «سَأَلْتُمُونِيهَا»، ويضاف إليها التضعيف.",
      exercice:"زِني الأفعال والأسماء الآتية وزنًا صرفيًّا صحيحًا: 1) فَهِمَ  2) دَحْرَجَ  3) شَدَّ  4) بَاعَ  5) اِنْطَلَقَ.",
      reponse:"1) فَهِمَ = فَعِلَ. 2) دَحْرَجَ = فَعْلَلَ (رباعي مجرد بزيادة لام في الميزان). 3) شَدَّ: نردّ الشدة فتصير «شَدَدَ» = فَعَلَ. 4) بَاعَ: مضارعها «يَبِيعُ» فأصلها «بَيَعَ» = فَعَلَ. 5) اِنْطَلَقَ = اِنْفَعَلَ (الهمزة والنون حرفان زائدان يُكتبان كما هما في الميزان)."},
    {semester:"S1",
      title:"الفعل المجرد والفعل المزيد",
      essentiel:"الفعل المجرد هو ما كانت جميع حروفه أصلية، والفعل المزيد هو ما زيد على حروفه الأصلية حرف أو حرفان أو ثلاثة أحرف.",
      cours:"المجرد يكون ثلاثيًّا مثل «نَظَرَ»، أو رباعيًّا مثل «زَلْزَلَ». والمزيد يُبنى على أوزان معروفة: فالثلاثي المزيد بحرف له ثلاثة أوزان: «أَفْعَلَ» للتعدية (أَخْرَجَ)، و«فَعَّلَ» للتكثير والتعدية (كَسَّرَ)، و«فَاعَلَ» للمشاركة (شَارَكَ). والمزيد بحرفين له خمسة أوزان: «اِنْفَعَلَ» و«اِفْتَعَلَ» و«تَفَعَّلَ» للمطاوعة، و«تَفَاعَلَ» للمشاركة، و«اِفْعَلَّ» لقوة اللون أو العيب. والمزيد بثلاثة أحرف له أربعة أوزان: «اِفْعَالَّ» و«اِفْعَوْعَلَ» و«اِفْعَوَّلَ» للمبالغة، و«اِسْتَفْعَلَ» للطلب والسؤال (اِسْتَغْفَرَ). وأما الرباعي المزيد فيكون بحرف على وزن «تَفَعْلَلَ» (تَدَحْرَجَ)، أو بحرفين على وزن «اِفْعَنْلَلَ» و«اِفْعَلَلَّ».",
      piege:"يظن كثير من المتعلمين أن كل فعل طويل مزيد وكل فعل قصير مجرد، فيقولون إن «زَلْزَلَ» و«سَفَرْجَل» مزيدان، والصواب أنهما مجردان لأن جميع حروفهما أصلية.",
      astuce:"قاعدة عملية: ارجعي بالفعل إلى الماضي المفرد ثم اسألي: هل يوجد حرف من «سَأَلْتُمُونِيهَا» أو شدّة زائدة؟ إن وُجد فالفعل مزيد، وإن لم يوجد فهو مجرد. واربطي المعنى بالوزن: «اِسْتَـ» = طلب، «تَفَاعَلَ» = مشاركة.",
      exercice:"حدّدي في كل فعل إن كان مجردًا أو مزيدًا، ثم اذكري وزنه ومعنى الزيادة إن وُجدت: 1) تَعَاوَنَ  2) كَتَبَ  3) اِسْتَخْرَجَ  4) عَلَّمَ  5) تَدَحْرَجَ.",
      reponse:"1) تَعَاوَنَ: مزيد بحرفين على وزن «تَفَاعَلَ»، ومعناه المشاركة. 2) كَتَبَ: مجرد ثلاثي على وزن «فَعَلَ». 3) اِسْتَخْرَجَ: مزيد بثلاثة أحرف على وزن «اِسْتَفْعَلَ»، ومعناه الطلب. 4) عَلَّمَ: مزيد بحرف (التضعيف) على وزن «فَعَّلَ»، ومعناه التكثير والتعدية. 5) تَدَحْرَجَ: رباعي مزيد بحرف على وزن «تَفَعْلَلَ»، ومعناه المطاوعة."},
    {semester:"S1",
      title:"الفعل الصحيح والفعل المعتل",
      essentiel:"الفعل الصحيح هو ما خلت حروفه الأصلية من أحرف العلة (ا، و، ي)، والفعل المعتل هو ما كان أحد حروفه الأصلية حرف علة.",
      cours:"ينقسم الصحيح ثلاثة أقسام: السالم وهو ما خلا من الهمزة والتضعيف مثل «كَتَبَ»، والمهموز وهو ما كان أحد أصوله همزة مثل «سَأَلَ» و«أَكَلَ»، والمضعّف وهو ما كانت عينه ولامه من جنس واحد مثل «قَصَّ». وينقسم المعتل خمسة أقسام: المثال وفاؤه حرف علة مثل «وَعَدَ»، والأجوف وعينه حرف علة مثل «قَالَ»، والناقص ولامه حرف علة مثل «سَعَى» و«دَعَا»، واللفيف المفروق وفاؤه ولامه حرفا علة مثل «وَقَى»، واللفيف المقرون وعينه ولامه حرفا علة مثل «طَوَى». والحكم يُعرف بالنظر إلى الحروف الأصلية لا إلى الزوائد.",
      piege:"الخطأ الشائع هو الحكم على الفعل بالنظر إلى صورته في المضارع أو مع الضمائر؛ فيُقال إن «يَقُولُ» أجوف و«قُلْتُ» صحيح، والصواب أن الفعل نفسه أجوف دائمًا لأن عينه حرف علة، وإنما حُذفت العين عند إسناده إلى ضمير رفع متحرك.",
      astuce:"استعملي أصابع اليد للترتيب: العلة في الأول = مِثال، في الوسط = أَجوف، في الآخر = ناقص. وتذكّري: «مِثال أوّل، أَجوف وسط، ناقص آخر».",
      exercice:"صنّفي الأفعال الآتية إلى صحيح (مع بيان نوعه) ومعتل (مع بيان نوعه): وَصَلَ – مَدَّ – قَرَأَ – نَامَ – رَمَى – طَوَى.",
      reponse:"وَصَلَ: معتل مثال (الواو في أوله). مَدَّ: صحيح مضعّف. قَرَأَ: صحيح مهموز (مهموز اللام). نَامَ: معتل أجوف (أصله نَوِمَ). رَمَى: معتل ناقص. طَوَى: معتل لفيف مقرون (العين واللام حرفا علة)."},
    {semester:"S1",
      title:"تصريف الفعل: الماضي والمضارع والأمر",
      essentiel:"تصريف الفعل هو إسناده إلى الضمائر في الأزمنة الثلاثة: الماضي والمضارع والأمر، مع ملاحظة التغييرات التي تطرأ على حروفه.",
      cours:"الفعل الصحيح السالم لا يتغير عند التصريف: كَتَبَ – كَتَبْتُ – أَكْتُبُ – اُكْتُبْ. والفعل المهموز تُحذف همزته في الأمر في أفعال معروفة مثل «أَخَذَ ← خُذْ» و«أَكَلَ ← كُلْ». والمضعّف يُفَكّ إدغامه إذا اتصل بضمائر الرفع المتحركة: قَصَّ ← قَصَصْتُ، قَصَصْنَا، يَقْصُصْنَ. والأجوف تُحذف عينه إذا أُسند إلى ضمير رفع متحرك أو سكن آخره: قَالَ ← قُلْتُ، قُلْنَا، قُلْ. والمثال الواوي من باب «فَعَلَ يَفْعِلُ» تُحذف فاؤه في المضارع والأمر: وَصَلَ ← يَصِلُ ← صِلْ. والناقص المنتهي بألف تُحذف ألفه مع واو الجماعة وتُقلب ياءً مع ألف الاثنين ونون النسوة: سَعَى ← سَعَوْا، سَعَيْنَ، تَسْعَيَانِ.",
      piege:"الخطأ الشائع كتابة الفعل كما هو دون التغيير الواجب، فيُكتب «قَالْتُ» بدل «قُلْتُ»، و«قَصَّتُ» بدل «قَصَصْتُ»، و«سَعَاوا» بدل «سَعَوْا».",
      astuce:"قاعدة مختصرة: «التاء و«نا» ونون النسوة تُوقظ الفعل فيتغيّر». فكلما اتصل الفعل بضمير رفع متحرك، توقّفي وفكّري: هل يُحذف حرف أو يُفكّ إدغام؟",
      exercice:"أسندي الفعل «قَالَ» إلى: أنا، نحن، هنّ في الماضي، ثم صوغي منه الأمر للمخاطب المفرد وللمخاطبة المفردة.",
      reponse:"الماضي: أنا ← قُلْتُ، نحن ← قُلْنَا، هنّ ← قُلْنَ (تُحذف العين لأن الفعل أجوف أُسند إلى ضمير رفع متحرك). الأمر: أنتَ ← قُلْ، أنتِ ← قُولِي (هنا تثبت العين لأن آخر الفعل لم يسكن)."},
    {semester:"S1",
      title:"الإعراب والبناء",
      essentiel:"الإعراب هو تغيّر آخر الكلمة بتغيّر موقعها في الجملة، والبناء هو لزوم آخر الكلمة صورة واحدة لا تتغير.",
      cours:"ألقاب الإعراب أربعة: الرفع وعلامته الضمة، والنصب وعلامته الفتحة، والجر وعلامته الكسرة، والجزم وعلامته السكون. مثال: «حضر التلميذُ» (رفع) – «رأيت التلميذَ» (نصب) – «سلّمت على التلميذِ» (جر). والإعراب نوعان: لفظي تظهر فيه الحركة، وتقديري لا تظهر فيه؛ ويكون التقدير للتعذر إذا كان آخر الكلمة ألفًا (الفتى)، وللاستثقال إذا كان واوًا أو ياءً (القاضي)، وللمناسبة إذا أُضيفت الكلمة إلى ياء المتكلم (كتابي). أما البناء فيكون على الضم أو الفتح أو الكسر أو السكون، والحروف كلها مبنية، ويلحق البناء بعض الأسماء وبعض الأفعال.",
      piege:"يخلط المتعلم بين البناء وعدم ظهور الحركة، فيحكم على «الفتى» بأنها مبنية لأن آخرها لا يتغير في الكتابة، والصواب أنها معربة إعرابًا تقديريًّا للتعذر.",
      astuce:"جرّبي «اختبار الحركة»: ضعي الكلمة في ثلاثة مواقع (فاعل، مفعول، بعد حرف جر). إن تغيّر آخرها فهي معربة، وإن ثبت على حالة واحدة كـ«هذا» و«نحن» و«أمس» فهي مبنية.",
      exercice:"بيّني في كل كلمة تحتها خط إن كانت معربة أو مبنية، وحدّدي حالتها: 1) جاء الـ**ولدُ**. 2) قرأت الـ**كتابَ**. 3) **هذا** بيتنا. 4) جلست في الـ**حديقةِ**. 5) **نحن** مجتهدون.",
      reponse:"1) «الولدُ» معربة، مرفوعة وعلامة رفعها الضمة (فاعل). 2) «الكتابَ» معربة، منصوبة وعلامة نصبها الفتحة (مفعول به). 3) «هذا» مبنية على السكون في محل رفع مبتدأ لأنها اسم إشارة. 4) «الحديقةِ» معربة، مجرورة وعلامة جرها الكسرة. 5) «نحن» مبنية على الفتح في محل رفع مبتدأ لأنها ضمير، والضمائر كلها مبنية."},
    {semester:"S2",
      title:"النكرة والمعرفة",
      essentiel:"النكرة اسم يدل على شيء غير معيّن، والمعرفة اسم يدل على شيء معيّن.",
      cours:"نقول «قرأت كتابًا» فـ«كتابًا» نكرة لأننا لا نعرف أيّ كتاب، ونقول «قرأت الكتابَ» فـ«الكتاب» معرفة. وتتحول النكرة إلى معرفة بثلاث طرائق: بدخول «أل» التعريف (كتاب ← الكتاب)، وبالإضافة إلى معرفة (كتاب ← كتاب فاطمة)، وبالنداء المقصود (يا تلميذُ). والمعارف سبعة: المعرّف بـ«أل»، والمضاف إلى معرفة، والمنادى المقصود بالنداء، والعَلَم (فاطمة، الرباط)، والضمير (أنا، هو)، واسم الإشارة (هذا)، والاسم الموصول (الذي).",
      piege:"يعتقد المتعلم أن التعريف لا يحصل إلا بـ«أل»، فيحكم على «كتاب فاطمة» و«يا تلميذُ» بأنهما نكرتان، والصواب أن الأولى معرفة بالإضافة والثانية معرفة بالنداء.",
      astuce:"احفظي المعارف السبعة بجملة تجمع أوائلها: «أل، إضافة، نداء، عَلَم، ضمير، إشارة، موصول»، وردّديها على أصابع اليد الواحدة مع الإبهام والخنصر مرتين.",
      exercice:"عيّني النكرة والمعرفة في الجمل الآتية، وبيّني نوع المعرفة: 1) زار طالبٌ مدرسةَ الحيّ. 2) هذه حقيبتي. 3) يا سائقُ، تمهّلْ. 4) الذي نجح فرح.",
      reponse:"1) «طالبٌ» نكرة، و«مدرسةَ الحيّ» معرفة بالإضافة، و«الحيّ» معرفة بـ«أل». 2) «هذه» معرفة (اسم إشارة)، و«حقيبتي» معرفة بالإضافة إلى ياء المتكلم (وهي ضمير). 3) «سائقُ» معرفة بالنداء المقصود. 4) «الذي» معرفة (اسم موصول)، و«فرح» فعل لا يدخل في التصنيف."},
    {semester:"S2",
      title:"الضمائر وأسماء الإشارة والأسماء الموصولة",
      essentiel:"الضمير واسم الإشارة والاسم الموصول ثلاثة أنواع من المعارف المبنية، يدل كل واحد منها على معيّن بطريقته الخاصة.",
      cours:"الضمير اسم معرفة مبني يدل على متكلم أو مخاطب أو غائب، وهو بارز له صورة في اللفظ (متصل مثل التاء في «نصحتُك»، أو منفصل مثل «أنا» و«إيّاي»)، أو مستتر لا صورة له في اللفظ، ويستتر جوازًا مع «هو» و«هي» ووجوبًا مع «أنا» و«نحن» و«أنتَ» في المضارع والأمر. واسم الإشارة معرفة تدل على معيّن حاضر أو سبق ذكره: «هذا» للمفرد المذكر، «هذه» للمفردة المؤنثة، «هذان/هذين» للمثنى المذكر، «هاتان/هاتين» للمثنى المؤنث، «هؤلاء» للجمع، و«هنا وهناك» للمكان. والاسم الموصول معرفة تدل على معيّن بواسطة جملة بعده تسمى صلة الموصول، ويجب أن تشتمل الصلة على ضمير يعود عليه يسمى العائد: «جاء الذي أكرمَكَ». وأسماء الإشارة والأسماء الموصولة مبنية إلا المثنى منها فيُعرب إعراب المثنى.",
      piege:"الخطأ الشائع هو إعراب أسماء الإشارة والموصولة بالحركات كالأسماء العادية، أو استعمال «الذي» مع المؤنث فيقال «البنت الذي نجحت»، والصواب «البنت التي نجحت» لأن الموصول يطابق ما قبله في الجنس والعدد.",
      astuce:"احفظي سلسلة المطابقة: «مفرد مذكر: هذا/الذي – مفردة مؤنثة: هذه/التي – مثنى: هذان/اللذان، هاتان/اللتان – جمع: هؤلاء/الذين، اللواتي». وردّديها في جدول صغير بألوان مختلفة للمذكر والمؤنث.",
      exercice:"أكملي بما يناسب: 1) ...... التلميذتان مجتهدتان (اسم إشارة). 2) فازت البنت ...... حفظت القصيدة (اسم موصول). 3) ...... نحبّ وطننا (ضمير منفصل). 4) في «شكرتُ أستاذي» عيّني الضمائر المتصلة وبيّني محلها الإعرابي.",
      reponse:"1) «هاتان التلميذتان مجتهدتان» (اسم إشارة للمثنى المؤنث، ويُعرب إعراب المثنى فهو مرفوع بالألف). 2) «فازت البنت التي حفظت القصيدة» (موصول للمفردة المؤنثة، والعائد ضمير مستتر جوازًا تقديره «هي»). 3) «نحن نحبّ وطننا». 4) في «شكرتُ أستاذي»: التاء ضمير متصل مبني في محل رفع فاعل، والياء ضمير متصل مبني في محل جر بالإضافة."},
    {semester:"S2",
      title:"المبتدأ والخبر",
      essentiel:"الجملة الاسمية تتكون من مبتدأ وخبر، وكلاهما مرفوع، ويطابق الخبر المبتدأ في العدد والجنس.",
      cours:"المبتدأ اسم مرفوع نبدأ به الجملة، والخبر ما نُخبر به عن المبتدأ ونتمّ به المعنى: «الليلةُ باردةٌ»، فـ«الليلةُ» مبتدأ مرفوع و«باردةٌ» خبر مرفوع. ويطابق الخبر المبتدأ في الإفراد والتثنية والجمع، وفي التذكير والتأنيث: «الطائرُ ملتمسٌ»، «القردانِ ساكنانِ»، «الغيبةُ والنميمةُ خلتانِ سيئتانِ». وإذا كان المبتدأ جمعًا للعاقل وجب الإخبار عنه بجمع مثله: «الرواةُ حكاؤونَ»، «الجداتُ عاشقاتٌ للحكي». وإذا كان المبتدأ جمعًا لغير العاقل جاز الإخبار عنه بالمفرد المؤنث أو بالجمع المؤنث: «الأخبارُ مدهشةٌ» أو «الأخبارُ مدهشاتٌ».",
      piege:"الخطأ الشائع هو نصب الخبر أو إهمال المطابقة، فيقال «التلميذاتُ مجتهدةٌ» أو «الأولادُ مجتهدًا»، والصواب «التلميذاتُ مجتهداتٌ» و«الأولادُ مجتهدونَ» لأن الجمع للعاقل يُخبر عنه بجمع مثله.",
      astuce:"قاعدة الميزان: تخيّلي المبتدأ والخبر كفّتَي ميزان لا بد أن تتساويا؛ إن كان المبتدأ مثنى مؤنثًا فالخبر مثنى مؤنث. واستثناء واحد فقط يسهل حفظه: جمع غير العاقل يجوز فيه المفرد المؤنث.",
      exercice:"أتمّي الجمل الآتية بخبر مطابق، ثم أعربي المبتدأ والخبر في الجملة الأولى: 1) الحديقتانِ ...... 2) المعلماتُ ...... 3) الكتبُ ......",
      reponse:"1) «الحديقتانِ واسعتانِ»: «الحديقتانِ» مبتدأ مرفوع وعلامة رفعه الألف لأنه مثنى، و«واسعتانِ» خبر مرفوع وعلامة رفعه الألف لأنه مثنى. 2) «المعلماتُ مجتهداتٌ» (جمع للعاقل فوجب جمع مثله). 3) «الكتبُ مفيدةٌ» أو «الكتبُ مفيداتٌ» (جمع لغير العاقل فيجوز الوجهان)."},
    {semester:"S2",
      title:"الفعل اللازم والفعل المتعدي",
      essentiel:"الفعل اللازم هو الذي يكتفي بفاعله ولا ينصب مفعولًا به، والفعل المتعدي هو الذي لا يكتفي بفاعله بل يتعدّاه إلى مفعول به واحد أو أكثر.",
      cours:"في «يتمّ اللقاءُ في الساحة» الفعل «يتمّ» لازم لأنه رفع الفاعل ولم ينصب مفعولًا. وفي «يعرض الفنانونَ أعمالَهم» الفعل «يعرض» متعدٍّ لأنه نصب المفعول به «أعمالَهم». ومن الأفعال المتعدية أفعال تنصب مفعولين أصلهما مبتدأ وخبر، وهي ثلاثة أقسام: أفعال اليقين مثل «رأى، وجد، علم، ألفى، درى» (وجدتُ القناعةَ رأسَ الغنى)، وأفعال الرجحان مثل «ظنّ، حسب، خال، زعم» (ظننتُك شجاعًا)، وأفعال التحويل مثل «صيّر، اتخذ، جعل، ردّ، ترك» (صيّرتُ الذهبَ خاتمًا).",
      piege:"الخطأ الشائع هو الحكم على الفعل بأنه متعدٍّ لمجرد وجود اسم منصوب أو شبه جملة بعده، فيُقال في «ذهبتُ صباحًا» إن «صباحًا» مفعول به، والصواب أنه ظرف زمان والفعل «ذهب» لازم.",
      astuce:"اختبار سريع: اسألي بـ«ماذا؟» بعد الفعل والفاعل. إن جاء الجواب اسمًا منصوبًا يتمّ به المعنى فالفعل متعدٍّ («أكل ماذا؟ التفاحةَ»)، وإن لم يصلح السؤال فالفعل لازم («جلس ماذا؟» لا معنى لها).",
      exercice:"بيّني نوع كل فعل (لازم أو متعدٍّ)، وحدّدي مفعوله أو مفعوليه إن وُجدا: 1) نامَ الطفلُ. 2) كتبت سلمى الدرسَ. 3) ظننتُ الجوَّ باردًا. 4) جلس الضيوفُ في القاعة.",
      reponse:"1) «نامَ» فعل لازم اكتفى بفاعله «الطفلُ». 2) «كتبت» فعل متعدٍّ لمفعول واحد هو «الدرسَ». 3) «ظننتُ» فعل متعدٍّ لمفعولين أصلهما مبتدأ وخبر، وهو من أفعال الرجحان: المفعول الأول «الجوَّ» والثاني «باردًا». 4) «جلس» فعل لازم، و«في القاعة» جار ومجرور وليس مفعولًا به."},
    {semester:"S2",
      title:"الفعل المبني للمجهول",
      essentiel:"الفعل المبني للمعلوم هو ما ذُكر فاعله، والفعل المبني للمجهول هو ما حُذف فاعله وناب عنه غيره فيسمى نائب الفاعل.",
      cours:"نقول «كَتَبَ التلميذُ الدرسَ» فهذا مبنيّ للمعلوم، فإذا حذفنا الفاعل قلنا «كُتِبَ الدرسُ»، فـ«الدرسُ» نائب فاعل مرفوع. وطريقة البناء في الماضي: يُضمّ أوله ويُكسر ما قبل آخره (فَهِمَ ← فُهِمَ). وفي المضارع: يُضمّ حرف المضارعة ويُفتح ما قبل الآخر (يَفْهَمُ ← يُفْهَمُ). وإذا كان الماضي مبدوءًا بتاء زائدة ضُمّ ثانيه مع أوله (تَعَلَّمَ ← تُعُلِّمَ)، وإذا كان مبدوءًا بهمزة وصل ضُمّ ثالثه مع أوله (اِسْتَخْرَجَ ← اُسْتُخْرِجَ)، وإذا كانت عينه ألفًا قُلبت ياءً وكُسر أوله (قَالَ ← قِيلَ، بَاعَ ← بِيعَ). وإذا كان الفعل لازمًا ناب عن الفاعل مصدرُه أو ظرفُه أو الجار والمجرور.",
      piege:"الخطأ الشائع هو إبقاء المفعول به منصوبًا بعد بناء الفعل للمجهول، فيقال «كُتِبَ الدرسَ»، والصواب «كُتِبَ الدرسُ» لأن المفعول أصبح نائب فاعل مرفوعًا.",
      astuce:"تذكّري نغمة الحركات: في الماضي «ضمّة ثم كسرة» (كُتِبَ)، وفي المضارع «ضمّة ثم فتحة» (يُكْتَبُ). ثم اسألي دائمًا: من صار مرفوعًا بعد حذف الفاعل؟",
      exercice:"ابني الأفعال الآتية للمجهول في الجمل، وحدّدي نائب الفاعل: 1) شرح المعلمُ الدرسَ. 2) يزرع الفلاحونَ القمحَ. 3) قال الناسُ الحقَّ.",
      reponse:"1) «شُرِحَ الدرسُ»: «الدرسُ» نائب فاعل مرفوع. 2) «يُزْرَعُ القمحُ»: ضُمّ حرف المضارعة وفُتح ما قبل الآخر، و«القمحُ» نائب فاعل مرفوع. 3) «قِيلَ الحقُّ»: عين الفعل ألف فقُلبت ياءً وكُسر أوله، و«الحقُّ» نائب فاعل مرفوع."},
    {semester:"S1",
      title:"فهم النص القرائي",
      essentiel:"فهم النص القرائي مهارة نتعرف بها على موضوع النص وأفكاره ومعاني كلماته وقيمه، وهو مكوّن أساسي في برنامج اللغة العربية بالسنة الأولى إعدادي.",
      cours:"تُدرس النصوص القرائية في السنة الأولى إعدادي داخل مجالات محددة: القيم الإسلامية، والقيم الوطنية والإنسانية، والمجال الحضاري في الدورة الأولى، والمجال الاجتماعي والاقتصادي، والمجال السكاني، والمجال الفني والثقافي في الدورة الثانية. ونتعامل مع النص في خطوات: أولًا الملاحظة والتوقع من العنوان والصورة وبداية النص ونهايته، ثانيًا القراءة الجيدة وشرح الكلمات الصعبة بالمرادف أو الضد أو السياق، ثالثًا الفهم بالإجابة عن أسئلة: من؟ ماذا؟ أين؟ متى؟ لماذا؟، رابعًا تحديد الفكرة العامة والأفكار الأساسية للمقاطع، وأخيرًا التركيب واستخراج القيم والدروس المستفادة.",
      piege:"الخطأ الشائع هو نسخ جمل من النص كإجابة دون فهم، أو الخلط بين الفكرة العامة (موضوع النص كله في جملة واحدة) والأفكار الأساسية (فكرة كل مقطع على حدة).",
      astuce:"استعملي طريقة «ثلاث قراءات»: قراءة أولى سريعة لمعرفة الموضوع، قراءة ثانية بالقلم لتسطير الكلمات الصعبة، قراءة ثالثة لتقسيم النص إلى مقاطع وكتابة فكرة أمام كل مقطع.",
      exercice:"اقرئي هذا النص القصير ثم أجيبي: «يستيقظ سعيد كل صباح باكرًا، يرتّب سريره، ويساعد أمه في إعداد الفطور، ثم يذهب إلى المدرسة ماشيًا. يقول: من نظّم وقته ربح يومه». أ) ما الفكرة العامة للنص؟ ب) اشرحي كلمة «يرتّب». ج) ما القيمة التي يدعو إليها النص؟",
      reponse:"أ) الفكرة العامة: حديث النص عن يوم سعيد المنظّم وعن فائدة تنظيم الوقت. ب) «يرتّب» تعني ينظّم ويجعل الأشياء في مكانها المناسب، وضدّها يُبعثر. ج) القيمة التي يدعو إليها النص هي تنظيم الوقت والنظام والمسؤولية، مع قيمة مساعدة الأهل والتعاون داخل الأسرة."},
    {semester:"S1",
      title:"بطاقة الكتاب",
      essentiel:"بطاقة الكتاب ورقة صغيرة نلخّص فيها المعلومات الأساسية عن كتاب قرأناه، وهي مهارة من مهارات التعبير والإنشاء في السنة الأولى إعدادي.",
      cours:"تتضمن بطاقة الكتاب عناصر ثابتة: عنوان الكتاب، واسم المؤلف، ونوع الكتاب (قصة، رواية، ديوان شعر، كتاب علمي)، ودار النشر ومكانها، وسنة الطبع ورقم الطبعة، وعدد الصفحات، ثم موضوع الكتاب في جملتين أو ثلاث، وأخيرًا الرأي الشخصي فيه. ونجد هذه المعلومات في الغلاف الخارجي والصفحة الأولى وصفحة الفهرس والغلاف الأخير. ومنفعة البطاقة أنها تساعدنا على تذكّر ما قرأناه وعلى تقديم الكتاب لأصدقائنا في نشاط مطالعة.",
      piege:"الخطأ الشائع هو الاكتفاء بذكر عنوان الكتاب واسم المؤلف مع إغفال باقي العناصر، أو نقل ملخص جاهز من الغلاف الأخير بدل كتابة موضوع الكتاب والرأي الشخصي بأسلوب المتعلم نفسه.",
      astuce:"احفظي ترتيب العناصر بجملة: «عنوان، مؤلف، نوع، ناشر، سنة، صفحات، موضوع، رأيي»، واكتبيها مرة واحدة في نموذج فارغ في آخر دفترك ثم املئيه لكل كتاب جديد تقرئينه.",
      exercice:"أعدّي بطاقة كتاب لقصة قرأتِها، مستعملة العناصر الثمانية المذكورة في الدرس، على ألا يتجاوز الموضوع ثلاث جمل.",
      reponse:"نموذج جواب: العنوان: «كليلة ودمنة». المؤلف: عبد الله بن المقفع. نوع الكتاب: مجموعة حكايات على ألسنة الحيوان. الناشر: دار المعارف – القاهرة. سنة الطبع: 2010، الطبعة الثانية. عدد الصفحات: 180 صفحة. الموضوع: يحكي الكتاب قصصًا يجري الحوار فيها بين الحيوانات، ويستخلص من كل قصة حكمة أو نصيحة في الصداقة والحكم والصدق. الرأي الشخصي: أعجبتني هذه القصص لأنها ممتعة وقصيرة وتعلّمني دروسًا في الحياة بأسلوب بسيط."},
    {semester:"S2",
      title:"توسيع فكرة وكتابة خبر قصير",
      essentiel:"توسيع الفكرة هو شرحها وتنميتها بالأمثلة والشواهد، وكتابة الخبر القصير (القصاصة) هي صياغة معلومة صحفية دقيقة وردت من مصدر معين في زمن محدد.",
      cours:"لتوسيع فكرة نتبع خطوات: نفهم الفكرة أولًا، ثم نشرحها بعبارتنا، ثم ندعّمها بمثال أو شاهد أو حكمة، ثم نستخلص نتيجة. مثال: فكرة «القراءة تغني العقل» تُوسّع بشرح فائدة القراءة، ثم بمثال تلميذة أصبحت أكثر تعبيرًا بفضل المطالعة، ثم بنتيجة تدعو إلى تخصيص وقت يومي للقراءة. أما الخبر القصير أو القصاصة فهو خبر أو معلومة صحفية ترد من مصدر معين وفي زمن محدد بمعطيات دقيقة، وعناصره: اسم الوكالة أو المصدر (مثل وكالة المغرب العربي للأنباء)، والعنوان الرئيسي والعنوان الفرعي، والتاريخ (اليوم والشهر والسنة)، والمكان، وملخص الخبر، وعدد الكلمات والرقم الترتيبي، واسم الصحافي.",
      piege:"الخطأ الشائع في هذا السن هو تحويل الخبر إلى قصة طويلة فيها رأي شخصي ومشاعر، أو نسيان المعطيات الأساسية: التاريخ والمكان والمصدر. والخبر الصحفي يجب أن يكون موجزًا موضوعيًّا يجيب عن الأسئلة الأساسية.",
      astuce:"لكتابة الخبر استعملي أسئلة الخمسة: مَن؟ ماذا؟ أين؟ متى؟ لماذا؟ وأجيبي عنها في جملتين أو ثلاث. ولتوسيع الفكرة تذكّري السلسلة: «أشرح – أمثّل – أستنتج».",
      exercice:"أ) وسّعي الفكرة الآتية في أربع جمل: «النظافة سلوك حضاري». ب) اكتبي خبرًا قصيرًا (قصاصة) في ثلاث جمل عن حملة نظافة نظّمها تلاميذ إعدادية بمدينتك، مع ذكر عناصر القصاصة.",
      reponse:"أ) النظافة سلوك حضاري لأنها تدل على احترام الإنسان لنفسه ولمحيطه. فالمدرسة النظيفة تجعل التلميذ يقبل على الدرس بنفس مرتاحة، والشارع النظيف يحمي صحة الناس من الأمراض. وقد جاء في الحديث الشريف الحثّ على الطهارة والنظافة. ولهذا يجب أن نجعل النظافة سلوكًا يوميًّا في البيت والمدرسة والحيّ. ب) نموذج قصاصة: «المغرب – تربية – بيئة / حملة نظافة بإعدادية النهضة / الرباط، 12 مارس 2026 (وكالة المغرب العربي للأنباء): نظّم تلاميذ إعدادية النهضة بالرباط، صباح اليوم الخميس، حملة لتنظيف محيط المؤسسة بمشاركة أكثر من مائة تلميذ وتلميذة. وأشرف على الحملة أساتذة نادي البيئة، وتم خلالها جمع النفايات وغرس عشر شجرات في ساحة المدرسة. وأكد المشاركون أن الحملة ستتكرر كل شهر. – أعدّته: سلمى العلوي»."}
