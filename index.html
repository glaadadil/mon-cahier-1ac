/* ---------- PARENT : Toutes les tâches ---------- */
function viewAllTasks(){
  const filtered = state.subjectFilter==='all' ? state.tasks : state.tasks.filter(t=>t.subject===state.subjectFilter);
  const sorted = [...filtered].sort((a,b)=> a.date<b.date?1:-1);
  const doneCount = state.tasks.filter(t=>t.done).length;
  let html = `<h2 class="section-title">Toutes les tâches</h2>
  <p class="muted">${state.tasks.length} tâche(s) au total · ${doneCount} terminée(s)</p>
  <div class="filters"><select class="filter-select" id="subject-filter">
    <option value="all">Toutes les matières</option>
    ${SUBJECTS.map(s=>`<option value="${s.key}" ${state.subjectFilter===s.key?'selected':''}>${esc(s.label)}</option>`).join('')}
  </select></div>`;
  if(sorted.length===0){
    const emptyLabel = state.subjectFilter==='all' ? "Aucune tâche pour l'instant" : `Aucune tâche en ${esc(subj(state.subjectFilter).label)} pour l'instant`;
    html += `<div class="empty"><span class="hand">${emptyLabel}</span>Utilise l'onglet « Ajouter » pour en créer une.</div>`;
  } else {
    html += sorted.map(t=>{
      const s = subj(t.subject);
      return `<div class="task-row ${t.done?'done':''}"><span class="dot" style="background:${s.color}"></span>
        <div class="task-main"><div class="task-title">${esc(t.title)}</div>
        <div class="task-sub">${esc(s.label)} · ${fmtDayShort(t.date)}${t.desc? ' · '+esc(t.desc): ''}</div></div>
        <span class="chip">${typeLabel(t.type)}</span>
        <button class="btn-danger" data-action="delete" data-id="${t.id}">Supprimer</button></div>`;
    }).join('');
  }
  return html;
}

/* ---------- PARENT : Ressources (fiches par matière) ---------- */
function viewResourcesParent(){
  const activeKey = state.parentResourceSubject;
  const activeSubj = subj(activeKey);
  const chapters = chaptersFor(activeKey);
  const hasSeed = !!SEED[activeKey];

  let html = `<h2 class="section-title">Ressources — fiches de cours</h2>
  <p class="muted">Choisis une matière, ajoute des fiches (une par chapitre). Elles s'affichent en cartes mises en forme côté Élève.</p>
  <div class="filters">
    <select class="filter-select" id="parent-subject-select">
      ${SUBJECTS.map(s=>`<option value="${s.key}" ${activeKey===s.key?'selected':''}>${esc(s.label)} (${chaptersFor(s.key).length})</option>`).join('')}
    </select>
  </div>`;

  if(hasSeed){
    html += `<div class="seed-banner">
      <p><strong>${SEED[activeKey].length} fiches prêtes à l'emploi</strong> existent déjà pour ${esc(activeSubj.label)} (programme officiel 1AC).</p>
      <button class="btn btn-secondary" id="load-seed" data-subject="${activeKey}">Charger ces fiches</button>
    </div>`;
  }

  html += `<div class="chapter-editor">
    <h2 class="section-title" style="font-size:22px;">${state.editingChapterId? 'Modifier la fiche' : 'Ajouter une fiche'}</h2>
    <form id="chapter-form">
      <input type="hidden" name="id" value="${state.editingChapterId||''}">
      <div class="form-grid">
        <div><label>Titre du chapitre</label><input name="title" required placeholder="Ex. Les fractions"></div>
        <div><label>Semestre</label><select name="semester"><option value="S1">Semestre 1</option><option value="S2">Semestre 2</option></select></div>
      </div>
      <label>L'essentiel (1-2 phrases)</label><textarea name="essentiel" style="min-height:50px;" placeholder="L'idée clé à retenir en une phrase"></textarea>
      <label>Le cours</label><textarea name="cours" placeholder="Explication claire + exemple résolu"></textarea>
      <label>Piège fréquent</label><textarea name="piege" style="min-height:50px;" placeholder="L'erreur typique à cet âge"></textarea>
      <label>Astuce</label><textarea name="astuce" style="min-height:50px;" placeholder="Moyen mnémotechnique"></textarea>
      <label>Exercice</label><textarea name="exercice" style="min-height:50px;" placeholder="Un petit exercice"></textarea>
      <label>Réponse</label><textarea name="reponse" style="min-height:40px;" placeholder="La réponse, pour qu'elle se corrige seule"></textarea>
      <button type="submit" class="btn btn-primary">${state.editingChapterId? 'Enregistrer les modifications' : 'Ajouter la fiche'}</button>
      ${state.editingChapterId? `<button type="button" class="btn-ghost" id="cancel-edit">Annuler la modification</button>` : ''}
    </form>
  </div>`;

  if(chapters.length===0){
    html += `<div class="empty"><span class="hand">Aucune fiche pour ${esc(activeSubj.label)}</span>Ajoute-en une ci-dessus, ou charge les fiches prêtes à l'emploi si disponibles.</div>`;
  } else {
    html += chapters.map(c=>`<div class="chapter-mini-row">
      <span class="chapter-mini-title"><span class="subj-tag" style="background:${activeSubj.color}">S${c.semester==='S2'?'2':'1'}</span>${esc(c.title)}</span>
      <span class="chapter-mini-actions">
        <button class="btn-small" data-action="edit-chapter" data-id="${c.id}">Modifier</button>
        <button class="btn-danger" data-action="delete-chapter" data-id="${c.id}">Supprimer</button>
      </span></div>`).join('');
  }

  html += `<div class="card" style="margin-top:22px;">
    <h2 class="section-title" style="font-size:22px;">Sécurité</h2>
    <p class="muted">Change les mots de passe des espaces Élève et Parent.</p>
    <form id="password-form">
      <div class="form-grid">
        <div><label>Nouveau mot de passe Élève</label><input type="password" id="pw-eleve" placeholder="${state.passwords? '••••' : ''}"></div>
        <div><label>Nouveau mot de passe Parent</label><input type="password" id="pw-parent" placeholder="${state.passwords? '••••' : ''}"></div>
      </div>
      <p class="muted" style="font-size:12px; margin:6px 0 0;">Laisse un champ vide pour ne pas changer ce mot de passe.</p>
      ${state.pwSaveMsg? `<p style="color:#2F6E8C; font-weight:700; font-size:13px; margin-top:8px;">${esc(state.pwSaveMsg)}</p>` : ''}
      <button type="submit" class="btn btn-secondary">Enregistrer les mots de passe</button>
    </form>
  </div>`;

  html += `<div style="margin-top:14px;"><button class="btn-ghost" id="reset-data">Réinitialiser toutes les données</button></div>`;
  return html;
}

/* ---------- PARENT : Générer un exercice avec l'IA ---------- */
function genLangFor(key){
  if(key==='arabe' || key==='islamique' || key==='social') return 'arabe';
  if(key==='anglais') return 'anglais';
  return 'français';
}

  const genChapters = chaptersFor(state.genSubject);
  if(state.genChapterId && !genChapters.find(c=>c.id===state.genChapterId)) state.genChapterId = null;
  if(!state.genChapterId && genChapters.length>0) state.genChapterId = genChapters[0].id;
  const activeSubj = subj(state.genSubject);
  const hasKey = !!state.apiKey;

  let html = `<h2 class="section-title">Générer un exercice avec l'IA</h2>
  <p class="muted">Crée un nouvel exercice sur mesure (avec sa correction) pour une leçon précise, grâce à une intelligence artificielle gratuite (Google Gemini).</p>

  <div class="card" id="api-key-card">
    <label>Clé API Gemini (gratuite)</label>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">

      ${hasKey? `<button class="btn-ghost" id="clear-api-key">Supprimer la clé</button>` : ''}

    <p class="muted" style="font-size:12px; margin-top:8px;">
      ${hasKey? '✅ Clé enregistrée sur cet appareil.' : '⚠️ Aucune clé enregistrée pour l\'instant.'}
      Obtiens une clé gratuite en 2 minutes sur <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> (compte Google, sans carte bancaire), puis colle-la ici. Elle reste uniquement sur cet appareil, dans ce navigateur.

      <option value="difficile" ${state.genDifficulty==='difficile'?'selected':''}>Difficile</option>
    </select>
    ${genChapters.length===0? `<p class="muted" style="margin-top:10px;">Charge d'abord des fiches pour ${esc(activeSubj.label)} dans l'onglet « Ressources ».</p>` : ''}
    <button class="btn btn-primary" id="gen-btn" style="margin-top:14px;" ${(!hasKey || genChapters.length===0 || state.genLoading)?'disabled':''}>${state.genLoading? '✨ Génération en cours…' : '✨ Générer un exercice'}</button>
    ${!hasKey? `<p class="muted" style="margin-top:8px;">Ajoute une clé API ci-dessus pour activer la génération.</p>` : ''}

      <div class="chapter-head" style="background:${activeSubj.color}">

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function bindPageEvents(){
  const page = document.getElementById('page');
  if(!page) return;

  page.querySelectorAll('[data-action="toggle"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const t = state.tasks.find(x=>x.id===btn.dataset.id);
      if(t){ t.done = !t.done; await saveTasks(); renderPage(); }
    });
  });
  page.querySelectorAll('[data-action="delete"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      state.tasks = state.tasks.filter(x=>x.id!==btn.dataset.id);
      await saveTasks(); renderPage();
    });
  });
  page.querySelectorAll('.mood-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{ state.moods[todayISO()] = btn.dataset.mood; await saveMoods(); renderPage(); });
  });
  page.querySelectorAll('.subject-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      state.openSubjectEleve = state.openSubjectEleve===card.dataset.subject ? null : card.dataset.subject;
      state.openChapterId = null;
      renderPage();
    });
  });
  page.querySelectorAll('[data-chapter-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.chapterToggle;
      state.openChapterId = state.openChapterId===id ? null : id;
      renderPage();
      const el = document.querySelector(`[data-chapter-toggle="${id}"]`);
      if(el && state.openChapterId===id) el.scrollIntoView({behavior:'smooth', block:'nearest'});
    });
  });
  page.querySelectorAll('[data-reveal]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const el = document.getElementById('answer-'+btn.dataset.reveal);
      if(el){ el.classList.toggle('shown'); btn.textContent = el.classList.contains('shown') ? 'Cacher la réponse' : 'Voir la réponse'; }
    });
  });

  const form = document.getElementById('add-form');
  if(form){
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(form);
      const task = {
        id: uid(), subject: fd.get('subject'), type: fd.get('type'),
        title: fd.get('title').trim(), desc: (fd.get('desc')||'').trim(),
        date: fd.get('date') || todayISO(),
        minutes: fd.get('minutes') ? parseInt(fd.get('minutes')) : null, done: false,
      };
      if(!task.title) return;
      state.tasks.push(task); await saveTasks();
      form.reset(); form.querySelector('[name="date"]').value = todayISO();
      alertBanner('Tâche ajoutée ✓');
    });
  }

  const filter = document.getElementById('subject-filter');
  if(filter){ filter.addEventListener('change', ()=>{ state.subjectFilter = filter.value; renderPage(); }); }

  const parentSubjSelect = document.getElementById('parent-subject-select');
  if(parentSubjSelect){
    parentSubjSelect.addEventListener('change', ()=>{
      state.parentResourceSubject = parentSubjSelect.value; state.editingChapterId = null; renderPage();
    });
  }

  const loadSeedBtn = document.getElementById('load-seed');
  if(loadSeedBtn){
    loadSeedBtn.addEventListener('click', async ()=>{
      const key = loadSeedBtn.dataset.subject;
      const existing = chaptersFor(key);
      if(existing.length>0 && !confirm('Des fiches existent déjà pour cette matière. Les remplacer par les fiches prédéfinies ?')) return;
      state.resources[key] = SEED[key].map(c=>({...c, id: uid()}));
      await saveResources(); renderPage(); alertBanner('Fiches chargées ✓');
    });
  }

  const chapterForm = document.getElementById('chapter-form');
  if(chapterForm){
    chapterForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(chapterForm);
      const key = state.parentResourceSubject;
      if(!Array.isArray(state.resources[key])) state.resources[key] = [];
      const data = {
        title: (fd.get('title')||'').trim(), semester: fd.get('semester'),
        essentiel:(fd.get('essentiel')||'').trim(), cours:(fd.get('cours')||'').trim(),
        piege:(fd.get('piege')||'').trim(), astuce:(fd.get('astuce')||'').trim(),
        exercice:(fd.get('exercice')||'').trim(), reponse:(fd.get('reponse')||'').trim(),
      };
      if(!data.title) return;
      const editId = fd.get('id');
      if(editId){
        const idx = state.resources[key].findIndex(c=>c.id===editId);
        if(idx>=0) state.resources[key][idx] = {...state.resources[key][idx], ...data};
      } else {
        state.resources[key].push({id: uid(), ...data});
      }
      state.editingChapterId = null;
      await saveResources(); renderPage(); alertBanner('Fiche enregistrée ✓');
    });
  }
  const cancelEdit = document.getElementById('cancel-edit');
  if(cancelEdit){ cancelEdit.addEventListener('click', ()=>{ state.editingChapterId = null; renderPage(); }); }

  page.querySelectorAll('[data-action="edit-chapter"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.editingChapterId = btn.dataset.id; renderPage();
      setTimeout(()=>{
        const key = state.parentResourceSubject;
        const c = chaptersFor(key).find(x=>x.id===btn.dataset.id);
        const f = document.getElementById('chapter-form');
        if(c && f){
          f.title.value=c.title||''; f.semester.value=c.semester||'S1'; f.essentiel.value=c.essentiel||'';
          f.cours.value=c.cours||''; f.piege.value=c.piege||''; f.astuce.value=c.astuce||'';
          f.exercice.value=c.exercice||''; f.reponse.value=c.reponse||'';
          f.scrollIntoView({behavior:'smooth', block:'start'});
        }
      },0);
    });
  });
  page.querySelectorAll('[data-action="delete-chapter"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = state.parentResourceSubject;
      state.resources[key] = chaptersFor(key).filter(c=>c.id!==btn.dataset.id);
      await saveResources(); renderPage();
    });
  });

  const pwForm = document.getElementById('password-form');
  if(pwForm){
    pwForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const eleveVal = document.getElementById('pw-eleve').value.trim();
      const parentVal = document.getElementById('pw-parent').value.trim();
      if(!eleveVal && !parentVal){ state.pwSaveMsg = 'Rien à changer.'; renderPage(); return; }
      if(eleveVal) state.passwords.eleve = eleveVal;
      if(parentVal) state.passwords.parent = parentVal;
      await savePasswords();
      state.pwSaveMsg = 'Mots de passe mis à jour ✓';
      renderPage(); alertBanner('Mots de passe mis à jour ✓');
    });
  }

  const resetBtn = document.getElementById('reset-data');
  if(resetBtn){
    resetBtn.addEventListener('click', async ()=>{
      if(confirm('Supprimer toutes les tâches, ressources et humeurs enregistrées ? Cette action est irréversible.')){
        state.tasks = []; state.resources = {}; state.moods = {};
        await saveTasks(); await saveResources(); await saveMoods();
        renderPage();
      }
    });
  }

  const saveKeyBtn = document.getElementById('save-api-key');
  if(saveKeyBtn){
    saveKeyBtn.addEventListener('click', async ()=>{
      const input = document.getElementById('api-key-input');
      const val = (input.value||'').trim();
      if(!val){ alertBanner('Colle une clé avant d\'enregistrer'); return; }
      state.apiKey = val;
      try{ await storageSet('apiKey', val); }catch(e){ console.error(e); }
      state.genError = null;
      renderPage(); alertBanner('Clé enregistrée ✓');
    });
  }
  const clearKeyBtn = document.getElementById('clear-api-key');
  if(clearKeyBtn){
    clearKeyBtn.addEventListener('click', async ()=>{
      if(!confirm('Supprimer la clé API enregistrée sur cet appareil ?')) return;
      state.apiKey = null;
      try{ await storageSet('apiKey', ''); }catch(e){ console.error(e); }
      renderPage();
    });
  }

  const genSubjectSelect = document.getElementById('gen-subject');
  if(genSubjectSelect){
    genSubjectSelect.addEventListener('change', ()=>{
      state.genSubject = genSubjectSelect.value; state.genChapterId = null;
      state.genResult = null; state.genError = null;
      renderPage();
    });
  }
  const genChapterSelect = document.getElementById('gen-chapter');
  if(genChapterSelect){
    genChapterSelect.addEventListener('change', ()=>{
      state.genChapterId = genChapterSelect.value;
      renderPage();
    });
  }
  const genDifficultySelect = document.getElementById('gen-difficulty');
  if(genDifficultySelect){
    genDifficultySelect.addEventListener('change', ()=>{
      state.genDifficulty = genDifficultySelect.value;
    });
  }
  const genBtn = document.getElementById('gen-btn');
  if(genBtn){ genBtn.addEventListener('click', ()=> generateExercise()); }
  const genAgainBtn = document.getElementById('gen-again');
  if(genAgainBtn){ genAgainBtn.addEventListener('click', ()=> generateExercise()); }
  const genAddTaskBtn = document.getElementById('gen-add-task');
  if(genAddTaskBtn){
    genAddTaskBtn.addEventListener('click', async ()=>{
      if(!state.genResult) return;
      const task = {
        id: uid(), subject: state.genSubject, type: 'exercice',
        title: `Exercice généré : ${state.genResult.chapterTitle||''}`.trim(),
        desc: `Énoncé :\n${state.genResult.enonce}\n\nCorrection :\n${state.genResult.reponse}`,
        date: todayISO(), minutes: null, done: false,
      };
      state.tasks.push(task); await saveTasks();
      alertBanner('Ajouté aux tâches ✓');
    });
  }
}

async function callGemini(promptText, apiKey){
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
    body: JSON.stringify({
      contents: [{ parts: [{ text: promptText }] }],
      generationConfig: {
        responseMimeType: 'application/json',
        responseSchema: {
          type: 'OBJECT',
          properties: { enonce: { type: 'STRING' }, reponse: { type: 'STRING' } },
          required: ['enonce', 'reponse']
        },
        temperature: 0.9,
      }
    })
  });
  if(!resp.ok){
    if(resp.status===400 || resp.status===401 || resp.status===403) throw new Error("Clé API invalide ou refusée. Vérifie qu'elle est bien copiée depuis aistudio.google.com/apikey.");
    if(resp.status===429) throw new Error("Trop de demandes pour l'instant (quota gratuit atteint). Réessaie dans quelques minutes.");
    throw new Error(`Erreur du service IA (code ${resp.status}). Réessaie plus tard.`);
  }
  const data = await resp.json();
  const text = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
  if(!text) throw new Error("Réponse vide de l'IA, réessaie.");
  let parsed;
  try{ parsed = JSON.parse(text); }catch(e){ throw new Error("Réponse de l'IA illisible, réessaie."); }
  if(!parsed.enonce || !parsed.reponse) throw new Error("Réponse de l'IA incomplète, réessaie.");
  return parsed;
}

async function generateExercise(){
  if(!state.apiKey) return;
  const chapter = chaptersFor(state.genSubject).find(c=>c.id===state.genChapterId);
  if(!chapter) return;
  const s = subj(state.genSubject);
  const langue = genLangFor(state.genSubject);
  const diffLabel = {facile:'facile', moyen:'moyen', difficile:'difficile'}[state.genDifficulty] || 'moyen';

  const promptText = `Tu es un professeur bienveillant pour un·e élève marocain·e de 11 ans en 1ère année collège (6ème).
Matière : ${s.label}
Leçon : ${chapter.title}
Rappel du cours (à utiliser comme contexte, ne pas recopier) : ${chapter.essentiel||''} ${chapter.cours||''}
Niveau de difficulté souhaité : ${diffLabel}

Génère UN NOUVEL exercice original (différent de l'exemple du cours) adapté à cette leçon et à ce niveau de difficulté, avec sa correction complète, claire et exacte.
Rédige l'énoncé et la correction entièrement en ${langue}, dans un style simple et adapté à un enfant de 11 ans.
Réponds uniquement avec un objet JSON valide contenant exactement deux clés : "enonce" et "reponse". Aucun texte en dehors du JSON.`;

  state.genLoading = true; state.genError = null; renderPage();
  try{
    const result = await callGemini(promptText, state.apiKey);
    state.genResult = { enonce: result.enonce, reponse: result.reponse, chapterTitle: chapter.title };
  }catch(err){
    state.genError = err && err.message ? err.message : "Une erreur est survenue, réessaie.";
    state.genResult = null;
  }finally{
    state.genLoading = false; renderPage();
  }
}

function alertBanner(msg){
  const b = document.createElement('div'); b.textContent = msg;
  b.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2F5233;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.2);z-index:99;';
  document.body.appendChild(b); setTimeout(()=>b.remove(), 1800);
}

function bindShellEvents(){
  document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.dataset.mode;
      if(target === state.mode) return;
      state.authenticated = false; state.authTarget = target; state.authError = null; render();
    });
  });
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.view = btn.dataset.view; render(); });
  });
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn){
    logoutBtn.addEventListener('click', ()=>{
      state.authenticated = false; state.authTarget = null; state.authError = null; render();
    });
  }
}

function viewSetupPasswords(){
  return `<div class="auth-wrap"><div class="auth-card">
    <div class="title">Bienvenue !</div>
    <p class="muted">Avant de commencer, crée un mot de passe pour l'espace Élève et un autre pour l'espace Parent. C'est simple, juste pour éviter les erreurs de manipulation (ce n'est pas une protection très sécurisée).</p>
    <form id="setup-form" style="text-align:left;">
      <label>Mot de passe Élève</label><input type="password" id="setup-eleve" required placeholder="Ex. 1234">
      <label>Mot de passe Parent</label><input type="password" id="setup-parent" required placeholder="Ex. maman2026">
      ${state.authError? `<p class="auth-error">${esc(state.authError)}</p>` : ''}
      <button type="submit" class="btn btn-primary" style="width:100%;">Créer les mots de passe</button>
    </form>
  </div></div>`;
}

function viewLogin(){
  if(!state.authTarget){
    return `<div class="auth-wrap"><div class="auth-card">
      <div class="title">Qui utilise le cahier ?</div>
      <p class="muted">Choisis ton espace pour continuer.</p>
      <div class="role-grid">
        <button class="role-btn" data-role="eleve"><span class="role-emoji">👧</span><span class="role-label">Élève</span></button>
        <button class="role-btn" data-role="parent"><span class="role-emoji">👨‍👩‍👧</span><span class="role-label">Parent</span></button>
      </div>
    </div></div>`;
  }
  const roleLabel = state.authTarget==='eleve' ? 'Élève' : 'Parent';
  return `<div class="auth-wrap"><div class="auth-card">
    <div class="title">Espace ${roleLabel}</div>
    <p class="muted">Entre le mot de passe pour continuer.</p>
    <form id="login-form" style="text-align:left;">
      <label>Mot de passe</label><input type="password" id="login-password" autofocus>
      ${state.authError? `<p class="auth-error">${esc(state.authError)}</p>` : ''}
      <button type="submit" class="btn btn-primary" style="width:100%;">Valider</button>
    </form>
    <div class="auth-back"><button class="btn-ghost" id="auth-back-btn">← Changer d'espace</button></div>
  </div></div>`;
}

function bindAuthEvents(){
  const setupForm = document.getElementById('setup-form');
  if(setupForm){
    setupForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const eleve = document.getElementById('setup-eleve').value.trim();
      const parent = document.getElementById('setup-parent').value.trim();
      if(!eleve || !parent){ state.authError = 'Merci de remplir les deux mots de passe.'; render(); return; }
      state.passwords = { eleve, parent };
      await savePasswords();
      state.authError = null; state.authenticated = true; state.mode = 'parent'; state.view = 'add';
      render();
    });
  }
  document.querySelectorAll('.role-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.authTarget = btn.dataset.role; state.authError = null; render(); });
  });
  const authBackBtn = document.getElementById('auth-back-btn');
  if(authBackBtn){ authBackBtn.addEventListener('click', ()=>{ state.authTarget = null; state.authError = null; render(); }); }
  const loginForm = document.getElementById('login-form');
  if(loginForm){
    loginForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const val = document.getElementById('login-password').value;
      if(val === state.passwords[state.authTarget]){
        state.authenticated = true; state.mode = state.authTarget; state.view = state.mode==='eleve' ? 'today' : 'add';
        state.authTarget = null; state.authError = null; render();
      } else {
        state.authError = 'Mot de passe incorrect.'; render();
      }
    });
  }
}

function render(){
  const app = document.getElementById('app');
  if(!state.passwords){
    app.innerHTML = viewSetupPasswords();
    bindAuthEvents();
    return;
  }
  if(!state.authenticated){
    app.innerHTML = viewLogin();
    bindAuthEvents();
    return;
  }
  app.innerHTML = shell();
  bindShellEvents(); renderPage();
}

(async function init(){ await loadState(); render(); })();
</script>
</body>
</html>
