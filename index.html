<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Cahier — 1AC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EC;
    --ink:#26313C;
    --ink-soft:#5A6672;
    --marge:#C0392B;
    --seyes:#A9C6E8;
    --chalkboard:#2F5233;
    --chalkboard-dark:#22402A;
    --chalk-white:#F4F1E8;
    --gold:#D4A72C;
    --line:#E3DFD1;
    --card:#FFFFFF;
    --radius:14px;
    --shadow: 0 2px 10px rgba(38,49,60,0.08);
    --essentiel:#2F6E8C;
    --essentiel-bg:#EAF4F8;
    --piege:#B5482B;
    --piege-bg:#FDEEE8;
    --astuce:#9C7A17;
    --astuce-bg:#FBF4DE;
    --exercice:#3F4A56;
    --exercice-bg:#F1F3F0;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Nunito', sans-serif; color:var(--ink); background:var(--paper); min-height:100vh; }
  .hand{ font-family:'Caveat', cursive; }

  .topbar{
    background: linear-gradient(180deg, var(--chalkboard), var(--chalkboard-dark));
    color: var(--chalk-white); padding: 16px 20px; display:flex; align-items:center;
    justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .title{ font-family:'Caveat', cursive; font-size:32px; font-weight:700; }
  .brand .subtitle{ font-size:13px; opacity:0.75; letter-spacing:1px; text-transform:uppercase; }
  .mode-switch{ display:flex; background:rgba(255,255,255,0.12); border-radius:999px; padding:4px; gap:2px; }
  .mode-btn{
    border:none; background:transparent; color:var(--chalk-white); opacity:0.75; padding:8px 16px;
    border-radius:999px; font-family:'Nunito'; font-weight:700; font-size:14px; cursor:pointer; transition:.15s;
  }
  .mode-btn.active{ background:var(--chalk-white); color:var(--chalkboard-dark); opacity:1; }
  .mode-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .tabs{ display:flex; gap:6px; padding:14px 20px 0; flex-wrap:wrap; }
  .tab{
    border:1px solid var(--line); border-bottom:none; background:var(--card); color:var(--ink-soft);
    font-family:'Nunito'; font-weight:700; padding:10px 18px; border-radius:12px 12px 0 0; cursor:pointer; font-size:14px;
  }
  .tab.active{ color:var(--chalkboard); background:var(--paper); position:relative; top:1px; }
  .tab:focus-visible{ outline:2px solid var(--chalkboard); outline-offset:2px; }

  .page{
    background: repeating-linear-gradient(var(--paper) 0 27px, var(--seyes) 27px 28px), var(--paper);
    background-position: 0 4px; border-top:1px solid var(--line); min-height: 70vh; padding: 28px 28px 60px 64px; position:relative;
  }
  .page::before{ content:""; position:absolute; top:0; bottom:0; left:44px; width:2px; background:var(--marge); opacity:0.55; }
  @media (max-width:640px){ .page{ padding:22px 16px 50px 40px; } .page::before{ left:26px; } }

  h2.section-title{ font-family:'Caveat', cursive; font-size:30px; margin:0 0 4px; color:var(--chalkboard-dark); font-weight:700; }
  .muted{ color:var(--ink-soft); font-size:14px; margin:0 0 18px; }

  .card{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:12px; }
  .next-card{ border:2px dashed var(--gold); background:#FFFCF2; }
  .next-card .eyebrow{ font-weight:800; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); margin-bottom:4px;}

  .task-row{
    display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--card);
    border-radius:12px; box-shadow:var(--shadow); margin-bottom:8px;
  }
  .task-row.done{ opacity:0.55; }
  .task-row.done .task-title{ text-decoration: line-through; }
  .dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .task-main{ flex:1; min-width:0; }
  .task-title{ font-weight:700; font-size:15px; }
  .task-sub{ font-size:12.5px; color:var(--ink-soft); }
  .chip{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--paper); color:var(--ink-soft); white-space:nowrap; }
  .checkbox{
    width:26px; height:26px; border-radius:8px; border:2px solid var(--line); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; background:#fff;
  }
  .checkbox.checked{ background:var(--chalkboard); border-color:var(--chalkboard); color:#fff; font-weight:900; }

  .subject-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; }
  .subject-card{ border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; cursor:pointer; color:#fff; border:none; text-align:left; font-family:'Nunito'; }
  .subject-card .subject-name{ font-weight:800; font-size:16px; }
  .subject-card .subject-hint{ font-size:12px; opacity:0.9; margin-top:4px; }
  .subject-card.active-subject{ outline:3px solid var(--chalkboard-dark); outline-offset:2px; }

  .empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); }
  .empty .hand{ font-size:26px; display:block; margin-bottom:6px; color:var(--chalkboard-dark); }

  .mood-row{ display:flex; gap:10px; margin-top:22px; align-items:center; }
  .mood-btn{ font-size:26px; background:#fff; border:2px solid var(--line); border-radius:50%; width:52px; height:52px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .mood-btn.selected{ border-color:var(--marge); box-shadow:0 0 0 3px rgba(192,57,43,0.15); }

  .week-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  @media (max-width:900px){ .week-grid{ grid-template-columns:repeat(2,1fr);} }
  .day-col{ background:var(--card); border-radius:12px; box-shadow:var(--shadow); padding:10px; min-height:110px; }
  .day-head{ font-weight:800; font-size:13px; margin-bottom:6px; color:var(--chalkboard-dark); text-transform:capitalize;}
  .day-head.today{ color:var(--marge); }
  .mini-task{ font-size:12px; padding:4px 6px; border-radius:7px; margin-bottom:4px; background:var(--paper); }
  .mini-task.done{ opacity:.5; text-decoration:line-through; }

  label{ display:block; font-weight:700; font-size:13px; margin:14px 0 6px; }
  input, select, textarea{ width:100%; font-family:'Nunito'; font-size:14px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:#fff; color:var(--ink); }
  textarea{ min-height:80px; resize:vertical; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  @media (max-width:640px){ .form-grid{ grid-template-columns:1fr; } }
  .btn{ font-family:'Nunito'; font-weight:800; font-size:14px; padding:11px 20px; border-radius:10px; border:none; cursor:pointer; }
  .btn-primary{ background:var(--chalkboard); color:#fff; margin-top:18px; }
  .btn-primary:hover{ background:var(--chalkboard-dark); }
  .btn-secondary{ background:var(--gold); color:#3a2c05; margin-top:10px; }
  .btn-ghost{ background:transparent; color:var(--marge); text-decoration:underline; font-weight:700; padding:6px; }
  .btn-small{ background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:6px 12px; font-weight:700; font-size:12.5px; cursor:pointer; }
  .btn-danger{ background:#fff; color:var(--marge); border:1.5px solid var(--marge); padding:6px 12px; border-radius:8px; font-weight:700; font-size:12.5px; cursor:pointer; }

  .filters{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  select.filter-select{ width:auto; }

  .loading{ padding:60px 20px; text-align:center; color:var(--ink-soft); font-family:'Caveat'; font-size:22px; }
  footer.foot{ text-align:center; padding:18px; font-size:12px; color:var(--ink-soft); }

  /* ---- Chapter cards (subject resources) ---- */
  .chapter-list{ display:flex; flex-direction:column; gap:16px; margin-top:16px; }
  .chapter-card{ background:var(--card); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
  .chapter-card.compact{ box-shadow:none; border-radius:0; }

  /* ---- Sommaire (index cliquable des chapitres) ---- */
  .sommaire-group-label{ font-family:'Caveat', cursive; font-size:19px; font-weight:700; color:var(--ink-soft); margin:14px 0 6px; }
  .sommaire-group-label:first-child{ margin-top:0; }
  .sommaire-list{ display:flex; flex-direction:column; gap:8px; }
  .sommaire-item{ background:var(--card); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
  .sommaire-row{
    width:100%; display:flex; align-items:center; gap:10px; padding:12px 14px; border:none; background:transparent;
    cursor:pointer; font-family:'Nunito'; text-align:left;
  }
  .sommaire-item.open .sommaire-row{ background:var(--paper); }
  .sommaire-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .sommaire-title{ flex:1; font-weight:700; font-size:14.5px; color:var(--ink); }
  .sommaire-chevron{ color:var(--ink-soft); font-size:12px; flex-shrink:0; }
  .sommaire-content{ border-top:1px solid var(--line); }
  .chapter-head{ padding:14px 18px; color:#fff; }
  .chapter-eyebrow{ font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; opacity:0.85; }
  .chapter-title{ font-family:'Caveat', cursive; font-size:26px; font-weight:700; line-height:1.1; }
  .chapter-body{ padding:16px 18px 18px; }
  .chapter-essentiel{ background:var(--essentiel-bg); color:var(--essentiel); border-left:4px solid var(--essentiel); border-radius:8px; padding:10px 12px; font-weight:700; font-size:14px; margin-bottom:14px; }
  .chapter-section{ margin-bottom:14px; }
  .chapter-section-label{ font-weight:800; font-size:12.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); margin-bottom:5px; }
  .chapter-text{ font-size:14.5px; line-height:1.65; white-space:pre-wrap; }
  .box-piege{ background:var(--piege-bg); border-left:4px solid var(--piege); border-radius:8px; padding:10px 12px; }
  .box-piege .chapter-section-label{ color:var(--piege); }
  .box-astuce{ background:var(--astuce-bg); border-left:4px solid var(--astuce); border-radius:8px; padding:10px 12px; }
  .box-astuce .chapter-section-label{ color:var(--astuce); }
  .box-exercice{ background:var(--exercice-bg); border-radius:8px; padding:12px; }
  .box-exercice .chapter-section-label{ color:var(--exercice); }
  .reveal-btn{ margin-top:8px; }
  .reveal-answer{ display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-weight:700; color:var(--chalkboard-dark); }
  .reveal-answer.shown{ display:block; }

  .subj-tag{ display:inline-block; font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; color:#fff; margin-right:6px;}
  .chapter-editor{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px; margin-bottom:18px; }
  .chapter-mini-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; }
  .chapter-mini-title{ font-weight:700; font-size:14px; }
  .chapter-mini-actions{ display:flex; gap:6px; }
  .seed-banner{ background:#EAF4F8; border:1.5px dashed var(--essentiel); border-radius:12px; padding:14px 16px; margin-bottom:16px; }
  .seed-banner p{ margin:0 0 10px; font-size:13.5px; color:var(--ink); }

  /* ---- Écran de connexion / mots de passe ---- */
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background: linear-gradient(180deg, var(--chalkboard), var(--chalkboard-dark)); }
  .auth-card{ background:var(--card); border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.25); padding:32px 28px; max-width:380px; width:100%; text-align:center; }
  .auth-card .title{ font-family:'Caveat', cursive; font-size:34px; color:var(--chalkboard-dark); margin:0 0 4px; }
  .auth-card .muted{ margin-bottom:22px; }
  .role-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px; }
  .role-btn{ border:2px solid var(--line); background:#fff; border-radius:14px; padding:20px 10px; cursor:pointer; font-family:'Nunito'; }
  .role-btn:hover{ border-color:var(--gold); }
  .role-emoji{ font-size:32px; display:block; margin-bottom:8px; }
  .role-label{ font-weight:800; font-size:14.5px; color:var(--ink); }
  .auth-error{ color:var(--marge); font-weight:700; font-size:13px; margin:10px 0 0; }
  .auth-back{ margin-top:14px; }
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loading">Ouverture du cahier…</div>
</div>

<script>
const SUBJECTS = [
  {key:'arabe',    label:'Arabe',                 color:'#E4572E'},
  {key:'islamique',label:'Éducation islamique',    color:'#2E7D5B'},
  {key:'francais', label:'Français',               color:'#3B6FB6'},
  {key:'anglais',  label:'Anglais',                color:'#8B5CF6'},
  {key:'maths',    label:'Mathématiques',          color:'#E8930F'},
  {key:'svt',      label:'SVT',                    color:'#159895'},
  {key:'pc',       label:'Physique-Chimie',        color:'#4B4E9E'},
  {key:'social',   label:'Sciences sociales',      color:'#A6702B'},
  {key:'info',     label:'Informatique',           color:'#D6449A'},
];
const TYPES = [
  {key:'devoir',   label:'Devoir'},
  {key:'exercice', label:'Exercice'},
  {key:'revision', label:'Révision'},
  {key:'controle', label:'Contrôle'},
];
const MOODS = ['😊','🙂','😕'];

/* ---------- Contenu Mathématiques prêt à charger ---------- */
const SEED = {
  maths: [
    {semester:'S1', title:"Nombres entiers et décimaux positifs : opérations",
      essentiel:"Un nombre décimal a une partie entière et une partie décimale. Un entier est aussi un décimal (17 = 17,0).",
      cours:"Pour additionner ou soustraire des décimaux, on aligne toujours la virgule sous la virgule (on complète avec des zéros si besoin). Pour multiplier, on multiplie sans les virgules puis on compte au total le nombre de chiffres après les virgules dans les deux nombres, pour replacer la virgule.\nExemple : 3,4 × 2,05 → 34 × 205 = 6970 → 1+2 = 3 chiffres après la virgule → 6,970.",
      piege:"Aligner les chiffres de droite à droite au lieu d'aligner les virgules. Il faut toujours aligner la virgule, jamais le dernier chiffre.",
      astuce:"Compte les chiffres après la virgule AVANT de poser la multiplication, ça évite de l'oublier à la fin.",
      exercice:"Calcule 7,25 + 12,6 et 4,2 × 1,3.",
      reponse:"19,85 et 5,46."},
    {semester:'S1', title:"Fractions : opérations",
      essentiel:"Une fraction a/b représente un partage en b parts égales dont on prend a parts ; elle représente aussi a ÷ b.",
      cours:"Pour additionner ou soustraire deux fractions, il faut le même dénominateur. Exemple : 1/4 + 1/6 → dénominateur commun 12 → 3/12 + 2/12 = 5/12.\nPour multiplier deux fractions, on multiplie les numérateurs entre eux et les dénominateurs entre eux : 2/3 × 4/5 = 8/15.",
      piege:"Additionner numérateurs et dénominateurs directement (1/4 + 1/6 n'est PAS 2/10). Il faut le même dénominateur d'abord.",
      astuce:"Dessine deux rectangles partagés différemment pour voir pourquoi il faut le même découpage avant d'additionner.",
      exercice:"Calcule 2/5 + 1/5 et 3/4 × 2/3.",
      reponse:"3/5 et 6/12 (soit 1/2)."},
    {semester:'S1', title:"Nombres relatifs, décimaux négatifs : opérations",
      essentiel:"Un nombre relatif est positif, négatif ou nul. Sur une droite graduée, plus on va à droite, plus le nombre est grand.",
      cours:"Même signe : on additionne les distances à zéro et on garde le signe commun : (-3)+(-5) = -8. Signes différents : on soustrait la plus petite distance de la plus grande et on garde le signe du nombre le plus loin de zéro : (-7)+4 = -3. Soustraire revient à additionner l'opposé : 5-(-3) = 5+3 = 8.",
      piege:"Confondre « plus petit » avec « moins loin de zéro » : -10 est plus petit que -2.",
      astuce:"Pense à la température en °C : c'est le repère le plus concret pour les relatifs.",
      exercice:"Calcule (-8) + 3 et 6 - (-4).",
      reponse:"-5 et 10."},
    {semester:'S1', title:"Puissance d'un nombre relatif",
      essentiel:"aⁿ signifie qu'on multiplie a par lui-même n fois.",
      cours:"5² = 5×5 = 25. (-3)² = (-3)×(-3) = 9 (positif, car moins × moins = plus). Attention : (-3)² = 9 mais -3² = -(3²) = -9 (sans parenthèses, le carré passe avant le signe moins).",
      piege:"Oublier les parenthèses autour d'un nombre négatif avant de l'élever au carré — ça change tout le résultat.",
      astuce:"Puissance paire (2,4,6…) d'un nombre négatif → résultat positif. Puissance impaire (3,5…) → garde le signe négatif.",
      exercice:"Calcule (-2)³ et (-4)².",
      reponse:"-8 et 16."},
    {semester:'S1', title:"Angles et triangles",
      essentiel:"Un angle se mesure en degrés (°). La somme des trois angles d'un triangle fait toujours 180°.",
      cours:"Angle aigu < 90°, angle droit = 90°, angle obtus entre 90° et 180°. Si tu connais 2 angles d'un triangle, le 3e = 180° - (angle1+angle2). Triangle isocèle : 2 côtés égaux. Équilatéral : 3 côtés égaux (angles de 60°). Rectangle : un angle droit.",
      piege:"Mal placer le centre du rapporteur — il doit être exactement sur le sommet de l'angle.",
      astuce:"Un angle droit ressemble toujours au coin d'une feuille de papier, pratique pour vérifier « à l'œil ».",
      exercice:"Un triangle a un angle de 50° et un de 70°. Quel est le troisième ?",
      reponse:"180 - (50+70) = 60°."},
    {semester:'S1', title:"Droites : parallélisme et perpendicularité",
      essentiel:"Deux droites parallèles ne se croisent jamais. Deux droites perpendiculaires se croisent à angle droit (90°).",
      cours:"Pour tracer une parallèle : équerre posée contre une règle bien fixe, on fait glisser l'équerre. Pour une perpendiculaire : le côté droit de l'équerre directement sur la droite. Notation : (d1)//(d2) parallèle, (d1)⊥(d2) perpendiculaire.",
      piege:"Faire glisser l'équerre sans garder la règle fixe — la parallèle tracée est alors décalée.",
      astuce:"Deux droites perpendiculaires à une même troisième droite sont toujours parallèles entre elles.",
      exercice:"Si (d1)⊥(d3) et (d2)⊥(d3), que peut-on dire de (d1) et (d2) ?",
      reponse:"Elles sont parallèles."},
    {semester:'S1', title:"Droites remarquables : médiatrice, bissectrice, cercle circonscrit",
      essentiel:"La médiatrice d'un segment est perpendiculaire à ce segment et passe par son milieu. La bissectrice partage un angle en deux angles égaux.",
      cours:"Tout point de la médiatrice de [AB] est à égale distance de A et de B. Construction au compas : même écartement pointé en A puis en B, la droite passant par les deux points d'intersection des arcs est la médiatrice. Le centre du cercle circonscrit à un triangle est le point où se croisent ses trois médiatrices.",
      piege:"Changer l'écartement du compas entre les deux arcs — il faut garder exactement le même écartement.",
      astuce:"« Médiatrice = MIlieu, perpendiculAIRE » — elle passe toujours par le milieu, à angle droit.",
      exercice:"M est sur la médiatrice de [AB]. Si MA = 5 cm, combien vaut MB ?",
      reponse:"5 cm."},
    {semester:'S2', title:"Développement et factorisation",
      essentiel:"Développer transforme un produit en somme. Factoriser fait l'inverse : une somme devient un produit.",
      cours:"Distributivité : k(a+b) = ka+kb. Développer : 3(x+5) = 3x+15. Factoriser : on repère un facteur commun : 3x+15 = 3(x+5).",
      piege:"Oublier de multiplier TOUS les termes de la parenthèse : dans 4(x-2), il faut faire 4×x ET 4×2.",
      astuce:"Après avoir développé, refactorise pour vérifier que tu retombes sur l'expression de départ.",
      exercice:"Développe 5(x+3), puis factorise 8x+12.",
      reponse:"5x+15, puis 4(2x+3)."},
    {semester:'S2', title:"Équations",
      essentiel:"Une équation est une égalité avec une inconnue x. La résoudre, c'est trouver la valeur de x qui rend l'égalité vraie.",
      cours:"Règle d'or : ce qu'on fait d'un côté, on le fait aussi de l'autre (comme une balance). x+7=12 → x=5 (on soustrait 7 des deux côtés). 3x=18 → x=6 (on divise les deux côtés par 3).",
      piege:"Oublier de vérifier la solution en la remplaçant dans l'équation de départ.",
      astuce:"Imagine une balance à deux plateaux : ce que tu retires ou ajoutes d'un côté, fais-le aussi de l'autre.",
      exercice:"Résous x - 4 = 9, puis vérifie.",
      reponse:"x = 13 (13-4=9 ✓)."},
    {semester:'S2', title:"Symétrie centrale",
      essentiel:"La symétrie centrale de centre O transforme A en A' tel que O soit le milieu de [AA'].",
      cours:"On trace la droite (AO), puis on place A' sur cette droite de l'autre côté de O, à la même distance : OA = OA'. Pour une figure entière, on fait de même pour chaque sommet puis on relie dans le même ordre.",
      piege:"Placer A' sur la droite sans respecter OA = OA'.",
      astuce:"C'est comme faire pivoter la figure d'un demi-tour (180°) autour de O.",
      exercice:"O est le milieu de [AA']. Si OA = 4 cm, combien vaut AA' ?",
      reponse:"8 cm."},
    {semester:'S2', title:"Parallélogrammes et quadrilatères particuliers",
      essentiel:"Un parallélogramme a ses côtés opposés parallèles deux à deux.",
      cours:"Propriété clé : ses diagonales se coupent en leur milieu. Rectangle = parallélogramme + 4 angles droits. Losange = parallélogramme + 4 côtés égaux. Carré = rectangle ET losange en même temps.",
      piege:"Croire qu'un quadrilatère est un parallélogramme juste parce qu'il « a l'air » d'en être un — il faut le prouver.",
      astuce:"Carré = rectangle + losange : le quadrilatère le plus « complet ».",
      exercice:"Dans ABCD, diagonales se coupent en I. Si AI = 3 cm, combien vaut IC ?",
      reponse:"3 cm (I est le milieu des deux diagonales)."},
    {semester:'S2', title:"Sécantes à deux droites parallèles et angles",
      essentiel:"Une sécante qui coupe deux droites parallèles crée des paires d'angles liés entre eux.",
      cours:"Les angles alternes-internes (de part et d'autre de la sécante, entre les parallèles) sont égaux. Les angles correspondants (même position) sont égaux aussi. Très utile pour calculer un angle sans le mesurer.",
      piege:"Appliquer la règle alors que les droites ne sont pas parallèles.",
      astuce:"Dessine la figure en gros et en couleur au brouillon pour repérer les angles qui se correspondent.",
      exercice:"(d1)//(d2), sécante commune. Un angle mesure 65°. Que vaut son alterne-interne ?",
      reponse:"65° (ils sont égaux)."},
    {semester:'S2', title:"Cercle, disque",
      essentiel:"Le cercle est la ligne des points à distance r (rayon) d'un centre. Le disque, c'est le cercle + son intérieur.",
      cours:"Périmètre : P = 2×π×r. Aire du disque : A = π×r² (π ≈ 3,14). Exemple : rayon 5 cm → périmètre 2×3,14×5 = 31,4 cm, aire 3,14×25 = 78,5 cm².",
      piege:"Confondre rayon (centre-bord) et diamètre (bord-bord, le double du rayon).",
      astuce:"Diamètre = 2 × rayon, toujours. Vérifie laquelle des deux mesures est donnée dans l'énoncé.",
      exercice:"Un cercle a un rayon de 3 cm. Calcule son périmètre (à 0,1 près).",
      reponse:"2×3,14×3 = 18,84 ≈ 18,8 cm."},
    {semester:'S2', title:"Prisme droit et cylindre",
      essentiel:"Solides à deux bases identiques et parallèles. Volume = aire de la base × hauteur.",
      cours:"Prisme base 4×3 cm, hauteur 6 cm : V = (4×3)×6 = 72 cm³. Cylindre rayon 2 cm, hauteur 10 cm : V = (π×2²)×10 ≈ 125,6 cm³.",
      piege:"Oublier l'unité au cube (cm³) pour un volume — ce n'est ni des cm ni des cm².",
      astuce:"Calcule toujours d'abord l'aire de la base seule, puis multiplie par la hauteur.",
      exercice:"Un prisme a une base d'aire 15 cm² et une hauteur de 4 cm. Volume ?",
      reponse:"60 cm³."},
    {semester:'S2', title:"Droite graduée, repère dans le plan",
      essentiel:"Un repère (deux axes gradués perpendiculaires) permet de situer un point par deux nombres : (abscisse ; ordonnée).",
      cours:"Pour placer A(3 ; 2) : on avance de 3 sur l'axe horizontal (abscisse), puis on monte de 2 (ordonnée).",
      piege:"Inverser l'ordre — lire ou placer l'ordonnée avant l'abscisse.",
      astuce:"« Horizontal d'abord (le couloir), vertical ensuite (l'ascenseur) ».",
      exercice:"Place B(4 ; -1). Est-il au-dessus ou en dessous de l'axe horizontal ?",
      reponse:"En dessous, car son ordonnée est négative."},
    {semester:'S2', title:"Proportionnalité",
      essentiel:"Deux grandeurs sont proportionnelles si l'on passe de l'une à l'autre en multipliant toujours par le même nombre.",
      cours:"Produit en croix : si a/b = c/d, alors a×d = b×c. Exemple : 200 g de farine → 4 parts ; pour 6 parts : 200/4 = x/6 → x = (200×6)/4 = 300 g.",
      piege:"Appliquer la règle de trois à des grandeurs qui ne sont pas proportionnelles (âge et taille, par exemple).",
      astuce:"Demande-toi : « si je double une grandeur, l'autre double-t-elle aussi ? » Si oui, c'est proportionnel.",
      exercice:"3 stylos coûtent 15 DH. Combien coûtent 5 stylos ?",
      reponse:"25 DH."},
    {semester:'S2', title:"Statistiques",
      essentiel:"Les statistiques organisent et résument des données chiffrées recueillies sur un groupe.",
      cours:"Effectif = nombre de fois qu'une valeur apparaît. Fréquence = effectif ÷ effectif total (souvent en %). La somme des fréquences vaut toujours 1 (ou 100%).",
      piege:"Confondre effectif (nombre brut) et fréquence (proportion du total).",
      astuce:"La fréquence répond à « quelle part du total ? », jamais à « combien, en nombre entier ? ».",
      exercice:"Classe de 25 élèves, 10 pratiquent le football. Fréquence en % ?",
      reponse:"10/25 = 0,4 = 40%."},

  francais: [
{semester:'S1', title:"Le verbe et la conjugaison",
  essentiel:"Le verbe est le mot qui indique une action ou un état ; il se conjugue selon la personne et le temps.",
  cours:"Un verbe change de forme selon qui fait l'action (je, tu, il...) et selon le moment (présent, passé, futur). Exemple : le verbe « chanter » → je chante (présent), je chantais (imparfait), je chanterai (futur). L'infinitif est la forme « de base » du verbe, celle qu'on trouve dans le dictionnaire : chanter, finir, prendre.\nLes verbes du 1er groupe se terminent par -er (chanter), ceux du 2e groupe par -ir avec -issons au pluriel (finir → nous finissons), les autres sont des verbes du 3e groupe, souvent irréguliers (prendre, aller, dire).",
  piege:"Confondre l'infinitif et le participe passé pour les verbes en -er : « il a mangé » (participe passé) et non « il a manger ».",
  astuce:"Pour vérifier -é ou -er, remplace le verbe par « prendre/pris » : « il a mangé » → « il a pris » (donc -é) ; « il va manger » → « il va prendre » (donc -er).",
  exercice:"Conjugue le verbe « jouer » au présent avec « elle », puis à l'infinitif dans la phrase : elle aime ... au foot.",
  reponse:"elle joue ; elle aime jouer au foot."},
{semester:'S1', title:"Les temps du récit : imparfait et passé simple",
  essentiel:"Dans un récit écrit, l'imparfait décrit ce qui dure ou se répète, le passé simple raconte les actions précises qui font avancer l'histoire.",
  cours:"Imparfait : terminaisons -ais, -ais, -ait, -ions, -iez, -aient. Exemple : « Il faisait beau, les oiseaux chantaient » (description, arrière-plan).\nPassé simple : pour les verbes en -er, terminaisons -ai, -as, -a... Exemple : « Il ouvrit la porte et entra » (actions brèves, qui se succèdent).\nOn les mélange souvent dans un conte : « Il était une fois une petite fille qui vivait dans un village (imparfait, décor). Un jour, elle partit se promener dans la forêt (passé simple, action). »",
  piege:"Utiliser seulement l'imparfait pour tout le récit, ce qui rend l'histoire plate, sans actions marquantes.",
  astuce:"Imparfait = ça DURE (comme un décor de théâtre qui reste). Passé simple = ça arrive UNE FOIS, d'un coup.",
  exercice:"Mets le verbe entre parenthèses au temps qui convient : « La forêt (être) sombre. Soudain, un bruit (retentir). »",
  reponse:"La forêt était sombre. Soudain, un bruit retentit."},
{semester:'S1', title:"Le groupe nominal et ses expansions",
  essentiel:"Le groupe nominal (GN) est construit autour d'un nom ; on peut l'enrichir avec un adjectif, un complément du nom ou une proposition relative.",
  cours:"GN minimal : « la maison ». On peut l'enrichir : « la grande maison » (adjectif), « la maison de mes grands-parents » (complément du nom introduit par « de »), « la maison qui est au bord de la mer » (proposition relative introduite par « qui »).\nCes expansions permettent de préciser et d'enrichir une description, très utile pour décrire un personnage, un lieu ou un objet.",
  piege:"Oublier l'accord de l'adjectif avec le nom : « la maison blanc » au lieu de « la maison blanche ».",
  astuce:"Pose-toi la question : de qui/de quoi parle-t-on précisément ? Chaque expansion doit répondre à « lequel ? » ou « comment ? ».",
  exercice:"Enrichis le groupe nominal « le chat » avec un adjectif, puis avec un complément du nom.",
  reponse:"Exemples possibles : le chat noir ; le chat de la voisine."},
{semester:'S1', title:"Les déterminants et les articles",
  essentiel:"Le déterminant se place devant le nom pour l'annoncer et donner une précision (genre, nombre, quantité).",
  cours:"Articles définis : le, la, les (chose connue/précise). Articles indéfinis : un, une, des (chose non précisée). Articles partitifs : du, de la, des (une quantité qu'on ne compte pas : du pain, de l'eau).\nAutres déterminants : possessifs (mon, ta, ses), démonstratifs (ce, cette, ces), numéraux (trois, dix).\nExemple : « J'ai vu UN chat. LE chat était noir » — indéfini d'abord (on le découvre), puis défini (on en parle déjà).",
  piege:"Confondre « des » article indéfini pluriel et « des » venant de « de + les » (complément du nom) : « les jouets des enfants ».",
  astuce:"Un déterminant répond toujours à la question : est-ce que je connais déjà cette chose (le/la/les) ou pas encore (un/une/des) ?",
  exercice:"Complète avec le bon déterminant : « ... élève est arrivée avec ... cartable neuf. »",
  reponse:"L'élève est arrivée avec un cartable neuf."},
{semester:'S1', title:"L'adjectif qualificatif et son accord",
  essentiel:"L'adjectif qualificatif donne une caractéristique au nom et s'accorde toujours en genre et en nombre avec lui.",
  cours:"Exemple : un garçon courageux → une fille courageuse (accord en genre) ; des enfants courageux (accord en nombre).\nRègle générale : on ajoute -e au féminin (grand → grande), -s au pluriel (grand → grands), sauf exceptions (beau → belle, heureux → heureuse).\nL'adjectif peut être placé avant le nom (un joli dessin) ou après (un dessin joli), selon l'adjectif et l'habitude de la langue.",
  piege:"Oublier d'accorder l'adjectif quand il est loin du nom, par exemple après le verbe être : « les filles sont content » au lieu de « contentes ».",
  astuce:"Toujours revenir au nom : de qui/quoi parle l'adjectif ? Accorde-le avec CE nom, même si des mots les séparent.",
  exercice:"Accorde l'adjectif « heureux » dans la phrase : « Les élèves étaient (heureux) de partir en sortie. » (élèves = groupe mixte filles et garçons)",
  reponse:"Les élèves étaient heureux de partir en sortie."},
{semester:'S1', title:"Raconter à partir d'une bande dessinée",
  essentiel:"Pour raconter une bande dessinée, on transforme les images et les bulles de dialogue en un texte suivi, avec des verbes d'action et des connecteurs de temps.",
  cours:"Étapes : 1) observer chaque case et repérer les personnages, le lieu, l'action ; 2) mettre les événements dans l'ordre avec des mots comme d'abord, ensuite, puis, enfin ; 3) transformer les paroles des bulles en discours (direct : « Il dit : \\\"Attends-moi !\\\" » ou indirect : il lui dit d'attendre).\nExemple : case 1 (un enfant court), case 2 (il tombe) → « D'abord, l'enfant courait vers l'école. Puis, il trébucha et tomba. »",
  piege:"Se contenter de décrire chaque image sans lien logique, sans connecteurs, ce qui donne un texte haché.",
  astuce:"Imagine que tu racontes l'histoire à un ami qui n'a pas vu les images : donne-lui tous les détails utiles, dans l'ordre.",
  exercice:"Raconte en une phrase avec un connecteur de temps : image 1 = un chat dort ; image 2 = un chien arrive et aboie.",
  reponse:"Exemple : Le chat dormait tranquillement, puis un chien arriva et se mit à aboyer."},
{semester:'S2', title:"Le schéma narratif du conte",
  essentiel:"Un conte suit généralement cinq étapes : la situation initiale, l'élément perturbateur, les péripéties, l'élément de résolution et la situation finale.",
  cours:"1) Situation initiale : le décor, les personnages, la vie « normale » (« Il était une fois une princesse qui vivait heureuse... »). 2) Élément perturbateur : un événement qui change tout (« Un jour, une sorcière la maudit... »). 3) Péripéties : les aventures, les obstacles. 4) Résolution : l'action qui règle le problème. 5) Situation finale : souvent une morale ou un retour au calme.",
  piege:"Oublier l'élément perturbateur et passer directement de la situation initiale aux péripéties, ce qui rend l'histoire confuse.",
  astuce:"Retiens : DÉPART (situation initiale) → DÉCLIC (élément perturbateur) → PARCOURS (péripéties) → DÉNOUEMENT (résolution) → FIN.",
  exercice:"Identifie l'étape du schéma narratif : « Grâce à son courage, elle réussit à briser le sort. »",
  reponse:"C'est l'élément de résolution (l'action qui règle le problème)."},
{semester:'S2', title:"Décrire un personnage, un lieu ou un objet",
  essentiel:"Décrire, c'est donner des détails précis en utilisant les cinq sens et un vocabulaire varié, organisés du général au particulier.",
  cours:"Pour un personnage : allure générale, visage, vêtements, attitude, caractère. Pour un lieu : ce qu'on voit, entend, sent ; du plus loin au plus près, ou du plus grand au plus petit détail.\nExemple : « C'était un vieil homme (allure générale) au visage ridé (détail) et aux yeux pétillants de malice (caractère suggéré par le détail). »\nUtilise des comparaisons (« aussi rapide qu'un guépard ») pour rendre la description vivante.",
  piege:"Faire une liste plate d'adjectifs sans organisation ni lien entre les détails (« Il était grand. Il était gentil. Il était brun. »).",
  astuce:"Choisis 2 ou 3 détails marquants plutôt que tout dire : mieux vaut un détail précis et original qu'une longue liste banale.",
  exercice:"Décris en deux phrases un lieu que tu aimes, en utilisant au moins un des cinq sens (vue, ouïe, odorat...).",
  reponse:"Réponse libre ; exemple : La plage s'étendait à perte de vue. On entendait les vagues se briser doucement sur le sable chaud."},
{semester:'S2', title:"Lire et comprendre un texte informatif (les médias)",
  essentiel:"Un texte informatif présente des faits réels de façon organisée, souvent avec un titre, des sous-titres et l'ordre : qui, quoi, où, quand, pourquoi.",
  cours:"Pour comprendre un article : repère le titre (résume l'info), le chapeau/l'introduction (l'essentiel en quelques lignes), puis les paragraphes qui développent avec des détails.\nQuestions clés : QUI est concerné ? QUOI s'est-il passé ? OÙ ? QUAND ? POURQUOI/COMMENT ? Ces questions aident à retrouver rapidement les informations importantes dans un article.",
  piege:"Confondre un fait (vérifiable, objectif) et une opinion (avis personnel) dans un article : « Le concert a eu lieu samedi » (fait) vs « C'était le meilleur concert de l'année » (opinion).",
  astuce:"Pour repérer une opinion, cherche des mots comme « je pense que », « à mon avis », ou des adjectifs qui jugent (magnifique, horrible).",
  exercice:"Dans la phrase « Le collège a organisé une sortie scolaire jeudi dernier, et c'était vraiment formidable », identifie le fait et l'opinion.",
  reponse:"Fait : le collège a organisé une sortie scolaire jeudi dernier. Opinion : c'était vraiment formidable."},
{semester:'S2', title:"Écrire une lettre",
  essentiel:"Une lettre s'adresse à un destinataire précis et respecte une structure fixe : formule d'appel, corps du texte, formule de politesse, signature.",
  cours:"Structure : lieu et date en haut ; formule d'appel (Cher/Chère... ou Bonjour...) ; corps du texte organisé en paragraphes ; formule de politesse finale (Je t'embrasse, Amicalement...) ; signature.\nLe ton et le vocabulaire changent selon le destinataire : plus familier pour un ami, plus formel pour un adulte inconnu (Madame, Monsieur... Veuillez agréer...).",
  piege:"Oublier la formule d'appel ou la formule de politesse finale, ou utiliser un ton trop familier dans une lettre formelle.",
  astuce:"Avant d'écrire, demande-toi : à qui j'écris (ami, famille, adulte) ? Cela détermine le ton à utiliser du début à la fin.",
  exercice:"Écris la formule d'appel et la formule de politesse finale d'une lettre à ta grand-mère.",
  reponse:"Exemple : « Chère Mamie, » ... « Je t'embrasse très fort, [ton prénom] »."},
{semester:'S2', title:"Le texte théâtral : dialogue et didascalies",
  essentiel:"Un texte théâtral est fait pour être joué : il combine des dialogues (paroles des personnages) et des didascalies (indications de jeu, entre parenthèses ou en italique).",
  cours:"Structure : le nom du personnage suivi de ses paroles ; les didascalies précisent le ton, les gestes ou le décor (ex. : MARIA (en colère) : Tu ne m'écoutes jamais !).\nÀ l'oral, il faut travailler la voix (volume, intonation), les gestes et les déplacements pour donner vie au texte.",
  piege:"Lire le texte théâtral comme un roman, sans faire varier la voix selon le personnage et son émotion.",
  astuce:"Avant de jouer une scène, demande-toi : que ressent mon personnage à ce moment précis ? Cela guide ta voix et tes gestes.",
  exercice:"Écris une courte réplique de deux personnages qui se disputent à propos d'un jouet cassé, avec une didascalie.",
  reponse:"Exemple : LEA (fâchée) : Tu as cassé mon jouet préféré ! SAMI (gêné) : Je... je suis désolé, je ne l'ai pas fait exprès."},
{semester:'S2', title:"Vocabulaire : les synonymes et les antonymes",
  essentiel:"Un synonyme a un sens proche d'un mot donné ; un antonyme a le sens contraire.",
  cours:"Synonymes : content / heureux / joyeux (nuances proches). Antonymes : content / triste ; grand / petit ; rapide / lent.\nUtiliser des synonymes évite de répéter le même mot dans un texte et rend l'écriture plus riche. Attention : deux synonymes ne sont pas toujours interchangeables dans tous les contextes (on dit « un repas copieux », pas « un repas gros »).",
  piege:"Croire que deux synonymes veulent dire exactement la même chose dans toutes les phrases, sans nuance.",
  astuce:"Pour trouver un synonyme, pense à un mot qui pourrait remplacer l'autre SANS changer le sens général de la phrase.",
  exercice:"Donne un synonyme et un antonyme du mot « rapide ».",
  reponse:"Synonyme possible : véloce/vif. Antonyme : lent."}

  svt: [
{semester:'S1', title:"Le milieu naturel et ses composantes",
  essentiel:"Un milieu naturel réunit des êtres vivants et des éléments non vivants qui agissent les uns sur les autres.",
  cours:"Dans une mare, les poissons, les algues et les insectes sont des composantes biotiques, car ils sont vivants. L'eau, la lumière, la température et le sol sont des composantes abiotiques, car ils ne sont pas vivants.\nExemple : si la mare manque d'eau, certains êtres vivants ne peuvent plus y vivre.",
  piege:"Dire que l'eau ou le sol sont vivants parce qu'ils sont dans la nature.",
  astuce:"BIO = vie : biotique veut dire vivant. A-BIO-tique veut dire sans vie.",
  exercice:"Dans un jardin, classe le ver de terre, la lumière et une pierre en biotique ou abiotique.",
  reponse:"Le ver de terre est biotique. La lumière et la pierre sont abiotiques."},

{semester:'S1', title:"La diversité des êtres vivants et la cellule",
  essentiel:"Les êtres vivants sont très divers, mais les animaux et les végétaux sont tous constitués de cellules.",
  cours:"Une cellule est la plus petite unité du vivant. Au microscope, une cellule végétale possède souvent une paroi rigide et peut contenir des parties vertes, alors qu'une cellule animale n'a pas de paroi.\nExemple : la peau d'un oignon observée au microscope montre des cellules juxtaposées comme de petites briques.",
  piege:"Croire qu'une cellule est toujours visible à l'œil nu ou qu'elle est la même chez tous les êtres vivants.",
  astuce:"Cellule = petite pièce de construction : beaucoup de cellules construisent un être vivant.",
  exercice:"Quel instrument permet d'observer clairement les cellules d'une peau d'oignon ?",
  reponse:"C'est le microscope qui permet d'observer clairement les cellules."},

{semester:'S1', title:"La respiration en milieu aérien",
  essentiel:"Les êtres vivants respirent en réalisant des échanges gazeux : ils prélèvent du dioxygène et rejettent du dioxyde de carbone.",
  cours:"Chez l'être humain, l'air entre par le nez ou la bouche, passe dans la trachée puis arrive aux poumons. Chez l'insecte, l'air passe par de petits orifices et des trachées.\nExemple : après une course, on respire plus vite parce que les muscles ont besoin de davantage de dioxygène.",
  piege:"Confondre respirer avec seulement inspirer : respirer comprend aussi le rejet de dioxyde de carbone.",
  astuce:"O2 entre, CO2 sort : imagine une flèche qui entre puis une flèche qui sort.",
  exercice:"Quel organe permet principalement les échanges gazeux chez l'être humain ?",
  reponse:"Les poumons permettent principalement les échanges gazeux chez l'être humain."},

{semester:'S1', title:"La respiration dans l'eau et chez les plantes",
  essentiel:"Les organes respiratoires changent selon le milieu : les poissons utilisent des branchies et les plantes échangent des gaz par des stomates.",
  cours:"Un poisson fait passer l'eau sur ses branchies, qui prélèvent le dioxygène dissous dans l'eau. Les feuilles possèdent de minuscules ouvertures appelées stomates, utiles aux échanges gazeux.\nExemple : un poisson ne peut pas utiliser ses branchies dans l'air comme des poumons.",
  piege:"Penser que seuls les animaux respirent ou que le poisson respire l'eau elle-même.",
  astuce:"BRanchies = BRassage de l'eau ; STOmates = petites portes sur les feuilles.",
  exercice:"Dans l'eau, quel gaz les branchies du poisson prélèvent-elles ?",
  reponse:"Les branchies prélèvent le dioxygène dissous dans l'eau."},

{semester:'S1', title:"L'alimentation chez l'être humain et les animaux",
  essentiel:"Chaque être vivant a un régime alimentaire adapté à ce qu'il mange et à ses organes.",
  cours:"Un herbivore mange surtout des végétaux, un carnivore mange surtout des animaux et un omnivore mange des aliments d'origines végétale et animale. Les dents donnent des indices : les molaires larges broient, les canines pointues déchirent.\nExemple : la vache est herbivore ; le lion est carnivore ; l'être humain est omnivore.",
  piege:"Dire qu'un omnivore mange absolument tout ou classer un animal seulement selon sa taille.",
  astuce:"Herbe dans herbivore, chair dans carnivore, omni signifie de plusieurs sortes.",
  exercice:"Le lapin mange de l'herbe, des feuilles et des légumes. Quel est son régime alimentaire ?",
  reponse:"Le lapin est herbivore, car il se nourrit de végétaux."},

{semester:'S1', title:"La nutrition des plantes vertes",
  essentiel:"Une plante verte fabrique sa matière grâce à l'eau, aux sels minéraux, au dioxyde de carbone et à la lumière.",
  cours:"Les racines absorbent l'eau et les sels minéraux du sol. Les feuilles prélèvent le dioxyde de carbone de l'air ; avec la lumière, la plante fabrique sa matière organique.\nExemple : une plante gardée longtemps sans lumière devient fragile et ne se développe pas normalement.",
  piege:"Croire que la plante prend sa nourriture toute faite dans le sol comme un animal.",
  astuce:"Racines : eau et sels ; feuilles : air et lumière.",
  exercice:"Cite les deux éléments que les racines prélèvent dans le sol.",
  reponse:"Les racines prélèvent l'eau et les sels minéraux dans le sol."},

{semester:'S1', title:"Chaînes alimentaires et équilibres naturels",
  essentiel:"Dans un milieu, les êtres vivants sont liés par l'alimentation ; modifier une population peut perturber tout le milieu.",
  cours:"Une chaîne alimentaire se lit dans le sens est mangé par. La plante verte est un producteur ; un animal qui mange est un consommateur ; les décomposeurs transforment la matière morte.\nExemple : herbe → lapin → renard. Si les renards disparaissent, les lapins peuvent devenir trop nombreux et manger plus d'herbe.",
  piege:"Lire la flèche à l'envers ou croire qu'un prédateur est forcément inutile au milieu.",
  astuce:"La flèche va vers celui qui mange : l'herbe est mangée par le lapin.",
  exercice:"Dans la chaîne herbe → sauterelle → grenouille, quel être vivant mange la sauterelle ?",
  reponse:"C'est la grenouille qui mange la sauterelle."},

{semester:'S2', title:"Classer les êtres vivants",

  cours:"On compare des caractères comme la présence de plumes, de poils, de nageoires ou de fleurs. Les groupes emboîtés montrent que certains groupes sont inclus dans d'autres.\nExemple : le chat et le lapin ont des poils ; ils peuvent être placés ensemble dans un groupe différent de celui du pigeon, qui a des plumes.",

{semester:'S2', title:"Lire une carte topographique",
  essentiel:"Une carte topographique représente un terrain vu d'en haut et permet de connaître l'altitude et la forme du relief.",
  cours:"Les courbes de niveau relient les points de même altitude. Quand elles sont serrées, la pente est forte ; quand elles sont espacées, la pente est douce.\nExemple : deux courbes marquées 400 m et 450 m indiquent une différence d'altitude de 50 m.",
  piege:"Penser que deux courbes proches ont la même altitude ou que des courbes serrées indiquent un terrain plat.",
  astuce:"Courbes serrées = montée serrée, donc pente forte.",
  exercice:"Sur une carte, une colline passe de 200 m à 260 m. Quelle est la différence d'altitude ?",
  reponse:"La différence d'altitude est de 60 m, car 260 m − 200 m = 60 m."},

{semester:'S2', title:"Érosion et transport des matériaux",
  essentiel:"L'érosion use les roches et enlève des matériaux ; l'eau, le vent ou la glace peuvent ensuite les transporter.",
  cours:"La pluie peut détacher des grains de roche et une rivière les emporte vers l'aval. Pendant le transport, les grains se heurtent et deviennent souvent plus petits et plus arrondis.\nExemple : après de fortes pluies, une rivière peut devenir marron parce qu'elle transporte de la terre.",
  piege:"Croire que l'érosion fabrique les roches ou que les matériaux restent toujours sur place.",
  astuce:"Érosion = enlèvement ; transport = déplacement.",
  exercice:"Quel agent peut transporter du sable dans le désert : le vent ou la lumière ?",
  reponse:"C'est le vent qui peut transporter du sable dans le désert."},

{semester:'S2', title:"Sédimentation, diagénèse et roches sédimentaires",

  cours:"La sédimentation est le dépôt de particules, souvent au fond de l'eau. Avec le temps, les couches se tassent et se cimentent : c'est la diagénèse.\nExemple : du sable déposé puis cimenté peut former du grès, une roche sédimentaire.",
  piege:"Penser que le dépôt devient une roche en quelques minutes ou confondre transport et sédimentation.",
  astuce:"Sédimentation = se déposer ; diagénèse = devenir une roche avec le temps.",
  exercice:"Remets dans l'ordre : transport, dépôt des particules, formation de la roche.",
  reponse:"L'ordre est : transport, dépôt des particules ou sédimentation, puis formation de la roche par diagénèse."},

  cours:"Une empreinte de feuille, une coquille ou un os peuvent devenir des fossiles si les conditions de conservation sont favorables. Dans une série de strates non bouleversées, les couches du bas sont généralement plus anciennes que celles du haut.\nExemple : une ammonite fossilisée aide à connaître les anciens milieux et les temps géologiques.",

  {semester:'S1', title:"أوربا في العصر الوسيط والحروب الصليبية",
    essentiel:"عرفت أوربا في العصر الوسيط النظام الفيودالي، حيث امتلك كبار الإقطاعيين الأراضي. وكانت الحروب الصليبية صراعات، لكنها أدت أيضاً إلى احتكاك الحضارات وتبادل بعض المعارف.",
    cours:"في النظام الفيودالي كان الملك في القمة، ثم النبلاء ورجال الدين، وكان الفلاحون يعملون في الأراضي. بدأت الحروب الصليبية في أواخر القرن الحادي عشر. لا ندرسها كحروب فقط، بل نلاحظ أيضاً انتقال سلع ومعارف بين الشرق والغرب.\nمثال محلول: إذا انتقلت معرفة علمية من مدينة إسلامية إلى أوربا، فهذا مثال على احتكاك الحضارات وتبادلها.",
    piege:"الظن أن كل علاقة بين الحضارات هي حرب فقط. يمكن أن توجد تجارة وتعلم وتبادل أيضاً.",
    astuce:"احتكاك الحضارات قد يعني صراعاً وقد يعني تبادلاً.",
    exercice:"اذكر نتيجة غير عسكرية واحدة لاحتكاك الحضارات.",
    reponse:"من نتائجه تبادل السلع أو انتقال بعض المعارف والاختراعات بين الشعوب."},

  {semester:'S1', title:"شكل الأرض وتمثيلها والإحداثيات",
    essentiel:"الأرض كروية تقريباً، ويمكن تمثيلها بالكرة الأرضية أو الخريطة. تساعد خطوط العرض والطول على تحديد موقع أي مكان بدقة.",
    cours:"خط الاستواء هو خط العرض 0 درجة، وخط غرينتش هو خط الطول 0 درجة. خطوط العرض تحدد الموقع شمالاً أو جنوباً، وخطوط الطول تحدده شرقاً أو غرباً.\nمثال محلول: موقع الرباط يقارب 34 درجة شمالاً و6 درجات غرباً، أي إنها تقع شمال خط الاستواء وغرب خط غرينتش.",
    piege:"الخلط بين خط العرض وخط الطول أو بين الشرق والغرب.",
    astuce:"العرض: شمال وجنوب. الطول: شرق وغرب.",
    exercice:"مدينة تقع عند 20 درجة شمالاً و10 درجات شرقاً. هل تقع شمال أم جنوب خط الاستواء؟",
    reponse:"تقع شمال خط الاستواء لأن خط العرض مكتوب 20 درجة شمالاً."},

  {semester:'S2', title:"الأرض كوكب متغير: اليابس والماء والهواء",
    essentiel:"سطح الأرض يتغير بفعل عوامل داخلية مثل الزلازل والبراكين وعوامل خارجية مثل الرياح والمياه. وتحيط بالأرض أغلفة أهمها الغلاف المائي والجوي.",
    cours:"يشمل الغلاف اليابس القارات والجبال والسهول، ويشمل الغلاف المائي المحيطات والبحار والأنهار. الغلاف الجوي طبقة الغازات التي تحيط بالأرض وتسمح بالحياة. قد تنحت مياه الأنهار الصخور مع الزمن فتغير شكل المكان.\nمثال محلول: تكوّن واد بفعل مياه جارية مدة طويلة مثال على تأثير عامل خارجي في سطح الأرض.",
    piege:"الاعتقاد أن الجبال والسهول لا تتغير أبداً. التغير قد يكون بطيئاً جداً أو سريعاً مثل الزلزال.",
    astuce:"يابس وماء وهواء: ثلاثة أغلفة نلاحظها حولنا.",
    exercice:"إلى أي غلاف ينتمي الهواء الذي نتنفسه؟",
    reponse:"ينتمي إلى الغلاف الجوي، وهو الغلاف الغازي الذي يحيط بالأرض."},

  {semester:'S2', title:"السكان والكثافة السكانية",
    essentiel:"لا يتوزع السكان بالتساوي في العالم. الكثافة السكانية تبين عدد السكان في كل كيلومتر مربع.",
    cours:"تحسب الكثافة السكانية بالقسمة: عدد السكان ÷ المساحة. ترتفع الكثافة غالباً في السهول والمدن والمناطق التي تتوفر فيها المياه والعمل، وتقل في الصحاري والجبال الوعرة.\nمثال محلول: منطقة فيها 20000 نسمة ومساحتها 100 كلم². الكثافة = 20000 ÷ 100 = 200 نسمة في الكلم².",
    piege:"قسمة المساحة على عدد السكان بدل قسمة عدد السكان على المساحة.",
    astuce:"الكثافة تسأل: كم شخصاً في مساحة واحدة؟ إذن السكان أولاً ثم المساحة.",
    exercice:"إقليم عدد سكانه 6000 نسمة ومساحته 30 كلم². احسب كثافته السكانية.",
    reponse:"الكثافة = 6000 ÷ 30 = 200 نسمة في الكلم²."},

  {semester:'S2', title:"أنشطة السكان: الفلاحة والصناعة والخدمات",
    essentiel:"يمارس السكان أنشطة اقتصادية لإنتاج السلع وتقديم الخدمات. من أهمها الفلاحة والصناعة والتجارة والخدمات.",
    cours:"الفلاحة تنتج النباتات والحيوانات، والصناعة تحول المواد الأولية إلى منتجات، أما التجارة والخدمات فتساعد على بيع المنتجات وتلبية حاجات الناس.\nمثال محلول: القمح يزرعه الفلاح، ويطحن في مصنع ليصبح دقيقاً، ثم ينقله التاجر إلى المخبزة. هذه سلسلة تجمع الفلاحة والصناعة والتجارة والخدمات.",
    piege:"اعتبار التجارة صناعة. التجارة تنقل وتبيع السلع، أما الصناعة فتحول المواد إلى منتجات.",
    astuce:"فلاح يزرع، مصنع يحول، تاجر يبيع، خدمة تساعد.",
    exercice:"هل عمل الطبيب من الفلاحة أم الصناعة أم الخدمات؟",
    reponse:"عمل الطبيب من الخدمات، لأنه يقدم خدمة صحية للناس."},

  {semester:'S2', title:"الكرامة والحرية والمساواة والعدل",
    essentiel:"لكل إنسان كرامة وحقوق يجب احترامها. الحرية لا تعني إيذاء الآخرين، والمساواة والعدل يضمنان احترام الحقوق للجميع.",
    cours:"الكرامة تعني قيمة كل إنسان ووجوب معاملته باحترام. الحرية هي القدرة على الاختيار والتعبير في حدود القانون وحقوق الآخرين. المساواة تعني التساوي في الحقوق، والعدل يعني إعطاء كل ذي حق حقه.\nمثال محلول: إذا سمح الأستاذ لجميع التلاميذ بالتعبير دون سخرية، فهو يحترم الكرامة والمساواة وحرية التعبير المنظمة.",
    piege:"القول إن الحرية تعني فعل أي شيء. الحرية ترتبط باحترام القانون وحقوق الآخرين.",
    astuce:"حريتي تقف عندما تبدأ حقوق غيري.",
    exercice:"هل السخرية من زميل بسبب لهجته أو شكله تحترم الكرامة؟ علل.",
    reponse:"لا، لأنها تجرح كرامته ولا تحترم حقه في المعاملة باحترام ومساواة."},

  {semester:'S2', title:"التضامن والتسامح والديمقراطية والسلم",
    essentiel:"المواطن الصالح يساعد الآخرين ويحترم الاختلاف ويشارك في اتخاذ القرار بطرق سلمية. هذه القيم تقوي العيش المشترك.",
    cours:"التضامن هو التعاون لمساعدة من يحتاج. التسامح هو احترام الاختلاف في الرأي أو الثقافة من دون إهانة. الديمقراطية تعني المشاركة والحوار واحترام قرار الأغلبية مع حفظ حقوق الأقلية. السلم هو حل الخلافات بالحوار لا بالعنف.\nمثال محلول: عند اختيار ممثل القسم، يترشح التلاميذ ويصوتون باحترام. هذا تطبيق بسيط للديمقراطية.",
    piege:"الاعتقاد أن التسامح يعني الموافقة على كل الآراء. التسامح هو احترام الشخص وحقه في الرأي مع إمكان مناقشة الفكرة بأدب.",
    astuce:"نختلف في الرأي، لكن لا نختلف في الاحترام.",
    exercice:"كيف يمكن حل خلاف بين تلميذين حول لعبة في ساحة المدرسة؟",
    reponse:"يتحدثان بهدوء ويستمع كل واحد للآخر، ثم يتفقان على حل عادل مثل تبادل الدور أو طلب مساعدة الأستاذ عند الحاجة."},

  {semester:'S2', title:"القاعدة القانونية وحقوق الطفل",
    essentiel:"القاعدة القانونية تنظم حياة الناس وتحمي الحقوق. للطفل حقوق مثل التعليم والحماية والرعاية، وله أيضاً واجبات داخل الأسرة والمدرسة والمجتمع.",
    cours:"القاعدة القانونية عامة وملزمة، مثل قواعد السلامة في الطريق. تحمي القوانين الناس وتساعد على حل النزاعات. من حقوق الطفل التعلم والرعاية والحماية من العنف، ومن واجباته احترام الآخرين والمحافظة على ممتلكات المدرسة.\nمثال محلول: وضع حزام الأمان في السيارة ليس اختياراً شخصياً فقط، بل قاعدة تحمي حياة الركاب.",
    piege:"الظن أن الحقوق تعني عدم وجود واجبات. لكل حق استعمال مسؤول يحترم حقوق الآخرين والقواعد.",
    astuce:"حقوقي تحميني، وواجباتي تجعلني مسؤولاً.",
    exercice:"اذكر حقاً واحداً للطفل وواجباً واحداً له في المدرسة.",
    reponse:"من حقوق الطفل في المدرسة التعلم في بيئة آمنة. ومن واجباته احترام المعلمين والزملاء والمحافظة على تجهيزات المدرسة."}

  anglais: [
{semester:'S1', title:"Greetings and introducing yourself",
  essentiel:"Pour commencer une conversation, on salue puis on dit son prénom. En anglais, le pronom « I » prend toujours une majuscule.",
  cours:"Hello! / Hi! (Bonjour / Salut)\nMy name is Sara. (Je m'appelle Sara.)\nI am eleven. (J'ai onze ans.)\nNice to meet you. (Enchanté(e).)",
  piege:"Ne pas dire « I have eleven years » : en anglais, on utilise « I am eleven ».",
  astuce:"I = moi : la lettre « I » est toujours grande, comme une personne qui se présente fièrement.",
  exercice:"Complete: Hello! My name ___ Yasmine. I ___ eleven.",
  reponse:"Hello! My name is Yasmine. I am eleven."},

{semester:'S1', title:"School and classroom objects",
  essentiel:"On apprend le vocabulaire de la classe et les mots pour montrer un objet proche ou éloigné.",
  cours:"a book (un livre), a pen (un stylo), a ruler (une règle), a bag (un sac)\nThis is a book. (C'est un livre, près de moi.)\nThat is a bag. (C'est un sac, plus loin.)\nThese are pens. (Ce sont des stylos.)",
  piege:"Ne pas mettre « a » devant un pluriel : on dit « pens », pas « a pens ».",
  astuce:"This/these = près ; that/those = loin. « These » finit comme « trees » : il y en a plusieurs.",
  exercice:"Choose the correct word: ___ are my books. (This / These)",
  reponse:"These are my books."},

{semester:'S1', title:"My family",
  essentiel:"Pour parler de sa famille, on emploie les possessifs my, your, his et her, puis le verbe have got.",
  cours:"mother (mère), father (père), sister (sœur), brother (frère)\nThis is my sister. (Voici ma sœur.)\nI have got one brother. (J'ai un frère.)\nShe has got a baby. (Elle a un bébé.)",
  piege:"Avec he, she ou un seul nom, utiliser « has got », pas « have got ».",
  astuce:"He = garçon ; she = fille. His = à lui ; her = à elle.",
  exercice:"Complete: Lina ___ got two sisters.",
  reponse:"Lina has got two sisters."},

{semester:'S1', title:"My house",
  essentiel:"On nomme les pièces de la maison et on dit ce qui existe avec there is ou there are.",
  cours:"kitchen (cuisine), bedroom (chambre), bathroom (salle de bains), living room (salon)\nThere is a bed in my bedroom. (Il y a un lit dans ma chambre.)\nThere are two windows in the house. (Il y a deux fenêtres dans la maison.)\nThe cat is under the table. (Le chat est sous la table.)",
  piege:"« There is » est pour une chose ; « there are » est pour plusieurs choses.",
  astuce:"Is est court, pour un seul objet ; are contient un « r » comme « several » : plusieurs objets.",
  exercice:"Complete: There ___ three chairs in the kitchen.",
  reponse:"There are three chairs in the kitchen."},

{semester:'S1', title:"Clothes and colours",
  essentiel:"On décrit les vêtements avec une couleur et on utilise le présent continu pour dire ce qu'une personne porte maintenant.",
  cours:"T-shirt, trousers, dress, shoes, jacket\nred (rouge), blue (bleu), green (vert), black (noir)\nHe is wearing a blue T-shirt. (Il porte un T-shirt bleu.)\nShe is wearing black shoes. (Elle porte des chaussures noires.)",
  piege:"Ne pas oublier « is » dans « She is wearing ». « She wearing » est incomplet.",
  astuce:"Pour décrire un vêtement : couleur + vêtement, par exemple « a red dress ».",
  exercice:"Put the words in order: wearing / is / a green jacket / He.",
  reponse:"He is wearing a green jacket."},

{semester:'S2', title:"Food and drinks",
  essentiel:"On exprime ce que l'on aime et ce que l'on a avec like, have got, some et any.",
  cours:"bread (pain), cheese (fromage), apple (pomme), water (eau), milk (lait)\nI like apples. (J'aime les pommes.)\nWe have got some milk. (Nous avons du lait.)\nHave you got any water? (As-tu de l'eau ?)",
  piege:"Après « Do you like », le mot est souvent au pluriel : « Do you like apples? ».",
  astuce:"Some est souvent dans une phrase affirmative ; any est fréquent dans une question ou une phrase négative.",
  exercice:"Complete: Have you got ___ juice? Yes, I have got some juice.",
  reponse:"Have you got any juice? Yes, I have got some juice."},

{semester:'S2', title:"Transport and getting around",
  essentiel:"On nomme les moyens de transport et on dit comment on se déplace avec by.",
  cours:"bus, car, train, bike, taxi, on foot (à pied)\nI go to school by bus. (Je vais à l'école en bus.)\nThey go by train. (Ils vont en train.)\nI walk to school. (Je vais à l'école à pied.)",
  piege:"On dit « by bus », sans « the » ni « a » : pas « by the bus ».",
  astuce:"Pour un véhicule, pense à « by » : by car, by train, by bike. À pied : « on foot ».",
  exercice:"Complete: My father goes to work ___ car.",
  reponse:"My father goes to work by car."},

{semester:'S2', title:"Sports and abilities",
  essentiel:"Can sert à dire ce que l'on sait faire ; can't sert à dire ce que l'on ne sait pas faire.",
  cours:"football, swimming, tennis, cycling, basketball\nI can swim. (Je sais nager.)\nShe can play tennis. (Elle sait jouer au tennis.)\nHe can't ride a bike. (Il ne sait pas faire du vélo.)",
  piege:"Après can, le verbe reste simple : « can swim », pas « can to swim » ni « can swims ».",
  astuce:"Can est le même avec I, you, he et she : il ne change jamais.",
  exercice:"Complete: My friend ___ play football, but he can't swim.",
  reponse:"My friend can play football, but he can't swim."},

{semester:'S2', title:"Free time and routines",
  essentiel:"Le présent simple sert à parler des habitudes ; les adverbes de fréquence disent à quelle fréquence on fait une action.",
  cours:"read, play games, watch TV, listen to music, draw\nI play games after school. (Je joue après l'école.)\nShe always reads at night. (Elle lit toujours le soir.)\nWe sometimes watch TV. (Nous regardons parfois la télévision.)",
  piege:"Avec he ou she, on ajoute souvent -s : « She reads », pas « She read ».",
  astuce:"Always = toujours ; usually = d'habitude ; sometimes = parfois ; never = jamais.",
  exercice:"Complete: Adam ___ (play) basketball on Saturday.",
  reponse:"Adam plays basketball on Saturday."},

{semester:'S2', title:"Health and feeling well",
  essentiel:"Pour parler d'un problème de santé simple, on dit « I have got... » et on peut donner un conseil avec should.",
  cours:"a headache (mal à la tête), a stomach ache (mal au ventre), a cold (un rhume), tired (fatigué(e))\nI have got a headache. (J'ai mal à la tête.)\nYou should drink water. (Tu devrais boire de l'eau.)\nYou should rest. (Tu devrais te reposer.)",
  piege:"Ne pas dire « I am a headache » : le mal est une chose que l'on « has got ».",
  astuce:"Should donne un conseil doux : « You should... » = « Tu devrais... ».",
  exercice:"Complete: I am tired. You ___ rest.",
  reponse:"I am tired. You should rest."}

  info: [
{semester:'S1', title:"Information et informatique",
  essentiel:"Une information a du sens pour une personne. L'informatique permet de saisir, traiter, stocker et présenter des informations avec des appareils numériques.",
  cours:"Une information peut être un texte, une image, un son ou un nombre.\nExemple : « La température est 25 °C » est une information. L'ordinateur reçoit des données, les traite et affiche un résultat.",
  piege:"Confondre une information avec l'ordinateur : l'ordinateur est un outil ; l'information est ce qu'il traite.",
  astuce:"Retiens le chemin : entrée → traitement → sortie. On donne, l'ordinateur travaille, il montre un résultat.",
  exercice:"Dans « une photo de classe », quel type d'information est utilisé ?",
  reponse:"C'est une information sous forme d'image."},

{semester:'S1', title:"Le système informatique",
  essentiel:"Un système informatique réunit le matériel, que l'on peut toucher, et les logiciels, qui sont des programmes.",
  cours:"Le matériel comprend par exemple l'écran, le clavier et l'unité centrale. Un logiciel est un programme, par exemple LibreOffice Writer ou un navigateur web.\nSans logiciel, le matériel ne sait pas quelles actions effectuer.",
  piege:"Dire que l'écran est un logiciel : l'écran est un objet matériel.",
  astuce:"Hardware = partie dure que l'on touche ; software = programmes que l'on ouvre à l'écran.",
  exercice:"Classe ces éléments : clavier, LibreOffice Writer, souris, navigateur web.",
  reponse:"Matériel : clavier, souris. Logiciels : LibreOffice Writer, navigateur web."},

{semester:'S1', title:"Périphériques : entrée, sortie et stockage",
  essentiel:"Les périphériques permettent d'envoyer des informations à l'ordinateur, de recevoir un résultat ou de conserver des fichiers.",
  cours:"Entrée : clavier, souris, micro, scanner. Sortie : écran, imprimante, haut-parleurs. Stockage : disque, clé USB, carte mémoire.\nExemple : le micro envoie ta voix ; les haut-parleurs diffusent le son.",
  piege:"Penser que l'imprimante est un périphérique d'entrée : elle reçoit le résultat et l'imprime, donc c'est une sortie.",
  astuce:"Entrée = l'information entre ; sortie = le résultat sort.",
  exercice:"Le scanner est-il un périphérique d'entrée ou de sortie ?",
  reponse:"Le scanner est un périphérique d'entrée : il envoie une image ou un document à l'ordinateur."},

{semester:'S1', title:"Système d'exploitation et interface graphique",
  essentiel:"Le système d'exploitation est le logiciel principal qui permet d'utiliser l'ordinateur. Son interface graphique montre un bureau, des fenêtres, des icônes et des menus.",
  cours:"Windows, Linux ou ChromeOS sont des systèmes d'exploitation. Le bureau est l'écran de travail ; une icône ouvre un programme, un fichier ou un dossier.\nOn peut déplacer, réduire ou fermer une fenêtre avec la souris.",
  piege:"Fermer une fenêtre sans enregistrer son travail : le document peut être perdu.",
  astuce:"Avant de cliquer sur la croix de fermeture, vérifie que le document est enregistré.",
  exercice:"Comment appelle-t-on le petit dessin cliquable qui ouvre un programme ou un dossier ?",
  reponse:"C'est une icône."},

{semester:'S1', title:"Fichiers, dossiers et extensions",
  essentiel:"Un fichier contient des informations enregistrées ; un dossier sert à ranger des fichiers et d'autres dossiers.",
  cours:"Exemple d'organisation : 1AC / Informatique / Mon_texte.odt.\nL'extension est la fin du nom : .odt pour un texte Writer, .pdf pour un document à lire, .jpg ou .png pour une image, .mp3 pour un son.\nUn nom clair aide à retrouver son travail : expose_animaux.odt.",
  piege:"Changer seulement le nom ou l'extension d'un fichier ne le transforme pas vraiment dans un autre format.",
  astuce:"Dossier = cartable ; fichier = feuille rangée dans le cartable.",
  exercice:"Dans « vacances.jpg », quelle est l'extension et quel type de fichier indique-t-elle ?",
  reponse:"L'extension est .jpg ; elle indique généralement un fichier image."},

{semester:'S2', title:"Images, sons et documents multimédias",
  essentiel:"Un document multimédia peut mélanger du texte, des images et des sons. Chaque type de fichier a une extension courante.",
  cours:"Une image peut être .jpg ou .png ; un son peut être .mp3 ; une vidéo peut être .mp4.\nAvant d'ajouter un fichier à un travail, vérifie qu'il est adapté au sujet et respecte le droit d'auteur.",
  piege:"Croire qu'une image trouvée en ligne est libre de copie parce qu'elle est facile à voir.",
  astuce:"Pour chaque image, pose-toi deux questions : est-elle utile ? puis-je l'utiliser en respectant sa source ?",
  exercice:"Associe « chanson.mp3 » à son type de document.",

{semester:'S2', title:"Traitement de texte : saisir et corriger",

  arabe: [
{semester:"S1", title:"الميزان الصرفي",
    essentiel:"الميزان الصرفي طريقة لمعرفة حروف الكلمة الأصلية والزائدة. حروف الميزان هي فاء وعين ولام.",
    cours:"نقابل حروف الفعل الثلاثي بـ ف ع ل. مثال: كتب على وزن فعل، ودرس على وزن فعل.\nإذا زادت حروف في الكلمة نُبقيها في الميزان: كاتب على وزن فاعل، ومكتوب على وزن مفعول.",

    reponse:"لاعب على وزن فاعل، ومكتبة على وزن مفعلة."},

  {semester:"S1", title:"الفعل المجرد والفعل المزيد",

    piege:"الظن أن كل فعل طويل مجرد، أو حذف حرف أصلي عند البحث عن الجذر.",

  {semester:"S1", title:"الفعل الصحيح والفعل المعتل",

    cours:"كتب وفتح فعلان صحيحان. وعد فعل معتل المثال لأن أوله واو، وقال فعل معتل أجوف لأن وسطه ألف أصلها واو، وسعى فعل معتل ناقص لأن آخره ألف أصلها ياء.\nحروف العلة هي الواو والياء والألف.",
    piege:"عد الألف دائما حرفا مستقلا من الأصل دون الانتباه إلى أنها قد تنقلب عن واو أو ياء.",

    reponse:"وعد فعل معتل مثال، وكتب فعل صحيح، وباع فعل معتل أجوف، ودعا فعل معتل ناقص."},

  {semester:"S1", title:"تصريف الفعل: الماضي والمضارع والأمر",
    essentiel:"الفعل الماضي يدل على حدث وقع، والمضارع يدل على حدث يقع أو سيقع، والأمر يطلب القيام بالفعل.",

  {semester:"S1", title:"الإعراب والبناء",

  {semester:"S1", title:"النكرة والمعرفة",

  {semester:"S2", title:"الضمائر وأسماء الإشارة والأسماء الموصولة",

  {semester:"S2", title:"المبتدأ والخبر",

let state = { tasks: [], resources: {}, moods: {}, mode: 'eleve', view: 'today', subjectFilter:'all', openSubjectEleve:null, openChapterId:null, parentResourceSubject: SUBJECTS[0].key, editingChapterId:null,
  apiKey:null, genSubject: SUBJECTS[0].key, genChapterId:null, genDifficulty:'moyen', genResult:null, genError:null, genLoading:false,
  passwords:null, authenticated:false, authTarget:null, authError:null, pwSaveMsg:null };

function subj(key){ return SUBJECTS.find(s=>s.key===key) || {label:key,color:'#999'}; }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDateLong(iso){ const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}); }
function fmtDayShort(iso){ const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('fr-FR', {weekday:'short', day:'numeric'}); }
function weekDates(){
  const d = new Date(); const day = (d.getDay()+6)%7;
  const monday = new Date(d); monday.setDate(d.getDate()-day);
  const out=[]; for(let i=0;i<7;i++){ const x=new Date(monday); x.setDate(monday.getDate()+i); out.push(x.toISOString().slice(0,10)); }
  return out;
}
function uid(){ return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function chaptersFor(key){ return Array.isArray(state.resources[key]) ? state.resources[key] : []; }

/* ---------- Stockage : compatible avec l'environnement Claude (window.storage) ----------
   ET avec un navigateur normal / GitHub Pages (localStorage), pour que les données
   soient VRAIMENT conservées sur l'appareil d'une fois à l'autre. */
const LS_PREFIX = 'mon-cahier-1ac:';
async function storageGet(key){
  if(window.storage && typeof window.storage.get === 'function'){
    try{ const r = await window.storage.get(key); if(r && r.value!=null) return r.value; }catch(e){}
  }
  try{ return localStorage.getItem(LS_PREFIX+key); }catch(e){ return null; }
}
async function storageSet(key, value){
  let okViaShim = false;
  if(window.storage && typeof window.storage.set === 'function'){
    try{ await window.storage.set(key, value); okViaShim = true; }catch(e){}
  }
  try{ localStorage.setItem(LS_PREFIX+key, value); }catch(e){ if(!okViaShim) console.error(e); }
}

async function loadState(){
  try{ const v = await storageGet('tasks'); state.tasks = v ? JSON.parse(v) : []; }catch(e){ state.tasks = []; }
  try{ const v = await storageGet('resources'); state.resources = v ? JSON.parse(v) : {}; }catch(e){ state.resources = {}; }
  try{ const v = await storageGet('moods'); state.moods = v ? JSON.parse(v) : {}; }catch(e){ state.moods = {}; }
  try{ const v = await storageGet('apiKey'); state.apiKey = v || null; }catch(e){ state.apiKey = null; }
  try{ const v = await storageGet('passwords'); state.passwords = v ? JSON.parse(v) : null; }catch(e){ state.passwords = null; }
}
async function savePasswords(){ try{ await storageSet('passwords', JSON.stringify(state.passwords)); }catch(e){ console.error(e); } }
async function saveTasks(){ try{ await storageSet('tasks', JSON.stringify(state.tasks)); }catch(e){ console.error(e); } }
async function saveResources(){ try{ await storageSet('resources', JSON.stringify(state.resources)); }catch(e){ console.error(e); } }
async function saveMoods(){ try{ await storageSet('moods', JSON.stringify(state.moods)); }catch(e){ console.error(e); } }

function renderPage(){
  const page = document.getElementById('page');
  if(!page) return;
  if(state.mode==='eleve'){
    if(state.view==='today') page.innerHTML = viewToday();
    else if(state.view==='week') page.innerHTML = viewWeek();
    else page.innerHTML = viewSubjectsEleve();
  } else {
    if(state.view==='add') page.innerHTML = viewAdd();
    else if(state.view==='tasks') page.innerHTML = viewAllTasks();
    else if(state.view==='resources') page.innerHTML = viewResourcesParent();
    else page.innerHTML = viewGenerate();
  }
  bindPageEvents();
}

/* ---------- ÉLÈVE : Aujourd'hui ---------- */
function viewToday(){
  const iso = todayISO();
  const tasks = state.tasks.filter(t=>t.date===iso).sort((a,b)=> (a.done?1:0)-(b.done?1:0));
  const next = tasks.find(t=>!t.done);
  const mood = state.moods[iso];
  let html = `<h2 class="section-title">Aujourd'hui, ${fmtDateLong(iso)}</h2>`;
  if(next){
    html += `<div class="card next-card"><div class="eyebrow">Prochaine étape</div>
      <div class="task-title">${esc(next.title)}</div>
      <div class="task-sub">${esc(subj(next.subject).label)} ${next.minutes?`· ${next.minutes} min`:''}</div></div>`;
  }
  if(tasks.length===0){
    html += `<div class="empty"><span class="hand">Rien de prévu aujourd'hui !</span>Demande à un parent d'ajouter une tâche si besoin.</div>`;
  } else { html += tasks.map(t=>taskRow(t)).join(''); }
  html += `<div class="mood-row"><span class="muted" style="margin:0;">Ma journée :</span>
    ${MOODS.map(m=>`<button class="mood-btn ${mood===m?'selected':''}" data-mood="${m}">${m}</button>`).join('')}</div>`;
  return html;
}
function taskRow(t){
  const s = subj(t.subject);
  return `<div class="task-row ${t.done?'done':''}" data-id="${t.id}">
    <button class="checkbox ${t.done?'checked':''}" data-action="toggle" data-id="${t.id}">${t.done?'✓':''}</button>
    <span class="dot" style="background:${s.color}"></span>
    <div class="task-main"><div class="task-title">${esc(t.title)}</div>
      <div class="task-sub">${esc(s.label)}${t.desc? ' · '+esc(t.desc): ''}</div></div>
    ${t.minutes?`<span class="chip">${t.minutes} min</span>`:''}
    <span class="chip" style="background:${s.color}22;color:${s.color}">${typeLabel(t.type)}</span></div>`;
}
function typeLabel(k){ return (TYPES.find(x=>x.key===k)||{label:k}).label; }

/* ---------- ÉLÈVE : Semaine ---------- */
function viewWeek(){
  const dates = weekDates(); const iso = todayISO();
  let html = `<h2 class="section-title">Cette semaine</h2><p class="muted">Vue d'ensemble, du lundi au dimanche.</p><div class="week-grid">`;
  for(const d of dates){
    const dayTasks = state.tasks.filter(t=>t.date===d);
    html += `<div class="day-col"><div class="day-head ${d===iso?'today':''}">${fmtDayShort(d)}</div>
      ${dayTasks.length===0 ? `<div style="font-size:12px;color:var(--ink-soft);">—</div>` :
        dayTasks.map(t=>`<div class="mini-task ${t.done?'done':''}">${esc(t.title)}</div>`).join('')}</div>`;
  }
  return html + `</div>`;
}

/* ---------- ÉLÈVE : Mes matières ---------- */
function viewSubjectsEleve(){
  let html = `<h2 class="section-title">Mes matières</h2><p class="muted">Clique sur une matière pour voir les fiches de cours.</p>`;
  html += `<div class="subject-grid">` + SUBJECTS.map(s=>{
    const n = chaptersFor(s.key).length;
    return `<button class="subject-card ${state.openSubjectEleve===s.key?'active-subject':''}" style="background:${s.color}" data-subject="${s.key}">
      <div class="subject-name">${esc(s.label)}</div>
      <div class="subject-hint">${n ? n+' fiche'+(n>1?'s':'')+' de cours' : 'Pas encore de fiches'}</div>
    </button>`;
  }).join('') + `</div><div id="subject-detail">${state.openSubjectEleve ? subjectDetailHTML(state.openSubjectEleve) : ''}</div>`;
  return html;
}
function subjectDetailHTML(key){
  const s = subj(key); const chapters = chaptersFor(key);
  if(chapters.length===0){
    return `<div class="empty" style="margin-top:16px;"><span class="hand">Pas encore de fiches pour ${esc(s.label)}</span>Un parent peut en ajouter depuis l'espace Parent.</div>`;
  }
  const s1 = chapters.filter(c=>c.semester!=='S2');
  const s2 = chapters.filter(c=>c.semester==='S2');
  const groupHTML = (label, list) => list.length===0 ? '' : `
    <div class="sommaire-group-label">${label}</div>
    <div class="sommaire-list">` + list.map(c=>sommaireRowHTML(c,s)).join('') + `</div>`;
  return `<div class="sommaire" style="margin-top:16px;">` + groupHTML('Semestre 1', s1) + groupHTML('Semestre 2', s2) + `</div>`;
}
function sommaireRowHTML(c,s){
  const isOpen = state.openChapterId === c.id;
  return `<div class="sommaire-item ${isOpen?'open':''}">
    <button class="sommaire-row" data-chapter-toggle="${c.id}">
      <span class="sommaire-dot" style="background:${s.color}"></span>
      <span class="sommaire-title">${esc(c.title)}</span>
      <span class="sommaire-chevron">${isOpen?'▲':'▼'}</span>
    </button>
    ${isOpen ? `<div class="sommaire-content">${chapterCardHTML(c,s,true)}</div>` : ''}
  </div>`;
}
function chapterCardHTML(c,s,compact){
  const head = compact ? '' : `<div class="chapter-head" style="background:${s.color}">
      <div class="chapter-eyebrow">${esc(s.label)} · Semestre ${c.semester==='S2'?'2':'1'}</div>
      <div class="chapter-title">${esc(c.title)}</div>
    </div>`;
  return `<div class="chapter-card ${compact?'compact':''}">
    ${head}
    <div class="chapter-body">
      ${c.essentiel? `<div class="chapter-essentiel">🎯 ${esc(c.essentiel)}</div>`:''}
      ${c.cours? `<div class="chapter-section"><div class="chapter-section-label">📖 Le cours</div><div class="chapter-text">${esc(c.cours)}</div></div>`:''}
      ${c.piege? `<div class="chapter-section box-piege"><div class="chapter-section-label">⚠️ Piège fréquent</div><div class="chapter-text">${esc(c.piege)}</div></div>`:''}
      ${c.astuce? `<div class="chapter-section box-astuce"><div class="chapter-section-label">🧠 Astuce</div><div class="chapter-text">${esc(c.astuce)}</div></div>`:''}
      ${c.exercice? `<div class="chapter-section box-exercice">
          <div class="chapter-section-label">✍️ À toi de jouer</div>
          <div class="chapter-text">${esc(c.exercice)}</div>
          ${c.reponse? `<button class="btn-small reveal-btn" data-reveal="${c.id}">Voir la réponse</button>
          <div class="reveal-answer" id="answer-${c.id}">${esc(c.reponse)}</div>`:''}
        </div>`:''}
    </div>
  </div>`;
}
