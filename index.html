<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Cahier — 1AC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F4EC;
    --ink:#26313C;
    --ink-soft:#5A6672;
    --marge:#C0392B;
    --seyes:#A9C6E8;
    --chalkboard:#2F5233;
    --chalkboard-dark:#22402A;
    --chalk-white:#F4F1E8;
    --gold:#D4A72C;
    --line:#E3DFD1;
    --card:#FFFFFF;
    --radius:14px;
    --shadow: 0 2px 10px rgba(38,49,60,0.08);
    --essentiel:#2F6E8C;
    --essentiel-bg:#EAF4F8;
    --piege:#B5482B;
    --piege-bg:#FDEEE8;
    --astuce:#9C7A17;
    --astuce-bg:#FBF4DE;
    --exercice:#3F4A56;
    --exercice-bg:#F1F3F0;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Nunito', sans-serif; color:var(--ink); background:var(--paper); min-height:100vh; }
  .hand{ font-family:'Caveat', cursive; }

  .topbar{
    background: linear-gradient(180deg, var(--chalkboard), var(--chalkboard-dark));
    color: var(--chalk-white); padding: 16px 20px; display:flex; align-items:center;
    justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .title{ font-family:'Caveat', cursive; font-size:32px; font-weight:700; }
  .brand .subtitle{ font-size:13px; opacity:0.75; letter-spacing:1px; text-transform:uppercase; }
  .mode-switch{ display:flex; background:rgba(255,255,255,0.12); border-radius:999px; padding:4px; gap:2px; }
  .mode-btn{
    border:none; background:transparent; color:var(--chalk-white); opacity:0.75; padding:8px 16px;
    border-radius:999px; font-family:'Nunito'; font-weight:700; font-size:14px; cursor:pointer; transition:.15s;
  }
  .mode-btn.active{ background:var(--chalk-white); color:var(--chalkboard-dark); opacity:1; }
  .mode-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .tabs{ display:flex; gap:6px; padding:14px 20px 0; flex-wrap:wrap; }
  .tab{
    border:1px solid var(--line); border-bottom:none; background:var(--card); color:var(--ink-soft);
    font-family:'Nunito'; font-weight:700; padding:10px 18px; border-radius:12px 12px 0 0; cursor:pointer; font-size:14px;
  }
  .tab.active{ color:var(--chalkboard); background:var(--paper); position:relative; top:1px; }
  .tab:focus-visible{ outline:2px solid var(--chalkboard); outline-offset:2px; }

  .page{
    background: repeating-linear-gradient(var(--paper) 0 27px, var(--seyes) 27px 28px), var(--paper);
    background-position: 0 4px; border-top:1px solid var(--line); min-height: 70vh; padding: 28px 28px 60px 64px; position:relative;
  }
  .page::before{ content:""; position:absolute; top:0; bottom:0; left:44px; width:2px; background:var(--marge); opacity:0.55; }
  @media (max-width:640px){ .page{ padding:22px 16px 50px 40px; } .page::before{ left:26px; } }

  h2.section-title{ font-family:'Caveat', cursive; font-size:30px; margin:0 0 4px; color:var(--chalkboard-dark); font-weight:700; }
  .muted{ color:var(--ink-soft); font-size:14px; margin:0 0 18px; }

  .card{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:12px; }
  .next-card{ border:2px dashed var(--gold); background:#FFFCF2; }
  .next-card .eyebrow{ font-weight:800; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--gold); margin-bottom:4px;}

  .task-row{
    display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--card);
    border-radius:12px; box-shadow:var(--shadow); margin-bottom:8px;
  }
  .task-row.done{ opacity:0.55; }
  .task-row.done .task-title{ text-decoration: line-through; }
  .dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .task-main{ flex:1; min-width:0; }
  .task-title{ font-weight:700; font-size:15px; }
  .task-sub{ font-size:12.5px; color:var(--ink-soft); }
  .chip{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--paper); color:var(--ink-soft); white-space:nowrap; }
  .checkbox{
    width:26px; height:26px; border-radius:8px; border:2px solid var(--line); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; background:#fff;
  }
  .checkbox.checked{ background:var(--chalkboard); border-color:var(--chalkboard); color:#fff; font-weight:900; }

  .subject-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; }
  .subject-card{ border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; cursor:pointer; color:#fff; border:none; text-align:left; font-family:'Nunito'; }
  .subject-card .subject-name{ font-weight:800; font-size:16px; }
  .subject-card .subject-hint{ font-size:12px; opacity:0.9; margin-top:4px; }
  .subject-card.active-subject{ outline:3px solid var(--chalkboard-dark); outline-offset:2px; }

  .empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); }
  .empty .hand{ font-size:26px; display:block; margin-bottom:6px; color:var(--chalkboard-dark); }

  .mood-row{ display:flex; gap:10px; margin-top:22px; align-items:center; }
  .mood-btn{ font-size:26px; background:#fff; border:2px solid var(--line); border-radius:50%; width:52px; height:52px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .mood-btn.selected{ border-color:var(--marge); box-shadow:0 0 0 3px rgba(192,57,43,0.15); }

  .week-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:12px; }
  @media (max-width:900px){ .week-grid{ grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .week-grid{ grid-template-columns:1fr; } }
  .day-col{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:12px; min-height:130px; display:flex; flex-direction:column; }
  .day-col.today-col{ outline:2.5px solid var(--marge); outline-offset:1px; }
  .day-head{ display:flex; align-items:center; justify-content:space-between; font-weight:800; font-size:14px; margin-bottom:8px; color:var(--chalkboard-dark); text-transform:capitalize;}
  .day-head.today{ color:var(--marge); }
  .day-count{ font-size:11px; font-weight:800; background:var(--paper); color:var(--ink-soft); border-radius:999px; padding:2px 8px; }
  .day-head.today .day-count{ background:var(--marge); color:#fff; }
  .week-empty{ font-size:12.5px; color:var(--ink-soft); font-style:italic; padding:10px 2px; }
  .mini-task{
    display:flex; align-items:center; gap:8px; font-size:12.5px; padding:8px 9px; border-radius:9px; margin-bottom:6px;
    background:var(--paper); border-left:4px solid var(--line); cursor:pointer; transition:transform .1s, box-shadow .1s;
  }
  .mini-task:hover{ box-shadow:0 2px 6px rgba(0,0,0,0.12); transform:translateY(-1px); }
  .mini-task:active{ transform:translateY(0); }
  .mini-task-check{
    width:18px; height:18px; border-radius:6px; border:2px solid var(--line); background:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:900; color:#fff;
  }
  .mini-task.done .mini-task-check{ background:var(--chalkboard); border-color:var(--chalkboard); }
  .mini-task-body{ flex:1; min-width:0; }
  .mini-task-title{ font-weight:700; line-height:1.25; word-break:break-word; }
  .mini-task.done .mini-task-title{ opacity:.55; text-decoration:line-through; }
  .mini-task-sub{ font-size:10.5px; color:var(--ink-soft); margin-top:1px; }

  label{ display:block; font-weight:700; font-size:13px; margin:14px 0 6px; }
  input, select, textarea{ width:100%; font-family:'Nunito'; font-size:14px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:#fff; color:var(--ink); }
  textarea{ min-height:80px; resize:vertical; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  @media (max-width:640px){ .form-grid{ grid-template-columns:1fr; } }
  .btn{ font-family:'Nunito'; font-weight:800; font-size:14px; padding:11px 20px; border-radius:10px; border:none; cursor:pointer; }
  .btn-primary{ background:var(--chalkboard); color:#fff; margin-top:18px; }
  .btn-primary:hover{ background:var(--chalkboard-dark); }
  .btn-secondary{ background:var(--gold); color:#3a2c05; margin-top:10px; }
  .btn-ghost{ background:transparent; color:var(--marge); text-decoration:underline; font-weight:700; padding:6px; }
  .btn-small{ background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:6px 12px; font-weight:700; font-size:12.5px; cursor:pointer; }
  .btn-danger{ background:#fff; color:var(--marge); border:1.5px solid var(--marge); padding:6px 12px; border-radius:8px; font-weight:700; font-size:12.5px; cursor:pointer; }

  .filters{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  select.filter-select{ width:auto; }

  .loading{ padding:60px 20px; text-align:center; color:var(--ink-soft); font-family:'Caveat'; font-size:22px; }
  footer.foot{ text-align:center; padding:18px; font-size:12px; color:var(--ink-soft); }

  /* ---- Chapter cards (subject resources) ---- */
  .chapter-list{ display:flex; flex-direction:column; gap:16px; margin-top:16px; }
  .chapter-card{ background:var(--card); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
  .chapter-card.compact{ box-shadow:none; border-radius:0; }

  /* ---- Sommaire (index cliquable des chapitres) ---- */
  .sommaire-group-label{ font-family:'Caveat', cursive; font-size:19px; font-weight:700; color:var(--ink-soft); margin:14px 0 6px; }
  .sommaire-group-label:first-child{ margin-top:0; }
  .sommaire-list{ display:flex; flex-direction:column; gap:8px; }
  .sommaire-item{ background:var(--card); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
  .sommaire-row{
    width:100%; display:flex; align-items:center; gap:10px; padding:12px 14px; border:none; background:transparent;
    cursor:pointer; font-family:'Nunito'; text-align:left;
  }
  .sommaire-item.open .sommaire-row{ background:var(--paper); }
  .sommaire-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .sommaire-title{ flex:1; font-weight:700; font-size:14.5px; color:var(--ink); }
  .sommaire-chevron{ color:var(--ink-soft); font-size:12px; flex-shrink:0; }
  .sommaire-content{ border-top:1px solid var(--line); }
  .chapter-head{ padding:14px 18px; color:#fff; }
  .chapter-eyebrow{ font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; opacity:0.85; }
  .chapter-title{ font-family:'Caveat', cursive; font-size:26px; font-weight:700; line-height:1.1; }
  .chapter-body{ padding:16px 18px 18px; }
  .chapter-essentiel{ background:var(--essentiel-bg); color:var(--essentiel); border-left:4px solid var(--essentiel); border-radius:8px; padding:10px 12px; font-weight:700; font-size:14px; margin-bottom:14px; }
  .chapter-section{ margin-bottom:14px; }
  .chapter-section-label{ font-weight:800; font-size:12.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); margin-bottom:5px; }
  .chapter-text{ font-size:14.5px; line-height:1.65; white-space:pre-wrap; }
  .box-piege{ background:var(--piege-bg); border-left:4px solid var(--piege); border-radius:8px; padding:10px 12px; }
  .box-piege .chapter-section-label{ color:var(--piege); }
  .box-astuce{ background:var(--astuce-bg); border-left:4px solid var(--astuce); border-radius:8px; padding:10px 12px; }
  .box-astuce .chapter-section-label{ color:var(--astuce); }
  .box-exercice{ background:var(--exercice-bg); border-radius:8px; padding:12px; }
  .box-exercice .chapter-section-label{ color:var(--exercice); }
  .reveal-btn{ margin-top:8px; }
  .reveal-answer{ display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-weight:700; color:var(--chalkboard-dark); }
  .reveal-answer.shown{ display:block; }

  .subj-tag{ display:inline-block; font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; color:#fff; margin-right:6px;}
  .chapter-editor{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px; margin-bottom:18px; }
  .chapter-mini-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; }
  .chapter-mini-title{ font-weight:700; font-size:14px; }
  .chapter-mini-actions{ display:flex; gap:6px; }
  .seed-banner{ background:#EAF4F8; border:1.5px dashed var(--essentiel); border-radius:12px; padding:14px 16px; margin-bottom:16px; }
  .seed-banner p{ margin:0 0 10px; font-size:13.5px; color:var(--ink); }

  /* ---- Écran de connexion / mots de passe ---- */
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background: linear-gradient(180deg, var(--chalkboard), var(--chalkboard-dark)); }
  .auth-card{ background:var(--card); border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.25); padding:32px 28px; max-width:380px; width:100%; text-align:center; }
  .auth-card .title{ font-family:'Caveat', cursive; font-size:34px; color:var(--chalkboard-dark); margin:0 0 4px; }
  .auth-card .muted{ margin-bottom:22px; }
  .role-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px; }
  .role-btn{ border:2px solid var(--line); background:#fff; border-radius:14px; padding:20px 10px; cursor:pointer; font-family:'Nunito'; }
  .role-btn:hover{ border-color:var(--gold); }
  .role-emoji{ font-size:32px; display:block; margin-bottom:8px; }
  .role-label{ font-weight:800; font-size:14.5px; color:var(--ink); }
  .auth-error{ color:var(--marge); font-weight:700; font-size:13px; margin:10px 0 0; }
  .auth-back{ margin-top:14px; }
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loading">Ouverture du cahier…</div>
</div>

<script>
const SUBJECTS = [
  {key:'arabe',    label:'Arabe',                 color:'#E4572E'},
  {key:'islamique',label:'Éducation islamique',    color:'#2E7D5B'},
  {key:'francais', label:'Français',               color:'#3B6FB6'},
  {key:'anglais',  label:'Anglais',                color:'#8B5CF6'},
  {key:'maths',    label:'Mathématiques',          color:'#E8930F'},
  {key:'svt',      label:'SVT',                    color:'#159895'},
  {key:'pc',       label:'Physique-Chimie',        color:'#4B4E9E'},
  {key:'social',   label:'Sciences sociales',      color:'#A6702B'},
  {key:'info',     label:'Informatique',           color:'#D6449A'},
];

const DISCUSSION_FR = [
  {key:"presentation", label:"Se présenter en détail",
    dialogue:[
      {bot:"Présente-toi : ton nom, ton âge, et une chose qui te rend unique.", options:["Je m'appelle Salma, j'ai 11 ans, et je suis passionnée de dessin depuis toute petite.","Moi c'est Yasmine, 11 ans, et ce qui me rend unique, c'est que je parle trois langues."]},
      {bot:"Qu'est-ce qui te passionne le plus dans la vie, et pourquoi ?", options:["Ce qui me passionne le plus, c'est la lecture, car elle m'emmène dans d'autres mondes.","J'adore le sport, parce que ça me permet de me dépasser chaque jour."]},
      {bot:"Si tu devais te décrire en trois mots, lesquels choisirais-tu ?", options:["Je dirais curieuse, courageuse et un peu rêveuse.","Je choisirais joyeuse, déterminée et généreuse."]},
      {bot:"Merci pour cette belle présentation, j'ai l'impression de mieux te connaître !", options:["Merci à toi de m'avoir écoutée avec attention !","C'était un plaisir de me présenter ainsi !"]}
    ]
  },
  {key:"souvenir", label:"Raconter un souvenir",
    dialogue:[
      {bot:"Raconte-moi un souvenir qui t'a particulièrement marqué. Que s'est-il passé ?", options:["L'année dernière, je suis partie en voyage avec ma famille et j'ai découvert une ville magnifique.","Un jour, j'ai remporté un concours de dessin à l'école, et j'étais vraiment fière de moi."]},
      {bot:"Pourquoi ce moment était-il si spécial pour toi ?", options:["Parce que j'étais entourée des personnes que j'aime et que tout s'est très bien passé.","Parce que j'avais beaucoup travaillé pour y arriver, alors j'étais particulièrement heureuse."]},
      {bot:"Est-ce que tu as ressenti d'autres émotions ce jour-là ?", options:["Oui, j'étais aussi un peu nerveuse avant, mais tout s'est transformé en joie ensuite.","J'ai ressenti de la surprise, car je ne m'attendais pas du tout à ce résultat."]},
      {bot:"Merci d'avoir partagé ce souvenir, c'était vraiment intéressant à écouter !", options:["Merci de m'avoir écoutée avec autant d'attention !","Avec plaisir, j'aime beaucoup raconter cette histoire !"]}
    ]
  },
  {key:"description", label:"Décrire une personne ou un lieu",
    dialogue:[
      {bot:"Décris-moi une personne que tu admires. À quoi ressemble-t-elle et pourquoi l'admires-tu ?", options:["J'admire ma grand-mère : elle est petite, souriante, et toujours pleine de sagesse.","J'admire ma maîtresse, qui est patiente et qui explique toujours très clairement."]},
      {bot:"Peux-tu aussi me décrire un lieu que tu adores visiter ?", options:["J'adore la médina de ma ville, avec ses ruelles étroites et ses couleurs vives.","Mon endroit préféré est la plage, avec le sable doré et le bruit apaisant des vagues."]},
      {bot:"Qu'est-ce qui rend ce lieu si particulier selon toi ?", options:["C'est l'ambiance chaleureuse et les odeurs d'épices qui flottent partout.","C'est le calme et la beauté du paysage qui me font tout oublier."]},
      {bot:"Tes descriptions sont pleines de détails, bravo !", options:["Merci, j'aime beaucoup observer et décrire ce qui m'entoure.","Merci beaucoup, c'est un sujet que j'apprécie particulièrement."]}
    ]
  },
  {key:"avis_livre_film", label:"Donner son avis sur un livre ou un film",
    dialogue:[
      {bot:"Quel est le dernier livre ou film qui t'a plu ? Donne-moi ton avis.", options:["J'ai adoré le dernier film que j'ai vu, car l'histoire était pleine de rebondissements.","J'ai beaucoup aimé un roman d'aventure, parce que le personnage principal était très courageux."]},
      {bot:"Qu'est-ce qui t'a le plus plu dans cette histoire ?", options:["Ce qui m'a le plus plu, c'est la fin surprenante que je n'avais pas du tout imaginée.","J'ai surtout aimé l'amitié entre les personnages, qui rendait l'histoire touchante."]},
      {bot:"Y a-t-il quelque chose que tu changerais dans cette histoire ?", options:["Je pense que le début était un peu lent, j'aurais aimé que l'action commence plus vite.","Non, je trouve que tout était parfaitement équilibré du début à la fin."]},
      {bot:"Merci pour cette critique bien argumentée !", options:["Merci, j'aime beaucoup donner mon avis sur ce que je lis ou regarde.","C'est un plaisir de partager mes impressions avec toi !"]}
    ]
  },
  {key:"loisirs_passion", label:"Parler de ses loisirs et de sa passion",
    dialogue:[
      {bot:"Quelle activité pratiques-tu pendant ton temps libre, et depuis combien de temps ?", options:["Je fais de la natation depuis trois ans, et c'est devenu une vraie passion.","Je dessine depuis que je suis petite, presque tous les jours après l'école."]},
      {bot:"Qu'est-ce que cette activité t'apporte au quotidien ?", options:["Elle m'aide à me détendre après une journée fatigante à l'école.","Elle me permet d'exprimer mes idées et de laisser parler mon imagination."]},
      {bot:"As-tu un objectif ou un rêve lié à cette passion ?", options:["Oui, j'aimerais un jour participer à une compétition régionale.","J'aimerais exposer mes dessins dans une petite exposition à l'école."]},
      {bot:"C'est un très beau projet, je te souhaite de le réaliser !", options:["Merci beaucoup, je vais continuer à m'entraîner pour y arriver !","Merci, tes encouragements me donnent encore plus envie de progresser !"]}
    ]
  },
  {key:"raconter_histoire", label:"Raconter une histoire",
    dialogue:[
      {bot:"Invente le début d'une petite histoire : qui est le personnage principal, et où se trouve-t-il ?", options:["Il était une fois une jeune fille qui vivait dans un petit village au bord de la mer.","Il était une fois un garçon curieux qui explorait chaque jour la forêt près de chez lui."]},
      {bot:"Un jour, un événement inattendu se produit. Que se passe-t-il ?", options:["Un jour, elle a découvert une carte mystérieuse cachée dans un vieux livre.","Un jour, il a trouvé une petite porte cachée derrière un grand arbre."]},
      {bot:"Comment le personnage réagit-il face à cette découverte ?", options:["Elle a d'abord eu peur, puis elle a décidé de suivre la carte par curiosité.","Il a hésité un instant, puis il a rassemblé son courage pour ouvrir la porte."]},
      {bot:"Et comment se termine ton histoire ?", options:["Finalement, elle a découvert un trésor caché et elle l'a partagé avec tout le village.","Finalement, il a découvert un monde magique et il y est retourné chaque été."]}
    ]
  },
  {key:"debat_ecole", label:"Parler de l'école et débattre un sujet",
    dialogue:[

      astuce:"Trace deux flèches depuis le facteur devant la parenthèse vers chaque terme intérieur : chaque terme doit recevoir sa flèche. Pour factoriser, demande-toi : « quel nombre ou quelle lettre est présent dans tous les termes ? »",
      exercice:"1) Développe et réduis : A = 4(2x + 3) et B = −3(x − 5). 2) Factorise : C = 7x + 7×4 et D = 15x − 10. 3) Calcule A pour x = 2.",
      reponse:"1) A = 8x + 12 ; B = −3x + 15. 2) C = 7(x + 4) ; D = 5(3x − 2). 3) Pour x = 2 : A = 8 × 2 + 12 = 16 + 12 = 28 (on vérifie : 4 × (2×2 + 3) = 4 × 7 = 28)."},
    {semester:"S2",
      title:"Équations",
      essentiel:"Résoudre une équation du premier degré ax + b = 0, c'est trouver la valeur de l'inconnue x qui rend l'égalité vraie ; on garde l'équilibre en faisant la même opération des deux côtés.",
      cours:"Une équation du premier degré à une inconnue s'écrit ax + b = 0 ; si a ≠ 0, elle a une seule solution : x = −b/a. Pour la résoudre, on regroupe les termes en x d'un côté et les nombres de l'autre, puis on divise par le coefficient de x. Exemple : 3x + 5 = 20 donne 3x = 20 − 5 = 15, donc x = 15/3 = 5. On vérifie toujours en remplaçant : 3 × 5 + 5 = 20, c'est correct. Pour un problème, on suit cinq étapes : choisir l'inconnue, traduire l'énoncé par une égalité, écrire l'équation, la résoudre, puis répondre et vérifier. Si les coefficients sont des fractions, on multiplie tous les termes par un multiple commun des dénominateurs pour supprimer les dénominateurs.",
      piege:"Oublier de changer le signe quand on fait passer un terme de l'autre côté du signe égal : écrire 3x = 20 + 5. Autre piège : diviser un seul membre au lieu des deux.",
      astuce:"Pense à une balance : ce que tu fais à gauche, tu le fais à droite. « Un terme qui traverse le = change de signe ; un facteur qui traverse devient un diviseur. » Et vérifie toujours ta solution en la remplaçant dans l'équation.",
      exercice:"1) Résous : 5x − 7 = 13 et 2(x + 3) = 4x − 2. 2) Problème : Sara a x dirhams. Son frère en a le double. Ensemble ils ont 60 dirhams. Combien Sara a-t-elle ?",
      reponse:"1) 5x = 13 + 7 = 20 donc x = 4 (vérification : 5×4 − 7 = 13). Pour la deuxième : 2x + 6 = 4x − 2, donc 6 + 2 = 4x − 2x, soit 8 = 2x et x = 4. 2) x + 2x = 60, donc 3x = 60 et x = 20 : Sara a 20 dirhams et son frère 40 dirhams (20 + 40 = 60)."},
    {semester:"S2",
      title:"Symétrie centrale",
      essentiel:"Le symétrique M' d'un point M par rapport à un point O est tel que O soit le milieu de [MM'] : c'est un demi-tour autour de O.",
      cours:"Deux figures sont symétriques par rapport à un point O lorsqu'elles se superposent après un demi-tour autour de O ; O s'appelle le centre de symétrie. Pour construire M', on trace la demi-droite [MO), puis on reporte la même longueur : OM' = OM avec O entre M et M'. Par exemple si OM = 3 cm, alors OM' = 3 cm et MM' = 6 cm. La symétrie centrale conserve les longueurs (AB = A'B'), l'alignement des points, les mesures d'angles, le parallélisme et la perpendicularité. L'image d'une droite est une droite parallèle à celle de départ, l'image d'un segment est un segment de même longueur, et l'image d'un cercle est un cercle de même rayon dont le centre est le symétrique du centre.",
      piege:"Construire un symétrique par rapport à une droite (symétrie axiale, comme un miroir) au lieu d'un demi-tour autour d'un point : la figure obtenue est alors retournée au lieu d'être tournée de 180°.",
      astuce:"Symétrie centrale = « demi-tour » : la figure image est à l'envers, comme une photo tournée de 180°. Pour vérifier, le centre O doit toujours être exactement au MILIEU du segment qui relie un point et son image.",
      exercice:"Sur une feuille, place trois points A, B et O non alignés avec OA = 4 cm. 1) Construis A' et B', symétriques de A et B par rapport à O. 2) Que peut-on dire de AB et A'B' ? et des droites (AB) et (A'B') ? 3) Quelle est l'image du cercle de centre A et de rayon 2 cm ?",
      reponse:"1) A' est sur la demi-droite [AO) au-delà de O avec OA' = OA = 4 cm ; même construction pour B'. 2) AB = A'B' car la symétrie centrale conserve les longueurs, et (AB) ∥ (A'B') car l'image d'une droite est une droite parallèle. 3) C'est le cercle de centre A' (symétrique de A par rapport à O) et de même rayon 2 cm."},
    {semester:"S2",
      title:"Parallélogrammes et quadrilatères particuliers",
      essentiel:"Un parallélogramme est un quadrilatère dont les côtés opposés sont parallèles ; ses diagonales se coupent en leur milieu et il possède un centre de symétrie.",
      cours:"Si ABCD est un parallélogramme, alors (AB) ∥ (DC) et (AD) ∥ (BC). Ses propriétés : les côtés opposés ont la même longueur, les angles opposés ont la même mesure, et les diagonales [AC] et [BD] se coupent en leur milieu O, qui est son centre de symétrie. Les réciproques servent à démontrer : si les diagonales d'un quadrilatère se coupent en leur milieu, alors c'est un parallélogramme. Les quadrilatères particuliers sont des parallélogrammes avec un « bonus » : le rectangle a quatre angles droits et ses diagonales sont de même longueur ; le losange a quatre côtés égaux et ses diagonales sont perpendiculaires ; le carré possède les deux (quatre angles droits et quatre côtés égaux). Le trapèze, lui, a seulement deux côtés parallèles. Exemple : dans un parallélogramme où AB = 7 cm et BC = 4 cm, le périmètre vaut 2 × (7 + 4) = 22 cm.",
      piege:"Croire qu'un quadrilatère dont deux côtés seulement sont parallèles est un parallélogramme (c'est un trapèze), ou confondre losange et carré : un losange n'a pas forcément d'angles droits.",
      astuce:"Retiens l'« arbre de famille » : parallélogramme → (angles droits) rectangle, → (côtés égaux) losange, → les deux = carré. Pour les diagonales : rectangle = diagonales de MÊME LONGUEUR, losange = diagonales PERPENDICULAIRES, carré = les deux.",
      exercice:"ABCD est un parallélogramme de centre O, avec AB = 6 cm, AD = 3,5 cm et l'angle Â = 70°. 1) Donne DC et BC. 2) Calcule le périmètre. 3) Donne la mesure de l'angle Ĉ puis celle de B̂. 4) Si de plus AC = BD, quelle est la nature exacte de ABCD ?",
      reponse:"1) DC = AB = 6 cm et BC = AD = 3,5 cm (côtés opposés de même longueur). 2) P = 2 × (6 + 3,5) = 19 cm. 3) Ĉ = Â = 70° (angles opposés) et B̂ = 180° − 70° = 110°. 4) Un parallélogramme dont les diagonales ont la même longueur est un rectangle."},
    {semester:"S2",
      title:"Sécantes à deux droites parallèles et angles",
      essentiel:"Quand une sécante coupe deux droites parallèles, les angles alternes-internes sont égaux et les angles correspondants sont égaux.",
      cours:"Soit une droite (Δ) qui coupe (D1) en A et (D2) en B : elle forme quatre angles en A et quatre angles en B. Les angles situés entre les deux droites sont dits internes, les autres externes. On repère alors les paires d'angles alternes-internes (de part et d'autre de la sécante, entre les deux droites), alternes-externes et correspondants (du même côté de la sécante, l'un interne et l'autre externe, dans la même position). Propriété : si (D1) ∥ (D2), alors deux angles alternes-internes sont de même mesure, et deux angles correspondants aussi ; les angles internes situés du même côté sont supplémentaires (somme 180°). Exemple : si un angle vaut 65°, son alterne-interne vaut 65° et l'angle interne du même côté vaut 115°. Les réciproques sont utiles pour démontrer que deux droites sont parallèles.",
      piege:"Appliquer l'égalité des angles alternes-internes alors que les deux droites ne sont PAS parallèles : la propriété n'est vraie que si le parallélisme est donné ou démontré. Autre erreur : confondre angles alternes-internes et angles correspondants.",
      astuce:"Cherche les lettres dans la figure : les angles correspondants forment un « F » (même position), les alternes-internes forment un « Z » (en zigzag), et les internes du même côté forment un « U » (ils font 180°).",
      exercice:"(D1) ∥ (D2) et (Δ) est une sécante qui les coupe en A et B. Un des angles en A mesure 118°. Détermine : 1) la mesure de son angle correspondant en B ; 2) la mesure de son alterne-interne ; 3) la mesure de l'angle interne situé du même côté de la sécante.",
      reponse:"1) 118° (les angles correspondants sont de même mesure). 2) 118° (les angles alternes-internes sont de même mesure). 3) 180° − 118° = 62° (les angles internes du même côté sont supplémentaires)."},
    {semester:"S2",
      title:"Cercle, disque",
      essentiel:"Le cercle de centre O et de rayon r est l'ensemble des points situés à la distance r de O ; le disque, c'est le cercle ET tout l'intérieur.",
      cours:"Si OA = OB = OM = 4 cm, les points A, B et M appartiennent au cercle (C) de centre O et de rayon 4 cm ; on écrit A ∈ (C). Le segment [OM] est un rayon, le segment [AB] qui passe par O est un diamètre (d = 2r), et un segment comme [CD] qui joint deux points du cercle sans passer par le centre est une corde. Une portion de cercle entre deux points est un arc. Le périmètre du cercle se calcule par P = 2 × π × r = π × d et l'aire du disque par A = π × r × r, avec π ≈ 3,14. Exemple : pour r = 5 cm, P ≈ 2 × 3,14 × 5 = 31,4 cm et A ≈ 3,14 × 25 = 78,5 cm². Le centre O n'appartient pas au cercle mais il appartient au disque. Une tangente à un cercle est une droite qui ne coupe le cercle qu'en un seul point, appelé point de contact : si H est ce point de contact, alors le rayon [OH] est perpendiculaire à la tangente en H. Cette propriété permet de construire une tangente à un cercle en un point donné : il suffit de tracer la perpendiculaire au rayon en ce point.",
      piege:"Confondre les deux formules et calculer l'aire avec 2πr : on utilise 2πr pour le tour (en cm) et πr² pour la surface (en cm²). Erreur fréquente aussi : utiliser le diamètre dans la formule de l'aire au lieu du rayon. Autre erreur fréquente : tracer une tangente qui n'est pas perpendiculaire au rayon au point de contact, ou confondre tangente (un seul point commun) et corde/sécante (deux points communs).",
      astuce:"« Périmètre = 2πr (le tour, en cm) ; Aire = πr² (la surface, en cm² car il y a un carré) ». Si on te donne le diamètre, commence par le diviser par 2 pour avoir r.",
      exercice:"Un cercle (C) a pour centre O et pour diamètre 12 cm. 1) Donne son rayon. 2) Calcule son périmètre (π ≈ 3,14). 3) Calcule l'aire du disque correspondant. 4) Le point E vérifie OE = 5 cm : E appartient-il au cercle ? au disque ?",
      reponse:"1) r = 12 ÷ 2 = 6 cm. 2) P = 2 × 3,14 × 6 = 37,68 cm. 3) A = 3,14 × 6 × 6 = 113,04 cm². 4) Non, E n'appartient pas au cercle car OE = 5 ≠ 6 cm ; mais comme 5 < 6, E est à l'intérieur, donc il appartient au disque."},
    {semester:"S2",
      title:"Prisme droit et cylindre",
      essentiel:"Pour un prisme droit comme pour un cylindre droit, le volume se calcule en multipliant l'aire d'une base par la hauteur.",
      cours:"Un prisme droit est un solide limité par deux bases polygonales superposables et parallèles, et par des faces latérales rectangulaires perpendiculaires aux bases ; un cylindre de révolution a deux bases en forme de disque. L'aire latérale vaut périmètre d'une base × hauteur : pour un prisme de base triangulaire de côtés 3, 4 et 5 cm et de hauteur 2 cm, le périmètre de base est 12 cm et l'aire latérale 12 × 2 = 24 cm². Pour un cylindre, cela donne aire latérale = 2 × π × r × h. Le volume est V = aire de la base × hauteur : pour un prisme, V = A_base × h ; pour un cylindre, V = π × r × r × h. Exemple : un cylindre de rayon 3 cm et de hauteur 10 cm a un volume V ≈ 3,14 × 9 × 10 = 282,6 cm³. On sait aussi reconnaître et construire le patron de ces solides (deux bases + un grand rectangle). L'aire totale d'un solide est la somme de son aire latérale et de l'aire de ses deux bases : aire totale = aire latérale + 2 × aire d'une base. Par exemple, pour le prisme de base triangulaire (côtés 3, 4 et 5 cm, hauteur 2 cm, aire latérale 24 cm²) dont la base est un triangle rectangle d'aire (3 × 4) / 2 = 6 cm², l'aire totale vaut 24 + 2 × 6 = 36 cm².",
      piege:"Oublier de calculer d'abord l'aire de la base (surtout pour un triangle : (base × hauteur)/2) et multiplier directement des longueurs. Autre erreur : mélanger les unités, cm² pour une aire et cm³ pour un volume.",
      astuce:"Une seule phrase pour tous ces solides : « Volume = aire de la base × hauteur ». Et pour l'aire latérale, imagine qu'on déroule le solide : on obtient un rectangle de largeur « périmètre de la base » et de hauteur « hauteur du solide ».",
      exercice:"Un prisme droit a pour base un rectangle de 5 cm sur 3 cm et une hauteur de 8 cm. 1) Calcule l'aire de sa base. 2) Calcule son volume. 3) Calcule son aire latérale. 4) Un cylindre de rayon 2 cm et de hauteur 8 cm a-t-il un volume plus grand ou plus petit (π ≈ 3,14) ?",
      reponse:"1) A_base = 5 × 3 = 15 cm². 2) V = 15 × 8 = 120 cm³. 3) Périmètre de base = 2 × (5 + 3) = 16 cm, donc aire latérale = 16 × 8 = 128 cm². 4) V_cylindre = 3,14 × 2 × 2 × 8 = 100,48 cm³, donc plus petit que 120 cm³."},
    {semester:"S2",
      title:"Droite graduée, repère dans le plan",
      essentiel:"Sur une droite graduée, chaque point est repéré par un seul nombre, son abscisse ; dans un repère du plan, il faut deux nombres, l'abscisse puis l'ordonnée.",
      cours:"Une droite graduée (ou axe gradué) possède une origine O, une unité (la longueur OI) et un sens. Le nombre associé à un point A est son abscisse, on écrit A(+3) ou x_A = +3. La distance entre deux points est la différence « positive » de leurs abscisses : si x_A = −3 et x_B = 2,5, alors AB = 2,5 − (−3) = 5,5. Un repère du plan est formé de deux droites graduées : l'axe horizontal des abscisses et l'axe vertical des ordonnées, qui se croisent à l'origine O(0 ; 0). Un point s'écrit alors avec ses deux coordonnées, l'abscisse d'abord : A(+2 ; +4), B(−5 ; 0), C(+3 ; −2). Pour placer C(+3 ; −2), on avance de 3 vers la droite puis on descend de 2.",
      piege:"Inverser les coordonnées et placer A(+2 ; +4) comme s'il s'agissait de (+4 ; +2). Autre erreur : oublier le signe moins des abscisses négatives ou compter les traits de graduation au lieu de compter les unités.",
      astuce:"« On marche d'abord, on monte ensuite » : abscisse (horizontal) puis ordonnée (vertical). Astuce de mémoire : « a » d'abscisse vient avant « o » d'ordonnée dans l'alphabet.",
      exercice:"Dans un repère, place les points A(+3 ; +2), B(−2 ; +2), C(−2 ; −3) et D(+3 ; −3). 1) Quelle est la nature du quadrilatère ABCD ? 2) Sur une droite graduée, on a M(−4) et N(+2,5) : calcule MN. 3) Donne les coordonnées du milieu du segment [AB].",
      reponse:"1) A et B ont la même ordonnée, C et D aussi ; A et D ont la même abscisse, B et C aussi : ABCD est un rectangle (longueur 5, largeur 5 → c'est même un carré de côté 5). 2) MN = 2,5 − (−4) = 6,5 unités. 3) Le milieu de [AB] a pour coordonnées ((3 + (−2))/2 ; 2) = (+0,5 ; +2)."},
    {semester:"S2",
      title:"Proportionnalité",
      essentiel:"Un tableau est de proportionnalité quand on passe d'une ligne à l'autre en multipliant toujours par le même nombre, appelé coefficient de proportionnalité.",
      cours:"Exemple : le périmètre d'un carré est proportionnel à son côté, car 8/2 = 12/3 = 16/4 = 20/5 = 4 : le coefficient de proportionnalité est 4 et P = 4 × a. En revanche, l'aire du carré n'est pas proportionnelle au côté, car 4/2 = 2 alors que 9/3 = 3 : les quotients ne sont pas égaux. Pour compléter un tableau de proportionnalité, on peut multiplier par le coefficient, utiliser le passage à l'unité, ou utiliser l'égalité des produits en croix. Représentés graphiquement, les points d'une situation de proportionnalité sont alignés avec l'origine du repère. Les pourcentages et les échelles sont des cas de proportionnalité : prendre 15 % de 200 DH, c'est calculer 200 × 15/100 = 30 DH.",
      piege:"Croire que toute situation « qui augmente » est proportionnelle (l'âge et la taille, par exemple, ne le sont pas), et ajouter au lieu de multiplier : passer de 3 à 12 en « ajoutant 9 » à toutes les valeurs.",
      astuce:"Teste toujours les quotients : divise chaque valeur de la 2ᵉ ligne par celle du dessus ; si tu obtiens partout le même nombre, c'est proportionnel. Graphiquement : « droite qui passe par l'origine = proportionnalité ».",
      exercice:"6 cahiers identiques coûtent 42 DH. 1) Calcule le prix d'un cahier. 2) Complète : combien coûtent 10 cahiers ? 3) Le tableau ci-dessous est-il de proportionnalité : côté 2 → aire 4 ; côté 3 → aire 9 ? 4) Calcule 20 % de 45 DH.",
      reponse:"1) 42 ÷ 6 = 7 DH le cahier (coefficient de proportionnalité 7). 2) 10 × 7 = 70 DH. 3) Non : 4 ÷ 2 = 2 mais 9 ÷ 3 = 3, les quotients sont différents, donc l'aire n'est pas proportionnelle au côté. 4) 45 × 20/100 = 9 DH."},
    {semester:"S2",
      title:"Statistiques",
      essentiel:"L'effectif d'une valeur est le nombre de fois où elle apparaît, et sa fréquence s'obtient en divisant cet effectif par l'effectif total.",
      cours:"On étudie une population (par exemple les élèves d'une classe) selon un caractère (la note, la couleur préférée, la taille). Pour 16 notes : 5, 8, 9, 9, 10, 10, 10, 10, 11, 11, 11, 12, 12, 13, 14, 16, on construit un tableau des effectifs : la note 10 a un effectif de 4 et l'effectif total est N = 16. La fréquence de la note 10 est f = 4/16 = 0,25, ce qui donne un pourcentage de 0,25 × 100 = 25 %. La somme de tous les effectifs est égale à l'effectif total, et la somme des pourcentages fait 100 %. On représente ensuite les données par un diagramme en bâtons, un diagramme circulaire (secteurs proportionnels aux effectifs, angle = pourcentage × 360/100) ou un tableau. Un caractère est quantitatif s'il s'exprime par un nombre (la taille) et qualitatif sinon (la couleur).",
      piege:"Diviser par le nombre de valeurs différentes au lieu de l'effectif total quand on calcule une fréquence, et confondre la valeur du caractère (la note 10) avec son effectif (4 élèves).",
      astuce:"« Fréquence = ma part ÷ le tout », puis × 100 pour le pourcentage. Vérifie toujours ton tableau : la somme des effectifs doit redonner l'effectif total, et la somme des pourcentages 100 %.",
      exercice:"Dans une classe de 25 élèves, on note le nombre de frères et sœurs : 0 (4 élèves), 1 (10 élèves), 2 (6 élèves), 3 (5 élèves). 1) Vérifie l'effectif total. 2) Calcule la fréquence et le pourcentage pour la valeur 1. 3) Quel angle utiliserais-tu pour cette valeur dans un diagramme circulaire ? 4) Quelle valeur a le plus grand effectif ?",
      reponse:"1) 4 + 10 + 6 + 5 = 25 : l'effectif total est bien 25. 2) f = 10/25 = 0,4 soit 40 %. 3) Angle = 40 × 360/100 = 144°. 4) La valeur 1 (10 élèves) : c'est la valeur la plus fréquente."}

  francais: [
    {semester:"S1",
      title:"Le verbe et la conjugaison",
      essentiel:"Le verbe est le mot qui exprime une action ou un état ; il se compose d'un radical et d'une terminaison qui change selon la personne, le temps et le mode. On classe les verbes en trois groupes d'après leur infinitif.",
      cours:"Pour conjuguer un verbe, il faut d'abord trouver son infinitif, puis son groupe. Le 1er groupe se termine par -er (chanter, jouer), le 2e groupe par -ir avec le participe présent en -issant (finir, grandir), le 3e groupe réunit tous les autres verbes, dits irréguliers (aller, prendre, venir, être, avoir). Dans « nous chantions », le radical est « chant- » et la terminaison est « -ions » : la terminaison nous renseigne sur la personne (nous) et sur le temps (l'imparfait). Le verbe s'accorde toujours avec son sujet : « Les élèves écrivent une histoire » (sujet pluriel, donc terminaison -ent). Un verbe peut aussi exprimer un état quand il s'agit d'un verbe d'état comme être, sembler, paraître, devenir, rester : « Le village était calme. »",
      piege:"Beaucoup d'élèves marocains de 1AC confondent l'infinitif en -er et le participe passé en -é parce que les deux se prononcent de la même façon : ils écrivent « il a chanter » au lieu de « il a chanté », ou « je vais mangé » au lieu de « je vais manger ». Autre erreur très fréquente : oublier d'accorder le verbe avec un sujet éloigné, comme dans « les enfants du village joue » au lieu de « jouent ».",
      astuce:"Remplace le verbe douteux par « prendre », un verbe du 3e groupe : si « prendre » sonne juste, il faut l'infinitif en -er (« je vais prendre » → « je vais manger ») ; si c'est « pris » qui sonne juste, il faut le participe passé en -é (« il a pris » → « il a mangé »). Pour l'accord, encadre toujours le sujet avec « c'est ... qui » : « ce sont les enfants qui jouent ».",
      exercice:"1) Donne l'infinitif et le groupe des verbes soulignés : « Mqaidech aperçut un feu, il appela ses frères et ils marchèrent longtemps. » 2) Complète avec -er ou -é : « Le maître a demand__ aux élèves de racont__ leur histoire, puis il a corrig__ les cahiers. » 3) Accorde le verbe : « Les sept frères (partir, présent) à la forêt. »",
      reponse:"1) « aperçut » → apercevoir, 3e groupe ; « appela » → appeler, 1er groupe ; « marchèrent » → marcher, 1er groupe. 2) « Le maître a demandé aux élèves de raconter leur histoire, puis il a corrigé les cahiers. » (demandé et corrigé sont des participes passés après l'auxiliaire avoir ; raconter est un infinitif après la préposition « de »). 3) « Les sept frères partent à la forêt. » Le sujet « les sept frères » est au pluriel, la terminaison est donc « -ent »."},
    {semester:"S1",
      title:"Les temps du récit : imparfait et passé simple",
      essentiel:"Dans un récit écrit au passé, l'imparfait sert à décrire le décor, les habitudes et les actions qui durent, tandis que le passé simple raconte les actions courtes, achevées et qui se suivent.",
      cours:"L'imparfait exprime la description (« Elle était belle »), l'habitude ou la répétition (« Chaque jour, il se levait à six heures ») et la durée (« Depuis des mois, la neige recouvrait les champs »). Le passé simple présente au contraire une action accomplie et limitée dans le temps (« Il ferma la fenêtre et sortit »), une action soudaine (« Soudain, le téléphone sonna ») ou une suite d'actions successives (« Il ouvrit la porte, entra, s'assit et se mit à écrire »). Les deux temps travaillent ensemble : l'imparfait est le fond du tableau, le passé simple est ce qui bouge devant. Terminaisons de l'imparfait, identiques pour tous les verbes : -ais, -ais, -ait, -ions, -iez, -aient. Au passé simple, les verbes du 1er groupe font -ai, -as, -a, -âmes, -âtes, -èrent (il marcha) et beaucoup de verbes du 3e groupe font -is ou -it (il partit, il prit). Exemple complet : « La forêt était sombre et les oiseaux se taisaient ; tout à coup, un loup surgit derrière un arbre. »",
      piege:"L'erreur la plus répandue en 1AC est de mettre tout le récit au passé simple, y compris les descriptions, ou d'écrire « il mangeat » en mélangeant les deux terminaisons. Autre piège : à la 3e personne du singulier, les élèves écrivent « il marchait » quand il faut « il marcha », parce qu'ils traduisent directement de l'arabe où un seul temps du passé suffit souvent.",
      astuce:"Pose-toi la question : « Est-ce que ça dure ou est-ce que ça claque ? » Si ça dure, si ça se répète ou si ça décrit → imparfait. Si ça claque, si c'est bref et fini → passé simple. Retiens aussi les mots déclencheurs : « chaque jour, souvent, autrefois, pendant que » annoncent l'imparfait ; « soudain, tout à coup, un jour, alors » annoncent le passé simple.",
      exercice:"Mets les verbes entre parenthèses à l'imparfait ou au passé simple : « Il (être) une fois une petite fille qui (habiter) près d'une forêt. Chaque matin, elle (aider) sa mère. Un jour, pendant qu'elle (ramasser) du bois, elle (entendre) un cri, elle (courir) vers le buisson et elle (découvrir) un oiseau blessé. »",
      reponse:"« Il était une fois une petite fille qui habitait près d'une forêt. Chaque matin, elle aidait sa mère. Un jour, pendant qu'elle ramassait du bois, elle entendit un cri, elle courut vers le buisson et elle découvrit un oiseau blessé. » Explication : « était », « habitait », « aidait » et « ramassait » décrivent la situation initiale ou une habitude, donc imparfait ; « entendit », « courut » et « découvrit » sont des actions brèves et successives déclenchées par « un jour », donc passé simple."},
    {semester:"S2",
      title:"Le groupe nominal et ses expansions",
      essentiel:"Le groupe nominal est un ensemble de mots dont le noyau est un nom ; il peut être enrichi par des expansions qui donnent des précisions sur ce nom.",
      cours:"Le groupe nominal minimal se compose d'un déterminant et d'un nom : « un chien », « des élèves », « une table ». C'est le déterminant qui indique le genre (masculin ou féminin) et le nombre (singulier ou pluriel) du nom. On peut ensuite agrandir ce groupe grâce à trois expansions étudiées en 1AC : l'adjectif qualificatif épithète (« un chien noir »), le complément du nom introduit par une préposition (« un chien de berger ») et la proposition subordonnée relative introduite par un pronom relatif qui, que, où, dont (« un chien qui aboyait fort »). Toutes ces expansions se rattachent au même noyau : le nom « chien ». On peut aussi réduire un groupe nominal en supprimant ses expansions, ce qui aide à repérer le noyau. Exemple d'un groupe nominal très étendu : « la vieille maison blanche de mon grand-père que nous visitions chaque été ».",
      piege:"Les élèves de 1AC prennent souvent le déterminant ou une expansion pour le noyau du groupe nominal : dans « une boîte de chocolats », ils répondent que le noyau est « chocolats » alors que c'est « boîte ». Ils oublient aussi d'accorder les expansions adjectivales avec le noyau et écrivent « des maisons blanc ».",
      astuce:"Pour trouver le noyau, mets le groupe au singulier ou au pluriel : le mot qui change de nombre avec le sens général est le noyau. Autre méthode : supprime tout ce que tu peux enlever ; le dernier mot qui reste indispensable, avec son déterminant, est le noyau. Pense « déterminant + NOM noyau + habits (adjectif, de..., qui...) ».",
      exercice:"Dans les groupes nominaux suivants, souligne le noyau et indique la nature de chaque expansion : 1) « un long chemin poussiéreux » ; 2) « la maison de l'ogre » ; 3) « le cheval que son père lui avait offert » ; 4) « une grande fête du village qui dura trois jours ».",
      reponse:"1) Noyau : chemin ; expansions : « long » et « poussiéreux » sont deux adjectifs qualificatifs épithètes. 2) Noyau : maison ; expansion : « de l'ogre » est un complément du nom introduit par la préposition « de ». 3) Noyau : cheval ; expansion : « que son père lui avait offert » est une proposition subordonnée relative introduite par le pronom relatif « que ». 4) Noyau : fête ; expansions : « grande » (adjectif qualificatif épithète), « du village » (complément du nom) et « qui dura trois jours » (subordonnée relative)."},
    {semester:"S2",
      title:"Les déterminants et les articles",
      essentiel:"Le déterminant se place devant le nom, le rend utilisable dans la phrase et porte les marques de son genre et de son nombre ; les articles sont les déterminants les plus courants.",
      cours:"On distingue les articles définis (le, la, l', les), qui désignent une chose déjà connue ou précise, les articles indéfinis (un, une, des), qui présentent une chose inconnue ou quelconque, et les articles partitifs (du, de la, de l', des), qui indiquent une quantité qu'on ne compte pas : « Je bois du lait. » Il existe aussi des articles contractés, formés par la fusion d'une préposition et d'un article : à + le = au, à + les = aux, de + le = du, de + les = des. Dans un conte, l'article indéfini ouvre l'histoire et l'article défini reprend ensuite le personnage : « Il était une fois un ogre... L'ogre habitait au fond de la forêt. » Les autres déterminants étudiés en 1AC sont l'adjectif possessif (mon, ta, ses, notre, leurs) et l'adjectif démonstratif (ce, cet, cette, ces).",
      piege:"L'erreur classique des élèves marocains est d'oublier l'article ou d'en mettre un de trop, parce que l'arabe fonctionne différemment : on lit souvent « Je vais à école » au lieu de « à l'école », ou « J'aime le lait avec du thé » mal construit. Autre confusion très fréquente : « des » article indéfini pluriel (« des livres ») et « des » article contracté (« la couverture des livres » = de + les).",
      astuce:"Retiens la petite règle du conte : « un / une / des » pour la première fois, « le / la / les » ensuite. Pour ne jamais oublier l'article, dis-toi qu'en français un nom commun voyage presque toujours accompagné : il ne sort jamais tout seul. Et pour distinguer les deux « des », essaie de remplacer par « de les » : si la phrase garde son sens, c'est un article contracté.",
      exercice:"Complète avec l'article qui convient (défini, indéfini, partitif ou contracté) : « ___ matin, ___ jeune fille alla ___ marché du village. Elle acheta ___ pain, ___ dattes et ___ eau. Sur ___ chemin ___ retour, elle rencontra ___ vieille femme qui portait ___ panier lourd. »",
      reponse:"« Un matin, une jeune fille alla au marché du village. Elle acheta du pain, des dattes et de l'eau. Sur le chemin du retour, elle rencontra une vieille femme qui portait un panier lourd. » Explications : « un matin » et « une jeune fille » sont indéfinis car on les présente pour la première fois ; « au » (à + le) et « du retour » (de + le) sont des articles contractés ; « du pain » et « de l'eau » sont des partitifs car il s'agit de quantités non comptables ; « des dattes » est un indéfini pluriel ; « le chemin » est défini car il est précisé par « du retour »."},
    {semester:"S2",
      title:"L'adjectif qualificatif et son accord",
      essentiel:"L'adjectif qualificatif précise le nom ou le pronom auquel il se rapporte et s'accorde toujours avec lui en genre et en nombre. Il est épithète quand il est collé au nom, attribut quand il suit un verbe d'état.",
      cours:"L'adjectif épithète est placé avant ou après le nom, à l'intérieur du groupe nominal : « des chaussures noires », « un vieil homme ». L'adjectif attribut du sujet est séparé du nom par un verbe d'état (être, sembler, paraître, devenir, rester, demeurer) : « Ces enfants sont ravissants », « La dame était silencieuse. » Un adjectif peut aussi être apposé, détaché par une virgule : « Studieux, il ne reculait devant rien. » Pour l'accord, on ajoute -e au féminin et -s au pluriel : petit, petite, petits, petites. Attention aux féminins particuliers : heureux → heureuse, beau → belle, vieux → vieille, cruel → cruelle, gentil → gentille. Le participe passé employé comme adjectif s'accorde de la même manière : « les monuments visités ». Quand un adjectif qualifie deux noms de genres différents, il se met au masculin pluriel : « une fille et un garçon contents ».",
      piege:"En 1AC, l'oubli du -e du féminin et du -s du pluriel est l'erreur numéro un, surtout quand l'adjectif est loin du nom : « les portes du palais étaient ouvert » au lieu de « ouvertes ». Les élèves accordent aussi l'adjectif attribut avec le complément le plus proche au lieu du sujet : « la maison et le jardin étaient propre ».",
      astuce:"Fais la flèche : trace une flèche de l'adjectif vers le nom qu'il qualifie, puis recopie le genre et le nombre de ce nom. Astuce d'oreille pour le féminin : prononce l'adjectif au féminin (« ouverte », « heureuse »), la consonne que tu entends est justement celle qu'il faut écrire au masculin aussi.",
      exercice:"Accorde les adjectifs entre parenthèses et précise leur fonction (épithète ou attribut) : « La (petit) maison de l'ogre paraissait (abandonné). Ses murs (blanc) étaient (sale) et ses fenêtres (étroit) restaient (fermé). La fille et son frère semblaient (inquiet) devant cette porte (vieux). »",
      reponse:"« La petite maison de l'ogre paraissait abandonnée. Ses murs blancs étaient sales et ses fenêtres étroites restaient fermées. La fille et son frère semblaient inquiets devant cette vieille porte. » Fonctions : « petite » est épithète du nom « maison » ; « abandonnée » est attribut du sujet « la petite maison » (verbe d'état paraître) ; « blancs » est épithète de « murs » et « sales » attribut du sujet « ses murs » ; « étroites » est épithète de « fenêtres » et « fermées » attribut du sujet « ses fenêtres » ; « inquiets » est attribut du sujet « la fille et son frère », donc masculin pluriel car les deux genres sont mélangés ; « vieille » est épithète de « porte » et se place avant le nom."},
    {semester:"S1",
      title:"Raconter à partir d'une bande dessinée",
      essentiel:"La bande dessinée raconte une histoire avec des images : lire les vignettes dans l'ordre permet de retrouver le récit, puis de l'écrire avec des phrases complètes au passé.",
      cours:"Dans le programme de 1AC, la séquence « raconter en images » du guide du professeur demande d'écrire un début de récit à partir d'une bande dessinée et d'en rédiger la suite. Il faut d'abord observer le vocabulaire de la BD : la planche (la page entière), la bande (une rangée d'images), la vignette (une image), la bulle ou le phylactère (les paroles), le cartouche (le texte du narrateur, souvent rectangulaire), les onomatopées (Boum ! Aïe !) et les idéogrammes (les petites étoiles de la colère). Ensuite, on lit les vignettes de gauche à droite et de haut en bas pour repérer les personnages, le lieu, le moment et les actions. Enfin, on transforme les images en texte narratif : on remplace les bulles par des paroles rapportées et on emploie l'imparfait pour décrire le décor et le passé simple pour les actions. Exemple : une vignette montre un garçon qui court sous la pluie avec son cartable sur la tête, on écrit : « Il pleuvait très fort ; Karim mit son cartable sur sa tête et courut vers l'arrêt du bus. »",
      piege:"Les élèves se contentent de décrire les images une par une (« Dans la première image, il y a un garçon... ») au lieu de raconter une véritable histoire liée par des connecteurs. Ils recopient aussi les bulles telles quelles, sans les intégrer au récit avec des verbes de parole et une ponctuation correcte.",
      astuce:"Utilise la méthode QQOQ pour chaque vignette : Qui ? Quoi ? Où ? Quand ? Puis relie tes phrases avec des connecteurs de temps : d'abord, ensuite, soudain, alors, enfin. Règle d'or : une vignette n'est pas une phrase toute faite, c'est une action à raconter.",
      exercice:"Voici trois vignettes décrites en mots : (1) une fille arrose des fleurs sur un balcon, le soleil brille ; (2) une bulle : « Oh non ! Mon chat ! », le chat est sur le rebord voisin ; (3) la fille tient le chat dans ses bras et sourit. Rédige un court récit de quatre à cinq phrases au passé, en utilisant l'imparfait pour la description, le passé simple pour les actions, et en intégrant la parole de la bulle.",
      reponse:"Proposition de réponse : « C'était un beau matin d'été et le soleil brillait sur la ville. Sur son balcon, Salma arrosait tranquillement ses fleurs rouges. Soudain, elle aperçut son chat perché sur le rebord du balcon voisin et s'écria : « Oh non ! Mon chat ! » Elle se pencha lentement, tendit les bras et attrapa l'animal effrayé. Enfin rassurée, elle serra son chat contre elle et sourit. » Le récit respecte les critères attendus : l'imparfait pour le décor (« brillait », « arrosait »), le passé simple pour les actions successives (« aperçut », « s'écria », « se pencha », « attrapa », « serra »), la parole de la bulle rapportée au discours direct avec un verbe de parole et des guillemets, et des connecteurs de temps (« soudain », « enfin »)."},
    {semester:"S1",
      title:"Le schéma narratif du conte",
      essentiel:"Tout conte suit cinq étapes : la situation initiale, l'élément perturbateur, les péripéties, le dénouement et la situation finale, souvent complétée par une morale.",
      cours:"La situation initiale présente les personnages, le lieu et l'époque dans une situation stable ; les verbes y sont surtout à l'imparfait et elle commence par une formule d'ouverture comme « Il était une fois ». L'élément perturbateur, annoncé par un complément de temps du type « un jour », « soudain », « tout à coup », brise cet équilibre et déclenche l'action. Les péripéties sont la suite des aventures du héros, avec ses ennemis et ses alliés ; les verbes sont alors au passé simple. Le dénouement résout le problème et la situation finale rétablit un équilibre, différent de celui du début, parfois suivi d'une morale. Dans le conte marocain « Mqaidech », par exemple, la situation initiale présente un homme et ses sept enfants près d'une forêt ; l'élément perturbateur est la mort du père et le besoin d'argent ; les péripéties sont la chasse, la nuit chez l'ogre et la ruse de la gtaïfa rouge ; le dénouement est le retour grâce au cheval ; la situation finale est la grande fête au village, avec la morale : il ne faut jamais sous-estimer les petits enfants.",
      piege:"Beaucoup d'élèves de 1AC confondent l'élément perturbateur et la première péripétie, ou placent la morale au début. Une autre erreur fréquente est de raconter toute l'histoire au présent, alors que le conte demande l'imparfait pour la situation initiale et le passé simple pour les actions.",
      astuce:"Retiens les cinq doigts de la main : pouce = situation initiale, index = élément perturbateur (le doigt qui montre le problème), majeur = péripéties (le plus long doigt, car c'est la partie la plus longue), annulaire = dénouement, auriculaire = situation finale. Ajoute le repère des mots clés : « Il était une fois » pour le début, « un jour » pour la perturbation, « depuis ce jour » pour la fin.",
      exercice:"Remets ces éléments dans l'ordre du schéma narratif et nomme chaque étape : a) Amina rapporta la clé au vieux jardinier, qui lui offrit la plus belle rose du jardin. b) Il était une fois, dans un village près d'Ifrane, une fille curieuse nommée Amina qui passait chaque jour devant un jardin fermé. c) Depuis ce jour, la porte du jardin resta ouverte pour tous les enfants du village. d) Elle chercha longtemps, interrogea les voisins et finit par trouver la clé sous une pierre. e) Un matin, elle découvrit que la porte du jardin était grande ouverte et que la clé avait disparu.",
      reponse:"Ordre correct : b, e, d, a, c. b) Situation initiale : présentation du personnage (Amina), du lieu (un village près d'Ifrane) et d'une situation stable, à l'imparfait (« passait »). e) Élément perturbateur : la disparition de la clé, annoncée par « un matin ». d) Péripéties : les recherches successives d'Amina, au passé simple (« chercha », « interrogea », « finit »). a) Dénouement : la clé est rendue et le problème est résolu. c) Situation finale : un nouvel équilibre s'installe, marqué par « depuis ce jour »."},
    {semester:"S2",
      title:"Décrire un personnage, un lieu ou un objet",
      essentiel:"Décrire, c'est faire voir avec des mots : on choisit un ordre clair, on emploie des expansions du nom et des indicateurs de lieu, et on intègre la description dans le récit sans l'arrêter.",
      cours:"La deuxième période du programme de 1AC est consacrée à la description d'une personne, d'un lieu, d'un animal et d'un objet, puis à son insertion dans un récit court. Pour décrire une personne, on fait son portrait physique (taille, visage, cheveux, vêtements) et son portrait moral (caractère, qualités, défauts) ; le portrait peut être valorisant ou dévalorisant selon les mots choisis. Pour décrire un lieu, on suit un ordre organisé et on emploie des indicateurs spatiaux : à gauche, à droite, au fond, devant, derrière, tout autour. Pour un objet, on précise la forme, la matière, la couleur, la taille et l'usage. Les outils de la description sont les adjectifs qualificatifs, les compléments du nom, les subordonnées relatives, les comparaisons (« des yeux noirs comme des olives ») et les verbes de perception ou d'état à l'imparfait. Exemple : « La vieille dame était toute petite ; son visage ridé souriait sous un foulard vert et ses mains, abîmées par le travail, tremblaient légèrement. »",
      piege:"Les élèves de cet âge accumulent les adjectifs sans ordre (« elle était belle, gentille, grande, jolie, sympathique ») et emploient sans arrêt « il y a » : « il y a une table, il y a une chaise, il y a une fenêtre ». Ils oublient aussi que dans un récit la description se fait à l'imparfait et non au présent.",
      astuce:"Pour une personne, descends comme un ascenseur : de la tête aux pieds, puis termine par le caractère. Pour un lieu, fais tourner la caméra : du général au détail, en utilisant deux ou trois indicateurs spatiaux différents. Et remplace « il y a » par des verbes plus riches : se dresser, s'étendre, occuper, orner, sentir.",
      exercice:"Rédige un paragraphe de cinq à six phrases pour décrire le souk de ton quartier un jour de marché. Consignes obligatoires : emploie l'imparfait, au moins trois adjectifs qualificatifs accordés, un complément du nom, une subordonnée relative, deux indicateurs de lieu et une comparaison. Interdiction d'utiliser « il y a ».",
      reponse:"Proposition de réponse : « Le souk de mon quartier s'éveillait très tôt, dans une odeur épaisse de menthe et de pain chaud. À droite de l'entrée, les étals colorés des marchands de légumes s'étendaient jusqu'au vieux mur de la mosquée. Au fond, un vendeur d'épices, qui portait une djellaba beige, remplissait de petits sacs de cumin et de safran. Les tomates brillantes ressemblaient à de grosses billes rouges posées sur la paille. Tout autour, les voix des acheteurs et les cris des enfants formaient un bruit joyeux qui ne s'arrêtait jamais. » Vérification des consignes : verbes à l'imparfait (« s'éveillait », « s'étendaient », « remplissait », « ressemblaient », « formaient ») ; adjectifs accordés (« épaisse », « colorés », « brillantes », « joyeux ») ; compléments du nom (« de menthe », « des marchands de légumes ») ; subordonnées relatives (« qui portait une djellaba beige », « qui ne s'arrêtait jamais ») ; indicateurs de lieu (« à droite de l'entrée », « au fond », « tout autour ») ; comparaison (« ressemblaient à de grosses billes rouges ») ; aucune occurrence de « il y a »."},
    {semester:"S1",
      title:"Lire et comprendre un texte informatif (les médias)",
      essentiel:"Un texte informatif des médias, comme le fait divers ou le compte rendu, sert à informer de façon objective en répondant aux questions Qui ? Quoi ? Quand ? Où ? Comment ? Pourquoi ?",
      cours:"La première séquence du programme de 1AC, « rapporter des faits », fait découvrir des écrits journalistiques et historiques : le fait divers, le compte rendu et le récit historique. Un article de presse se reconnaît à sa présentation : le titre (souvent court et accrocheur), le chapeau qui résume l'essentiel, le corps de l'article, parfois une photographie avec sa légende, la source et la date. Le journaliste rapporte les faits sans donner son avis : il emploie la troisième personne, des dates précises, des chiffres et des noms de lieux réels. Les temps dominants sont le passé composé et le présent, plus rares dans le récit fictif. Exemple de fait divers : « Hier, vers 17 heures, un incendie s'est déclaré dans un entrepôt de Casablanca. Les pompiers, arrivés en quinze minutes, ont maîtrisé le feu ; aucune victime n'a été signalée. » On y retrouve bien les six questions du journaliste.",
      piege:"Les élèves marocains de 1AC confondent souvent l'information et l'opinion : ils recopient une phrase de commentaire en croyant citer un fait, ou ajoutent leur avis personnel (« c'est très triste ») dans un résumé qui doit rester objectif. Ils confondent aussi le titre et le chapeau, et oublient d'indiquer la source du document.",
      astuce:"Applique la règle des 5 W et un H, facile à retenir en français sous la forme QQQOCP : Qui ? Quoi ? Quand ? Où ? Comment ? Pourquoi ? Souligne dans le texte, avec des couleurs différentes, la réponse à chaque question : ce que tu n'as pas pu souligner est probablement une opinion, pas une information.",
      exercice:"Lis ce fait divers : « Samedi matin, à Rabat, une élève de 12 ans a retrouvé un sac contenant 3 000 dirhams devant son collège. Accompagnée de son professeur, elle a remis le sac au commissariat du quartier, où le propriétaire l'a récupéré dans l'après-midi. » 1) Réponds aux six questions du journaliste. 2) Relève deux indices qui montrent que ce texte est informatif et non fictif. 3) Propose un titre en cinq mots au maximum.",
      reponse:"1) Qui ? Une élève de 12 ans. Quoi ? Elle a retrouvé puis rendu un sac contenant 3 000 dirhams. Quand ? Samedi matin, et le propriétaire l'a récupéré dans l'après-midi. Où ? À Rabat, devant son collège, puis au commissariat du quartier. Comment ? En allant au commissariat accompagnée de son professeur. Pourquoi ? Pour rendre l'argent à son propriétaire, par honnêteté. 2) Deux indices parmi d'autres : la précision des informations réelles (lieu « Rabat », date « samedi matin », somme « 3 000 dirhams ») et l'emploi de la troisième personne avec le passé composé, sans aucun avis du journaliste ni formule de conte. 3) Titre possible : « Une collégienne rend 3 000 dirhams »."},
    {semester:"S2",
      title:"Écrire une lettre",
      essentiel:"Une lettre respecte une présentation précise : lieu et date, formule d'appel, corps du message, formule finale de politesse et signature. Son ton change selon le destinataire.",
      cours:"En haut à droite, on écrit le lieu et la date : « Rabat, le 12 mai 2026 ». On commence par une formule d'appel suivie d'une virgule : « Cher ami, », « Chère Amina, » dans une lettre personnelle, « Monsieur le Directeur, » dans une lettre administrative. Le corps de la lettre annonce d'abord la raison d'écrire, puis développe le message en paragraphes courts : « Je t'écris cette lettre pour te demander une faveur. » On termine par une formule finale adaptée : « À bientôt, je t'embrasse » entre amis, « Veuillez agréer, Monsieur, l'expression de mes salutations distinguées » dans une lettre officielle, puis on signe en bas à droite. La différence essentielle est le ton : dans la lettre personnelle on emploie le tutoiement et un langage familier, dans la lettre administrative le vouvoiement et un langage soutenu, avec un objet précis. Exemple de demande d'autorisation : « Monsieur le Directeur, je me permets de vous demander l'autorisation d'utiliser la salle de théâtre du collège le samedi 20 mai afin de présenter le conte préparé par notre classe. »",
      piege:"En 1AC, les élèves oublient très souvent la date et la signature, ou mélangent les registres : ils écrivent « Salut Monsieur le Directeur » et « je t'embrasse » dans une lettre officielle. Ils passent aussi du tutoiement au vouvoiement à l'intérieur de la même lettre.",
      astuce:"Retiens le sigle DAPFS, comme le squelette de toute lettre : Date, Appel, Paragraphes, Formule finale, Signature. Avant d'écrire, demande-toi : « À qui j'écris ? » Si c'est un adulte que tu ne connais pas, tu vouvoies du début à la fin ; si c'est un ami, tu tutoies du début à la fin, sans jamais changer en route.",
      exercice:"Rédige une lettre d'une dizaine de lignes à ta correspondante française pour l'inviter à passer une semaine chez toi à Marrakech pendant les vacances du printemps. Tu dois respecter les cinq éléments de la lettre personnelle, employer le tutoiement, présenter deux activités que vous ferez ensemble et poser une question à ta correspondante.",
      reponse:"Proposition de réponse : « Marrakech, le 15 mars 2026 — Chère Léa, — Comment vas-tu ? J'espère que toute ta famille est en bonne santé. Je t'écris cette lettre pour t'inviter à passer une semaine chez moi pendant les vacances du printemps. Nous habitons une maison près de la médina et ma chambre est assez grande pour deux. Si tu acceptes, nous visiterons d'abord la place Jemaa el-Fna et ses conteurs, puis nous irons voir les jardins de la Ménara, où l'on peut se promener au calme. Ma mère prépare un couscous délicieux le vendredi : tu vas l'adorer ! Dis-moi vite si tes parents sont d'accord et à quelle date tu pourrais arriver. — À bientôt, je t'embrasse très fort. — Ton amie, Sara. » Vérification : le lieu et la date figurent en haut, la formule d'appel « Chère Léa, » est suivie d'une virgule, le corps annonce clairement l'invitation et présente deux activités (la place Jemaa el-Fna et les jardins de la Ménara), une question est posée à la correspondante, le tutoiement est employé partout, et la lettre se termine par une formule finale amicale suivie de la signature."},
    {semester:"S1",
      title:"Le texte théâtral : dialogue et didascalies",
      essentiel:"Un texte de théâtre est écrit pour être joué : il se compose des répliques échangées par les personnages et des didascalies, ces indications de mise en scène qui ne sont pas prononcées.",
      cours:"Le texte théâtral est une histoire imaginée par un auteur, appelé dramaturge, pour être représentée par des comédiens sur une scène. Il contient deux types d'informations : le dialogue, c'est-à-dire les répliques précédées du nom du personnage, et les didascalies, qui précisent la façon de jouer (gestes, attitude, voix, décor, vêtements, accessoires). Les didascalies sont souvent écrites en italique, en gras ou entre parenthèses et ne se lisent pas à voix haute. Une didascalie externe est donnée par l'auteur en dehors du dialogue, tandis qu'une didascalie interne est glissée dans la réplique d'un personnage (« Donnez-moi cette chaise »). La pièce est découpée en actes et en scènes ; la scène d'exposition, au début, informe le spectateur sur les personnages et sur l'action, et le dénouement clôt l'histoire. En 1AC, cette leçon sert surtout à transformer le conte écrit en classe en petite pièce à jouer : on choisit le décor, les costumes et on remplace le narrateur par des répliques. Exemple : « L'OGRE, d'une voix terrible, en s'approchant du feu. — Qui a osé toucher à ma gtaïfa rouge ? »",
      piege:"Les élèves écrivent les didascalies comme des répliques, donc les acteurs les lisent à voix haute, ou bien ils oublient le nom du personnage devant chaque réplique. Autre erreur fréquente : garder des phrases de narration (« il entra dans la maison ») au lieu de les transformer en didascalie (« Il entre dans la maison. ») ou en parole de personnage.",
      astuce:"Pense « ce qui se dit / ce qui se fait » : ce qui se dit va après le tiret, ce qui se fait va entre parenthèses ou en italique. Test simple avant de jouer : lis à haute voix uniquement les répliques ; si une phrase parlée devient bizarre, c'est qu'elle était en réalité une didascalie.",
      exercice:"Transforme ce passage narratif en un extrait de texte théâtral de trois répliques, avec le nom des personnages et au moins deux didascalies : « Karim entra dans la classe en retard et tout essoufflé. Le professeur lui demanda pourquoi il arrivait après la sonnerie. Karim expliqua qu'il avait aidé une vieille dame à traverser la rue et le professeur, touché, l'autorisa à s'asseoir. »",
      reponse:"Proposition de réponse : « La salle de classe. Les élèves sont déjà installés. Karim entre en courant, essoufflé. — KARIM, baissant la tête. Excusez-moi, Monsieur, je suis en retard. — LE PROFESSEUR, sévèrement, en fermant son cahier. La sonnerie a retenti depuis dix minutes, Karim. Peux-tu m'expliquer pourquoi tu arrives seulement maintenant ? — KARIM, reprenant son souffle. J'ai aidé une vieille dame à traverser l'avenue, Monsieur ; elle avait très peur des voitures. — LE PROFESSEUR, souriant et lui montrant sa place. Voilà une bonne raison. Assieds-toi et ouvre ton livre. » Cet extrait respecte les consignes : le nom de chaque personnage précède sa réplique, les paroles sont au discours direct et les didascalies (le décor initial, « baissant la tête », « sévèrement, en fermant son cahier », « reprenant son souffle », « souriant et lui montrant sa place ») indiquent le jeu des comédiens sans être prononcées."},
    {semester:"S2",
      title:"Vocabulaire : les synonymes et les antonymes",
      essentiel:"Les synonymes sont des mots de sens proche et les antonymes des mots de sens contraire ; dans les deux cas, les mots appartiennent à la même classe grammaticale.",
      cours:"Deux synonymes ont le même sens ou un sens voisin et sont toujours de même nature : un nom pour un nom (habit / vêtement), un adjectif pour un adjectif (beau / joli), un verbe pour un verbe (décorer / orner). Les synonymes ne sont pourtant jamais totalement interchangeables : ils se distinguent par le degré d'intensité (content, heureux, ravi) et par le niveau de langue (une bagnole en langage familier, une voiture en langage courant, une automobile en langage soutenu). Les antonymes, eux, expriment le contraire et appartiennent aussi à la même classe grammaticale : grand / petit, monter / descendre, la joie / la tristesse. On forme souvent un antonyme à l'aide d'un préfixe négatif : possible / impossible, heureux / malheureux, faire / défaire, régulier / irrégulier. Le dictionnaire est l'outil idéal pour vérifier le sens exact et éviter un contresens. Exemple d'emploi utile en rédaction : au lieu de répéter « il était content », on écrit « il était ravi », ce qui enrichit le texte et évite les répétitions.",
      piege:"Les élèves de 1AC proposent souvent un synonyme d'une autre classe grammaticale (« rapide » pour « vite ») ou un mot dont le sens est trop éloigné du contexte : « grand » remplacé par « âgé » dans « un grand jardin ». Pour les antonymes, ils ajoutent le préfixe « in- » à tort et écrivent « inpossible » au lieu de « impossible », ou « ingrand » au lieu de « petit ».",
      astuce:"Fais le test du remplacement : réécris la phrase entière avec le mot proposé ; si le sens reste le même, c'est un vrai synonyme dans ce contexte. Pour les antonymes, retiens la règle du préfixe : devant les lettres m, b et p, « in- » devient « im- » (impossible, immobile, imbattable).",
      exercice:"1) Donne un synonyme de chaque mot souligné, en gardant la même classe grammaticale : « une maison ancienne », « il regarda le ciel », « la peur du héros ». 2) Donne l'antonyme de : rapide, la clarté, monter, poli, utile (utilise un préfixe pour deux d'entre eux). 3) Classe ces synonymes du plus faible au plus fort : furieux, agacé, mécontent.",
      reponse:"1) « une maison ancienne » → une maison vieille (adjectif) ; « il regarda le ciel » → il observa ou il contempla le ciel (verbe) ; « la peur du héros » → la crainte ou la frayeur du héros (nom). 2) rapide / lent, la clarté / l'obscurité, monter / descendre, poli / impoli (préfixe im- devant p), utile / inutile (préfixe in-). 3) Du plus faible au plus fort : agacé, mécontent, furieux ; ces trois adjectifs sont synonymes mais leur intensité est différente, ce qui montre qu'on ne peut pas toujours remplacer un synonyme par un autre."},
    {semester:"S2",
      title:"Étudier une œuvre : la fiche de lecture",
      essentiel:"En fin d'année, le programme de 1AC prévoit la lecture d'une œuvre complète (roman, recueil de contes ou nouvelle) ; on en rend compte avec une fiche de lecture qui présente le livre, résume l'histoire et décrit les personnages.",
      cours:"Le guide pédagogique du ministère prévoit, en sixième période de l'année, l'étude d'une œuvre complète (souvent une nouvelle ou un texte de littérature de jeunesse) plutôt qu'un seul texte court comme dans les périodes précédentes (Ministère de l'Éducation nationale, guide pédagogique du français, période 1, https://www.men.gov.ma/Fr/Documents/lefrancais/Col_periode1_Guideprofesseur.pdf). Contrairement au baccalauréat, où quatre œuvres précises sont imposées à tout le Maroc (comme La Boîte à merveilles d'Ahmed Sefrioui), aucune œuvre unique n'est obligatoire pour toutes les classes de 1AC : le titre est choisi par l'école ou par l'enseignant, selon le manuel utilisé. Pour bien lire un roman et en rendre compte, une fiche de lecture doit regrouper : 1) l'identité de l'œuvre — titre, auteur, genre (roman, conte, nouvelle) et date ; 2) un résumé de l'histoire en suivant le schéma narratif (situation initiale, élément perturbateur, péripéties, dénouement, situation finale) ; 3) les personnages principaux, avec leur nom, leurs traits de caractère et leur rôle dans l'histoire ; 4) le lieu et l'époque où se déroule l'action ; 5) les mots nouveaux rencontrés, avec leur sens trouvé dans le dictionnaire ; 6) un avis personnel sur le livre, justifié par une phrase ou un passage qui a plu ou déplu. On complète la fiche au crayon pendant la lecture (noter les noms des personnages dès leur première apparition, les lieux, les passages marquants), puis on la met au propre à la fin (méthode confirmée par plusieurs guides scolaires, https://lycee-international-stgermain.com/wp-content/uploads/2020/06/fiche-de-lecture_COLLEGE.pdf et https://site.ac-martinique.fr/clg-perrinon/?page_id=149).",
      piege:"Beaucoup d'élèves confondent le résumé et l'avis personnel, ou racontent toute l'intrigue dans le désordre au lieu de suivre la chronologie de l'histoire. Autre erreur fréquente : présenter tous les personnages sans distinguer les principaux (ceux qui agissent dans toute l'histoire) des secondaires (ceux qui n'apparaissent que dans un épisode), ou oublier de préciser le lien entre les personnages (famille, amis, ennemis).",
      astuce:"Pendant la lecture, garde un marque-page ou une feuille volante et note, dès qu'ils apparaissent : le nom d'un nouveau personnage, le lieu où on se trouve, et une phrase qui te marque. À la fin de chaque chapitre, résume-le en une ou deux phrases : tu auras déjà presque toute ta fiche de lecture prête sans avoir à tout relire.",
      exercice:"En t'aidant du plan ci-dessus, prépare la fiche de lecture d'un livre que tu es en train de lire (ou d'un conte déjà étudié en classe) : 1) Donne le titre, l'auteur et le genre. 2) Résume l'histoire en 5 à 8 phrases en suivant le schéma narratif. 3) Présente les deux personnages principaux (nom, caractère, rôle). 4) Donne ton avis en une phrase, justifié par un exemple précis tiré du texte.",
      reponse:"Il n'y a pas de correction unique puisque chaque élève choisit un livre différent ; vérifie plutôt que ta fiche contient bien les 4 éléments demandés : titre/auteur/genre corrects, résumé qui suit l'ordre de l'histoire (situation initiale → événement qui change tout → actions → fin), personnages bien distingués avec leur rôle, et un avis personnel appuyé sur un exemple précis (une scène, une phrase, un personnage) plutôt qu'une simple opinion du type « c'est bien » ou « c'est nul »."}
