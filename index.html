  pc: [
    {semester:"S1",
      title:"L'eau et les états de la matière",
      essentiel:"L'eau existe dans la nature sous trois états (solide, liquide, gazeux) et circule sans arrêt grâce au cycle de l'eau. Elle est indispensable à la vie et se trouve dans presque tous les aliments.",
      cours:"L'ensemble des réserves d'eau de la Terre s'appelle l'hydrosphère : environ 3/4 (75 %) de la surface du globe est couverte d'eau, mais les mers et océans en représentent 97,2 %, les glaces 2,15 %, les eaux souterraines 0,63 % et les lacs et rivières 0,01 % seulement. L'eau solide, c'est la glace, la neige, le givre, la grêle ; l'eau liquide, c'est la pluie, la rosée, la buée, le brouillard ; l'eau gazeuse, c'est la vapeur d'eau, qui est invisible. Dans le cycle de l'eau, la chaleur du Soleil provoque l'évaporation de l'eau des mers ; en s'élevant, la vapeur se refroidit et se liquéfie en fines gouttelettes qui forment les nuages ; l'eau retombe en précipitations (pluie, neige, grêle), puis s'infiltre pour former les nappes souterraines ou ruisselle vers les oueds et la mer. Pour détecter l'eau dans un aliment, on utilise le sulfate de cuivre anhydre : blanc, il devient bleu en présence d'eau. Ainsi la pomme, le lait ou le pain contiennent de l'eau, alors que l'huile ou le sucre sec n'en contiennent pas.",
      piege:"Confondre la vapeur d'eau (gaz invisible) avec la buée, le brouillard ou le nuage, qui sont en réalité de minuscules gouttelettes d'eau LIQUIDE. On ne voit donc jamais la vapeur d'eau.",
      astuce:"Pour le cycle de l'eau, retiens « E.C.P.R.I. » : Évaporation, Condensation (nuages), Précipitations, Ruissellement, Infiltration. Et pour le test : « sulfate de cuivre : Blanc = sec, Bleu = eau ».",
      exercice:"Le matin, Sara observe de la buée sur la vitre froide de la cuisine, alors que sa mère fait bouillir de l'eau. 1) Nomme le changement d'état qui a formé la buée et précise l'état de départ et l'état d'arrivée. 2) La buée est-elle de la vapeur d'eau ? Explique. 3) Sara verse du sulfate de cuivre anhydre blanc sur un morceau de pomme : que se passe-t-il et que conclut-elle ?",
      reponse:"1) C'est la liquéfaction (appelée aussi condensation liquide) : la vapeur d'eau (état gazeux) au contact de la vitre froide passe à l'état liquide. 2) Non : la vapeur d'eau est un gaz invisible. La buée est constituée de très fines gouttelettes d'eau liquide, c'est pourquoi on la voit. 3) Le sulfate de cuivre anhydre devient bleu : la pomme contient donc de l'eau."},
    {semester:"S1",
      title:"Les changements d'état et le modèle particulaire",
      essentiel:"La matière est faite de particules très petites et invisibles. Selon leur arrangement et leur agitation, on obtient l'état solide, liquide ou gazeux ; en recevant ou en cédant de la chaleur, la matière change d'état.",
      cours:"Dans le modèle particulaire, la matière est constituée de particules infiniment petites, invisibles et indéformables, identiques dans un corps pur. À l'état solide, les particules sont en contact, liées, ordonnées et pratiquement immobiles : le solide garde sa forme propre. À l'état liquide, elles sont encore en contact mais désordonnées et peuvent glisser les unes sur les autres : le liquide coule et prend la forme du récipient. À l'état gazeux, elles sont éloignées, très agitées et non liées : le gaz est compressible et occupe tout l'espace offert. La température se mesure avec un thermomètre, en degrés Celsius (°C) ; la chaleur est l'énergie thermique reçue ou cédée par un corps : quand un corps reçoit de la chaleur, sa température augmente. Les changements d'état sont la fusion (solide → liquide), la solidification (liquide → solide), la vaporisation (liquide → gaz), la liquéfaction (gaz → liquide), la sublimation (solide → gaz) et la condensation solide (gaz → solide). Lors d'un changement d'état, la MASSE est conservée mais le VOLUME change : 100 mL d'eau liquide donnent environ 110 mL de glace, alors qu'un glaçon de 100 g donne 100 g d'eau liquide. Sous pression normale, l'eau pure fond à 0 °C et bout à 100 °C, et sa température reste constante pendant tout le changement d'état.",
      piege:"Croire que la glace est plus lourde que l'eau parce qu'elle occupe plus de place : la masse ne change pas, seul le volume augmente (c'est pourquoi une bouteille pleine mise au congélateur peut se fissurer). Autre erreur : penser que la température continue de monter pendant l'ébullition.",
      astuce:"« Fusion = Fondre, Solidification = devenir Solide, Vaporisation = devenir Vapeur, Liquéfaction = devenir Liquide » : le nom dit l'état d'ARRIVÉE. Et retiens : « la Masse ne Mange rien, le Volume Varie ».",
      exercice:"On place 200 g d'eau liquide (200 mL) dans un congélateur. Après quelques heures, on obtient un bloc de glace de volume 220 mL. 1) Nomme le changement d'état et le sens du transfert de chaleur. 2) Quelle est la masse de la glace obtenue ? Justifie. 3) Explique avec le modèle particulaire pourquoi la glace garde sa forme alors que l'eau liquide coulait.",
      reponse:"1) C'est la solidification : l'eau liquide passe à l'état solide. L'eau CÈDE de la chaleur au congélateur, donc sa température diminue jusqu'à 0 °C puis elle gèle. 2) La masse est toujours 200 g : la masse est conservée lors d'un changement d'état physique. Seul le volume a changé (200 mL → 220 mL). 3) Dans la glace, les particules sont en contact, liées, ordonnées et pratiquement immobiles : le solide possède une forme propre. Dans l'eau liquide, les particules sont en contact mais désordonnées et glissent les unes sur les autres : le liquide n'a pas de forme propre et s'écoule."},
    {semester:"S1",
      title:"Masse, volume et masse volumique",
      essentiel:"La masse (en g ou kg) se mesure avec une balance, le volume (en mL, cm³ ou L) avec une éprouvette graduée. La masse volumique est la masse d'une unité de volume : ρ = m / V.",
      cours:"Pour mesurer le volume d'un liquide, on utilise une éprouvette graduée posée sur une table horizontale et on lit au bas du ménisque, l'œil au niveau de la surface. Pour un solide qui ne flotte pas et n'absorbe pas l'eau, on utilise la méthode du déplacement d'eau : V(solide) = V(final) − V(initial). La masse se mesure avec une balance électronique, après avoir fait la tare du récipient. La masse volumique, notée ρ, se calcule par ρ = m / V ; on en déduit m = ρ × V et V = m / ρ. Son unité internationale est le kg/m³, mais on utilise souvent le g/mL ou le g/cm³. Exemples utiles : eau = 1 g/mL, huile d'olive environ 0,82 g/mL, fer environ 7,86 g/mL, cuivre 8,92 g/mL, or 19,3 g/mL. Un corps flotte sur un liquide si sa masse volumique est plus petite que celle du liquide, et il coule si elle est plus grande : c'est pourquoi l'huile flotte sur l'eau et un clou en fer coule. Retenons aussi : 1 L = 1 000 mL et 1 mL = 1 cm³, donc 1 L d'eau a une masse de 1 000 g = 1 kg.",
      piege:"Confondre masse et volume (« ce sac est plus grand donc plus lourd ») et oublier les unités : il faut que m et V soient dans des unités qui se correspondent (g avec mL, ou kg avec m³). Autre piège : oublier de calculer V(final) − V(initial) pour un solide immergé.",
      astuce:"Triangle magique : m en haut, ρ et V en bas. On cache la grandeur cherchée : m = ρ × V, ρ = m/V, V = m/ρ. Et « ce qui flotte est plus léger pour le même volume ».",
      exercice:"Dans une éprouvette contenant 62 mL d'eau, on plonge un petit objet métallique : le niveau monte à 76 mL. La balance indique une masse de 159,6 g pour cet objet. 1) Calcule le volume de l'objet. 2) Calcule sa masse volumique en g/mL. 3) Sachant que la masse volumique du plomb est 11,4 g/mL et celle du fer 7,86 g/mL, de quel métal s'agit-il ? Cet objet flotte-t-il sur l'eau ?",
      reponse:"1) V = 76 − 62 = 14 mL. 2) ρ = m / V = 159,6 / 14 = 11,4 g/mL. 3) La masse volumique trouvée (11,4 g/mL) est celle du plomb : l'objet est en plomb. Comme 11,4 g/mL est bien supérieur à la masse volumique de l'eau (1 g/mL), l'objet coule : il ne flotte pas."},
    {semester:"S1",
      title:"La pression et la pression atmosphérique",
      essentiel:"Un gaz enfermé exerce une pression sur les parois de son récipient ; l'air qui nous entoure exerce lui aussi une pression sur tout ce qu'il touche, appelée pression atmosphérique, qui vaut en moyenne 1013 hPa au niveau de la mer.",
      cours:"Quand on comprime l'air contenu dans une seringue dont l'orifice est bouché, on sent une résistance : l'air occupe alors un volume plus petit et sa pression augmente ; à l'inverse, si on tire le piston, le volume augmente et la pression diminue. Un gaz est donc compressible (on peut réduire son volume) et expansible (il peut occuper un plus grand volume) : plus on diminue le volume d'un gaz, plus sa pression augmente. La pression se mesure avec un manomètre pour un gaz enfermé, et avec un baromètre pour la pression de l'atmosphère ; son unité internationale est le pascal (Pa), mais on utilise aussi le bar (1 bar = 100 000 Pa) et l'hectopascal (1 hPa = 100 Pa), unité utilisée en météorologie. L'air qui nous entoure, bien qu'invisible, a un poids et exerce une pression sur tout ce qu'il touche : c'est la pression atmosphérique, qui vaut en moyenne 1013 hPa au niveau de la mer, et qui diminue quand l'altitude augmente (l'air est plus « fin » en montagne). Elle varie aussi avec les conditions météorologiques : une pression plus basse que la moyenne annonce souvent la pluie (dépression), une pression plus haute annonce du beau temps (anticyclone). L'expérience historique de Torricelli (un tube rempli de mercure retourné dans une cuve de mercure) a permis de mesurer et de mettre en évidence cette pression atmosphérique pour la première fois. On peut aussi la mettre en évidence simplement : un verre rempli d'eau à ras bord, recouvert d'une feuille de papier rigide et retourné, garde son eau car la pression atmosphérique pousse la feuille vers le haut avec plus de force que le poids de l'eau ne pousse vers le bas.",
      piege:"Croire que l'air ne pèse rien ou que le vide n'exerce aucune force : c'est justement parce que l'air a un poids et exerce une pression que l'expérience du verre d'eau retourné fonctionne. Autre erreur : confondre pascal (unité de base) et hectopascal (100 fois plus grand), ou penser que la pression atmosphérique est la même partout sur Terre.",
      astuce:"Retiens la valeur clé « 1013 hPa au niveau de la mer », comme à la météo. Et pour le sens de variation : « on Comprime = Pression Augmente, on Détend = Pression diminue ».",
      exercice:"Au sommet d'une haute montagne marocaine (environ 4 000 m d'altitude), un randonneur mesure avec un baromètre une pression atmosphérique d'environ 610 hPa, alors qu'elle est de 1013 hPa au niveau de la mer à Agadir. 1) Compare les deux valeurs et explique pourquoi elles sont différentes. 2) Quel appareil permettrait de mesurer la pression d'un gaz enfermé dans une bouteille, et quel appareil mesure la pression atmosphérique ? 3) On enferme de l'air dans une seringue bouchée et on pousse le piston : que deviennent le volume et la pression de l'air ?",
      reponse:"1) La pression au sommet de la montagne (610 hPa) est bien plus faible qu'au niveau de la mer à Agadir (1013 hPa), car la pression atmosphérique diminue quand l'altitude augmente : il y a moins d'air au-dessus de nous en altitude. 2) Un manomètre mesure la pression d'un gaz enfermé (comme dans une bouteille ou un pneu) ; un baromètre mesure la pression atmosphérique. 3) En poussant le piston, on diminue le volume occupé par l'air enfermé, donc sa pression augmente : l'air est compressible."},
    {semester:"S1",
      title:"Mélanges et corps purs",
      essentiel:"Un corps pur est formé d'un seul constituant ; un mélange contient au moins deux corps purs. Un mélange est homogène si on ne distingue pas ses constituants (une seule phase), hétérogène si on les distingue (au moins deux phases).",
      cours:"L'eau distillée, le sel pur ou le sucre pur sont des corps purs. L'eau minérale, l'air, le lait ou le jus d'orange sont des mélanges. Un mélange homogène ne présente qu'une seule phase : on ne voit pas ses constituants, comme l'eau salée, l'eau sucrée ou l'air. Un mélange hétérogène présente au moins deux phases visibles : eau + huile, eau + sable, jus avec pulpe. On dit qu'un liquide est miscible dans l'eau s'il forme un mélange homogène (sirop de menthe) et non miscible s'il forme deux phases (huile). Un solide est soluble s'il disparaît dans l'eau (le sel) et insoluble sinon (le sable). Dans le mélange eau + huile, l'huile se place au-dessus parce qu'elle est moins dense que l'eau ; si on agite fort, on obtient une émulsion. Un corps pur se reconnaît à ses températures de changement d'état constantes : l'eau pure fond à 0 °C et bout à 100 °C, tandis qu'une eau salée bout à une température supérieure à 100 °C.",
      piege:"Croire qu'un liquide transparent est forcément un corps pur : l'eau salée est parfaitement transparente mais c'est un mélange homogène. Inversement, croire que le lait est un corps pur parce qu'il est d'une seule couleur, alors qu'au microscope on voit des gouttelettes de matière grasse (mélange hétérogène).",
      astuce:"« Je vois les morceaux → HÉTÉROgène (hétéroclite, en désordre) ; je ne vois qu'une seule chose → HOMOgène (pareil partout) ».",
      exercice:"Classe ces échantillons en corps pur / mélange homogène / mélange hétérogène et justifie : (a) eau distillée, (b) eau + sel bien agitée, (c) eau + sable, (d) air, (e) vinaigrette (huile + vinaigre au repos), (f) sucre en poudre pur. Puis explique comment tu prouverais expérimentalement que (a) est un corps pur et (b) un mélange.",
      reponse:"(a) eau distillée = corps pur (un seul constituant). (b) eau + sel = mélange homogène (une seule phase, on ne distingue plus le sel). (c) eau + sable = mélange hétérogène (deux phases, le sable est visible et se dépose). (d) air = mélange homogène de gaz (dioxygène, diazote…). (e) vinaigrette au repos = mélange hétérogène (deux phases, l'huile moins dense flotte au-dessus). (f) sucre pur = corps pur. Expérience : on chauffe chaque liquide et on suit la température d'ébullition. L'eau distillée bout à 100 °C et sa température reste constante pendant l'ébullition : c'est un corps pur. L'eau salée bout à une température supérieure à 100 °C et qui varie pendant l'ébullition : c'est un mélange."},
    {semester:"S1",
      title:"Dissolution et séparation des mélanges",
      essentiel:"La dissolution donne une solution : un soluté se dissout dans un solvant (avec l'eau, on obtient une solution aqueuse). Pour séparer les constituants d'un mélange, on utilise la décantation, la filtration ou la distillation.",
      cours:"Le soluté est la substance qui se dissout, le solvant est le liquide qui dissout ; si le solvant est l'eau, on parle de solution aqueuse. Quand on ajoute du sucre à de l'eau et qu'on agite, le sucre devient invisible : il est soluble, et le mélange obtenu est homogène. Lorsqu'on ajoute trop de soluté, il ne se dissout plus et se dépose au fond : la solution est saturée. Le sable, lui, est insoluble et donne un mélange hétérogène. Lors d'une dissolution, la masse totale est conservée : masse de la solution = masse du soluté + masse du solvant. La concentration massique C est la masse de soluté contenue dans un litre de solution : C = m / V, en g/L. Pour séparer les mélanges : la décantation consiste à laisser reposer pour que le solide se dépose ou que les deux liquides se séparent ; la filtration, avec un filtre en papier, retient le solide (le résidu) et laisse passer le liquide (le filtrat) ; la distillation sépare un mélange homogène grâce à une vaporisation suivie d'une liquéfaction dans un réfrigérant, le liquide recueilli s'appelant le distillat. C'est ainsi qu'on obtient de l'eau distillée à partir d'eau salée.",
      piege:"Croire que le sucre « disparaît » ou que sa masse est perdue lors de la dissolution : il est toujours présent dans la solution et la masse totale est conservée. Autre erreur : vouloir séparer de l'eau salée par filtration, alors que le filtre ne retient que les particules solides non dissoutes.",
      astuce:"« Ce qui est dissous ne se filtre pas » : filtration pour l'hétérogène, distillation pour l'homogène. Pour les mots : « soluté = ce qui se dissout, solvant = celui qui dissout ».",
      exercice:"On dissout 20 g de sel dans 500 mL d'eau et on obtient 500 mL de solution. 1) Nomme le soluté et le solvant, et précise si la solution est homogène ou hétérogène. 2) Calcule la concentration massique en g/L. 3) On veut récupérer le sel solide et de l'eau pure séparément : quelle technique choisis-tu ? La filtration convient-elle ? Explique.",
      reponse:"1) Le soluté est le sel, le solvant est l'eau ; la solution obtenue est un mélange homogène (solution aqueuse). 2) V = 500 mL = 0,5 L, donc C = m / V = 20 / 0,5 = 40 g/L. 3) Il faut une distillation : on chauffe la solution, l'eau se vaporise puis se liquéfie dans le réfrigérant et on recueille l'eau distillée (le distillat), tandis que le sel reste dans le ballon. La filtration ne convient pas, car le sel est dissous : il traverse le papier filtre avec l'eau."},
    {semester:"S1",
      title:"Le traitement de l'eau",
      essentiel:"L'eau naturelle n'est pas potable : elle doit passer par une station de traitement qui élimine les gros déchets, les particules et les microbes. En parallèle, les eaux usées doivent être épurées avant d'être rejetées.",
      cours:"Les principales sources de pollution de l'eau sont les eaux usées domestiques, les déchets industriels, les engrais et pesticides agricoles, le pétrole et ses dérivés, ainsi que les déchets végétaux. Pour rendre une eau de surface potable, la station de traitement enchaîne plusieurs étapes : 1) le dégrillage retient les gros objets solides (bois, pierres, plastiques) grâce à des grilles ; 2) la décantation dans un grand bassin laisse se déposer les particules en suspension ; 3) la filtration fait passer l'eau à travers une couche de sable ; 4) l'ozonation avec le gaz ozone (O₃) détruit une partie des microbes et supprime les mauvais goûts et odeurs ; 5) le passage sur charbon actif retient les impuretés dissoutes ; 6) la stérilisation finale par le chlore (chloration) garantit une eau sans microbes jusqu'au robinet. Une eau potable doit être limpide, inodore, sans microbes, et contenir des sels minéraux en quantité réglementée. Pour limiter la pollution : ne rien jeter de chimique dans l'évier, choisir des produits de lavage moins polluants, ne pas jeter de déchets dans les oueds et raccorder les eaux usées à une station d'épuration.",
      piege:"Confondre eau limpide et eau potable : une eau claire peut contenir des microbes et des substances dissoutes dangereuses. Autre confusion : mélanger le traitement de l'eau potable (avant consommation) et l'épuration des eaux usées (après utilisation).",
      astuce:"Retiens l'ordre du plus gros au plus petit : « Grilles → Dépôt → Sable → Ozone → Charbon → Chlore ». On enlève d'abord ce qui se voit, puis ce qui ne se voit pas.",
      exercice:"Une eau prélevée dans un oued est trouble et contient des brindilles, du sable fin et des bactéries. 1) Indique, dans l'ordre, les opérations qui permettront de la rendre potable et précise ce que chacune élimine. 2) Pourquoi la filtration seule ne suffit-elle pas ? 3) Cite deux gestes concrets pour éviter de polluer l'eau à la maison.",
      reponse:"1) Ordre : dégrillage (retient les brindilles et gros déchets) ; décantation (les particules en suspension se déposent au fond du bassin) ; filtration sur sable (retient le sable fin et les fines particules restantes) ; ozonation avec O₃ (détruit une partie des microbes, supprime goûts et odeurs) ; charbon actif (retient les impuretés dissoutes) ; stérilisation au chlore (élimine les microbes restants). 2) Parce que la filtration ne retient que les particules solides : les bactéries et les substances dissoutes passent à travers le filtre, il faut donc une désinfection (ozone, chlore). 3) Ne jamais verser d'huile, de peinture ou de médicaments dans l'évier ou les toilettes ; utiliser moins de produits de lavage et choisir les moins polluants (et raccorder les eaux usées à l'assainissement)."},
    {semester:"S2",
      title:"L'électricité autour de nous",
      essentiel:"L'électricité que nous utilisons chaque jour est produite loin de chez nous dans des centrales électriques, à partir de sources d'énergie renouvelables ou non renouvelables, puis transportée par des lignes à haute tension et distribuée jusqu'à nos maisons.",
      cours:"On distingue plusieurs modes de production de l'électricité selon la source d'énergie utilisée. Les sources d'énergie non renouvelables s'épuisent à l'échelle humaine : les centrales thermiques classiques brûlent du charbon, du fioul ou du gaz naturel pour produire de la chaleur qui fait tourner une turbine reliée à un alternateur, et les centrales nucléaires utilisent la fission de l'uranium. Les sources d'énergie renouvelables se renouvellent en permanence : les centrales hydrauliques utilisent la chute de l'eau des barrages, les centrales solaires transforment la lumière du Soleil en électricité, et les éoliennes utilisent la force du vent. Dans tous les cas, un alternateur transforme l'énergie mécanique en énergie électrique. Cette électricité produite est ensuite élevée à très haute tension par des transformateurs pour limiter les pertes pendant le transport sur de longues distances par les lignes à haute tension. Près des villes, d'autres transformateurs abaissent progressivement la tension avant la distribution jusqu'au compteur électrique de chaque maison.",
      piege:"Croire que l'électricité est stockée quelque part comme de l'eau dans un réservoir : en réalité, elle est produite au moment même où on l'utilise, ce qui explique pourquoi la production doit s'adapter en permanence à la consommation. Autre erreur : confondre source d'énergie renouvelable (qui ne s'épuise pas, comme le vent ou le Soleil) et source non renouvelable (qui s'épuise, comme le charbon ou le pétrole).",
      astuce:"Retiens « P.T.D. » pour le trajet de l'électricité : Production (à la centrale), Transport (lignes à haute tension), Distribution (jusqu'à la maison, après abaissement de la tension). Et pour les sources : « ce qui vient du Soleil, du vent ou de l'eau qui coule ne s'épuise pas ».",
      exercice:"Une centrale marocaine produit de l'électricité grâce à de grands panneaux solaires ; une autre utilise la force du vent avec de grandes éoliennes ; une troisième brûle du charbon. 1) Classe ces trois modes de production en énergies renouvelables et non renouvelables, en justifiant. 2) Pourquoi élève-t-on la tension de l'électricité à des valeurs très importantes avant de la transporter sur de longues lignes ? 3) Décris dans l'ordre les trois grandes étapes qui séparent la centrale électrique de la lampe allumée dans une maison.",
      reponse:"1) Énergies renouvelables : l'énergie solaire et l'énergie éolienne, qui ne s'épuisent pas avec leur utilisation. Énergie non renouvelable : le charbon, un combustible fossile qui s'épuise. 2) Une tension très élevée permet de transporter la même puissance électrique avec une intensité plus faible, ce qui réduit fortement les pertes d'énergie par échauffement dans les câbles sur de longues distances. 3) Production dans la centrale (l'alternateur transforme l'énergie mécanique en énergie électrique) ; transport à haute tension par les lignes électriques après élévation de la tension par un transformateur ; distribution après abaissement progressif de la tension par d'autres transformateurs, jusqu'au compteur puis à la lampe de la maison."},
    {semester:"S2",
      title:"Le circuit électrique simple et ses symboles",
      essentiel:"Un circuit électrique simple comprend au minimum un générateur, un récepteur et des fils de connexion. Le courant ne circule que si le circuit est fermé, et on représente le circuit par un schéma normalisé.",
      cours:"Un dipôle est un composant à deux bornes : la pile, la lampe, le moteur, l'interrupteur sont des dipôles. Le générateur (pile, batterie) fournit le courant électrique ; le récepteur (lampe, moteur, buzzer) a besoin du courant pour fonctionner. Pour que le courant passe, le circuit doit former une boucle fermée ; si l'interrupteur est ouvert, le circuit est ouvert et la lampe s'éteint. On dessine le circuit avec des symboles normalisés et des traits droits : un rond avec une croix pour la lampe, un rond avec la lettre M pour le moteur, deux traits parallèles inégaux pour la pile (le trait long est le pôle +), un trait avec un segment mobile pour l'interrupteur, un rond avec A pour l'ampèremètre et V pour le voltmètre. À l'extérieur du générateur, le courant circule du pôle positif (+) vers le pôle négatif (−) : c'est le sens conventionnel du courant, représenté par une flèche sur un fil. Exemple concret : une lampe de poche est un circuit simple pile + lampe + interrupteur ; une lampe à incandescence contient une chaîne conductrice : plot central, filament, tiges métalliques et culot, séparés par une bague isolante.",
      piege:"Dessiner un schéma avec un seul fil, ou oublier que le circuit doit former une boucle FERMÉE. Autre erreur fréquente : croire que la lampe « produit » l'électricité (c'est un récepteur, pas un générateur) et dessiner les fils en courbes au lieu de traits droits.",
      astuce:"« G.R.F. » pour les 3 éléments indispensables : Générateur, Récepteur, Fils (+ interrupteur pour commander). Et pour le sens du courant : « il sort par le PLUS, il rentre par le MOINS ».",
      exercice:"On dispose d'une pile, de deux lampes, d'un interrupteur et de fils de connexion. 1) Fais la liste des dipôles en indiquant, pour chacun, s'il est générateur ou récepteur. 2) Décris le schéma normalisé d'un circuit où une seule lampe est allumée et commandée par l'interrupteur (nomme les symboles utilisés et indique le sens du courant). 3) L'interrupteur est ouvert : la lampe brille-t-elle ? Pourquoi ?",
      reponse:"1) La pile est le générateur (elle fournit le courant) ; les deux lampes sont des récepteurs (elles consomment le courant pour éclairer) ; l'interrupteur et les fils de connexion ne sont ni générateur ni récepteur : ils servent à relier et à commander le circuit. 2) On dessine une boucle fermée avec des traits droits reliant : le symbole de la pile (deux traits parallèles inégaux, trait long = pôle +), le symbole de l'interrupteur, puis le symbole de la lampe (un cercle avec une croix). Une flèche sur un fil indique le sens conventionnel du courant : il sort de la borne + de la pile, traverse l'interrupteur et la lampe, et revient à la borne −. 3) Non : quand l'interrupteur est ouvert, le circuit est ouvert, le courant ne peut plus circuler et la lampe reste éteinte."},
    {semester:"S2",
      title:"Conducteurs, isolants et court-circuit",
      essentiel:"Un conducteur laisse passer le courant électrique (les métaux), un isolant ne le laisse pas passer (plastique, bois sec, verre, air). Un dipôle est court-circuité quand ses deux bornes sont reliées par un fil conducteur.",
      cours:"Pour tester un matériau, on l'intercale entre les points A et B d'un circuit contenant une pile et une lampe. Avec un clou en fer ou un morceau de cuivre, la lampe brille : ces matériaux sont conducteurs. Avec une règle en plastique, un morceau de bois, du tissu ou de l'air, la lampe reste éteinte : ce sont des isolants. Les principaux conducteurs sont les métaux (cuivre, fer, aluminium, argent), le graphite du crayon, mais aussi l'eau du robinet et le corps humain (attention, danger). Les principaux isolants sont le plastique, le caoutchouc, le verre, le bois sec, le papier et l'air. C'est pourquoi les fils électriques sont en cuivre à l'intérieur (conducteur) et entourés d'une gaine en plastique (isolant). Un dipôle est court-circuité lorsque ses deux bornes sont reliées directement par un fil : le courant passe alors par le fil au lieu de traverser le dipôle, qui cesse de fonctionner. Le court-circuit d'un GÉNÉRATEUR est dangereux : le courant devient très intense, les fils chauffent fortement et peuvent provoquer un incendie. Un court-circuit arrive souvent par accident, quand un fil perd sa gaine isolante.",
      piege:"Croire que l'eau pure et l'eau du robinet, c'est pareil : l'eau distillée est très peu conductrice, mais l'eau du robinet contient des sels dissous qui la rendent conductrice, d'où le danger de l'électricité dans une salle de bain. Autre erreur : dire que le bois est conducteur parce qu'il vient d'un arbre.",
      astuce:"« Métal = Marche, Plastique = Pas de passage ». Et pour le court-circuit : « le courant est paresseux, il prend toujours le chemin le plus facile ».",
      exercice:"Dans un circuit pile + lampe, on intercale successivement entre A et B : un trombone en métal, une gomme, une mine de crayon (graphite), un morceau de verre, un fil de cuivre. 1) Indique dans chaque cas si la lampe brille et classe les matériaux en conducteurs / isolants. 2) On relie ensuite directement les deux bornes de la lampe par un fil de cuivre : que se passe-t-il pour la lampe ? Comment appelle-t-on cette situation ? 3) Pourquoi ne faut-il jamais relier les deux bornes de la pile par un fil ?",
      reponse:"1) La lampe brille avec le trombone en métal, la mine de crayon (graphite) et le fil de cuivre : ce sont des conducteurs. Elle reste éteinte avec la gomme et le verre : ce sont des isolants. 2) La lampe s'éteint : le courant passe par le fil de cuivre, qui offre un chemin plus facile, au lieu de traverser la lampe. La lampe est court-circuitée. 3) Relier les deux bornes de la pile réalise un court-circuit du générateur : le courant devient très intense, la pile et les fils chauffent beaucoup, la pile se décharge très vite et il y a un risque de brûlure ou d'incendie."},
    {semester:"S2",
      title:"Circuits en série et en dérivation",
      essentiel:"Dans un circuit en série, tous les dipôles sont sur une seule boucle : si l'un s'arrête, tout s'arrête. Dans un circuit en dérivation (parallèle), il y a plusieurs boucles indépendantes : chaque appareil fonctionne séparément.",
      cours:"Avec un générateur et deux lampes identiques montées en série, il n'y a qu'une seule boucle : les deux lampes brillent faiblement, et si une lampe est grillée ou dévissée, l'autre s'éteint aussi. Avec les mêmes lampes montées en dérivation, chaque lampe est reliée directement aux deux bornes du générateur : elles brillent normalement, et si l'une grille, l'autre reste allumée. Dans un circuit en dérivation, on distingue les nœuds (points de rencontre de trois fils au moins), la branche principale (celle du générateur) et les branches dérivées. Plus on ajoute de lampes en série, plus l'éclat de chacune diminue ; en dérivation, l'éclat ne change pas. C'est pourquoi, dans une maison, toutes les lampes et les prises sont branchées en dérivation : on peut allumer la cuisine sans allumer le salon, et une ampoule grillée n'éteint pas la maison. Exemple concret : les anciennes guirlandes étaient en série (une ampoule grillée éteignait toute la guirlande), alors que l'éclairage d'une maison est en dérivation.",
      piege:"Croire que « plus il y a de lampes, plus ça éclaire » : en série, ajouter des lampes diminue l'éclat de chacune. Autre erreur : confondre un nœud avec un simple croisement de fils dessinés, ou penser que les lampes en dérivation se gênent entre elles.",
      astuce:"« SÉRIE = une SEULE route : un bouchon et tout s'arrête. DÉRIVATION = plusieurs routes : chacun a son chemin. » À la maison, tout est en dérivation.",
      exercice:"Deux montages utilisent la même pile et deux lampes identiques L1 et L2. Montage A : une seule boucle. Montage B : deux boucles, chaque lampe reliée aux bornes de la pile. On dévisse L2 : dans A, L1 s'éteint ; dans B, L1 reste allumée. 1) Identifie le type de montage A et B. 2) Compare l'éclat des lampes dans les deux montages et explique. 3) Quel montage est utilisé pour l'éclairage d'une maison ? Donne deux raisons.",
      reponse:"1) Le montage A est un montage en série (une seule boucle, dipôles les uns à la suite des autres) ; le montage B est un montage en dérivation (ou parallèle), avec plusieurs boucles indépendantes. 2) Dans le montage en série, les deux lampes brillent faiblement car l'éclat dépend du nombre de dipôles de la boucle unique ; dans le montage en dérivation, chaque lampe est reliée directement aux bornes du générateur et brille normalement. 3) L'éclairage d'une maison est en dérivation, parce que chaque appareil fonctionne indépendamment des autres (on allume une pièce sans allumer les autres) et parce qu'une lampe grillée n'empêche pas les autres de fonctionner."},
    {semester:"S2",
      title:"Intensité du courant et tension électrique",
      essentiel:"L'intensité I se mesure en ampère (A) avec un ampèremètre branché en série ; la tension U se mesure en volt (V) avec un voltmètre branché en dérivation aux bornes du dipôle.",
      cours:"Le courant continu est produit par un générateur possédant un pôle + et un pôle − ; son symbole est = ou DC. L'intensité du courant, notée I, mesure le débit du courant électrique : plus une lampe brille, plus l'intensité est grande. Elle se mesure avec un ampèremètre branché EN SÉRIE dans la branche étudiée, en respectant sa polarité (le courant entre par la borne rouge et sort par la borne COM) ; l'unité est l'ampère (A), avec 1 A = 1 000 mA. La tension, notée U, s'exerce entre les deux bornes d'un dipôle et se mesure avec un voltmètre branché EN DÉRIVATION (en parallèle) aux bornes de ce dipôle ; l'unité est le volt (V) : une pile ronde porte 1,5 V, une pile plate 4,5 V, un générateur de laboratoire délivre souvent 6 V ou 9 V, et une prise du secteur 220 V. Avec un appareil à aiguille, on calcule la valeur avec la relation I = C × n / N, où C est le calibre choisi, n la graduation lue et N le nombre total de graduations : par exemple pour C = 10 mA, n = 68 et N = 100, on obtient I = 6,8 mA. En série, l'intensité est la même partout ; en dérivation, l'intensité dans la branche principale est égale à la somme des intensités des branches dérivées (loi des nœuds), et la tension aux bornes de plusieurs dipôles en série s'additionne (loi d'additivité des tensions).",
      piege:"Brancher l'ampèremètre en dérivation ou le voltmètre en série : c'est la confusion la plus fréquente, elle empêche toute mesure correcte et peut abîmer l'appareil. Autre erreur : confondre intensité et tension, ou oublier de convertir les mA en A.",
      astuce:"« l'ampèrEmètre s'insÈre (en sÉrie), le voltmètre se pose à cÔte (en dérivatiOn) ». Retiens aussi : I en Ampère avec un Ampèremètre, U en Volt avec un Voltmètre.",
      exercice:"Dans un circuit en dérivation, la branche principale porte un ampèremètre qui indique I = 0,45 A. La première branche dérivée contient une lampe traversée par I1 = 0,25 A, la seconde une autre lampe. Un voltmètre branché aux bornes de la pile indique 4,5 V. 1) Comment doivent être branchés l'ampèremètre et le voltmètre ? 2) Calcule l'intensité I2 dans la seconde branche et nomme la loi utilisée. 3) Convertis I2 en milliampères.",
      reponse:"1) L'ampèremètre doit être branché en série dans la branche où l'on veut mesurer l'intensité, en respectant sa polarité ; le voltmètre doit être branché en dérivation (en parallèle) aux bornes du dipôle, ici la pile. 2) D'après la loi des nœuds, I = I1 + I2, donc I2 = I − I1 = 0,45 − 0,25 = 0,20 A. 3) I2 = 0,20 A = 200 mA (car 1 A = 1 000 mA)."},
    {semester:"S2",
      title:"La résistance électrique",
      essentiel:"Un conducteur ohmique (résistor) s'oppose au passage du courant électrique : plus sa résistance, mesurée en ohms (Ω), est grande, plus l'intensité du courant qui le traverse est petite.",
      cours:"Un conducteur ohmique, aussi appelé résistor, est un dipôle caractérisé par une grandeur appelée résistance électrique, notée R, dont l'unité internationale est l'ohm, de symbole Ω (on utilise aussi le kilohm, 1 kΩ = 1 000 Ω). On mesure une résistance directement avec un ohmmètre (ou un multimètre réglé en position ohmmètre), en veillant à ne jamais mesurer une résistance branchée dans un circuit sous tension. On peut aussi déterminer sa valeur sans instrument, grâce au code international des couleurs : chaque résistor porte des anneaux colorés qui indiquent sa valeur (par exemple, marron-noir-rouge donne 1 000 Ω, soit 1 kΩ). Quand on ajoute un conducteur ohmique dans un circuit en série avec une pile et une lampe, la lampe brille moins fort : plus la résistance ajoutée est grande, plus l'intensité du courant dans le circuit diminue. La place du conducteur ohmique dans un circuit en série (avant ou après la lampe) ne change rien à l'intensité du courant, qui reste la même partout dans une boucle en série. Le rhéostat est un résistor dont on peut faire varier la résistance en déplaçant un curseur, ce qui permet par exemple de régler la vitesse d'un petit moteur ou l'éclat d'une lampe.",
      piege:"Croire qu'ajouter une résistance dans un circuit fait « perdre » du courant en cours de route : en réalité, dans un circuit en série, l'intensité reste la même en tout point, mais elle est plus faible dans tout le circuit si la résistance totale est plus grande. Autre erreur : mesurer une résistance avec l'ohmmètre pendant que le circuit est encore alimenté par une pile, ce qui fausse la mesure.",
      astuce:"Retiens : « plus il y a de résistance, moins il y a de passage », comme un tuyau plus étroit qui laisse passer moins d'eau. Et pour l'unité : « R comme Résistance, Ω comme Ohm ».",
      exercice:"Dans un circuit série, une pile de 4,5 V alimente une lampe seule : l'ampèremètre indique 0,3 A. On ajoute ensuite un conducteur ohmique de résistance R = 10 Ω dans le même circuit, en série avec la lampe : l'ampèremètre indique alors 0,18 A. 1) Compare les deux intensités mesurées et explique la différence. 2) Le conducteur ohmique est-il placé avant ou après la lampe ? Cela change-t-il la valeur mesurée par l'ampèremètre ? 3) Cite un instrument permettant de mesurer directement la valeur de R sans le brancher dans le circuit sous tension, et un second moyen de connaître cette valeur.",
      reponse:"1) L'intensité diminue (de 0,3 A à 0,18 A) car l'ajout du conducteur ohmique augmente la résistance totale du circuit, ce qui réduit l'intensité du courant qui peut circuler. 2) Dans un circuit en série, la place du conducteur ohmique (avant ou après la lampe) ne change pas la mesure : l'intensité est la même en tout point d'une boucle en série. 3) On peut mesurer R directement avec un ohmmètre (multimètre en position ohmmètre), le résistor étant débranché de toute pile ; on peut aussi lire sa valeur grâce au code international des couleurs imprimé sur le résistor."},
    {semester:"S2",
      title:"Sécurité électrique",
      essentiel:"Le corps humain est conducteur : un contact avec le courant du secteur (220 V) provoque une électrisation qui peut devenir mortelle (électrocution). Fusibles, disjoncteurs et isolants protègent les personnes et les installations.",
      cours:"Deux grands dangers existent : pour les personnes, l'électrisation, qui peut entraîner des brûlures, un arrêt du cœur et la mort (électrocution) ; pour les installations, la surintensité due à un court-circuit ou à une surcharge, qui échauffe les fils et peut provoquer un incendie. Plus la tension reçue est grande, plus le courant qui traverse le corps est important : le secteur à 220 V est donc très dangereux, contrairement à une pile de 4,5 V. Les protections sont le fusible, qui fond et coupe le circuit en cas de surintensité, le disjoncteur, qui coupe automatiquement le courant et se réarme, la prise de terre et les gaines isolantes des fils. Les règles de sécurité à la maison : ne jamais toucher une borne de prise ni un fil dénudé, ne jamais introduire d'objet métallique dans une prise, ne jamais utiliser d'appareil électrique avec les mains mouillées ou dans une pièce humide (salle de bain), débrancher un appareil avant toute réparation, ne pas surcharger une multiprise et remplacer les rallonges abîmées. Exemple concret : une rallonge branchée au secteur mais sans appareil au bout est un danger classique pour un jeune enfant qui touche les bornes.",
      piege:"Croire qu'on peut toucher un fil ou une prise « juste une seconde », ou croire que l'eau est un isolant. L'eau du robinet, la sueur et le corps humain conduisent le courant : l'humidité augmente énormément le danger.",
      astuce:"Les 3 « jamais » : « Jamais les doigts dans une prise, jamais un appareil électrique les mains mouillées, jamais réparer sans débrancher. » Et : « fusible = sentinelle qui se sacrifie ».",
      exercice:"Karim veut brancher un radiateur électrique dans la salle de bain avec une rallonge dont la gaine est fendue, sur une multiprise où sont déjà branchés un sèche-cheveux et une machine à laver. 1) Relève trois comportements dangereux et explique le risque de chacun. 2) Quel dispositif de l'installation devrait couper le courant en cas de court-circuit ou de surcharge ? 3) Que faut-il faire avant de réparer un appareil électrique ?",
      reponse:"1) (a) Utiliser un appareil électrique dans une salle de bain humide : l'eau et l'humidité conduisent le courant, d'où un risque d'électrisation voire d'électrocution. (b) Utiliser une rallonge à la gaine fendue : le fil dénudé peut provoquer un court-circuit ou un contact direct avec un conducteur, donc électrisation et incendie. (c) Surcharger une multiprise avec plusieurs appareils puissants : l'intensité devient trop grande, les fils chauffent et il y a risque d'incendie. 2) Le fusible (qui fond et coupe le circuit) et surtout le disjoncteur du tableau électrique, qui coupe automatiquement le courant en cas de surintensité ; la prise de terre protège aussi les personnes. 3) Il faut toujours débrancher l'appareil du secteur avant toute réparation, et ne jamais intervenir avec les mains mouillées."},
    {semester:"S2",
      title:"Sources, récepteurs, couleurs et lumière blanche",
      essentiel:"Une source de lumière est un corps qui émet ou renvoie de la lumière : primaire si elle la produit elle-même (Soleil, lampe), secondaire si elle la diffuse (Lune, mur éclairé). Un récepteur est un objet sensible à la lumière (œil, photopile) ; la lumière blanche est en réalité composée de plusieurs couleurs. (Remarque : ce chapitre correspond au programme de 2AC au Maroc, pas de 1AC.)",
      cours:"Les sources primaires produisent leur propre lumière : le Soleil, une lampe à incandescence, une flamme de bougie, un ver luisant. Les sources secondaires ne produisent pas de lumière mais renvoient (diffusent) celle qu'elles reçoivent : la Lune, une table, un mur, un écran de cinéma ; un objet diffusant n'est une source que s'il est éclairé. Un récepteur de lumière est un objet sensible à la lumière : l'œil (récepteur physiologique qui transmet un message nerveux au cerveau par le nerf optique), la photopile ou cellule photovoltaïque (qui transforme l'énergie lumineuse en énergie électrique), la pellicule photographique (chlorure d'argent) et les feuilles des plantes vertes. Pour voir un objet, il faut que cet objet soit éclairé et que la lumière qu'il diffuse entre dans notre œil. Quand on fait passer un faisceau de lumière blanche à travers un prisme, on obtient un ensemble de couleurs (rouge, orange, jaune, vert, bleu, indigo, violet) : c'est la dispersion, qui montre que la lumière blanche est une lumière composée ; l'arc-en-ciel est la version naturelle de cette expérience, les gouttes de pluie jouant le rôle du prisme. Un filtre coloré ne laisse passer que sa propre couleur.",
      piege:"Croire que la Lune produit sa lumière : c'est une source secondaire, elle renvoie la lumière du Soleil. Autre erreur : penser qu'on peut voir un objet dans le noir complet, ou croire que la lumière blanche est une couleur « simple ».",
      astuce:"Moyen mnémotechnique pour les couleurs du spectre : « ROJVBIV » (Rouge, Orange, Jaune, Vert, Bleu, Indigo, Violet). Et : « source PRIMAIRE = elle PRODUIT, source SECONDAIRE = elle RENVOIE ».",
      exercice:"1) Classe en sources primaires, sources secondaires ou récepteurs : le Soleil, la Lune, l'œil, une bougie allumée, un panneau solaire, un miroir éclairé, une ampoule allumée. 2) Explique pourquoi on ne voit rien dans une pièce totalement noire, même les yeux ouverts. 3) Quelle expérience simple montre que la lumière blanche est composée ?",
      reponse:"1) Sources primaires : le Soleil, la bougie allumée, l'ampoule allumée (elles produisent leur lumière). Sources secondaires : la Lune, le miroir éclairé (ils renvoient la lumière reçue). Récepteurs : l'œil (récepteur physiologique) et le panneau solaire / photopile (récepteur qui transforme la lumière en électricité). 2) Pour voir un objet, il faut qu'il soit éclairé et que la lumière qu'il diffuse entre dans l'œil. Dans une pièce totalement noire, aucune lumière n'est diffusée vers nos yeux, donc on ne voit rien. 3) On fait passer un faisceau de lumière blanche à travers un prisme (ou un CD, ou des gouttes d'eau) : on observe la dispersion en plusieurs couleurs, du rouge au violet, ce qui prouve que la lumière blanche est une lumière composée."}

    {semester:"S1",
      title:"شكل الأرض وتمثيلها والإحداثيات",
      essentiel:"الأرض كوكب شبه كروي منتفخ عند خط الاستواء ومفلطح عند القطبين، ونمثّلها بالخرائط، ونحدّد المواقع عليها بخطوط الطول ودوائر العرض.",
      cours:"أثبتت الصور المأخوذة من الأقمار الاصطناعية أن الأرض كروية الشكل تقريباً، فهي مفلطحة عند القطبين ولذلك يقال إن شكلها إهليلجي، ومساحتها حوالي 510 مليون كلم². لأن الأرض كبيرة جداً نستعمل لتمثيلها الصور الجوية والتصاميم والخرائط، والخريطة هي تمثيل مصغّر ومستوٍ لسطح الأرض أو لجزء منه، وتستعمل رموزاً نقطية وخطية ومساحية. ولتحديد موقع أي مكان نستعمل شبكة الإحداثيات: خطوط الطول وهي أنصاف دوائر وهمية تلتقي عند القطبين وعددها 360، وخط الطول الأساسي هو خط غرينتش (0°)، وتُستعمل لتحديد الموقع والتوقيت؛ ودوائر العرض وهي دوائر وهمية متوازية عددها 180، وأكبرها خط الاستواء (0°)، وتُستعمل لتحديد الموقع ونوع المناخ. مثال ملموس: يوجد المغرب بين دائرتي عرض 21° و36° شمالاً وبين خطي طول 1° و17° غرب غرينتش.",
      piege:"خطأ شائع: الخلط بين خطوط الطول ودوائر العرض. تذكّري أن خطوط الطول «طويلة» تمتدّ من قطب إلى قطب وتتقاطع عندهما، أما دوائر العرض فهي دوائر كاملة متوازية لا تلتقي أبداً. وخطأ آخر: كتابة إحداثيات المغرب بالجنوب أو بالشرق، والصحيح: شمال خط الاستواء وغرب غرينتش.",
      astuce:"«الطول من القطب إلى القطب، والعرض حلقات موازية». وللترتيب: الطول ← غرينتش ← التوقيت؛ العرض ← الاستواء ← المناخ.",
      exercice:"حدّدي بالخريطة موقع مدينة تقع على دائرة عرض 34° شمالاً وخط طول 6° غرب غرينتش، ثم أجيبي: ما الفرق بين خطوط الطول ودوائر العرض؟ وفيمَ تُستعمل كل منهما؟",
      reponse:"المدينة تقع شمال خط الاستواء بـ34 درجة وغرب خط غرينتش بـ6 درجات، أي داخل المجال المغربي (مثل مدينة الرباط تقريباً). الفرق: خطوط الطول أنصاف دوائر وهمية تصل بين القطبين، عددها 360، وخطها الأساسي هو غرينتش، وتُستعمل لتحديد الموقع والتوقيت؛ أما دوائر العرض فهي دوائر وهمية متوازية عددها 180، وأكبرها خط الاستواء، وتُستعمل لتحديد الموقع ونوع المناخ."},
    {semester:"S1",
      title:"الأرض كوكب متغير: اليابس والماء والهواء",
      essentiel:"الأرض كوكب في تحوّل مستمر: تدور حول نفسها وحول الشمس، ويتوزّع سطحها بين يابس (29%) وماء (71%)، ويغلّفها الغلاف الجوي الذي يصنع الطقس والمناخ.",
      cours:"تقوم الأرض بدورتين: دورة محورية حول نفسها من الغرب إلى الشرق في 24 ساعة فينتج عنها تعاقب الليل والنهار واختلاف التوقيت حسب غرينتش، ودورة انتقالية حول الشمس في 365 يوماً و6 ساعات على مدار إهليلجي مائل فينتج عنها تعاقب الفصول وتكوّن المناطق المناخية (حارة معتدلة باردة). يمثّل اليابس حوالي 150 مليون كلم² موزّعة على القارات: آسيا 44، أمريكا 42، إفريقيا 30، القارة القطبية الجنوبية 14، أوروبا 10، أستراليا 10 مليون كلم²؛ ومن تضاريسه الجبال (الأعلى والأكثر انحداراً) ثم الهضاب والتلال ثم السهول والأحواض. أما الماء فيغطّي 71% من سطح الأرض بمساحة تقارب 376 مليون كلم²، وأكبر المحيطات الهادي (180) فالأطلنتي (106) فالهندي (75)؛ ومعدّل ملوحة مياه البحار 34.7 غرام في اللتر، وتتحرك مياهها بالمدّ والجزر (بفعل جاذبية الشمس والقمر) والأمواج والتيارات البحرية (بفعل الرياح). ويلفّ كل ذلك الغلاف الجوي المكوّن أساساً من الآزوت والأكسجين، وطبقته السفلى هي التروبوسفير حيث تحدث الاضطرابات الجوية؛ ونقيس الحرارة بالمحرار والتساقطات بالممطار والضغط الجوي بالبارومتر (وحدته الميلبار) وسرعة الرياح بالأنيمومتر.",
      piege:"خطأ شائع: الخلط بين الطقس والمناخ. الطقس هو حالة الجو في مكان معيّن خلال مدة قصيرة (أقل من 24 ساعة)، أما المناخ فهو حصيلة أحوال الطقس خلال مدة طويلة (شهر أو فصل أو سنة) في منطقة معيّنة.",
      astuce:"رقمان فقط: 71% ماء و29% يابس، وقاعدة «الطقس اليوم، المناخ سنوات». ولحفظ الدورتين: «محورية = ليل ونهار، انتقالية = فصول».",
      exercice:"1) ما نتيجة الدورة المحورية للأرض؟ وما نتيجة الدورة الانتقالية؟ 2) ما الفرق بين الطقس والمناخ؟ 3) أي المحيطات أكبر مساحة؟",
      reponse:"1) الدورة المحورية (24 ساعة حول محور الأرض) ينتج عنها تعاقب الليل والنهار واختلاف التوقيت؛ والدورة الانتقالية (365 يوماً و6 ساعات حول الشمس) ينتج عنها تعاقب الفصول واختلاف المناطق المناخية. 2) الطقس حالة الجو في مكان محدّد وفي مدة قصيرة جداً، والمناخ حصيلة أحوال الطقس في منطقة معيّنة خلال مدة طويلة. 3) المحيط الهادي هو الأكبر بمساحة تقارب 180 مليون كلم²."},
    {semester:"S2",
      title:"السكان والكثافة السكانية",
      essentiel:"ينمو سكان العالم ويتوزّعون بشكل متفاوت، ونقيس ذلك بالكثافة السكانية أي عدد السكان في الكيلومتر المربع الواحد.",
      cours:"انتقل عدد سكان العالم من 1.65 مليار نسمة سنة 1900م إلى 6.2 مليار نسمة سنة 2000م، ومرّ هذا النمو بثلاث مراحل: نمو بطيء بين 1900 و1950 بسبب الحروب والأوبئة والمجاعات (زيادة 875 مليون نسمة)، ثم نمو سريع جداً بين 1950 و1990 يُسمّى الانفجار الديموغرافي (زيادة 2875 مليون نسمة) بفضل تطوّر الفلاحة وتحسّن التغذية وتقدّم الطب، ثم مرحلة تراجع النمو بسبب انتشار الوعي وارتفاع تكاليف العيش. ونحسب نسبة الولادات والوفيات لكل ألف نسمة، ونسبة التزايد الطبيعي = نسبة الولادات ناقص نسبة الوفيات؛ وهي تقارب 28 في الألف بالبلدان السائرة في طريق النمو وأقل من 8 في الألف بالبلدان المتقدمة. أما التوزيع فمتفاوت بين مناطق آهلة بالسكان ومناطق قليلة السكان، وتتحكم فيه عوامل طبيعية (المناخ، التضاريس، الموارد) وتاريخية (قدم التعمير والهجرات) واقتصادية (فرص الشغل والبنيات التحتية) وسياسية. ولمقارنة الأمكنة نستعمل الكثافة السكانية = عدد السكان ÷ المساحة، وتُقاس بنسمة في الكيلومتر المربع؛ مثال: منطقة بها 500.000 نسمة ومساحتها 5.000 كلم² كثافتها 100 نسمة/كلم².",
      piege:"خطأ شائع: الاعتقاد أن الكثافة السكانية هي عدد السكان. الصحيح أنها علاقة بين عدد السكان والمساحة: بلد كثير السكان وواسع المساحة قد تكون كثافته ضعيفة، وبلد صغير قليل السكان قد تكون كثافته مرتفعة.",
      astuce:"احفظي العبارة: «ناس على مساحة». الكثافة = السكان ÷ المساحة، والوحدة ن/كلم². وللنمو: 1900 ← مليار و650 مليون، 2000 ← 6.2 مليار، أي أن العدد تضاعف تقريباً أربع مرات في قرن واحد.",
      exercice:"بلد عدد سكانه 36.000.000 نسمة ومساحته 720.000 كلم². 1) احسبي كثافته السكانية. 2) إذا كانت نسبة الولادات 20 في الألف والوفيات 6 في الألف، فما نسبة التزايد الطبيعي؟",
      reponse:"1) الكثافة = 36.000.000 ÷ 720.000 = 50 نسمة في الكيلومتر المربع. 2) نسبة التزايد الطبيعي = 20 − 6 = 14 في الألف."},
    {semester:"S2",
      title:"أنشطة السكان: الفلاحة والصناعة والخدمات",
      essentiel:"تنقسم أنشطة السكان الاقتصادية إلى ثلاثة قطاعات: الفلاحة (القطاع الأول)، والصناعة (القطاع الثاني)، والتجارة والخدمات (القطاع الثالث).",
      cours:"الفلاحة نشاط اقتصادي يقوم على زراعة الأرض وتربية الماشية والدواجن، وهي القطاع الأول وتشغّل حوالي 45% من السكان النشيطين في العالم، وتنقسم إلى فلاحة تقليدية (أدوات بسيطة، مردودية ضعيفة، إنتاج معيشي) وفلاحة عصرية (تقنيات حديثة، ضيعات واسعة، مردودية مرتفعة، إنتاج موجّه للسوق)، وتتحكّم فيها مقومات طبيعية (التضاريس، التربة، المناخ) وبشرية (الأساليب والتقنيات ورؤوس الأموال وسياسة الدولة). والصناعة نشاط اقتصادي يحوّل المواد الأولية الخام المأخوذة من الطبيعة إلى منتوجات قابلة للاستعمال باستخدام مصادر الطاقة، وتنقسم إلى صناعة تقليدية (الفخار، الحلي، الملابس التقليدية) وصناعة عصرية (السيارات، الطائرات، الحواسيب)، وإلى صناعات أساسية (الصلب، تكرير البترول) وتجهيزية (الميكانيكية، الإلكترونية) واستهلاكية (الغذائية، النسيج)، وتتركّز أهم مناطقها في النصف الشمالي من الكرة الأرضية. أما التجارة فهي نشاط اقتصادي يربط بين المنتج والمستهلك، وتكون بالجملة أو بنصف الجملة أو بالتقسيط، وداخلية أو خارجية (صادرات وواردات يقيسها الميزان التجاري)؛ والخدمات هي السلع غير الملموسة كالبناء والبنك والسياحة والبريد والصحة، وتساهم التجارة والخدمات بنحو 60% من الناتج الإجمالي بالمغرب.",
      piege:"خطأ شائع: إدراج السياحة أو الصحة أو النقل في القطاع الصناعي. الصحيح أنها خدمات، أي القطاع الثالث؛ فالصناعة تعني تحويل مادة أولية إلى منتوج ملموس.",
      astuce:"اسألي دائماً سؤالاً واحداً: هل النشاط يُنتج من الطبيعة (أول)، أم يحوّل مادة (ثان)، أم يقدّم خدمة أو يبيع (ثالث)؟ ورقم القطاع مرتبط بترتيب الظهور في تاريخ الإنسان: زرع، ثم صنع، ثم باع.",
      exercice:"صنّفي الأنشطة التالية في القطاعات الثلاثة: تربية الأبقار – صناعة النسيج – محل بيع الخضر – مستشفى – تكرير البترول – زراعة القمح. ثم اذكري فرقاً بين الفلاحة التقليدية والفلاحة العصرية.",
      reponse:"القطاع الأول (الفلاحة): تربية الأبقار، زراعة القمح. القطاع الثاني (الصناعة): صناعة النسيج، تكرير البترول. القطاع الثالث (التجارة والخدمات): محل بيع الخضر، المستشفى. والفرق: الفلاحة التقليدية تعتمد أدوات بسيطة ومردوديتها ضعيفة وإنتاجها معيشي موجّه للاستهلاك الذاتي، أما الفلاحة العصرية فتعتمد التقنيات الحديثة في ضيعات واسعة ومردوديتها مرتفعة وإنتاجها موجّه للأسواق."},
    {semester:"S1",
      title:"الكرامة والحرية والمساواة والعدل",
      essentiel:"الكرامة والحرية والمساواة والعدل قيم وحقوق كونية لكل إنسان، مصدرها الشريعة الإسلامية والدستور المغربي والإعلان العالمي لحقوق الإنسان.",
      cours:"الكرامة هي تلبية الحاجيات الطبيعية والضرورية للإنسان: حاجيات عضوية (التغذية والشرب والصحة)، واجتماعية (السكن والشغل والتعليم)، وفكرية (حرية التعبير والتفكير)، وروحية (حرية التدين والاعتقاد)، وهي مبدأ كوني بغضّ النظر عن دين الشخص أو لونه أو جنسيته. والحرية هي القدرة على الفعل والتفكير والاختيار، وهي حق غير قابل للتفويت، وتنقسم إلى حريات فردية (التملّك، الاعتقاد، التجوّل، اختيار العمل) وحريات جماعية (حرية الرأي والصحافة وتأسيس الجمعيات والانتماء إلى الأحزاب والنقابات). والمساواة هي التمتّع بالحقوق السياسية والاقتصادية والاجتماعية على حدّ سواء دون تمييز بسبب الدين أو اللون أو اللغة أو الجنس أو الوضع الاجتماعي، وهي أساس تكافؤ الفرص، وقد أقرّتها الشريعة الإسلامية والقوانين الوضعية، وتحميها اتفاقية القضاء على جميع أشكال التمييز ضد المرأة. والعدل هو احترام حقوق الآخرين والفصل في النزاعات بكل نزاهة وإشعار الجميع بمساواتهم أمام القانون، ويقتضي استقلال القضاء عن السلطتين التشريعية والتنفيذية. مثال ملموس: في المدرسة، إعطاء نفس فرصة المشاركة لكل التلاميذ مساواة، ومعاقبة المخطئ وحده دون ظلم غيره عدل.",
      piege:"خطأ شائع: اعتبار الحرية «أن أفعل ما أشاء». الصحيح أن حريتي تتوقف حيث تبدأ حرية الآخرين، فالحرية مسؤولية يحدّدها القانون واحترام حقوق الغير. وخطأ آخر: الخلط بين المساواة (نفس الحقوق للجميع) والعدل (إعطاء كل ذي حق حقه والفصل في النزاعات بنزاهة).",
      astuce:"كلمة تذكيرية: «ك ح م ع» (كرامة، حرية، مساواة، عدل)، واربطي كل قيمة بصورة: الكرامة = طبق طعام وسقف، الحرية = طائر، المساواة = ميزان متساوي الكفّتين، العدل = قاضٍ ومطرقة.",
      exercice:"أعطي مثالاً واحداً من حياتك المدرسية على كل قيمة: الكرامة، الحرية، المساواة، العدل. ثم بيّني الفرق بين حرية فردية وحرية جماعية.",
      reponse:"الكرامة: أن يجد كل تلميذ ماءً صالحاً للشرب ومرافق صحية نظيفة واحتراماً لشخصه دون إهانة. الحرية: أن أُعبّر عن رأيي في القسم باحترام. المساواة: أن يستفيد التلاميذ والتلميذات من نفس فرص المشاركة والأنشطة دون تمييز. العدل: أن يُعاقب المخطئ وحده وأن تُصحّح الأوراق بنزاهة للجميع. والفرق: الحرية الفردية حق يزاوله الفرد لمصلحته الشخصية (التملّك، الاعتقاد، التجوّل)، أما الحرية الجماعية فحق سياسي يُمارس مع الآخرين (حرية الرأي والصحافة وتأسيس الجمعيات)."},
    {semester:"S2",
      title:"التضامن والتسامح والديمقراطية والسلم",
      essentiel:"التضامن والتسامح والديمقراطية والسلم قيم تضمن استقرار المجتمعات وتقدّمها، وتعمل مؤسسات وطنية ودولية على نشرها.",
      cours:"التضامن سلوك إنساني يخفّف المعاناة عن الناس ويقدّم لهم المساعدة عند الحاجة، ومن مؤسساته بالمغرب الصندوق الوطني للضمان الاجتماعي ومؤسسة محمد الخامس للتضامن بشعارها «لنتحد ضد الحاجة»، وعلى المستوى الدولي الصليب الأحمر الذي أسّسه هنري دونان سنة 1864 والهلال الأحمر رمزه في البلدان الإسلامية. والتسامح هو الاعتراف بثقافة الآخر والتفاهم المتبادل بين الفئات والشعوب، وأنواعه: ديني (التعايش بين الأديان)، وفكري (عدم التعصّب للأفكار واحترام أدب الحوار)، وسياسي (ضمان الحريات السياسية). والديمقراطية هي مشاركة كل المواطنين البالغين سنّ التصويت في تسيير شؤون الحكم باختيار ممثليهم عبر انتخابات حرة ونزيهة، وأهم أركانها فصل السلط، ونقيضها الديكتاتورية أي مصادرة حق الشعوب في حكم نفسها. والسلم هو الحوار والتعايش والتفاهم بين الشعوب وحلّ النزاعات دون عنف، وأنواعه: سياسي (نبذ الحروب واعتماد المفاوضات)، وبيئي (المحافظة على البيئة والاستغلال العقلاني للثروات)، واقتصادي واجتماعي (التوافق بين العمال وأرباب العمل والاستخدام السلمي للعلم). ومن أجل السلم تأسّست هيئة الأمم المتحدة سنة 1945 ومقرّها نيويورك، ومن وكالاتها اليونسكو ومنظمة الصحة العالمية والفاو واليونيسيف. مثال ملموس: انتخاب مكتب الجمعية المدرسية بالتصويت السرّي تطبيق حقيقي للديمقراطية في القسم.",
      piege:"خطأ شائع: اعتبار الديمقراطية مجرد «التصويت». الصحيح أنها تشمل أيضاً حرية الترشح، ونزاهة الانتخابات، وفصل السلط، واحترام رأي الأقلية. وخطأ آخر: اعتبار السلم مجرد غياب الحرب، والصحيح أنه يشمل كذلك السلم البيئي والاقتصادي والاجتماعي.",
      astuce:"احفظي أربع صور: التضامن = يدان متشابكتان، التسامح = حوار بين مختلفين، الديمقراطية = صندوق اقتراع، السلم = حمامة بيضاء وغصن زيتون. وتاريخ واحد مهم: 1945 = تأسيس الأمم المتحدة.",
      exercice:"1) اذكري ثلاثة أنواع للسلم مع تعريف مختصر لكل نوع. 2) في أي سنة تأسّست هيئة الأمم المتحدة وما هدفها؟ 3) اقترحي عملاً تضامنياً يمكن أن ينظّمه قسمك.",
      reponse:"1) السلم السياسي: نبذ الحروب والنزاعات المسلحة واعتماد المفاوضات لحل الخلافات؛ السلم البيئي: المحافظة على البيئة والاستغلال العقلاني للثروات الطبيعية؛ السلم الاقتصادي والاجتماعي: التوافق بين العمال وأرباب العمل والاستخدام السلمي للعلم والتكنولوجيا. 2) تأسّست سنة 1945 ومقرها نيويورك، بهدف الحفاظ على السلم والأمن العالمي وتوسيع التعاون الدولي واحترام حقوق الإنسان. 3) مثال: تنظيم حملة لجمع الملابس والكتب المستعملة وتوزيعها على تلاميذ محتاجين، أو مساعدة زميل متعثّر في الدراسة بحصص دعم داخل القسم."},
    {semester:"S2",
      title:"القاعدة القانونية وحقوق الطفل",
      essentiel:"القانون مجموع القواعد العامة والملزمة التي تنظّم سلوك الأفراد داخل المجتمع، ومن القوانين الدولية اتفاقية حقوق الطفل التي تحمي كل إنسان دون 18 سنة.",
      cours:"القانون هو مجموع القواعد التي تنظّم وتوجّه سلوك الأفراد داخل المجتمع، وهو مقرون بالجزاء: من يخالفه يتعرّض للعقوبة من طرف الدولة. وللقاعدة القانونية أربع خصائص: عامة (موجّهة للجميع)، غائية (تهدف إلى تنظيم سلوك المجتمع)، اجتماعية (تعكس ضمير المجتمع)، ملزمة (مقرونة بجزاء). ومصادرها الشريعة الإسلامية (القرآن والسنة)، والتشريع الوضعي (الدساتير والقوانين)، والعرف، والاجتهاد الفقهي والقضائي. وتتعدّد مجالات تطبيقه: الأحوال الشخصية (الزواج، الطلاق، الإرث)، والتعامل التجاري، والعلاقات بين الدول؛ ودوره أنه يضمن حقوق الناس وحرياتهم المدنية والسياسية ويمنع الفوضى والنزاعات. وفي مجال حماية الأطفال، اعتمدت الجمعية العامة للأمم المتحدة اتفاقية حقوق الطفل بقرارها 44/25 في 20 نونبر 1989 ودخلت حيّز التنفيذ في 2 شتنبر 1990، وتعتبر طفلاً كل إنسان لم يتجاوز الثامنة عشرة، وتضمن له حقوق البقاء والنمو والحماية والمشاركة. مثال ملموس: القانون الداخلي للمؤسسة التعليمية قاعدة قانونية مصغّرة: يسري على كل التلاميذ، وهدفه تنظيم الحياة المدرسية، ويرتّب عقوبات على مخالفيه.",
      piege:"خطأ شائع: الخلط بين القاعدة القانونية والقاعدة الأخلاقية أو العادات. الفرق الأساسي هو الجزاء: مخالفة القانون يعاقب عليها بواسطة الدولة، أما مخالفة العادات أو المجاملات فلا يُعاقب عليها قانونياً.",
      astuce:"لخصائص القاعدة القانونية احفظي أربع كلمات متتابعة: «عامة – غائية – اجتماعية – ملزمة». ولحقوق الطفل احفظي أربع كلمات: «بقاء – نمو – حماية – مشاركة»، وتاريخاً واحداً: 20 نونبر 1989.",
      exercice:"1) اذكري خصائص القاعدة القانونية الأربع. 2) لماذا نقول إن القانون الداخلي لمؤسستك قاعدة قانونية؟ 3) في أي تاريخ اعتُمدت اتفاقية حقوق الطفل ومن هو «الطفل» حسبها؟",
      reponse:"1) عامة (موجّهة للجميع)، غائية (تهدف إلى تنظيم سلوك المجتمع)، اجتماعية (تعكس ضمير المجتمع)، ملزمة (مقرونة بجزاء). 2) لأنه يسري على جميع التلاميذ دون استثناء، وهدفه تنظيم الحياة المدرسية، ويعبّر عن قيم الجماعة التربوية، ويرتّب جزاءات تأديبية على من يخالفه. 3) اعتُمدت اتفاقية حقوق الطفل بقرار الجمعية العامة للأمم المتحدة 44/25 بتاريخ 20 نونبر 1989 (ودخلت حيّز التنفيذ في 2 شتنبر 1990)، والطفل حسبها هو كل إنسان لم يتجاوز الثامنة عشرة من عمره."}
