  islamique: [
    {semester:"S1",
      title:"سورة ق: الإيمان بقدرة الله والبعث",
      essentiel:"سورة «ق» سورة مكية عدد آياتها 45 آية، وترتيبها الخمسون في المصحف، ومحورها الأساسي إثبات البعث والنشور بالأدلة العقلية والردّ على من أنكره.",
      cours:"سُميت السورة بـ«ق» لأن الله تعالى افتتحها بحرف القاف، وهو من الحروف المقطعة التي استأثر الله بعلمها. وفي الشطر الأول منها (الآيات 1-15) يعرض الله شبهة الكافرين في قولهم: ﴿أَإِذَا مِتْنَا وَكُنَّا تُرَابًا ذَٰلِكَ رَجْعٌ بَعِيدٌ﴾ (ق: 3)، ثم يردّ عليهم بأدلة من الخلق: بناء السماء بلا فروج، وبسط الأرض وإرساء الجبال، وإنزال الماء وإحياء الأرض الميتة، فيختم بقوله: ﴿كَذَٰلِكَ الْخُرُوجُ﴾ (ق: 11). ومن مقاصد السورة تقوية الإيمان بقدرة الله على كل شيء، والدعوة إلى التأمل في بديع خلقه، والإيمان بأن الله قريب من العبد عليم بما يوسوس به قلبه.",
      piege:"يظن بعض المتعلمين في هذا السن أن الحروف المقطعة مثل «ق» كلمات لها معنى معروف يجب حفظه، والصواب أنها حروف استأثر الله بعلمها، ويُقرأ الحرف باسمه «قافْ» لا مقطعًا مع ما بعده.",
      astuce:"اربطي دليل البعث بمشهد محسوس تعرفينه: الأرض اليابسة في الصيف تعود خضراء بعد المطر؛ فمن أحيا الأرض قادر على إحياء الناس. ثلاث كلمات تختصر السورة: «قافٌ – قدرةٌ – قيامة».",
      exercice:"أجيبي: أ) ما نوع سورة ق؟ وكم عدد آياتها؟ وما ترتيبها في المصحف؟ ب) ما الشبهة التي أثارها الكافرون حول البعث؟ ج) اذكري دليلين عقليين وردا في السورة على قدرة الله على البعث.",
      reponse:"أ) سورة ق مكية (إلا الآية 38 فمدنية)، عدد آياتها 45 آية، وترتيبها الخمسون في المصحف الشريف، ونزلت بعد سورة المرسلات. ب) شبهتهم أنهم استبعدوا رجوع الحياة إلى الأجساد بعد أن تصير ترابًا، كما في قوله تعالى: ﴿أَإِذَا مِتْنَا وَكُنَّا تُرَابًا ذَٰلِكَ رَجْعٌ بَعِيدٌ﴾ (ق: 3). ج) من الأدلة: خلق السماء وبناؤها وتزيينها من غير شقوق ﴿أَفَلَمْ يَنظُرُوا إِلَى السَّمَاءِ فَوْقَهُمْ﴾ (ق: 6)، وإحياء الأرض الميتة بالماء وإخراج النبات منها وقوله بعدها ﴿كَذَٰلِكَ الْخُرُوجُ﴾ (ق: 11)؛ فمن قدر على الخلق الأول قدر على الإعادة."},
    {semester:"S1",
      title:"العقيدة الصحيحة وأركان الإيمان",
      essentiel:"العقيدة الصحيحة هي التصديق اليقيني بوجود الله ووحدانيته مع الإخلاص والعمل الصالح، وأركان الإيمان ستة كما بيّنها حديث جبريل عليه السلام.",
      cours:"أركان الإيمان الستة هي: الإيمان بالله، وبملائكته، وبكتبه، وبرسله، وباليوم الآخر، وبالقدر خيره وشره؛ كما في حديث جبريل عليه السلام حين سأل النبي ﷺ عن الإيمان فقال: «أَنْ تُؤْمِنَ بِاللَّهِ، وَمَلَائِكَتِهِ، وَكُتُبِهِ، وَرُسُلِهِ، وَالْيَوْمِ الْآخِرِ، وَالْقَدَرِ كُلِّهِ خَيْرِهِ وَشَرِّهِ» (رواه مسلم عن عمر بن الخطاب رضي الله عنه). وفي المقابل توجد العقائد الفاسدة، وهي كل اعتقاد يخالف التوحيد، مثل الشرك بالله، والاعتقاد بأن مخلوقًا ينفع أو يضرّ من دون الله، واللجوء إلى الشعوذة والسحر والأضرحة طلبًا للشفاء؛ قال تعالى: ﴿وَلَا تَدْعُ مِن دُونِ اللَّهِ مَا لَا يَنفَعُكَ وَلَا يَضُرُّكَ﴾ (يونس: 106). وقال النبي ﷺ لابن عباس: «إِذَا سَأَلْتَ فَاسْأَلِ اللَّهَ، وَإِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللَّهِ» (رواه الترمذي). ومن آثار العقيدة الصحيحة راحة القلب والثقة بالله والاستقامة في السلوك.",
      piege:"الخطأ الشائع الخلط بين أركان الإيمان الستة وأركان الإسلام الخمسة؛ فأركان الإسلام أعمال ظاهرة (الشهادتان، الصلاة، الزكاة، الصوم، الحج)، وأركان الإيمان تصديق بالقلب بأمور غيبية.",
      astuce:"احفظي الأركان الستة بترتيب الحديث: «الله – ملائكته – كتبه – رسله – اليوم الآخر – القدر». والعلامة المميزة: أركان الإيمان ستة وكلها اعتقاد، وأركان الإسلام خمسة وكلها عمل.",
      exercice:"أ) اذكري أركان الإيمان الستة بالترتيب مع اسم الحديث الذي وردت فيه. ب) صنّفي التصرفات الآتية إلى «عقيدة صحيحة» أو «عقيدة فاسدة»: 1- الدعاء لله بالشفاء مع الذهاب إلى الطبيب. 2- تعليق تميمة لجلب الحظ. 3- الذهاب إلى ساحر لمعرفة المستقبل. 4- التوكل على الله بعد بذل الجهد في المراجعة.",
      reponse:"أ) الإيمان بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، وبالقدر خيره وشره، وقد وردت في «حديث جبريل عليه السلام» عن عمر بن الخطاب رضي الله عنه. ب) 1- عقيدة صحيحة (الشفاء من الله والأخذ بالأسباب المشروعة مطلوب). 2- عقيدة فاسدة (اعتقاد النفع في غير الله). 3- عقيدة فاسدة (السحر والشعوذة، ولا يعلم الغيب إلا الله). 4- عقيدة صحيحة (التوكل مع العمل)."},
    {semester:"S2",
      title:"القرآن الكريم هدى ورحمة والتفكر",
      essentiel:"القرآن الكريم كلام الله المنزل على النبي محمد ﷺ، أنزله الله هدى ورحمة للعالمين، ومن مقاصده دعوة الإنسان إلى النظر والتفكر في خلق الله.",
      cours:"القرآن كلام الله المنزل على نبيه ﷺ بواسطة جبريل عليه السلام، المتعبَّد بتلاوته، المعجز، المنقول إلينا بالتواتر، عدد سوره 114 وأجزاؤه 30. وقد تكفّل الله بحفظه: ﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾ (الحجر: 9)، وهو هدى وبشرى: ﴿هُدًى وَبُشْرَىٰ لِلْمُؤْمِنِينَ﴾ (النمل: 2)، وشفاء ورحمة: ﴿وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ﴾ (الإسراء: 82). ومن آداب التعامل معه: الطهارة، والجلوس بأدب، والاستماع والإنصات: ﴿وَإِذَا قُرِئَ الْقُرْآنُ فَاسْتَمِعُوا لَهُ وَأَنصِتُوا﴾ (الأعراف: 204)، والمواظبة على التلاوة وتدبّر المعاني والعمل بالأوامر. وقد دعا القرآن إلى النظر والتفكر سبيلًا للمعرفة والهداية: ﴿أَفَلَا يَنظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ﴾ (الغاشية: 17)، وأول ما نزل منه أمرٌ بالقراءة: ﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ﴾ (العلق: 1).",
      piege:"يظن بعض المتعلمين أن الأجر إنما هو في تلاوة القرآن بسرعة وحفظه فقط، فينسون التدبّر والعمل. والصواب أن المقصود الأول من نزول القرآن هو الهداية والعمل بما فيه، ولذلك سُمّي «هدى ورحمة».",
      astuce:"اربطي ثلاث كلمات: «أقرأ – أتدبّر – أعمل». وقبل التلاوة كرّري في نفسك: «أنا أقرأ كلام الله، فأجلس بأدب وأنصت وأفهم».",
      exercice:"أ) اذكري ثلاث خصائص للقرآن الكريم مع دليل واحد من القرآن على كل خصيصة إن أمكن. ب) اذكري ثلاثة من آداب التعامل مع القرآن. ج) هات آية تدعو إلى التفكر في خلق الله مع ذكر سورتها ورقمها.",
      reponse:"أ) 1- كلام الله المنزّل على نبيه ﷺ: ﴿وَأَنزَلْنَا إِلَيْكَ الْكِتَابَ بِالْحَقِّ﴾ (المائدة: 48-50 حسب المصحف). 2- محفوظ بحفظ الله: ﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾ (الحجر: 9). 3- معجز لا يستطيع أحد الإتيان بمثله: ﴿قُلْ فَأْتُوا بِسُورَةٍ مِّثْلِهِ﴾ (يونس: 38). ب) من آدابه: الطهارة والوضوء، والاستماع والإنصات عند تلاوته، وتدبّر معانيه والعمل بأوامره واجتناب نواهيه. ج) قوله تعالى: ﴿أَفَلَا يَنظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ﴾ (سورة الغاشية، الآية 17)، وكذلك ﴿خَلَقَ السَّمَاوَاتِ بِغَيْرِ عَمَدٍ تَرَوْنَهَا﴾ (سورة لقمان، الآية 10)."},
    {semester:"S1",
      title:"بعثة الرسول ﷺ ودعوته وثباته",
      essentiel:"بدأت بعثة النبي ﷺ بنزول الوحي عليه في غار حراء بأول سورة العلق، ثم دعا سرًّا ثلاث سنوات ثم جهرًا، وثبت على دعوته صابرًا على أذى قريش.",
      cours:"كان النبي ﷺ يتحنّث في غار حراء متأمّلًا في خلق الله، فجاءه جبريل عليه السلام بأول ما نزل من القرآن: ﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ﴾ (العلق: 1-5). ثم أُمر بالإنذار في قوله تعالى: ﴿يَا أَيُّهَا الْمُدَّثِّرُ * قُمْ فَأَنذِرْ﴾ (المدثر: 1-2). وكانت الدعوة أولًا سرية، فأسلم أوّلون منهم خديجة رضي الله عنها وأبو بكر وعلي وزيد بن حارثة، ثم أُمر بالجهر بقوله: ﴿وَأَنذِرْ عَشِيرَتَكَ الْأَقْرَبِينَ﴾ (الشعراء: 214) و﴿فَاصْدَعْ بِمَا تُؤْمَرُ﴾ (الحجر: 94). وقد قابلته قريش بالسخرية والتكذيب والإيذاء، فثبت ﷺ ولم يدع عليهم بالهلاك، عملًا بأمر الله: ﴿فَاصْبِرْ عَلَىٰ مَا يَقُولُونَ﴾ (ق: 39)، و﴿فَاصْبِرْ كَمَا صَبَرَ أُولُو الْعَزْمِ مِنَ الرُّسُلِ﴾ (الأحقاف: 35). ومن أسباب ثباته: إيمانه القوي، وتأييد الله له، ولين جانبه ورحمته بالناس: ﴿فَبِمَا رَحْمَةٍ مِّنَ اللَّهِ لِنتَ لَهُمْ﴾ (آل عمران: 159).",
      piege:"الخطأ الشائع الظنّ أن الدعوة الجهرية بدأت مباشرة مع نزول الوحي، أو أن النبي ﷺ عاقب من أساء إليه. والصواب أن الدعوة كانت سرية أولًا ثم جهرية، وأن النبي ﷺ صبر وعفا ولم يدع على قومه بالهلاك لأن الإنسان حرّ ومسؤول عن اختياره.",
      astuce:"احفظي سلسلة مرتبة: «غار حراء ← اقرأ (العلق) ← قم فأنذر (المدثر) ← دعوة سرية ← فاصدع بما تؤمر ← ثبات وصبر». وتذكّري أن السورتين الأولى والثانية تبدأان بأمر: «اقرأ» ثم «قم».",
      exercice:"أ) ما أول ما نزل من القرآن الكريم؟ وأين نزل؟ ب) ما الآية التي أمر الله بها نبيه ﷺ بالجهر بالدعوة؟ ج) اذكري موقفًا واحدًا يدل على ثبات النبي ﷺ، وقيمة يمكنك أن تقتديها به في حياتك المدرسية.",
      reponse:"أ) أول ما نزل قوله تعالى: ﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ﴾ (سورة العلق، الآيات 1-5)، ونزل في غار حراء بجبل قريب من مكة. ب) قوله تعالى: ﴿فَاصْدَعْ بِمَا تُؤْمَرُ وَأَعْرِضْ عَنِ الْمُشْرِكِينَ﴾ (سورة الحجر، الآية 94)، وقبله ﴿وَأَنذِرْ عَشِيرَتَكَ الْأَقْرَبِينَ﴾ (الشعراء: 214). ج) من مواقف ثباته أنه صبر على سخرية قريش وإيذائها ولم يترك الدعوة ولم يدع عليهم بالهلاك، ملتزمًا أمر الله: ﴿فَاصْبِرْ عَلَىٰ مَا يَقُولُونَ﴾ (ق: 39). والقيمة المستفادة: الثبات على الحق والصبر على الصعوبات، كأن أواصل المراجعة والاجتهاد ولا أستسلم عند أول فشل أو سخرية من أحد."},
    {semester:"S1",
      title:"العبادة غاية الخلق وأركان الإسلام",
      essentiel:"خلق الله الإنسان لعبادته وحده، قال تعالى: ﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾ (الذاريات: 56)، وأركان الإسلام خمسة تُبنى عليها هذه العبادة.",
      cours:"قال النبي ﷺ: «بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، وَإِقَامِ الصَّلَاةِ، وَإِيتَاءِ الزَّكَاةِ، وَحَجِّ الْبَيْتِ، وَصَوْمِ رَمَضَانَ» (رواه مسلم في كتاب الإيمان عن عبد الله بن عمر رضي الله عنهما). ومفهوم العبادة واسع: هو كل عمل يحبه الله ويرضاه، من الصلاة والصوم إلى الإحسان إلى الناس وإتقان العمل. ولكل ركن غايات تربوية: فالشهادتان توحيد لله وإخلاص له، والصلاة تنهى عن الفحشاء والمنكر: ﴿إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنكَرِ﴾ (العنكبوت: 45)، والزكاة تطهّر المال وتنشر التكافل، والصوم يربّي على الصبر وحسن الخلق كما في الحديث: «فَلَا يَرْفُثْ وَلَا يَصْخَبْ... فَلْيَقُلْ: إِنِّي امْرُؤٌ صَائِمٌ» (رواه مسلم)، والحج مؤتمر للمسلمين يجدّد الإيمان.",
      piege:"الخطأ الشائع حصر العبادة في الصلاة والصوم فقط، وظنّ أن باقي الأعمال اليومية لا علاقة لها بالدين. والصواب أن الإتقان والصدق ومساعدة الأهل ونظافة البيئة كلها عبادات إذا صحّت فيها النية.",
      astuce:"احفظي أركان الإسلام على أصابع اليد الواحدة: الإبهام = الشهادتان (الأساس)، ثم الصلاة، الزكاة، الصوم، الحج. وتذكّري أن الحج مقيّد بالاستطاعة.",
      exercice:"أ) اذكري أركان الإسلام الخمسة بالترتيب مع الحديث الذي وردت فيه. ب) اذكري غاية تربوية واحدة لكل من: الصلاة، والزكاة، والصوم. ج) هات مثالًا من حياتك اليومية على عبادة ليست من أركان الإسلام.",
      reponse:"أ) الشهادتان، وإقام الصلاة، وإيتاء الزكاة، وصوم رمضان، وحج البيت لمن استطاع؛ وردت في حديث: «بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ...» (رواه مسلم عن عبد الله بن عمر رضي الله عنهما). ب) الصلاة تربّي على مراقبة الله وتنهى عن الفحشاء والمنكر (العنكبوت: 45)، والزكاة تطهّر المال وتحقّق التكافل بين الغني والفقير، والصوم يربّي على الصبر والتحكم في النفس وحسن الخلق. ج) مثال: مساعدة أمي في أعمال البيت أو مراجعة دروسي بإتقان أو إزالة الأذى عن الطريق؛ كل ذلك عبادة إذا نويت بها وجه الله."},
    {semester:"S1",
      title:"الطهارة والصلاة",
      essentiel:"الطهارة شرط من شروط صحة الصلاة، وهي إزالة النجاسة عن البدن والثياب والمكان، وطهارة القلب من المعاصي، والصلاة عبادة لها فرائض وسنن ومبطلات.",
      cours:"الطهارة نوعان: معنوية وهي طهارة النفس من الشرك والمعاصي كالحسد والحقد والغش والكبر، وحسّية وهي طهارة الجسم من النجس والأحداث. والطهارة الحسّية ثلاث: الوضوء (الطهارة الصغرى)، والغُسل (الطهارة الكبرى)، والتيمم عند انعدام الماء أو العجز عن استعماله لمرض أو برد شديد. وفرائض الوضوء سبع: النية، والفور، والدلك، وغسل الوجه، ومسح الرأس، وغسل اليدين إلى المرفقين، وغسل الرجلين. ومن سننه: غسل اليدين قبل إدخالهما في الإناء، والمضمضة، والاستنشاق، والاستنثار، ومسح الأذنين، وترتيب الفرائض. وأما الصلاة فقد أمر الله بها: ﴿وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَارْكَعُوا مَعَ الرَّاكِعِينَ﴾ (البقرة: 43)، وبيّن النبي ﷺ كيفيتها في حديث: «إِذَا قُمْتَ إِلَى الصَّلَاةِ فَأَسْبِغِ الْوُضُوءَ، ثُمَّ اسْتَقْبِلِ الْقِبْلَةَ، فَكَبِّرْ، ثُمَّ اقْرَأْ مَا تَيَسَّرَ مَعَكَ مِنَ الْقُرْآنِ، ثُمَّ ارْكَعْ حَتَّى تَطْمَئِنَّ رَاكِعًا...» (رواه البخاري). ومن فرائض الصلاة: النية، وتكبيرة الإحرام، والقيام، والفاتحة، والركوع، والسجود، والسلام؛ ومن مبطلاتها: الكلام العمد، والأكل والشرب، وترك فريضة من فرائضها.",
      piege:"الخطأ الشائع في هذا السن ترتيب الوضوء ترتيبًا خاطئًا أو الاكتفاء بمرور الماء دون دلك، والاعتقاد أن ترك تكبيرة الإحرام لا يبطل الصلاة؛ والصواب أنها فريضة من فرائض الصلاة لا تصح الصلاة بدونها.",
      astuce:"احفظي ترتيب الوضوء بحركة اليد من الأعلى إلى الأسفل: «نيّة ← وجه ← يدان ← رأس ← رجلان»، ولا تنسي الدلك والفور (عدم تأخير الأعضاء حتى تجفّ). وللصلاة تذكّري: «طهارة ← قبلة ← تكبير ← قراءة ← ركوع ← سجود ← سلام».",
      exercice:"أ) اذكري فرائض الوضوء السبع. ب) متى يُلجأ إلى التيمم؟ وكيف يُؤدى؟ ج) تلميذ تكلم في الصلاة عمدًا مع صاحبه، ما حكم صلاته؟ ولماذا؟",
      reponse:"أ) النية، والفور، والدلك، وغسل الوجه، ومسح الرأس، وغسل اليدين إلى المرفقين، وغسل الرجلين. ب) يُلجأ إلى التيمم عند انعدام الماء أو العجز عن استعماله بسبب المرض أو الخوف أو البرد الشديد، ويُؤدى بضربتين على صعيد طاهر (تراب أو رمل أو حجر): الأولى مع مسح الوجه، والثانية مع مسح اليدين إلى المرفقين. ج) صلاته باطلة ويجب عليه إعادتها، لأن الكلام العمد من مبطلات الصلاة، فالصلاة تقتضي الخشوع والانصراف بالقلب واللسان إلى الله."},
    {semester:"S2",
      title:"سورة لقمان: وصايا تربوية",
      essentiel:"سورة لقمان سورة مكية عدد آياتها 34 آية، وترتيبها 31 في المصحف، سُميت بذلك لاشتمالها على وصايا لقمان الحكيم لابنه.",
      cours:"تبدأ السورة ببيان أن القرآن ﴿هُدًى وَرَحْمَةً لِّلْمُحْسِنِينَ﴾ (لقمان: 3)، ثم تعرض دلائل قدرة الله في الكون: ﴿خَلَقَ السَّمَاوَاتِ بِغَيْرِ عَمَدٍ تَرَوْنَهَا﴾ (لقمان: 10). ثم تأتي وصايا لقمان لابنه، وأولها النهي عن الشرك: ﴿يَا بُنَيَّ لَا تُشْرِكْ بِاللَّهِ إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ﴾ (لقمان: 13)، ثم الإحسان إلى الوالدين وشكرهما: ﴿وَوَصَّيْنَا الْإِنسَانَ بِوَالِدَيْهِ﴾ (لقمان: 14)، ثم مراقبة الله لأنه لا يغيب عنه شيء: ﴿يَا بُنَيَّ إِنَّهَا إِن تَكُن مِثْقَالَ حَبَّةٍ مِّن خَرْدَلٍ...﴾ (لقمان: 16)، ثم إقامة الصلاة والأمر بالمعروف والنهي عن المنكر والصبر (لقمان: 17)، ثم النهي عن الكبر والتواضع في المشي والكلام: ﴿وَلَا تُصَعِّرْ خَدَّكَ لِلنَّاسِ... وَاغْضُضْ مِن صَوْتِكَ﴾ (لقمان: 18-19). وقد جاءت هذه الوصايا في أسلوب رقيق حنون يبدأ بـ«يا بنيّ»، فهي نموذج لأفضل طرائق تربية الأبناء.",
      piege:"يخلط بعض المتعلمين بين لقمان والأنبياء، فيظنون أنه نبي؛ والصواب أنه رجل حكيم آتاه الله الحكمة، قال تعالى: ﴿وَلَقَدْ آتَيْنَا لُقْمَانَ الْحِكْمَةَ﴾ (لقمان: 12)، وليس نبيًّا.",
      astuce:"احفظي الوصايا بترتيب من الأعلى إلى المحيط: «الله (لا تشرك) ← الوالدان (إحسان) ← نفسي (مراقبة الله والصلاة والصبر) ← الناس (التواضع وغض الصوت)». وكل وصية تبدأ بنداء حبيب: «يا بنيّ».",
      exercice:"أ) عرّفي بسورة لقمان: نوعها، عدد آياتها، ترتيبها، وسبب تسميتها. ب) اذكري ثلاثًا من وصايا لقمان لابنه مع رقم الآية. ج) ما القيمة التربوية التي تستفيدينها من أسلوب «يا بنيّ»؟",
      reponse:"أ) سورة لقمان مكية، عدد آياتها 34 آية، ترتيبها 31 في المصحف (بعد سورة الروم وقبل سورة السجدة)، وسُميت بذلك لاشتمالها على قصة لقمان الحكيم ووصاياه لابنه. ب) 1- النهي عن الشرك بالله (الآية 13). 2- الإحسان إلى الوالدين وشكرهما (الآية 14). 3- إقامة الصلاة والأمر بالمعروف والنهي عن المنكر والصبر (الآية 17)، ومنها كذلك النهي عن الكبر والتواضع في المشي والصوت (الآيتان 18-19). ج) أسلوب «يا بنيّ» يدل على أن التربية الناجحة تكون بالرحمة واللين والحوار الهادئ لا بالعنف والصراخ، وهذا ما يجعل النصيحة تُقبل وتصل إلى القلب."},
    {semester:"S1",
      title:"حقوق الله وحقوق النفس والوالدين والبيئة",
      essentiel:"من العدل (القسط) أن يؤدي المسلم الحقوق إلى أصحابها: حق الله بالتوحيد والإخلاص، وحق النفس بالحفظ والرعاية، وحق الوالدين وذوي الرحم بالإحسان والصلة، وحق البيئة بحمايتها من التلوث.",
      cours:"حق الله على العباد أن يعبدوه ولا يشركوا به شيئًا، كما في حديث معاذ بن جبل رضي الله عنه: «فَإِنَّ حَقَّ اللَّهِ عَلَى الْعِبَادِ أَنْ يَعْبُدُوا اللَّهَ وَلَا يُشْرِكُوا بِهِ شَيْئًا» (رواه البخاري)، وقال تعالى: ﴿وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ﴾ (البينة: 5). وحق النفس أن يحافظ الإنسان على جسمه وعقله بالغذاء الصحي والنظافة والرياضة والراحة، وأن يجتنب ما يضرّه كالتدخين والمخدرات والإفراط والتقصير؛ وقد أنكر النبي ﷺ على من أراد أن يشقّ على نفسه فقال: «لَكِنِّي أَصُومُ وَأُفْطِرُ، وَأُصَلِّي وَأَرْقُدُ» (رواه البخاري عن أنس رضي الله عنه). وحق الوالدين الإحسان إليهما: ﴿وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا وَبِالْوَالِدَيْنِ إِحْسَانًا﴾ (النساء: 36)، بطاعتهما في المعروف ومخاطبتهما بأدب ومساعدتهما، والدعاء لهما بعد وفاتهما؛ ومن حقوق ذوي الرحم صلتهم: «مَنْ سَرَّهُ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ... فَلْيَصِلْ رَحِمَهُ» (رواه البخاري). وحق البيئة حمايتها من التلوث المادي (تلويث الهواء والماء والتربة) والمعنوي (الضوضاء والمنظر القبيح)، قال تعالى: ﴿وَلَا تُفْسِدُوا فِي الْأَرْضِ بَعْدَ إِصْلَاحِهَا﴾ (الأعراف: 56).",
      piege:"الخطأ الشائع اعتبار حق البيئة مسألة نظافة فقط لا علاقة لها بالدين، أو الظنّ أن مساعدة الوالدين تفضّل من الابن؛ والصواب أن حماية البيئة والإحسان إلى الوالدين حقوق واجبة أمر بها الشرع، والإخلال بها إفساد وعقوق.",
      astuce:"تخيّلي أربع دوائر من الداخل إلى الخارج: «الله ← نفسي ← أهلي ← بيئتي»، وفي كل دائرة سؤال واحد: ماذا يجب عليّ اليوم نحوها؟",
      exercice:"أ) ما حق الله على عباده؟ اذكري الدليل. ب) اذكري ثلاثة سلوكات تضرّ بحق النفس. ج) صنّفي ما يأتي إلى تلوث مادي أو معنوي: دخان المصانع – الموسيقى الصاخبة في الحيّ – إلقاء النفايات في البحر – الكلام الفاحش.",
      reponse:"أ) حق الله على عباده أن يعبدوه ولا يشركوا به شيئًا، والدليل حديث معاذ بن جبل رضي الله عنه: «فَإِنَّ حَقَّ اللَّهِ عَلَى الْعِبَادِ أَنْ يَعْبُدُوا اللَّهَ وَلَا يُشْرِكُوا بِهِ شَيْئًا» (رواه البخاري)، وقوله تعالى: ﴿وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ﴾ (البينة: 5). ب) من السلوكات المضرة بالنفس: التدخين وتناول المخدرات، وإهمال النظافة والغذاء الصحي، والسهر الطويل وإهمال الراحة والدراسة، والإفراط في استعمال الشاشات. ج) تلوث مادي: دخان المصانع، وإلقاء النفايات في البحر. تلوث معنوي: الموسيقى الصاخبة في الحيّ (تلوث سمعي)، والكلام الفاحش (تلوث أخلاقي)."},
    {semester:"S1",
      title:"الإتقان ومحاسن الأخلاق",
      essentiel:"الإتقان هو أداء العمل على أحسن وجه، وهو عبادة يحبها الله؛ ومحاسن الأخلاق زينة المسلم وبها تمام رسالة النبي ﷺ.",
      cours:"قال النبي ﷺ: «إِنَّ اللَّهَ تَعَالَى يُحِبُّ إِذَا عَمِلَ أَحَدُكُمْ عَمَلًا أَنْ يُتْقِنَهُ» (رواه البيهقي عن عائشة رضي الله عنها)، وقال تعالى: ﴿إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا﴾ (الكهف: 30). ومن مظاهر الإتقان: الإخلاص في النية، واحترام الوقت، وحسن التنظيم، وتحمّل المسؤولية، وعدم التسويف. ولا يجوز أن يُتقن الإنسان واجباته الدينية ويهمل واجباته الدنيوية، فالعمل الدنيوي المتقن عبادة أيضًا. وأما محاسن الأخلاق فقد قال ﷺ: «إِنَّمَا بُعِثْتُ لِأُتَمِّمَ حُسْنَ الأَخْلَاقِ»، وقال: «مَا مِنْ شَيْءٍ أَثْقَلُ فِي الْمِيزَانِ مِنْ حُسْنِ الْخُلُقِ»، وأثنى الله على نبيه: ﴿وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ﴾ (القلم: 4)، ودعا إلى العفو وكظم الغيظ: ﴿وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ وَاللَّهُ يُحِبُّ الْمُحْسِنِينَ﴾ (آل عمران: 134)، ودفع السيئة بالحسنة: ﴿ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ﴾ (فصلت: 34).",
      piege:"الخطأ الشائع الفصل بين العبادة والعمل، فيُظنّ أن من يكثر النوافل يُعذر في التقصير في دراسته أو عمله؛ والصواب أن الإتقان في الدراسة والعمل عبادة، والتقصير فيها إخلال بالأمانة.",
      astuce:"قاعدة صغيرة قبل تسليم أي عمل مدرسي: «أراجع – أنظّم – أُسلّم في الوقت». ولحسن الخلق تذكّري ثلاثيّة: «كلمة طيبة، وجه بشوش، عفو عند الغضب».",
      exercice:"أ) عرّفي الإتقان واذكري الحديث الدال عليه. ب) اذكري ثلاثة مظاهر للإتقان في حياة التلميذة. ج) زميلتك أساءت إليك بكلمة جارحة أمام الصف، ما التصرف الموافق لمحاسن الأخلاق؟ استدلّي بآية.",
      reponse:"أ) الإتقان هو أداء العمل على أحسن وجه وأكمل صورة مع الإخلاص فيه، والدليل قوله ﷺ: «إِنَّ اللَّهَ تَعَالَى يُحِبُّ إِذَا عَمِلَ أَحَدُكُمْ عَمَلًا أَنْ يُتْقِنَهُ» (رواه البيهقي عن عائشة رضي الله عنها). ب) من مظاهره: كتابة الدروس بخط واضح ومراجعتها في وقتها، وإنجاز الواجبات المنزلية كاملة دون تأخير، واحترام مواعيد الدراسة والمحافظة على أدوات القسم ونظافته. ج) التصرف الموافق لمحاسن الأخلاق هو كظم الغيظ وعدم الردّ بالمثل، ثم الحوار الهادئ معها أو إخبار الأستاذ إن تكرر الأمر، والعفو عنها؛ قال تعالى: ﴿وَالْكَاظِمِينَ الْغَيْظَ وَالْعَافِينَ عَنِ النَّاسِ وَاللَّهُ يُحِبُّ الْمُحْسِنِينَ﴾ (آل عمران: 134)، وقال: ﴿ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ﴾ (فصلت: 34)."},
    {semester:"S2",
      title:"التعامل الإيجابي مع وسائل الاتصال الحديثة",
      essentiel:"وسائل الاتصال الحديثة نعمة إذا استُعملت في الخير، والتعامل الإيجابي معها يقوم على التثبّت من الأخبار وحفظ الوقت واحترام الآخرين.",
      cours:"التواصل ضرورة بشرية لأن الإنسان اجتماعي بطبعه، وقد جعل الله التعارف بين الناس مقصدًا: ﴿يَا أَيُّهَا النَّاسُ إِنَّا خَلَقْنَاكُم مِّن ذَكَرٍ وَأُنثَىٰ وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ لِتَعَارَفُوا﴾ (الحجرات: 13). ومن قواعد التعامل الإيجابي: التثبّت من الأخبار قبل نشرها، قال تعالى: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِن جَاءَكُم فَاسِقٌ بِنَبَإٍ فَتَبَيَّنُوا﴾ (الحجرات: 6)، وعدم القول بغير علم: ﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا﴾ (الإسراء: 36). ومن الاستعمال الإيجابي: التعلّم والبحث في الدروس، وصلة الأهل والأقارب، ونشر ما ينفع الناس. ومن السلبيات: إضاعة الوقت، ونشر الأخبار الكاذبة، والغيبة والسخرية والتنمّر، وكشف الأسرار الشخصية، وتقليد ما يخالف قيم المجتمع.",
      piege:"الخطأ الشائع في هذا السن هو مشاركة كل خبر أو صورة مثيرة بسرعة دون تأكّد، أو الظنّ أن التعليق الساخر على شخص «مزحة» لا إثم فيها؛ والصواب أن نشر الكذب والسخرية من الآخرين إيذاء يُسأل عنه الإنسان أمام الله.",

function subj(key){ return SUBJECTS.find(s=>s.key===key) || {label:key,color:'#999'}; }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDateLong(iso){ const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}); }
function fmtDayShort(iso){ const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('fr-FR', {weekday:'short', day:'numeric'}); }
function weekDates(){
  const d = new Date(); const day = (d.getDay()+6)%7;
  const monday = new Date(d); monday.setDate(d.getDate()-day);
  const out=[]; for(let i=0;i<7;i++){ const x=new Date(monday); x.setDate(monday.getDate()+i); out.push(x.toISOString().slice(0,10)); }
  return out;
}
function uid(){ return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function chaptersFor(key){ return Array.isArray(state.resources[key]) ? state.resources[key] : []; }

/* ---------- Stockage : compatible avec l'environnement Claude (window.storage) ----------
   ET avec un navigateur normal / GitHub Pages (localStorage), pour que les données
   soient VRAIMENT conservées sur l'appareil d'une fois à l'autre. */
const LS_PREFIX = 'mon-cahier-1ac:';
async function storageGet(key){
  if(window.storage && typeof window.storage.get === 'function'){
    try{ const r = await window.storage.get(key); if(r && r.value!=null) return r.value; }catch(e){}
  }
  try{ return localStorage.getItem(LS_PREFIX+key); }catch(e){ return null; }
}
async function storageSet(key, value){
  let okViaShim = false;
  if(window.storage && typeof window.storage.set === 'function'){
    try{ await window.storage.set(key, value); okViaShim = true; }catch(e){}
  }
  try{ localStorage.setItem(LS_PREFIX+key, value); }catch(e){ if(!okViaShim) console.error(e); }
}

async function loadState(){
  try{ const v = await storageGet('tasks'); state.tasks = v ? JSON.parse(v) : []; }catch(e){ state.tasks = []; }
  try{ const v = await storageGet('resources'); state.resources = v ? JSON.parse(v) : {}; }catch(e){ state.resources = {}; }
  try{ const v = await storageGet('moods'); state.moods = v ? JSON.parse(v) : {}; }catch(e){ state.moods = {}; }
  try{ const v = await storageGet('apiKey'); state.apiKey = v || null; }catch(e){ state.apiKey = null; }
  try{ const v = await storageGet('passwords'); state.passwords = v ? JSON.parse(v) : null; }catch(e){ state.passwords = null; }
}
async function savePasswords(){ try{ await storageSet('passwords', JSON.stringify(state.passwords)); }catch(e){ console.error(e); } }
async function saveTasks(){ try{ await storageSet('tasks', JSON.stringify(state.tasks)); }catch(e){ console.error(e); } }
async function saveResources(){ try{ await storageSet('resources', JSON.stringify(state.resources)); }catch(e){ console.error(e); } }
async function saveMoods(){ try{ await storageSet('moods', JSON.stringify(state.moods)); }catch(e){ console.error(e); } }

function viewToday(){
  const iso = todayISO();
  const tasks = state.tasks.filter(t=>t.date===iso).sort((a,b)=> (a.done?1:0)-(b.done?1:0));
  const next = tasks.find(t=>!t.done);
  const mood = state.moods[iso];
  let html = `<h2 class="section-title">Aujourd'hui, ${fmtDateLong(iso)}</h2>`;
  if(next){
    html += `<div class="card next-card"><div class="eyebrow">Prochaine étape</div>
      <div class="task-title">${esc(next.title)}</div>
      <div class="task-sub">${esc(subj(next.subject).label)} ${next.minutes?`· ${next.minutes} min`:''}</div></div>`;
  }
  if(tasks.length===0){
    html += `<div class="empty"><span class="hand">Rien de prévu aujourd'hui !</span>Demande à un parent d'ajouter une tâche si besoin.</div>`;
  } else { html += tasks.map(t=>taskRow(t)).join(''); }
  html += `<div class="mood-row"><span class="muted" style="margin:0;">Ma journée :</span>
    ${MOODS.map(m=>`<button class="mood-btn ${mood===m?'selected':''}" data-mood="${m}">${m}</button>`).join('')}</div>`;
  return html;
}
function taskRow(t){
  const s = subj(t.subject);
  const hasDetail = !!(t.enonce || t.desc);
  const isOpen = hasDetail && state.openTaskId === t.id;
  let html = `<div class="task-row ${t.done?'done':''}" data-id="${t.id}">
    <button class="checkbox ${t.done?'checked':''}" data-action="toggle" data-id="${t.id}">${t.done?'✓':''}</button>

      <div class="task-title">${esc(t.title)}</div>
      <div class="task-sub">${esc(s.label)}${hasDetail?` · ${isOpen?'▲ Masquer le détail':'▼ Voir le détail'}`:''}</div>
    </div>
    ${t.minutes?`<span class="chip">${t.minutes} min</span>`:''}
    <span class="chip" style="background:${s.color}22;color:${s.color}">${typeLabel(t.type)}</span></div>`;

/* ---------- ÉLÈVE : Semaine ---------- */
function viewWeek(){
  const dates = weekDates(); const iso = todayISO();
  const weekTasks = state.tasks.filter(t=>dates.includes(t.date));
  const weekDone = weekTasks.filter(t=>t.done).length;
  let html = `<h2 class="section-title">Cette semaine</h2>
    <p class="muted">Du lundi au dimanche · ${weekTasks.length} tâche(s), ${weekDone} terminée(s). Clique sur une tâche pour la cocher.</p>`;
  if(weekTasks.length===0){
    html += `<div class="empty"><span class="hand">Rien de prévu cette semaine !</span>Demande à un parent d'ajouter des tâches depuis l'onglet « Ajouter ».</div>`;
  }
  html += `<div class="week-grid">`;
  for(const d of dates){
    const dayTasks = state.tasks.filter(t=>t.date===d).sort((a,b)=>(a.done?1:0)-(b.done?1:0));
    const isToday = d===iso;
    html += `<div class="day-col ${isToday?'today-col':''}">
      <div class="day-head ${isToday?'today':''}"><span>${fmtDayShort(d)}</span>${dayTasks.length?`<span class="day-count">${dayTasks.length}</span>`:''}</div>
      ${dayTasks.length===0 ? `<div class="week-empty">Rien de prévu</div>` :
        dayTasks.map(t=>{
          const s = subj(t.subject);
          return `<div class="mini-task ${t.done?'done':''}" data-action="toggle" data-id="${t.id}" style="border-left-color:${s.color}" title="Cliquer pour ${t.done?'décocher':'cocher comme fait'}">

              <div class="mini-task-sub">${esc(s.label)}${t.minutes?` · ${t.minutes} min`:''}</div></div>
          </div>`;
        }).join('')}
      </div>`;
  }
  return html + `</div>`;
}

      </div>
      <div style="margin-top:12px; display:flex; flex-direction:column; gap:8px;">
        ${turn.options.map((opt,i)=>`
          <div style="display:flex; align-items:center; gap:8px;">

          </div>
        `).join('')}

      ${isLast && step>0 ? `<span class="muted">🎉 Dialogue terminé, bravo !</span>` : ''}
    </div>
  </div>`;

  return html;
}

function speak(text, lang){
  try{
    if(!('speechSynthesis' in window)) { alertBanner('La lecture audio n\'est pas disponible sur cet appareil.'); return; }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang || discussLangCode();
    utter.rate = 0.92;
    window.speechSynthesis.speak(utter);
  }catch(e){ console.error(e); }
}

async function callGeminiText(promptText, apiKey){
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent';
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
    body: JSON.stringify({
      contents: promptText,
      generationConfig: { temperature: 0.8 }
    })
  });
  if(!resp.ok){
    if(resp.status===400 || resp.status===401 || resp.status===403) throw new Error("Clé API invalide ou refusée. Vérifie qu'elle est bien copiée depuis aistudio.google.com/apikey.");
    if(resp.status===429) throw new Error("Trop de demandes pour l'instant (quota gratuit atteint). Réessaie dans quelques minutes.");
    throw new Error(`Erreur du service IA (code ${resp.status}). Réessaie plus tard.`);
  }
  const data = await resp.json();
  const text = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
  if(!text) throw new Error("Réponse vide de l'IA, réessaie.");
  return text.trim();
}

function discussSystemPrompt(){
  const theme = discussTheme();
  const themeLabel = theme.label;
  if(state.discussModule==='en'){
    return `Tu es un ami virtuel amical qui aide une élève marocaine de 11 ans (1ère année collège) à débuter en anglais, niveau BASIQUE/DÉBUTANT (A1), sur le thème : "${themeLabel}".
Règles :
- Écris uniquement en anglais TRÈS simple (vocabulaire concret et courant, phrases courtes de 5-8 mots, niveau A1, aucune expression rare ou idée abstraite).
- Pose UNE question à la fois, simple et directe, en lien avec le thème.
- Si son message précédent contient une erreur, corrige-la gentiment en 1 courte phrase avant ta question (ex: "Good try! We say 'I go to school', not 'I goes to school'."), sinon félicite-la brièvement.
- Reste toujours positif, encourageant, jamais sévère, comme pour un tout débutant qui découvre l'anglais.
- Réponses courtes (2-3 phrases maximum).`;
  }
  return `Tu es un ami virtuel amical qui aide une élève marocaine de 11 ans, en 1ère année collège (1AC), à s'entraîner à l'expression orale en FRANÇAIS, sur le thème : "${themeLabel}".
Le français est une langue qu'elle maîtrise déjà bien à l'écrit comme à l'oral : ne simplifie PAS comme pour une débutante.
Règles :
- Écris en français riche et naturel, du niveau réellement attendu en 1AC : phrases complètes et structurées, connecteurs logiques (d'abord, ensuite, parce que, cependant…), vocabulaire varié adapté à son âge — pas de phrases ultra-courtes de débutant.
- Pose UNE question à la fois, qui invite à argumenter, raconter ou décrire (pas juste des questions fermées à un mot), en lien avec le thème.
- Si son message précédent contient une faute de grammaire, de conjugaison, d'accord ou de vocabulaire, corrige-la gentiment et précisément en 1 courte phrase avant ta question, sinon félicite-la brièvement pour la qualité ou la richesse de sa phrase.
- Encourage-la à faire des phrases plus longues et plus riches au fil de la conversation.
- Reste toujours positif, encourageant, jamais sévère.
- Réponses courtes (2-3 phrases maximum).`;
}

async function discussStartChat(){
  if(!state.apiKey) return;
  state.discussChat = [];
  state.discussChatError = null;
  state.discussChatLoading = true; renderPage();
  try{
    const contents = [{ role:'user', parts:[{text: discussSystemPrompt() + '\n\nCommence maintenant la conversation avec une phrase d\'accueil courte et une première question.'}] }];
    const reply = await callGeminiText(contents, state.apiKey);
    state.discussChat.push({role:'model', text: reply});
  }catch(err){
    state.discussChatError = err && err.message ? err.message : "Une erreur est survenue, réessaie.";
  }finally{
    state.discussChatLoading = false; renderPage();
    setTimeout(()=>{ const log=document.getElementById('discuss-chat-log'); if(log) log.scrollTop = log.scrollHeight; }, 0);
  }
}

async function discussContinueChat(){
  if(!state.apiKey) return;
  state.discussChatError = null;
  state.discussChatLoading = true; renderPage();
  try{
    const contents = [
      { role:'user', parts:[{text: discussSystemPrompt()}] },
      { role:'model', parts:[{text: 'Compris, je vais suivre ces règles.'}] },
      ...state.discussChat.map(m=>({ role: m.role==='user'?'user':'model', parts:[{text:m.text}] }))
    ];
    const reply = await callGeminiText(contents, state.apiKey);
    state.discussChat.push({role:'model', text: reply});
  }catch(err){
    state.discussChatError = err && err.message ? err.message : "Une erreur est survenue, réessaie.";
  }finally{
    state.discussChatLoading = false; renderPage();
    setTimeout(()=>{ const log=document.getElementById('discuss-chat-log'); if(log) log.scrollTop = log.scrollHeight; }, 0);
  }
}

async function discussSendMessage(userText){
  if(!state.apiKey || !userText) return;
  state.discussChat.push({role:'user', text: userText});
  await discussContinueChat();
}

async function discussRetry(){
  if(state.discussChat.length===0){ await discussStartChat(); }
  else { await discussContinueChat(); }
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function bindPageEvents(){
  const page = document.getElementById('page');
  if(!page) return;

  page.querySelectorAll('[data-action="toggle"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const t = state.tasks.find(x=>x.id===btn.dataset.id);
      if(t){ t.done = !t.done; await saveTasks(); renderPage(); }
    });
  });
  page.querySelectorAll('[data-action="delete"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      state.tasks = state.tasks.filter(x=>x.id!==btn.dataset.id);
      await saveTasks(); renderPage();
    });
  });
  page.querySelectorAll('[data-action="toggle-task-detail"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.openTaskId = state.openTaskId === el.dataset.id ? null : el.dataset.id;
      renderPage();
    });
  });
  page.querySelectorAll('.mood-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{ state.moods[todayISO()] = btn.dataset.mood; await saveMoods(); renderPage(); });
  });
  page.querySelectorAll('.subject-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      state.openSubjectEleve = state.openSubjectEleve===card.dataset.subject ? null : card.dataset.subject;
      state.openChapterId = null;
      renderPage();
    });
  });
  page.querySelectorAll('[data-chapter-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.chapterToggle;
      state.openChapterId = state.openChapterId===id ? null : id;
      renderPage();
      const el = document.querySelector(`[data-chapter-toggle="${id}"]`);
      if(el && state.openChapterId===id) el.scrollIntoView({behavior:'smooth', block:'nearest'});
    });
  });
  page.querySelectorAll('[data-reveal]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const el = document.getElementById('answer-'+btn.dataset.reveal);
      if(el){ el.classList.toggle('shown'); btn.textContent = el.classList.contains('shown') ? 'Cacher la réponse' : 'Voir la réponse'; }
    });
  });

  const form = document.getElementById('add-form');
  if(form){
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(form);
      const task = {
        id: uid(), subject: fd.get('subject'), type: fd.get('type'),
        title: fd.get('title').trim(), desc: (fd.get('desc')||'').trim(),
        date: fd.get('date') || todayISO(),
        minutes: fd.get('minutes') ? parseInt(fd.get('minutes')) : null, done: false,
      };
      if(!task.title) return;
      state.tasks.push(task); await saveTasks();
      form.reset(); form.querySelector('[name="date"]').value = todayISO();
      alertBanner('Tâche ajoutée ✓');
    });
  }

  const filter = document.getElementById('subject-filter');
  if(filter){ filter.addEventListener('change', ()=>{ state.subjectFilter = filter.value; renderPage(); }); }

  const parentSubjSelect = document.getElementById('parent-subject-select');
  if(parentSubjSelect){
    parentSubjSelect.addEventListener('change', ()=>{
      state.parentResourceSubject = parentSubjSelect.value; state.editingChapterId = null; renderPage();
    });
  }

  const loadSeedBtn = document.getElementById('load-seed');
  if(loadSeedBtn){
    loadSeedBtn.addEventListener('click', async ()=>{
      const key = loadSeedBtn.dataset.subject;
      const existing = chaptersFor(key);
      if(existing.length>0 && !confirm('Des fiches existent déjà pour cette matière. Les remplacer par les fiches prédéfinies ?')) return;
      state.resources[key] = SEED[key].map(c=>({...c, id: uid()}));
      await saveResources(); renderPage(); alertBanner('Fiches chargées ✓');
    });
  }

  const chapterForm = document.getElementById('chapter-form');
  if(chapterForm){
    chapterForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(chapterForm);
      const key = state.parentResourceSubject;
      if(!Array.isArray(state.resources[key])) state.resources[key] = [];
      const data = {
        title: (fd.get('title')||'').trim(), semester: fd.get('semester'),
        essentiel:(fd.get('essentiel')||'').trim(), cours:(fd.get('cours')||'').trim(),
        piege:(fd.get('piege')||'').trim(), astuce:(fd.get('astuce')||'').trim(),
        exercice:(fd.get('exercice')||'').trim(), reponse:(fd.get('reponse')||'').trim(),
      };
      if(!data.title) return;
      const editId = fd.get('id');
      if(editId){
        const idx = state.resources[key].findIndex(c=>c.id===editId);
        if(idx>=0) state.resources[key][idx] = {...state.resources[key][idx], ...data};
      } else {
        state.resources[key].push({id: uid(), ...data});
      }
      state.editingChapterId = null;
      await saveResources(); renderPage(); alertBanner('Fiche enregistrée ✓');
    });
  }
  const cancelEdit = document.getElementById('cancel-edit');
  if(cancelEdit){ cancelEdit.addEventListener('click', ()=>{ state.editingChapterId = null; renderPage(); }); }

  const aiFillBtn = document.getElementById('ai-fill-btn');
  if(aiFillBtn){ aiFillBtn.addEventListener('click', ()=>{ generateFicheFromText(); }); }
  const aiFillTextEl = document.getElementById('ai-fill-text');
  if(aiFillTextEl){ aiFillTextEl.addEventListener('input', (e)=>{ state.aiFillText = e.target.value; }); }

  page.querySelectorAll('[data-action="edit-chapter"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.editingChapterId = btn.dataset.id; renderPage();
      setTimeout(()=>{
        const key = state.parentResourceSubject;
        const c = chaptersFor(key).find(x=>x.id===btn.dataset.id);
        const f = document.getElementById('chapter-form');
        if(c && f){
          f.title.value=c.title||''; f.semester.value=c.semester||'S1'; f.essentiel.value=c.essentiel||'';
          f.cours.value=c.cours||''; f.piege.value=c.piege||''; f.astuce.value=c.astuce||'';
          f.exercice.value=c.exercice||''; f.reponse.value=c.reponse||'';
          f.scrollIntoView({behavior:'smooth', block:'start'});
        }
      },0);
    });
  });
  page.querySelectorAll('[data-action="delete-chapter"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const key = state.parentResourceSubject;
      state.resources[key] = chaptersFor(key).filter(c=>c.id!==btn.dataset.id);
      await saveResources(); renderPage();
    });
  });

  const pwForm = document.getElementById('password-form');
  if(pwForm){
    pwForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const eleveVal = document.getElementById('pw-eleve').value.trim();
      const parentVal = document.getElementById('pw-parent').value.trim();
      if(!eleveVal && !parentVal){ state.pwSaveMsg = 'Rien à changer.'; renderPage(); return; }
      if(eleveVal) state.passwords.eleve = eleveVal;
      if(parentVal) state.passwords.parent = parentVal;
      await savePasswords();
      state.pwSaveMsg = 'Mots de passe mis à jour ✓';
      renderPage(); alertBanner('Mots de passe mis à jour ✓');
    });
  }

  const resetBtn = document.getElementById('reset-data');
  if(resetBtn){
    resetBtn.addEventListener('click', async ()=>{
      if(confirm('Supprimer toutes les tâches, ressources et humeurs enregistrées ? Cette action est irréversible.')){
        state.tasks = []; state.resources = {}; state.moods = {};
        await saveTasks(); await saveResources(); await saveMoods();
        renderPage();
      }
    });
  }

  const saveKeyBtn = document.getElementById('save-api-key');
  if(saveKeyBtn){
    saveKeyBtn.addEventListener('click', async ()=>{
      const input = document.getElementById('api-key-input');
      const val = (input.value||'').trim();
      if(!val){ alertBanner('Colle une clé avant d\'enregistrer'); return; }
      state.apiKey = val;
      try{ await storageSet('apiKey', val); }catch(e){ console.error(e); }
      state.genError = null;
      renderPage(); alertBanner('Clé enregistrée ✓');
    });
  }
  const clearKeyBtn = document.getElementById('clear-api-key');
  if(clearKeyBtn){
    clearKeyBtn.addEventListener('click', async ()=>{
      if(!confirm('Supprimer la clé API enregistrée sur cet appareil ?')) return;
      state.apiKey = null;
      try{ await storageSet('apiKey', ''); }catch(e){ console.error(e); }
      renderPage();
    });
  }

  const genSubjectSelect = document.getElementById('gen-subject');
  if(genSubjectSelect){
    genSubjectSelect.addEventListener('change', ()=>{
      state.genSubject = genSubjectSelect.value; state.genChapterId = null;
      state.genResult = null; state.genError = null;
      renderPage();
    });
  }
  const genChapterSelect = document.getElementById('gen-chapter');
  if(genChapterSelect){
    genChapterSelect.addEventListener('change', ()=>{
      state.genChapterId = genChapterSelect.value;
      renderPage();
    });
  }
  const genDifficultySelect = document.getElementById('gen-difficulty');
  if(genDifficultySelect){
    genDifficultySelect.addEventListener('change', ()=>{
      state.genDifficulty = genDifficultySelect.value;
    });
  }
  const genBtn = document.getElementById('gen-btn');
  if(genBtn){ genBtn.addEventListener('click', ()=> generateExercise()); }
  const genAgainBtn = document.getElementById('gen-again');
  if(genAgainBtn){ genAgainBtn.addEventListener('click', ()=> generateExercise()); }
  const genAddTaskBtn = document.getElementById('gen-add-task');
  if(genAddTaskBtn){
    genAddTaskBtn.addEventListener('click', async ()=>{
      if(!state.genResult) return;
      const dateInput = document.getElementById('gen-task-date');
      const typeInput = document.getElementById('gen-task-type');
      const date = (dateInput && dateInput.value) ? dateInput.value : todayISO();
      const type = (typeInput && typeInput.value) ? typeInput.value : 'devoir';
      const task = {
        id: uid(), subject: state.genSubject, type,
        title: `Exercice généré : ${state.genResult.chapterTitle||''}`.trim(),
        enonce: state.genResult.enonce, reponse: state.genResult.reponse,
        date, minutes: null, done: false,
      };
      state.tasks.push(task); await saveTasks();
      alertBanner(`Ajouté au cahier pour le ${fmtDayShort(date)} ✓`);
    });
  }

  page.querySelectorAll('[data-discuss-module]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = btn.dataset.discussModule;
      if(val===state.discussModule) return;
      state.discussModule = val; state.discussGuidedStep = 0;
      state.discussChat = []; state.discussChatError = null;
      renderPage();
    });
  });
  const discussThemeSelect = document.getElementById('discuss-theme-select');
  if(discussThemeSelect){
    discussThemeSelect.addEventListener('change', ()=>{
      if(state.discussModule==='en'){ state.discussThemeEn = discussThemeSelect.value; }
      else { state.discussThemeFr = discussThemeSelect.value; }
      state.discussGuidedStep = 0;
      state.discussChat = []; state.discussChatError = null;
      renderPage();
    });
  }
  page.querySelectorAll('[data-action="speak"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ speak(btn.dataset.text, discussLangCode()); });
  });
  page.querySelectorAll('[data-action="discuss-answer"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const theme = discussTheme();
      const dialogue = theme.dialogue;
      if(state.discussGuidedStep < dialogue.length - 1) state.discussGuidedStep += 1;
      renderPage();
    });
  });
  const discussRestartBtn = document.getElementById('discuss-restart') || page.querySelector('[data-action="discuss-restart"]');
  if(discussRestartBtn){
    discussRestartBtn.addEventListener('click', ()=>{ state.discussGuidedStep = 0; renderPage(); });
  }
  const discussChatStartBtn = document.getElementById('discuss-chat-start');
  if(discussChatStartBtn){
    discussChatStartBtn.addEventListener('click', ()=>{ discussStartChat(); });
  }
  const discussChatRetryBtn = document.getElementById('discuss-chat-retry');
  if(discussChatRetryBtn){
    discussChatRetryBtn.addEventListener('click', ()=>{ discussRetry(); });
  }
  const discussChatForm = document.getElementById('discuss-chat-form');
  if(discussChatForm){
    discussChatForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const input = document.getElementById('discuss-chat-input');
      const val = (input.value||'').trim();
      if(!val) return;
      input.value = '';
      discussSendMessage(val);
    });
  }
}

async function callGeminiJSON(promptText, apiKey, schema){
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent';
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
    body: JSON.stringify({
      contents: [{ parts: [{ text: promptText }] }],
      generationConfig: {
        responseMimeType: 'application/json',
        responseSchema: schema,
        temperature: 0.8,
      }
    })
  });
  if(!resp.ok){
    if(resp.status===400 || resp.status===401 || resp.status===403) throw new Error("Clé API invalide ou refusée. Vérifie qu'elle est bien copiée depuis aistudio.google.com/apikey.");
    if(resp.status===429) throw new Error("Trop de demandes pour l'instant (quota gratuit atteint). Réessaie dans quelques minutes.");
    throw new Error(`Erreur du service IA (code ${resp.status}). Réessaie plus tard.`);
  }
  const data = await resp.json();
  const text = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
  if(!text) throw new Error("Réponse vide de l'IA, réessaie.");
  let parsed;
  try{ parsed = JSON.parse(text); }catch(e){ throw new Error("Réponse de l'IA illisible, réessaie."); }
  return parsed;
}

async function callGemini(promptText, apiKey){
  const schema = { type: 'OBJECT', properties: { enonce: { type: 'STRING' }, reponse: { type: 'STRING' } }, required: ['enonce', 'reponse'] };
  const parsed = await callGeminiJSON(promptText, apiKey, schema);
  if(!parsed.enonce || !parsed.reponse) throw new Error("Réponse de l'IA incomplète, réessaie.");
  return parsed;
}

async function generateFicheFromText(){
  const textarea = document.getElementById('ai-fill-text');
  const sourceText = textarea ? textarea.value.trim() : '';
  state.aiFillText = textarea ? textarea.value : '';
  if(!sourceText){ state.aiFillError = "Colle d'abord un texte source."; renderPage(); return; }
  if(!state.apiKey) return;
  const s = subj(state.parentResourceSubject);
  const langue = genLangFor(state.parentResourceSubject);
  const schema = {
    type: 'OBJECT',
    properties: {
      title: { type: 'STRING' }, essentiel: { type: 'STRING' }, cours: { type: 'STRING' },
      piege: { type: 'STRING' }, astuce: { type: 'STRING' }, exercice: { type: 'STRING' }, reponse: { type: 'STRING' }
    },
    required: ['title','essentiel','cours','piege','astuce','exercice','reponse']
  };
  const promptText = `Tu es un professeur qui prépare des fiches de révision pour un·e élève marocain·e de 11 ans en 1ère année collège (6ème), matière : ${s.label}.
Voici un texte source (cours, manuel scolaire, notes) à transformer en fiche de révision structurée :
"""
${sourceText}
"""
Rédige une fiche FIDÈLE à ce texte (n'invente pas de notions absentes du texte fourni), entièrement en ${langue}, dans un style simple adapté à un enfant de 11 ans, avec exactement ces champs :
- title : titre court du chapitre
- essentiel : l'idée clé à retenir, en 1-2 phrases
- cours : explication claire avec un exemple, fondée sur le texte fourni
- piege : une erreur fréquente à cet âge en lien avec ce sujet
- astuce : un moyen mnémotechnique ou une astuce pour retenir
- exercice : un petit exercice basé sur ce contenu
- reponse : la réponse complète à cet exercice
Réponds uniquement avec un objet JSON valide contenant exactement ces 7 clés. Aucun texte en dehors du JSON.`;

  state.aiFillLoading = true; state.aiFillError = null; renderPage();
  try{
    const result = await callGeminiJSON(promptText, state.apiKey, schema);
    if(!result.title || !result.cours) throw new Error("Réponse de l'IA incomplète, réessaie.");
    state.aiFillLoading = false; state.aiFillError = null; state.editingChapterId = null;
    renderPage();
    setTimeout(()=>{
      const f = document.getElementById('chapter-form');
      if(f){
        f.title.value = result.title||''; f.essentiel.value = result.essentiel||'';
        f.cours.value = result.cours||''; f.piege.value = result.piege||'';
        f.astuce.value = result.astuce||''; f.exercice.value = result.exercice||'';
        f.reponse.value = result.reponse||'';
        f.scrollIntoView({behavior:'smooth', block:'start'});
      }
    }, 0);
    state.aiFillText = '';
    alertBanner('Fiche générée, relis puis clique sur "Ajouter la fiche" ✓');
  }catch(err){
    state.aiFillLoading = false;
    state.aiFillError = err && err.message ? err.message : "Une erreur est survenue, réessaie.";
    renderPage();
  }
}

async function generateExercise(){
  if(!state.apiKey) return;
  const chapter = chaptersFor(state.genSubject).find(c=>c.id===state.genChapterId);
  if(!chapter) return;
  const s = subj(state.genSubject);
  const langue = genLangFor(state.genSubject);
  const diffLabel = {facile:'facile', moyen:'moyen', difficile:'difficile'}[state.genDifficulty] || 'moyen';

  const promptText = `Tu es un professeur bienveillant pour un·e élève marocain·e de 11 ans en 1ère année collège (6ème).
Matière : ${s.label}
Leçon : ${chapter.title}
Rappel du cours (à utiliser comme contexte, ne pas recopier) : ${chapter.essentiel||''} ${chapter.cours||''}
Niveau de difficulté souhaité : ${diffLabel}

Génère UN NOUVEL exercice original (différent de l'exemple du cours) adapté à cette leçon et à ce niveau de difficulté, avec sa correction complète, claire et exacte.
Rédige l'énoncé et la correction entièrement en ${langue}, dans un style simple et adapté à un enfant de 11 ans.
Réponds uniquement avec un objet JSON valide contenant exactement deux clés : "enonce" et "reponse". Aucun texte en dehors du JSON.`;

  state.genLoading = true; state.genError = null; renderPage();
  try{
    const result = await callGemini(promptText, state.apiKey);
    state.genResult = { enonce: result.enonce, reponse: result.reponse, chapterTitle: chapter.title };
  }catch(err){
    state.genError = err && err.message ? err.message : "Une erreur est survenue, réessaie.";
    state.genResult = null;
  }finally{
    state.genLoading = false; renderPage();
  }
}

function alertBanner(msg){
  const b = document.createElement('div'); b.textContent = msg;
  b.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2F5233;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.2);z-index:99;';
  document.body.appendChild(b); setTimeout(()=>b.remove(), 1800);
}

function bindShellEvents(){
  document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.dataset.mode;
      if(target === state.mode) return;
      state.authenticated = false; state.authTarget = target; state.authError = null; render();
    });
  });
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.view = btn.dataset.view; render(); });
  });
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn){
    logoutBtn.addEventListener('click', ()=>{
      state.authenticated = false; state.authTarget = null; state.authError = null; render();
    });
  }
}

function viewSetupPasswords(){
  return `<div class="auth-wrap"><div class="auth-card">
    <div class="title">Bienvenue !</div>
    <p class="muted">Avant de commencer, crée un mot de passe pour l'espace Élève et un autre pour l'espace Parent. C'est simple, juste pour éviter les erreurs de manipulation (ce n'est pas une protection très sécurisée).</p>
    <form id="setup-form" style="text-align:left;">
      <label>Mot de passe Élève</label><input type="password" id="setup-eleve" required placeholder="Ex. 1234">
      <label>Mot de passe Parent</label><input type="password" id="setup-parent" required placeholder="Ex. maman2026">
      ${state.authError? `<p class="auth-error">${esc(state.authError)}</p>` : ''}
      <button type="submit" class="btn btn-primary" style="width:100%;">Créer les mots de passe</button>
    </form>
  </div></div>`;
}

function viewLogin(){
  if(!state.authTarget){
    return `<div class="auth-wrap"><div class="auth-card">
      <div class="title">Qui utilise le cahier ?</div>
      <p class="muted">Choisis ton espace pour continuer.</p>
      <div class="role-grid">
        <button class="role-btn" data-role="eleve"><span class="role-emoji">👧</span><span class="role-label">Élève</span></button>
        <button class="role-btn" data-role="parent"><span class="role-emoji">👨‍👩‍👧</span><span class="role-label">Parent</span></button>
      </div>
    </div></div>`;
  }
  const roleLabel = state.authTarget==='eleve' ? 'Élève' : 'Parent';
  return `<div class="auth-wrap"><div class="auth-card">
    <div class="title">Espace ${roleLabel}</div>
    <p class="muted">Entre le mot de passe pour continuer.</p>
    <form id="login-form" style="text-align:left;">
      <label>Mot de passe</label><input type="password" id="login-password" autofocus>
      ${state.authError? `<p class="auth-error">${esc(state.authError)}</p>` : ''}
      <button type="submit" class="btn btn-primary" style="width:100%;">Valider</button>
    </form>
    <div class="auth-back"><button class="btn-ghost" id="auth-back-btn">← Changer d'espace</button></div>
  </div></div>`;
}

function bindAuthEvents(){
  const setupForm = document.getElementById('setup-form');
  if(setupForm){
    setupForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const eleve = document.getElementById('setup-eleve').value.trim();
      const parent = document.getElementById('setup-parent').value.trim();
      if(!eleve || !parent){ state.authError = 'Merci de remplir les deux mots de passe.'; render(); return; }
      state.passwords = { eleve, parent };
      await savePasswords();
      state.authError = null; state.authenticated = true; state.mode = 'parent'; state.view = 'add';
      render();
    });
  }
  document.querySelectorAll('.role-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.authTarget = btn.dataset.role; state.authError = null; render(); });
  });
  const authBackBtn = document.getElementById('auth-back-btn');
  if(authBackBtn){ authBackBtn.addEventListener('click', ()=>{ state.authTarget = null; state.authError = null; render(); }); }
  const loginForm = document.getElementById('login-form');
  if(loginForm){
    loginForm.addEventListener('submit', (e)=>{
      e.preventDefault();
      const val = document.getElementById('login-password').value;
      if(val === state.passwords[state.authTarget]){
        state.authenticated = true; state.mode = state.authTarget; state.view = state.mode==='eleve' ? 'today' : 'add';
        state.authTarget = null; state.authError = null; render();
      } else {
        state.authError = 'Mot de passe incorrect.'; render();
      }
    });
  }
}

function render(){
  const app = document.getElementById('app');
  if(!state.passwords){
    app.innerHTML = viewSetupPasswords();
    bindAuthEvents();
    return;
  }
  if(!state.authenticated){
    app.innerHTML = viewLogin();
    bindAuthEvents();
    return;
  }
  app.innerHTML = shell();
  bindShellEvents(); renderPage();
}

(async function init(){ await loadState(); render(); })();
</script>
